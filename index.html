<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sohbet Köşesi</title>
<meta name="theme-color" content="#1E4B45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F0;
  --card:#FAFCFB;
  --ink:#132B29;
  --ink-soft:#496059;
  --teal:#1E4B45;
  --teal-ink:#F4F8F6;
  --gold:#9C7420;
  --line:#CBD8D2;
  --quote:#E2EBE7;
  --fs:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B1A; --card:#152624; --ink:#E4EEE9; --ink-soft:#9DB3AD;
    --teal:#2F6F65; --teal-ink:#F4F8F6; --gold:#D4AE55; --line:#28403C; --quote:#162B28;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1B1A; --card:#152624; --ink:#E4EEE9; --ink-soft:#9DB3AD;
  --teal:#2F6F65; --teal-ink:#F4F8F6; --gold:#D4AE55; --line:#28403C; --quote:#162B28;
}
:root[data-theme="contrast"]{
  --paper:#000000; --card:#0A0A0A; --ink:#FFFFFF; --ink-soft:#FFFFFF;
  --teal:#000000; --teal-ink:#FFFFFF; --gold:#FFD400; --line:#FFFFFF; --quote:#1A1A1A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Literata","Iowan Old Style",Georgia,"Times New Roman",serif;
  font-size:20px;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{display:block}

/* ---------- Ana sayfa ---------- */
.home{max-width:520px;margin:0 auto;padding:28px 20px 40px}
.hello{margin:0 4px 22px}
.greet{margin:0;font-size:20px;color:var(--ink-soft);font-style:italic}
.hello h1{margin:2px 0 0;font-size:38px;line-height:1.15;font-weight:700;letter-spacing:-0.01em}
.hicri{display:block;margin:8px 4px 0;font-size:16px;color:var(--ink-soft)}
.kandil-banner{
  display:block;text-align:center;background:linear-gradient(120deg,var(--gold),#c99a3a);
  color:#241a05;border-radius:18px;padding:14px 18px;margin:0 0 18px;font-size:20px;font-weight:700;
}
.new-banner{
  display:block;text-align:center;background:var(--card);border:1.5px dashed var(--gold);
  color:var(--ink);border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:18px;font-weight:600;
}

.arch{
  position:relative;display:block;text-align:center;
  background:var(--teal);color:var(--teal-ink);
  border-radius:50% 50% 22px 22px / 110px 110px 22px 22px;
  padding:56px 26px 24px;margin:0 0 18px;
}
.arch::before{
  content:"";position:absolute;inset:8px;pointer-events:none;
  border:1.5px solid var(--gold);
  border-radius:50% 50% 15px 15px / 102px 102px 15px 15px;
  opacity:.9;
}
.arch-title{display:block;font-size:24px;font-weight:700;line-height:1.2;margin-bottom:10px}
.arch-text{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-size:18px;line-height:1.55;font-style:italic;opacity:.96;
}
.arch-go{
  display:inline-block;margin-top:20px;padding:12px 26px;min-height:52px;
  border-radius:999px;background:var(--teal-ink);color:var(--teal);
  font-weight:600;font-size:20px;
}
.wide{
  display:flex;align-items:center;gap:18px;width:100%;min-height:104px;
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  padding:16px 20px;margin:0 0 14px;
}
.wide .ico{
  flex:none;width:60px;height:60px;border-radius:50%;
  background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;
}
.wide b{display:block;font-size:29px;line-height:1.2}
.wide small{display:block;font-size:19px;color:var(--ink-soft);margin-top:2px}

/* ---------- Sayfa çerçevesi ---------- */
.page{max-width:620px;margin:0 auto;padding:24px 20px 150px}
.page h1{font-size:34px;line-height:1.2;margin:4px 0 6px}
.lead{margin:0 0 22px;color:var(--ink-soft);font-size:20px}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--paper);border-top:1.5px solid var(--line);
}
.dock a{
  flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:60px;border-radius:16px;font-size:23px;font-weight:600;
  background:var(--card);border:1.5px solid var(--line);
}
.dock a.main{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}

/* ---------- Kaldığın yerden devam ---------- */
.resume{
  display:block;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--gold);
  border-radius:6px 20px 20px 6px;padding:18px 20px;margin:0 0 18px;
}
.resume .tag{display:block;font-size:17px;color:var(--ink-soft);margin:0 0 4px;font-style:italic}
.resume b{display:block;font-size:26px;line-height:1.25}
.resume .meter{margin-top:12px}

/* ---------- Namaz vakitleri ---------- */
.vakit-card{
  background:linear-gradient(155deg,var(--teal) 0%,#2E6157 60%,var(--gold) 145%);
  color:var(--teal-ink);border-radius:22px;padding:20px 22px 18px;margin:0 0 18px;
}
.vakit-loading{margin:0;font-size:18px;opacity:.9}
.vakit-tag{display:block;font-size:15px;letter-spacing:.02em;opacity:.85;margin-bottom:4px}
.vakit-next{display:block;font-size:24px;font-weight:700;line-height:1.25;margin-bottom:16px}
.vakit-strip{
  position:relative;height:8px;border-radius:99px;margin:0 4px 14px;
  background:linear-gradient(90deg,#1b2a4a 0%,#5b6fa8 14%,#e8c15a 24%,#bfe2f4 32%,#bfe2f4 62%,#f2a35a 74%,#5b3a6b 84%,#1b2a4a 100%);
}
.vakit-strip .tick{
  position:absolute;top:50%;width:10px;height:10px;margin-left:-5px;margin-top:-5px;
  border-radius:50%;background:var(--teal-ink);border:2px solid var(--teal);
}
.vakit-strip .now-mark{
  position:absolute;top:50%;width:16px;height:16px;margin-left:-8px;margin-top:-8px;
  border-radius:50%;background:var(--gold);border:2px solid var(--teal-ink);
  box-shadow:0 0 0 4px rgba(255,255,255,.25);
}
.vakit-legend{
  display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;opacity:.92;
}
.vakit-legend b{font-weight:600;margin-right:3px}

/* ---------- Kitaplık ---------- */
.search-wrap{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:4px 16px;margin:0 0 18px;
}
.search-wrap svg{flex:none;color:var(--ink-soft)}
.search{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font:inherit;font-size:20px;color:var(--ink);padding:14px 0;
}
.search::placeholder{color:var(--ink-soft)}
.search::-webkit-search-cancel-button{-webkit-appearance:none}
.book{
  display:flex;align-items:stretch;background:var(--card);
  border:1.5px solid var(--line);border-radius:18px;margin:0 0 16px;overflow:hidden;
}
.spine{flex:none;width:18px;background:var(--c)}
.book-body{padding:18px 20px;min-width:0;flex:1}
.book-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.book-body b{display:block;font-size:27px;line-height:1.25}
.fav-btn{flex:none;background:none;border:0;padding:4px;margin:-2px -4px 0 0;color:var(--ink-soft)}
.fav-btn svg{fill:none;transition:fill .15s}
.fav-btn.on{color:var(--gold)}
.fav-btn.on svg{fill:currentColor}
.quick-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.fav-toggle{
  display:inline-flex;align-items:center;gap:8px;
  min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:18px;font-weight:600;
}
.fav-toggle svg{fill:none}
.fav-toggle.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.fav-toggle.on svg{fill:currentColor}
.cat-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.cat-chip{
  min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:16px;font-weight:600;
}
.cat-chip.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.mark-list{display:flex;flex-direction:column;gap:14px}
.mark-card{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;border-left:6px solid var(--line)}
.mark-card-y{border-left-color:#E6B22E}
.mark-card-g{border-left-color:#14A86E}
.mark-card-p{border-left-color:#E03A8A}
.mark-card-doc{display:block;font-size:15px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.mark-card-text{display:block;font-size:19px;line-height:1.5}
.mark-card-note{display:block;margin-top:8px;font-size:16px;font-style:italic;color:var(--ink-soft)}
.kandil-list{display:flex;flex-direction:column;gap:12px}
.kandil-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px}
.kandil-row b{font-size:20px}
.kandil-row span{color:var(--ink-soft);font-size:17px}
.kandil-row small{margin-left:auto;color:var(--gold);font-weight:600;font-size:15px}
.book-body .sub{display:block;font-size:18px;color:var(--ink-soft);margin-top:3px}
.book-body .desc{display:block;font-size:19px;margin-top:10px;line-height:1.45}
.meter{height:8px;border-radius:99px;background:var(--quote);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.book-body .st{display:block;font-size:17px;color:var(--ink-soft);margin-top:6px}

/* ---------- Sohbetler ---------- */
.empty{
  border:2px dashed var(--line);border-radius:18px;padding:22px 20px;margin:0 0 18px;
  font-size:21px;line-height:1.55;
}
.sample{
  border:2px dashed var(--line);border-radius:18px;padding:18px 20px;opacity:.85;
}
.sample .tag{font-size:17px;color:var(--ink-soft);font-style:italic;margin:0 0 10px}
.talk{
  display:flex;align-items:center;gap:16px;background:var(--card);
  border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 14px;min-height:96px;
}
.talk .ico{flex:none;width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center}
.talk b{display:block;font-size:23px;line-height:1.3}
.talk small{display:block;font-size:18px;color:var(--ink-soft);margin-top:2px}

/* ---------- Günün sohbeti ---------- */
.day-card{
  background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--gold);
  border-radius:6px 20px 20px 6px;padding:24px 22px;margin:0 0 22px;
}
.day-card p{margin:0;font-size:calc(var(--fs) + 1px);line-height:1.75}
.day-src{margin:16px 0 0;font-size:18px;color:var(--ink-soft);font-style:italic}
.cta{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;
  background:var(--teal);color:var(--teal-ink);border-radius:16px;font-size:23px;font-weight:600;
  padding:12px 18px;text-align:center;
}

/* ---------- Okuyucu ---------- */
.tools{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
  background:var(--paper);border-bottom:1.5px solid var(--line);
}
.tools-row{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
.tools .name{flex:1;min-width:0;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{
  flex:1 1 72px;height:58px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);display:grid;place-items:center;line-height:1;
}
.tbtn[disabled]{opacity:.35}
.tbtn svg{fill:none}
.tbtn.on{color:var(--gold)}
.tbtn.on svg{fill:currentColor}
.tbtn .a1{font-size:17px;font-weight:700}
.tbtn .a2{font-size:28px;font-weight:700}
.bar{height:5px;background:var(--quote)}
.bar i{display:block;height:100%;width:0;background:var(--gold)}

.reader{max-width:36rem;margin:0 auto;padding:22px 20px 160px;font-size:var(--fs)}
.reader .doc-title{font-size:1.5em;line-height:1.25;margin:.2em 0 .15em;font-weight:700}
.reader .doc-sub{margin:0 0 1.6em;color:var(--ink-soft);font-size:.85em;font-style:italic}
.reader p{margin:0 0 1.05em;line-height:1.75;scroll-margin-top:100px}
.reader h2{font-size:1.28em;line-height:1.3;margin:1.9em 0 .6em;font-weight:700;scroll-margin-top:100px}
.reader .q{
  margin:0 0 1.15em;padding:.7em 1em;background:var(--quote);
  border-left:4px solid var(--gold);border-radius:0 14px 14px 0;
}
.reader .li{display:flex;gap:.6em;margin:0 0 .8em}
.reader .li span:first-child{flex:none;min-width:1.4em;color:var(--gold);font-weight:700}
.reader .ar{
  direction:rtl;text-align:center;font-family:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  font-size:1.3em;line-height:2;margin:.4em 0 .8em;
}
.reader .end{margin-top:2.4em}
.reader.font-alt{font-family:"Nunito","Segoe UI",Arial,sans-serif}
.toc{margin:0 0 1.6em}
.toc-btn{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font-size:.72em;font-weight:600;color:var(--ink);
}
.toc-btn svg{fill:none}
.toc-list{display:none;flex-direction:column;gap:2px;margin-top:10px;padding:10px 4px;border-left:3px solid var(--gold)}
.toc.open .toc-list{display:flex}
.toc-item{display:block;padding:8px 12px;font-size:.78em;color:var(--ink-soft);border-radius:8px}
.reader .markable{cursor:pointer;border-radius:8px;transition:background .15s}
.reader .mark-y{background:rgba(255,196,0,.55)}
.reader .mark-g{background:rgba(20,168,110,.42)}
.reader .mark-p{background:rgba(224,58,138,.38)}
.mark-note{display:block;font-size:.78em;line-height:1.5;color:var(--ink-soft);font-style:italic;margin:-.6em 0 1.05em;padding-left:.2em}
.mark-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 12px;margin:-.4em 0 1.1em;
}
.mark-swatches{display:flex;gap:8px}
.mark-swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.mark-swatch-y{background:#FFC400}
.mark-swatch-g{background:#14A86E}
.mark-swatch-p{background:#E03A8A}
.mark-action{
  min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);font-size:16px;font-weight:600;
}
.mark-input{
  flex:1;min-width:140px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);
}
mark.here{background:transparent;box-shadow:-6px 0 0 var(--gold)}

/* ---------- Tablet ve geniş ekran ---------- */
@media (min-width:760px){
  .home{max-width:760px;display:flex;flex-wrap:wrap;gap:16px 18px}
  .home .hello,.home .resume,.home .vakit-card,.home .arch,.home .wide,.home .new-banner,.home .kandil-banner{flex:1 1 100%}
  .arch{padding:64px 30px 28px}
  .arch-title{font-size:27px}
  .arch-text{font-size:19px}

  .page{max-width:820px}
  .book-list{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
  .book-list>a.book{margin:0}

  .tools-row{max-width:820px}
  .reader{max-width:42rem}

  .dock{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:820px;border-radius:24px 24px 0 0}
}
@media (min-width:1100px){
  .home{max-width:900px}
  .page{max-width:920px}
  .book-list{grid-template-columns:1fr 1fr 1fr}
  .tools-row{max-width:920px}
  .reader{max-width:46rem}
  .dock{max-width:920px}
}
</style>
</head>

<script type="application/json" id="data">{"docs":[{"id":"kandil","title":"Mevlid Kandili","sub":"3 Eylül 2025 Çarşamba","desc":"Peygamber Efendimizin doğumu, şemaili ve güzel ahlakı","color":"#1E4B45","paras":[{"k":"p","t":"“İçinizden Allah’ın lutfuna ve âhiret gününe umut bağlayanlar, Allah’ı çokça ananlar için hiç şüphe yok ki, Resûlullah’ta güzel bir örneklik vardır.” (Ahzab Suresi, 21)"},{"k":"p","t":"Fahr-i Kâinat Efendimiz [sallallahu aleyhi ve sellem] bahar yağmurlarının toprağa düşmesiyle birlikte doğaya hayat vermesi gibi yeryüzüne teşrifiyle ve nübüvvetiyle âlemlere rahmet olmuştur."},{"k":"p","t":"Yaratılmışlar içinde Allah’ın habibi Hz. Peygamber Efendimiz [sallallahu aleyhi ve sellem] gibi sevilen, özlenen, hürmet gören, hasretiyle gönülleri yakan başka kim olabilir? O sevgiden, sevgi de O’ndan hâsıl olmuştur."},{"k":"p","t":"Resûlullah [sallallahu aleyhi ve sellem] Arap kabilelerinin en şereflisi ve en büyüğü olan Hâşimoğulları’nın en seçkini, Kureyşliler’in en temizi, en şereflisi ve medar-ı iftiharlarıdır. O gerek anne gerekse baba tarafından bu iki kabilenin en izzetlisidir. O, Allah katında ve insanların yanında beldelerin en mükerremi olan Mekke’de dünyaya gelmiştir."},{"k":"p","t":"Fahr-i Kainat Efendimiz [sallallahu aleyhi ve sellem] miladî 571 yılında, Rebiülevvel ayının 12. günü dünyaya teşrif etmiştir. Sahih rivayetlerle aktarıldığına göre bu gün pazartesi günüdür. Nitekim İbn Abbas (radıyallahu anh) şöyle demiştir:"},{"k":"q","t":"“Rasulullah [sallallahu aleyhi ve sellem] pazartesi günü dünyaya geldi, ona pazartesi günü peygamberlik verildi, Mekke’den Medine’ye pazartesi günü hicret etti, Medine’ye girişi pazartesi günü oldu. Pazartesi günü de vefat etti.”"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi ve sellem] hayatında doğum yıldönümünü kutlamamıştır, fakat doğduğu güne hürmeten bu günü oruç tutarak geçirmiştir. Efendimiz [sallallahu aleyhi ve sellem]’in dünyaya teşrifinin kutlanılması Dört Halife (radıyallahu anhum) devrinde başlamıştır. İmam Süyûtî ve İbn Hacer el-Askalânî (rahmetullahi aleyhim) mevlid ile ilgili yazdıkları eserlerinde Dört Halife döneminden itibaren mevlid gününde Efendimiz [sallallahu aleyhi ve sellem]’in şemailini ve onu öven şiirlerin okunduğunu buyurmuşlardır."},{"k":"p","t":"Peygamber Efendimiz [sallallahu aleyhi ve sellem] Allah Teala’nın katında o kadar kıymetli ve değeri yüksek ki, O’nun doğumunun yüzü suyu hürmetine o gün için azabı hafifleyen kullar vardır."},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi ve sellem]’in dünyaya teşrif ettiği bu tarih, müslümanlar için bir sevinç vesilesi olmuş ve bu güne büyük ehemmiyet vermişlerdir. Bir çok alim Efendimiz’in [sallallahu aleyhi ve sellem] doğumu ve hayatı hakkında eserler yazmışlar ve bu eserler dilden dile, gönülden gönüle aktarılarak bu güne kadar ulaşmıştır."},{"k":"p","t":"Rasulullah’ın [sallallahu aleyhi ve sellem] dünyaya gelmesi insanlık tarihinin en önemli olaylarından biridir."},{"k":"p","t":"Bu gece, Hz. İbrahim’in [aleyhisselâm] “Ey Rabbimiz! Onlara, içlerinden senin ayetlerini kendilerine okuyacak, onlara kitap ve hikmeti öğretecek, onları temizleyecek bir peygamber gönder.” (Bakara Suresi, 16) diye yaptığı duaya, Hz. İsa’nın [aleyhisselâm] “Ey İsrâiloğulları! Ben size Allah’ın elçisiyim, benden önce gelen Tevrat’ı doğrulayıcı ve benden sonra gelecek Ahmed adında bir peygamberi de müjdeleyici olarak geldim.”"},{"k":"p","t":"(Saf Suresi, 6) müjdesine ve Hz. Âmine’nin rüyasına mazhar olan Muhammed Mustafa [sallallahu aleyhi ve sellem] dünyaya gelmiştir."},{"k":"p","t":"Nitekim Resûlullah Efendimiz [sallallahu aleyhi ve sellem] şöyle buyurmuştur:"},{"k":"q","t":"“Ben Allah katında, kitapların anasında (levh-i mahfûzda) Allah’ın son peygamberi olarak yazılıyım. Ben, İbrahim’in duası, İsa’nın müjdesi ve annemin rüyasıyım.”"},{"k":"p","t":"Rasulullah Efendimiz [sallallahu aleyhi ve sellem] dünyaya gelirken bazı olaylar meydana gelmişti. Doğuma az bir zaman kala, Hz. Âmine bir rüya gördü. Rüyasında, bedeninden çıkan bir nur, doğu ile batı arasına ne varsa hepsini aydınlatıyordu. Rüya devam ederken gönülleri okşayan hoş bir ses duymuştu. Bu ses, ona doğumdan sonra yapacaklarını bildiriyordu: “Bir ve tek olan Allah’a [celle celaluhu] sığınırım’ de ve adını Muhammed koy, hâlini kimseye bildirme.”"},{"k":"p","t":"Hz. Âmine, doğum yaklaştıkça harikulade haller yaşamaya başladı. Gerçi daha önce de zaman zaman olağanüstü şeyler görüyordu. Fakat bu sefer çok daha başkaydı. Vakit geceye yaklaştıkça doğum yapacağı hissine kapıldı ve yakın komşusu Şifâ Hatun’a kendisine yardımcı olması için haber gönderdi."},{"k":"p","t":"Şifâ Hatun beraberinden birkaç kadınla birlikte Hz. Âmine’nin evine geldiler."},{"k":"p","t":"Hz. Âmine birden evinin içinin bir nurla kaplandığını, etrafın gündüz gibi aydınlık olduğunu fark etti. Uzandığı yatağın yanında bir kâse vardı. Bu kâse nereden gelmişti, kim koymuştu, bilmiyordu."},{"k":"p","t":"Kâsenin içinden birkaç yudum alınca içine bir ferahlığın dolduğunu hissetti. Derken güzellikleri göz alıcı bazı kadınlar geldi evine. Ama onları şimdiye kadar hiç görmemişti. Kendisi ve karnındaki yavrusu hakkında konuşuyorlar, birbirlerini ve Âmine’yi tebrik ediyorlardı. Hz. Âmine de, ”Yâ Rabbi, bunlar kimlerdir acaba?” diyerek merakla, hayretle onları izliyordu."},{"k":"p","t":"Dünya yaratıldı yaratılalı gelip geçen bu en hayırlı gecede, yeryüzünün her tarafından Allah’ın [celle celaluhu] emri ile gerçekleşen çeşit çeşit hadiseler oluyordu. Yalnız Hz. Âmine’nin evindekiler değil, Mekke içinde, yakın kabilelerde ve dünyanın her tarafında bu haller dikkatle gözlemleniyordu."},{"k":"p","t":"Mecûsilerin 1000 yıldan beri kesintisiz yaktıkları ateşleri, Rasulullah’ın [sallallahu aleyhi ve sellem] doğumuyla sönmüştü. Yine Hz. Muhammed’in [sallallahu aleyhi ve sellem] doğduğu gece Kâbe’deki putlar yüzüstü serilmişti. O zaman mukaddes sayılan Save Gölü’nün de o gece bir anda suyu çekilip kuruyuvermişti."},{"k":"p","t":"Yahudi ileri gelenleri ve âlimleri kitaplarında daha önce rastladıkları işaret ve müjdelerin açığa çıktığını gördüler. Kimsenin haberi olmadan en önce onlar bu müjdeyi verdiler. O gece yahudi âlimleri semaya bakıp, ”Şu yıldızın doğduğu gece Ahmed doğmuştur.” dediler."},{"k":"p","t":"Annesi Resûlullah Efendimiz’i [sallallahu aleyhi ve sellem] dünyaya getirirken, o başını yukarı doğru kaldırıp gözleri ile gökyüzünü seyretmekteydi, aynı şekilde annesi, doğum esnasında, Resûlullah [sallallahu aleyhi ve sellem] ile birlikte kendisinden bir nur çıktığını gördü."},{"k":"p","t":"Osman b. Ebü’l-Âs’ın (radıyallahu anh) annesi (Fâtıma bint Abdullah), Resûlullah Efendimiz’in [sallallahu aleyhi ve sellem] doğduğu esnada yıldızların yeryüzüne doğru alçaldığını, bir nurun ortaya çıktığını ve o nurdan başka hiçbir şey göremediğini ifade etmiştir."},{"k":"p","t":"Resûlullah Efendimiz’in [sallallahu aleyhi ve sellem] dünyaya teşrif ettiği gece Kisrâ’nın saraylarının sarsılması, saray balkonlarının yıkılması, Taberiye gölünün suyunun azalması, Mecûsîler’in bin yıldır"},{"k":"li","m":"•","t":"durmadan yanan ateşlerinin sönmesi de onun peygamberliğinin alametlerindendir."},{"k":"p","t":"Şeytan; hayatında koparacağı dört çığlıktan birisini, bu kutlu doğum gecesinde koparmıştır."},{"k":"p","t":"Bir yahudi ileri geleni Mekke’de Peygamberimizin [sallallahu aleyhi ve sellem] doğduğu gece, içlerinde Hişam ve Velid b. Muğîre, Utbe b. Rebia gibi Kureyş’in ileri gelenlerinin bulunduğu bir toplantıda,"},{"k":"li","m":"•","t":"Bu gece sizlerden birinin çocuğu oldu mu? diye sordu."},{"k":"li","m":"•","t":"Bilmiyoruz, diye cevap verdiler. Yahudi,"},{"k":"li","m":"•","t":"Vallahi sizin bu ihmalinizden iğreniyorum! Bakın, ey Kureyş topluluğu, size ne söylüyorum, iyi dinleyin. Bu gece, bu ümmetin en son peygamberi Ahmed doğdu. Eğer yanlışım varsa Filistin’in kutsiyetini inkâr etmiş olayım. Onun iki küreği arasında kırmızımtırak, üzerinde tüyler bulunan bir ben var, dedi."},{"k":"p","t":"Toplantıda bulunanlar yahudinin sözüne hayrete düştüler ve dağıldılar. Her biri evlerine döndüğünde bu durumu ev halkına anlattılar. “Bu gece Abdulmuttalib’in oğlu Abdullah’ın oğlu doğdu."},{"k":"p","t":"Adını Muhammed koydular.” haberini aldılar. Ertesi gün yahudiye vardılar:"},{"k":"li","m":"•","t":"Bahsettiğin çocuğun bizim aramızda geldiğini duydun mu, dediler. Yahudi,"},{"k":"li","m":"•","t":"Onun doğumu benim size haber verdiğimden önce midir, sonra mıdır, dedi. Onlar,"},{"k":"li","m":"•","t":"Öncedir ve ismi Ahmed’dir, dediler. Yahudi,"},{"k":"li","m":"•","t":"Beni ona götürün, dedi. Yahudi ile beraber kalkıp Hz. Âmine’nin evine gittiler, içeri girdiler."},{"k":"p","t":"Peygamberimiz’i [sallallahu aleyhi ve sellem] yahudinin yanına çıkardılar. Yahudi, Peygamberimizin [sallallahu aleyhi ve sellem] sırtındaki beni görünce, bir baygınlık hâli geldi, fenalaştı. Kendine gelip ayıldığında,"},{"k":"li","m":"•","t":"Ne oldu sana böyle, dediler. Yahudi,"},{"k":"li","m":"•","t":"Artık İsrâiloğullarından peygamberlik gitti, ellerinden kitap da gitti. Artık yahudi âlimlerinin kıymet ve itibarları da kalmadı. Araplar peygamberleriyle kurtuluşa ereceklerdir, dedi. Devamla, - Ey Kureyş topluluğu, ferahladınız mı? Vallahi size, doğudan batıya kadar ulaşacak bir güç, kuvvet ve üstünlük verilecektir, dedi."},{"k":"p","t":"Yüce Allah’ın, Hz. Muhammed’i [sallallahu aleyhi ve sellem] resûl olarak göndermesinden ve insanları Hakk’a ve sırât-ı müstakîme yönlendirmesinden daha büyük bir lütuf yoktur. Bir mümin için dünyada ve âhirette elde edilecek bütün hayırların sebebi hidayet ve imandır. Bunlar ebedî saadetin anahtarıdır."},{"k":"p","t":"Peygamber Efendimiz’in [sallallahu aleyhi ve sellem] en büyük mûcizesi yüce Allah’ın kendisine vahyettiği kelâmı ve hidayet kitabı Kur’ân-ı Kerîm’dir. Bu mûcizenin büyüklüğü bir âyette şöyle hatırlatılır:"},{"k":"p","t":"“Kendilerine okunmakta olan kitabı sana indirmemiz onlara yetmez mi?” (Ankebut Suresi, 51)"},{"k":"p","t":"O gelmeden önce Ehl-i kitap olan yahudi ve hıristiyanlar ellerindeki kitapları değiştirmişler; ona, onda olmayan hükümleri eklemişler ve ondan birçok hükmü çıkarmışlardı. Ehl-i kitabın dışındakilere gelince, onlar apaçık bir sapıklık içindeydiler. Ümmîler, putlara tapıyor, Mecûsîler ateşe ibadet ediyor ve iki tane ilâhın olduğunu savunuyor, insanlardan kimi yıldızlara, kimi güneşe kimi aya ibadet ediyordu."},{"k":"p","t":"Allah Teâlâ Hz. Muhammed’i [sallallahu aleyhi ve sellem] peygamber olarak göndermekle inananlara hidayet yolunu gösterdi. Hak dinini apaçık ortaya koydu ve İslâm, doğuya batıya da ulaştı. Yeryüzü şirk ve zulüm karanlığında iken, tevhid tanındı, adalet yayıldı."},{"k":"h","t":"Mevlid Kandili Neden Önemlidir?"},{"k":"p","t":"Rasulullah’a [sallallahu aleyhi ve sellem] pazartesi gününün orucu hakkında soru sorulduğunda, Peygamber Efendimiz [sallallahu aleyhi ve sellem], “Ben o gün doğdum ve nübüvvet de o gün bana verildi” buyurmuş ve bu vesile ile kendi doğumuna işaret etmiştir. Yine bununla, Allah Teâlâ’nın kullarına olan nimetlerinin yenilendiği günlerde oruç tutmanın müstehap olduğuna işaret edilmiştir. Şüphesiz, Allah Teâlâ’nın bu ümmete ihsan ettiği nimetlerin en büyüğü, Hz. Muhammed’in [sallallahu aleyhi ve sellem] dünyaya gelmesi ve onlara Peygamber olarak verilmesidir. Nitekim âyet-i kerimede de buna işaretle şöyle buyrulmuştur:"},{"k":"p","t":"“Andolsun ki içlerinden, kendilerine Allah'ın ayetlerini okuyan, (kötülüklerden ve inkârdan) kendilerini temizleyen, kendilerine Kitap ve hikmeti öğreten bir Peygamber göndermekle Allah, müminlere büyük bir lütufta bulunmuştur.” (Al-i İmran Suresi, 164)"},{"k":"p","t":"Çünkü Hz. Muhammed’in [sallallahu aleyhi ve sellem] bu ümmete bir peygamber olarak gönderilmesi, göklerin, yerlerin, güneş ve ayın, rüzgârın, gece ve gündüzün yaratılmasından çok daha büyük bir nimettir. Hz. Muhammed’in [sallallahu aleyhi ve sellem] peygamber olarak gönderilmesiyle dünya ve âhiretin hayırları tamamlanmış, Allah’ın [celle celaluhu] kulları için razı olduğu din kemâle ermiştir. Bu dini kabul etmek, insanların dinlerinin ve dünyalarının saadetine sebep olmuştur. İşte, Allah Teâlâ’nın, mümin olan kullarına nimetlerini bir nevi yenilettiği böyle bir günde, oruç ve buna benzer ibadetlerle bu günü yâd etmek gerçekten güzel bir hadisedir. Bu, nimete mukabil yapılan şükür mesabesindedir."},{"k":"p","t":"Nitekim Hz. Nuh [aleyhisselâm], tufandan kurtulduktan sonra ve Hz. Musa [aleyhisselâm] da Kızıldeniz’i geçtikten sonra, şükür olarak oruç tutmuşlardır. Bu iki peygamberin oruç tutmaları aşure gününe denk gelmiştir. Rasulullah Efendimiz de [sallallahu aleyhi ve sellem], Hz. Nuh’a ve Hz. Musa’ya [aleyhisselâm] mutabaat ederek aşure gününde oruç tutmuş, bunun önemini de sahabilerine, “Biz Musa’ya onlardan (yahudilerden) daha yakınız.” buyurarak ifade etmiştir."},{"k":"p","t":"İbn Abbas (radıyallahu anh) da şöyle demiştir: “Rasulullah [sallallahu aleyhi ve sellem], pazartesi günü dünyaya geldi, Ona pazartesi günü peygamberlik verildi, Mekke’den Medine’ye pazartesi günü hicret etti, Medine’ye girişi pazartesi günü oldu. Pazartesi günü de vefat etti.”"},{"k":"p","t":"Abbas ve Ebu Leheb amcalarından ikisiydi. Ebu Leheb O’nun azılı düşmanı, amcası Abbas ise can dostuydu. Süveybe Ebu Leheb’in cariyesiydi. Hz. Rasulullah’ı [sallallahu aleyhi vesellem] emzirmişti. Ebu Leheb’e Süveybe:"},{"k":"p","t":"“Kardeşin Abdullah’ın hanımı Âmine bir erkek çocuk doğurdu, biliyor musun?” dedi. Sevindi Ebu Leheb, ne de olsa kendi akrabasıydı, yeğeniydi. Kanı harekete geçti. Cariyesine: “Git, artık hürsün. Seni bağışladım!” dedi."},{"k":"p","t":"Azılı düşman Ebu Leheb, o biricik Allah Rasulü’ne sonradan neler yapmadı ki! Düşmanlığı hakkında ayet indi."},{"k":"p","t":"Abbas (radıyallahu anh), kardeşi Ebu Leheb’i öldükten sonra bir gün rüyasında görmüş ve şöyle anlatmıştır: “Sonradan Ebu Leheb’i çok kötü halde gördüm. Bana şöyle diyordu: “Öldükten sonra hep azap içindeyim. Ancak pazartesi günleri azabım hafifletiliyor. Çünkü o gün cariyem Süveybe’yi azad etmiştim.”"},{"k":"p","t":"Hafız Muhammed İbni Cezeri Şafii diyor ki: ‘’Ebu Leheb gibi azgın bir kâfirin azabı hafifleyince, O yüce Peygamberin ümmetinden olan bir mümin, Onun doğduğu gece sevinir, malını uygun yerlere dağıtır, ziyafet verir, böylece, Peygamberine olan sevgisini gösterirse, Allahü Teâlâ onu Cennetine sokar.’’"},{"k":"p","t":"Mübarek gün ve geceler münasebetiyle Resûlullah’ı [sallallahu aleyhi ve sellem] yâd etmek, pek çok hayra vesiledir. Okunan mevlidlerde Allah’ı anma, Peygamberimize [sallallahu aleyhi ve sellem] övgü ve sâlat-u selam vardır. Allah’ı anmak ayeti kerimede geçtiği üzere ‘’En büyük fazilettir.’’ (Ankebut Suresi, 45)"},{"k":"p","t":"Peygamber Efendimize [sallallahu aleyhi ve sellem] salat-u selam göndermek ise, “Muhakkak ki Allah ve melekleri, Peygambere salât ederler. Ey iman edenler! Siz de ona salât edin ve tam bir içtenlikle selam verin.” (Ahzab Suresi, 56) ayeti mucibince bizlere emredilmiştir."},{"k":"p","t":"Salat-u selam getirmek sünnet olup Peygamber Efendimiz’e [sallallahu aleyhi ve sellem] olan biatımızı yenilememiz dememektir. İşte mevlid vesilesiyle hem salat-u selam sünnetini işlemiş hem de Hz. Peygamber’e [sallallahu aleyhi ve sellem] olan ahdimizi tazeleyip tekrarlamış oluruz."},{"k":"p","t":"Peygamber Efendimiz’i [sallallahu aleyhi ve sellem] övmek ve onun şefaatine nail olmak maksadıyla Rasûl- i Ekrem [sallallahu aleyhi ve sellem] hayattayken bile şiirler yazılmış, kasideler söylenmiştir."},{"k":"p","t":"Sadat-ı Kiram Efendilerimiz de çeşitli sebeplerle Rasûlullah [sallallahu aleyhi ve sellem] için mevlidler düzenleyerek bu kutlu merasimin günümüze kadar devamına ön ayak olmuşlardır. Mevlidin okunması gayet faydalıdır ve ümmet tarafından güzel görülen İslâmî bir adettir. Müslümanlar arasında hoş ve tatlı bir sohbet vesilesidir. Bunların daha da ötesinde; müminlerin kalplerinde iman nurunun, Allah sevgisinin, peygamber aşkının tutuşması için çok tesirli bir vesiledir. İşte hem Rasûlullah’ı [sallallahu aleyhi ve sellem] anmak maksadıyla hem de ölen kişilerin ruhuna bir Fâtiha göndermek münasebetiyle mevlidler düzenlenmesi gayet güzeldir. Ve bunun devam ettirilmesi gerekir."},{"k":"p","t":"Peygamberimizin [sallallahu aleyhi ve sellem] doğum yıldönümlerinden okunan mevlidlere saygı ve hûşu içinde dinlemek, onun mübarek ruhuna salât ve selam okumak hiç şüphesiz Sevgili Peygamberimiz’e [sallallahu aleyhi ve sellem] olan sevgi ve bağlılığın bir ifadesidir."},{"k":"h","t":"Kıssa: O’na [sallallahu aleyhi vesellem] Hürmetsizliğin Cezası"},{"k":"p","t":"Medineli alim Şeyh Muhammed Sadaka’nın (rahmetullahi aleyh) oğlu Şeyh Abdülaziz (rahmetullahi aleyh), bizzat yaşadığı şu olayı anlatmıştır."},{"k":"p","t":"‘’Ben Suriye’de talebe idim. O bölgenin zenginlerinden biri âlemlere rahmet Hz. Muhammed [sallallahu aleyhi ve sellem] Efendimiz için mevlid okutuyordu. Mevlide biz de katıldık. Mevlidde Hz. Resûlullah’ın [sallallahu aleyhi ve sellem] doğum anını anlatan bölüm okurken cemaat ayağa kalktı. O sırada mevlidde bulunan bir hoca, ayağa kalkmadı. Hoca, mevlid sırasında ayağa kalkmanın dinde bir yeri ve delili olmadığını zannederek ayağa kalkmamıştı. Kimse ona karışmadı. Mevlis bitti. Dağıldık."},{"k":"p","t":"Ben okudum, medreseden mezun oldum. O bölgenin köyünde imamlık görevi aldım. Aradan on beş sene geçmişti. Yine bölgenin zenginlerinden birisi Hz. Resûlullah’ın [sallallahu aleyhi ve sellem] doğumunu kutlamak için mevlid okutuyordu. Beni de çağırdılar, gittim. Mevlid okunmaya başlayınca cemaatin içinden birisi hemen ayağa kalktı, edebe geçti, ellerini bağladı, boynunu büküp okunan mevlidi öylece dinlemeye başladı. Ben, kim bu adam diye bakınca, kendisini tanıdım. Bu adam, on beş sene önceki mevlidde ayağa kalkmayan hoca idi. Hayret ettim. Sabırsızlıkla mevlidin bitmesini bekledim. Mevlidden sonra, hocanın yanına vardım. Kendimi tanıttım, o ilk karşılaştığımız mevlidi hatırlattım. Sonra edeple, ‘’Hocam, o gün öyle yaptınız, bu gün de böyle yaptınız. Lütfen bunun sebebini açıklar mısınız?’’ diye sordum. Hoca, anlatayım dedi ve şunları anlattı:"},{"k":"p","t":"‘’Ben, Hz. Resûlullah’ın [sallallahu aleyhi ve sellem] doğum anını anlatan bölümü dinlerken ayağa kalkmadığım o mevlitten sonra eve döndüm. O gece bir rüya gördüm. Bir grup insanla bir odada oturuyorduk. Birden herkes ayağa kalktı. Hz. Resûlullah’ın [sallallahu aleyhi ve sellem] geldiğini söylediler. Ben de kalkmaya davrandım, Hz. Resûlullah [sallallahu aleyhi ve sellem], bana, ‘’Sen öyle kal!’’ dedi. O anda rüyadan uyandım, kendimi oturur vaziyette buldum, yerimden kalkamıyordum. Felç olmuştum. Yedi yıl felçli halim devam etti. Kendi ihtiyaçlarımı göremez oldum. Her hizmetimi hanımım yapıyordu. Namazlarımı yatakta, oturduğum yerde kılıyordum. Bir gün hanımım beni yıkadı, gusül abdesti aldırdı. Oturduğum yerde iki rekat hacet namazı kıldım. Ellerimi açıp yüce Allah’a yalvardım. Hz. Resûlullah’a [sallallahu aleyhi ve sellem] yöneldim, beni affedip şefaat etmesi için ağladım, sızladım. Saatlerce böyle devam ettim. Artık dua edecek ve ağlayacak takatim kalmamıştı. Bu yorgunluk içinde olduğum yerde uyuyakaldım."},{"k":"p","t":"Uykumda yine bir rüya gördüm. Rüyamda bir odada bulunuyordum. Etrafımda bir grup insan vardı."},{"k":"p","t":"Herkes birden ayağa kalktı. Baktım ki Hz. Resûlullah [sallallahu aleyhi ve sellem] odaya teşrif etti. Âlemlere rahmet Efendimiz [sallallahu aleyhi ve sellem] bana doğru baktı ve tebessüm ederek, ‘’Ayağa kalkabilirsin’’ buyurdu. Birden rüyadan uyandım. Baktım ki ayaktayım. İyi olmuştum. Ben de, ‘Bundan sonra ne zaman Hz. Resûlullah’ın [sallallahu aleyhi ve sellem] mevlidi okunursa, başından sonuna kadar ayakta dinleyeceğim diye Allah’a söz verdim, yemin ettim. Onun için böyle yaptım.’’"},{"k":"p","t":"Bu olayı dinleyen ve mevlit sırasında ayağa kalkmanın dindeki delilini soran yirmi kadar âlim, ‘Bu delil bize yeter’ demişlerdir."},{"k":"h","t":"Resûlullah Efendimiz [sallallahu aleyhi ve sellem]’in Şemaili"},{"k":"p","t":"Resûlullah [sallallahu aleyhi ve sellem] nurlu bir simaya sahipti, esmer değildi. Gözlerinin siyahı tam siyah beyazı da tam beyazdı. Geniş ve güzel gözlüydü. Gözünün beyazında kızıllıklar bulunmaktaydı. Kirpikleri uzuncaydı."},{"k":"p","t":"Yüzü parlaktı. Kaşları ince, uzunca ve hilal şeklindeydi. Burnun ortası hafif çukur uç tarafı ise yukarı doğru hafif kavisliydi. Dişleri düzgün ve araları açıkçaydı. Yüzü az geniş olmakla birlikte genel olarak yuvarlaktı. Geniş alınlıydı. Gür sakallıydı. Sakalları göğsünü (gerdanını) dolduruyordu. Karnı ve göğsü aynı seviyedeydi."},{"k":"p","t":"Göğsü geniş, omuzları ise iri idi. Kemikleri kalındı. Pazıları, kolları ve ayak bilekleri kalın ve kuvvetliydi. Elleri ve ayakları geniş yapılıydı. El ve ayak parmakları uzundu. En güzel bedene sahipti. Ne çok uzun ne de çok kısa boyluydu. Bununla birlikte Resûlullah’la [sallallahu aleyhi ve sellem] birlikte uzun boylu bir adam yürüdüğü zaman Resûlullah [sallallahu aleyhi ve sellem] daha uzun gözükürdü."},{"k":"p","t":"Saçları ne tam kıvırcık ne de tam düzdü. Tebessüm ettiği zaman âdeta dişleri bembeyaz dolu taneleri gibi, yıldırımın parlaklığını andırırcasına ortaya çıkardı. Konuştuğunda sanki dişlerinin arasından bir nur çıkıyormuş gibi olurdu. Güzel boyunluydu. Yüzünde aşırı derece et ve yağ yoktu. Vücudu derli toplu ve gayet az etli idi."},{"k":"h","t":"Efendimiz [sallallahu aleyhi ve sellem]’e ve Ehli Beytine Muhabbet Beslemek"},{"k":"p","t":"Bir şeyi seven onu kendisine tercih eder ve onun isteğine göre hareket eder. Şayet aksine hareket ederse sevgisinde samimi değildir, onun sevgisi sadece bir iddiadan ibarettir. İşte, Resûlullah Efendimiz’i [sallallahu aleyhi ve sellem] samimi olarak seven kimsede bu emareleri gözükür. Bu emarelerin başında şunlar gelmektedir:"},{"k":"li","m":"•","t":"Resûlullah’ın [sallallahu aleyhi ve sellem] yaşama üslubunu benimsemek ve sünnetine göre hareket etmek,"},{"k":"li","m":"•","t":"Onun sözlerine ve davranışlarına tâbi olmak,"},{"k":"li","m":"•","t":"Emirlerini yerine getirmek, yasakladıklarından kaçınmak,"},{"k":"li","m":"•","t":"Zor ve kolay zamanlarında, sevinçli ve kederli olduğu vakitlerdeki edebiyle edeplenip ahlâklanmaktır."},{"k":"p","t":"Bunların delili şu âyet-i kerimedir: “(Resûlüm!) De ki: Eğer Allah’ı seviyorsanız bana uyun ki Allah da sizi sevsin (sizden razı olsun) ve günahlarınızı bağışlasın. Allah çok bağışlayandır, çok merhamet edendir.” (Âl-i İmrân Suresi, 31)"},{"k":"p","t":"Resûlullah Efendimiz’in [sallallahu aleyhi ve sellem] ailesine, nesline, Ehl-i beyt’ine, müminlerin anneleri olan hanımlarına hürmet ve saygı göstermek, kendisine saygı ve hürmet göstermek gibidir."},{"k":"p","t":"Resûlullah Efendimiz [sallallahu aleyhi ve sellem] şöyle buyurmuştur:"},{"k":"q","t":"“Muhammed [sallallahu aleyhi ve sellem] ailesinin kıymetini bilip haklarını gözetmek, cehennemden kurtulmaya; Muhammed [sallallahu aleyhi ve sellem] ailesini sevmek, sırat köprüsünü kolayca geçmeye; Muhammed [sallallahu aleyhi ve sellem] ailesini sevip onlara yardım etmek, dünya ve ahiret azabından emin olmaya sebeptir.”"},{"k":"p","t":"İmam Şa‘bî (rahmetullahi aleyh) şöyle demiştir:"},{"k":"p","t":"“Zeyd b. Sâbit (radıyallahu anh), annesinin cenaze namazını kıldırdıktan sonra, binmesi için ona katırını getirdiler. O esnada İbn Abbas (radıyallahu anh) geldi ve Hz. Zeyd’in (radıyallahu anh) katıra rahat binmesi için katırın üzengisini tuttu. Hz. Zeyd (radıyallahu anh) ona, ‘Ey Peygamber’in [sallallahu aleyhi ve sellem] amcasının oğlu!"},{"k":"p","t":"Böyle davranma!’ diye ricada bulundu. İbn Abbas (radıyallahu anh) ise, ‘Biz büyüklerimize ve âlimlerimize böyle hürmet ederiz’ dedi. Bunun üzerine Hz. Zeyd (radıyallahu anh) onun elini öptü ve, ‘Biz de Hz. Peygamber’in [sallallahu aleyhi ve sellem] Ehl-i beyt’ine böyle hürmet ederiz’ diye karşılık verdi.”"},{"k":"p","t":"Abdullah b. Amr b. Âs (radıyallahu anh) Peygamber Efendimiz’den [sallallahu aleyhi ve sellem] şöyle işittiğini söylemiştir:"},{"k":"q","t":"“Müezzinin ezan okuduğunu duyduğunuz zaman, onun söylediklerini siz de aynen söyleyin. Sonra bana salât (Allahümme salli alâ seyyidinâ Muhammed) getirin. Çünkü bir kimse bana bir defa salât getirirse, Allah Teâlâ buna karşılık ona on defa rahmet eder. Daha sonra benim için Allah’tan vesileyi isteyin. Zira vesile, cennette Allah’ın kullarından sadece birine layık gördüğü bir makamdır. O kulun ben olacağımı umuyorum. Benim için Allah’tan vesileyi isteyen kimseye şefaatim vâcip olur.”"},{"k":"p","t":"Ezandan sonra okuduğumuz dua’da Efendimiz [sallallahu aleyhi ve sellem] ‘e vesile vermesi için dua ederiz:"},{"k":"p","t":"… “Ey bu eksiksiz olan davetin ve kılınacak olan namazın Rabbi Allah'ım! Hz. Muhammed'e [sallallahu aleyhi ve sellem] fazileti ve vesileyi ver. Onu, kendine vadettiğin makâm-ı mahmûda eriştir.“Ebû Hüreyre’den(radıyallahu anh) gelen başka bir rivayette Hz. Resûlullah [sallallahu aleyhi ve sellem] şöyle buyurmuştur: “Vesile cennetteki en yüce derecedir.”"},{"k":"p","t":"Enes b. Mâlik’ten (radıyallahu anh) rivayet edildiğine göre Peygamber Efendimiz [sallallahu aleyhi ve sellem] şöyle buyurmuştur:"},{"k":"q","t":"“Kim bana bir defa salavat getirirse, buna karşılık Allah ona on defa salât (rahmet) eder, onun on günahını bağışlar ve manevi derecesini on derece yükseltir.”"},{"k":"p","t":"Enes b. Mâlik’ten (radıyallahu anh) nakledildiğine göre Resûlullah Efendimiz [sallallahu aleyhi ve sellem] şöyle buyurmuştur:"},{"k":"q","t":"“Sevabını Allah Teâlâ’dan bekleyerek kim Medine’ye kabrimi ziyarete gelirse, kıyamet günü benim himayemde olur ve ona şefaat ederim.”"},{"k":"h","t":"Efendimiz [sallallahu aleyhi ve sellem]’in Güzel Ahlakı"},{"k":"p","t":"Resûlullah [sallallahu aleyhi ve sellem] kendisine yapılan daveti, çağıran kişi fakir mevki makam sahibi olmayan ve evi uzak olsa dahi kabul eder, kelle-paça cinsinden sakatat dahi olsa kendisine verilen hediyeyi kabul eder ve hediyeye hediye ile mukabelede bulunurdu."},{"k":"p","t":"Enes b. Mâlik (radıyallahu anh) anlatıyor:"},{"k":"q","t":"“Resûlullah’a [sallallahu aleyhi ve sellem] tam on sene hizmet ettim. Onun hizmetkarı olduğum halde Vallahi bu süre içerisinde bana bir defa olsun ‘öf’ bile demedi. Yapmış olduğum bir şey için de, ‘Niye böyle yaptın? (Şöyle yapsaydın ya!)’ ya da terkettiğim bir şey için, ‘Niye bunu terkettin? (yapsaydın ya!)’ dememiştir.”"},{"k":"p","t":"Hz. Âişe (radıyallahu anha) şöyle demiştir:"},{"k":"q","t":"“Resûlullah’tan [sallallahu aleyhi ve sellem] daha güzel ahlâklı biri daha yoktur. Ashabından veya Ehl-i beyt’inden biri onu çağırdığı zaman, ‘Lebbeyk’ (buyur) der ve o kimseye icabet ederdi.”"},{"k":"p","t":"Cerîr b. Abdullah (radıyallahu anh) şöyle demiştir: “İslâm’a girdiğim zamandan beri kendisinden istediğim hiçbir şeyden Peygamber [sallallahu aleyhi ve sellem] beni menetmedi. Beni her gördüğünde muhakkak yüzüme gülümsedi.”"},{"k":"p","t":"Resûlullah [sallallahu aleyhi ve sellem] ashabı ile şakalaşır, aralarına karışıp onlarla konuşurdu. Yine sahabilerin çocuklarıyla oynardı. O, hürün, kölenin, câriyenin, miskinlerin davetlerini kabul eder ve şehrin en uzağında bir hasta olsa dahi onun ziyaretine giderdi. Kendisinden özür dileyenin özrünü kabul ederdi."},{"k":"p","t":"Hz. Enes b. Mâlik (radıyallahu anh) demiştir ki: “(Gizlice bir derdini açmak üzere) ağzını Resûlullah’ın [sallallahu aleyhi ve sellem] kulağına yaklaştıran hiçbir adam, başını Hz. Peygamber’den uzaklaştırmadıkça Resûlullah [sallallahu aleyhi ve sellem] başını ondan uzaklaştırmazdı."},{"k":"p","t":"Yine (bir derdini anlatmak üzere) Resûlullah’ın [sallallahu aleyhi ve sellem] elini tutan bir adam, Hz. Peygamber’in [sallallahu aleyhi ve sellem] elini bırakmadıkça onun elini bırakmazdı. Dizleri, onun huzuruna oturan birinden daha önde görülmezdi.”"},{"k":"p","t":"Resûlullah [sallallahu aleyhi ve sellem] karşılaştığı kimseye öncelikle selâm verir ve ashabıyla karşılaştığında ilk yaptığı şey onlarla musâfaha etmek olurdu. Resûl-i Ekrem [sallallahu aleyhi ve sellem] o kadar ince düşünürdü ki, birine eziyet veya sıkıntı veririm, düşüncesiyle hiçbir zaman onun ayaklarını uzatarak oturduğu görülmemiştir."},{"k":"p","t":"Kendisini ziyarete gelenlere ikramda bulunur, kimi zaman hırkasını çıkarıp üzerine oturması için verir ve hatta altındaki minderi kaldırıp ona takdim ederdi. Sahabiler oturmak istemeseler de Resûlullah [sallallahu aleyhi ve sellem] oturmaları için ısrar ederdi. Kimi sahabilerine künyeler takar ve onlara kendilerinin en çok sevdikleri isimleriyle hitap ederdi. Haddi aşmadığı veya uygunsuz şeyler konuşmadığı müddetçe kimsenin sözünü kesmezdi."},{"k":"h","t":"Alemlere Rahmet Peygamberi"},{"k":"p","t":"Allah’u Teala, Hz. Adem’i [aleyhisselâm] dünyaya indirdiği zaman, Hz. Adem [aleyhisselâm] zellesini anladı, affı için ağladı ve şöyle yalvardı:"},{"k":"p","t":"“Ya Rabbi! Beni Habibin Muhammed [sallallahu aleyhi ve sellem] hatırına affeyle.” Yüce Rabbimiz:"},{"k":"q","t":"“Ey Adem [aleyhisselâm], sen benim habibim Muhammed’i [sallallahu aleyhi ve sellem] nereden tanıyorsun?”"},{"k":"p","t":"diye sordu. Hz. Adem [aleyhisselâm]:"},{"k":"p","t":"“Ya Rabbi! Sen beni Cennet’e yerleştirdiğin zaman Cennet’in her yerinde, Arş’ın üzerinde “La ilahe illallah Muhammedu’r-rasulullah” yazısını gördüm. İsmi senin isminle birlikte zikredilen ve her yere nakşedilen bu zatın senin katında çok kıymetli ve sevgili birisi olduğunu anladım. O sevgili kulunun hatırına beni affetmeni istiyorum.” dedi. Yüce Allah:"},{"k":"p","t":"“Evet,o benim habibimdir. Senin evlatlarından birisidir. Peygamberlerin sonuncusudur. Eğer onu yaratmasaydım seni de yaratmazdım. Seni onun hatırına affettim.” buyurdu."},{"k":"p","t":"Cabir bin Abdullah (radiyallahu anhuma) şöyle dedi:"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi ve sellem] uykuda iken bir grup melek gelir ve birbirlerine, ‘Dostunuzun (Rasûlullah’ın) durumunu anlatan bir misâl vardır’ derler. İçlerinden bir kısmı:"},{"k":"p","t":"‘O halde bu misâli kendisine anlatın’ der. Bir kısmı da onun uyuduğunu söyleyince, diğerleri derler ki:"},{"k":"p","t":"‘Gözü uyuyorsa da kalbi uyanıktır’. Bunun üzerine şöyle anlatırlar:"},{"k":"p","t":"‘Onun durumu tıpkı şöyledir: Bir adam bir ev yapar, evde bir sofra kurar, sonra da insanları davet etmesi için bir haberci görevlendirir. Haberciye kulak verenler eve girip o sofradan yerler, haberciye kulak vermeyenler ise pek tabii ki ne eve girerler, ne de sofradan yerler’."},{"k":"p","t":"Sonra hepsi birden şöyle der:"},{"k":"q","t":"“Ev cennettir, haberci Muhammed’dir [sallallahu aleyhi ve sellem]. Kim Muhammed’e [sallallahu aleyhi ve sellem] itaat ederse, Allah’a itaat etmiş olur, kim de ona karşı gelirse Allah’a isyan etmiş olur. Muhammed [sallallahu aleyhi ve sellem] iyi ve kötü insanların birbirlerinden tefrik edilmelerine (ayrılmalarına) bir vasıtadır!”"},{"k":"p","t":"Âlemlere rahmet olarak gönderilen muazzez Peygamberimizin [sallallahu aleyhi ve sellem], doğumunu anarken, yalnız mevlid okumak, ilâhîler söylemek ve kandil simidi dağıtmak, bu geceyi yaşamak için yeterli değildir."},{"k":"p","t":"Yüce Allah'ın sevgisine, hoşnutluğuna ve bağışlamasına ermenin yegâne yolu, Peygamberimizin yolundan gitmektir, O’na uymaktır."},{"k":"p","t":"Efendimiz’in s.a.v. yolundan gitmenin en güzel yolu da sünnet üzere yaşayan Allah dostlarını takip etmektir."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdulbaki El-hüseyni Hazretleri [kuddise sırruhû] bir sohbetlerinde şöyle buyurmuştur:"},{"k":"p","t":"“Bu dünya bir han gibidir; ahiret yolcusu bütün hazırlığını bu handa yapmalıdır. Yolda tedarik görülmez. Zira kervan yola çıkmıştır. Ölümle başlayan bir yolculuğun geri dönüşü yoktur. Yola çıkan kimsenin, hedefine ulaşması için belli bir yol ve usul takip etmesi gerekir. Başıboş ve hedefsiz yol giden kimsenin hedefine varması mümkün değildir. Onun nereye varacağı da belli olmaz. Allah yolu da böyledir."},{"k":"p","t":"O yolda Hz. Rasulullah’ın [sallallahu aleyhi ve sellem] izinden başka Allah'a giden bir yol ve kapı yoktur. Hz. Rasulullah'ın [sallallahu aleyhi ve sellem] hayatını yaşamak için de Allah dostlarına uymak gerekir. Hz. Peygamber'e [sallallahu aleyhi ve sellem] hakkıyla uymanın en güzel yolu, sünnet üzere yaşayan Allah dostlarını takip etmektir. Allah dostları, sünnet-i seniyyeyi kâl/söz olarak değil, hâl/hayat tarzı olarak yaşar ve yayarlar. Onlara uymakla iman selameti ile ölmek nasip olur. Böylece ebedi ahiret yolculuğu iman ile başlamış olur. En büyük saadet de budur.“Allah [celle celaluhu] sevgisini tatmanın ve ispat etmenin tek yolu Yüce Allah’ın sevdiklerini sevmektir."},{"k":"p","t":"Herkes kalbindeki Allah sevgisini kendisi ölçebilir. Bu sevgi, Allahu Teâlâ’nın sevdiği şeyleri ne kadar sevdiğimize ve onlara ne derece değer verdiğimize bakarak anlaşılır. Mesela Allah’ın sevgilisi Hz. Peygamber [sallallahu aleyhi ve sellem] kendisini anne-baba, evlat ve bütün insanlardan daha fazla sevmeyen müminin gerçek imana ve Allah’ın dostluğuna ulaşamayacağını belirtmiştir."},{"k":"p","t":"Allah için sevilecek kimselerin başında, peygamberlerden sonra Ashab-ı Kiram gelir. Sonra kâmil mürşidler ve diğer bütün müminler gelir."},{"k":"p","t":"Her devirde Allah [celle celaluhu] için sevilmeye layık, canını ve malını Allah [celle celaluhu] yoluna adamış öyle kâmil veliler bulunur ki, onlar ilahi aşk için bir merkez durumundadır. Allahu Teâlâ yeryüzünde en büyük sermaye olan ilahi aşkı onların kalbine emanet etmiştir. İlahi aşk ve edeb onların her şeyine yansımıştır. Onlar Allah’ın boyası ile boyanmıştır. Onların kalbine bağlanan kalpler, nasip, niyet, samimiyet ve kabiliyetlerine göre o aşktan nasiplenirler. Bu sevgi kalbi saflaştırır, insanı olgunlaştırır."},{"k":"p","t":"Allah Teâlâ [celle celaluhu] Efendimiz’e [sallallahu aleyhi ve sellem] layık ümmet olabilmeyi nasip eylesin."},{"k":"p","t":"Âmin."}],"mins":20,"cat":"Peygamberimiz"},{"id":"nebi","title":"Mevlid-i Nebî","sub":"Mevlid gecesi sohbeti","desc":"Gecenin önemi, menkıbeler ve bu geceyi nasıl değerlendirmeli","color":"#8A6A1F","paras":[{"k":"p","t":"Allah Teâlâ şöyle buyurmuştur:"},{"k":"q","t":"\"Andolsun size kendinizden öyle bir Peygamber gelmiştir ki, sizin sıkıntıya uğramanız ona çok ağır gelir. O, size çok düşkün, müminlere karşı çok şefkatlidir, merhametlidir.\""},{"k":"p","t":"Bu ayetin tefsirinde denir ki: Yani, bir resuldür ki, azîzdir; büyük izzeti vardır. Sizi sıkıntıya sokan şeyler ona ağır gelir. O yüksek izzet sahibi peygamber, kendi cinsinin evlatlarının zor durumda kalmasına razı olmaz. Sizin cinsinizden olması ve izzet sahibi bulunması sebebiyle bütün dertlerinizi ve kederlerinizi yüreğinde duyar, acınızı hisseder. Yani, azap görmeniz şöyle dursun, bir takım zahmete, sıkıntıya uğramanız bile onu üzer, son derece rahatsız eder. Yahut sizi sıkan, zorunuza giden şeyler beşeriyet icabı onu da üzer. Onun dayanma gücü ve metin görünüşü, sıkıntılara göğüs germesi, üzülmediğinden değil, peygamber oluşundandır. Üzerinize düşkündür. Hidayet ve iyiliğinize, faydanıza, hayrınıza hırslıdır. Üzerinize toz kondurmak istemediği gibi, sizi mutluluğun zirvesine eriştirmek, selamete çıkarmak, cennete ve Rıdvan’a kavuşturmak için bütün hırsıyla ve var gücüyle uğraşır. Üstelik onun merhameti yalnızca Kureyş'e, Arab'a, şu veya bu kavme değil, hangi kavimden olursa olsun bütün müminleredir ki, o raûftur. Re'feti çok fazladır, yani gayet ince bir şefkati ve derin bir merhameti vardır. Rahîmdir. Fıtraten, doğuştan, yaratılıştan, Allah tarafından pek ziyade merhametlidir. Günahkârlara bile acır."},{"k":"p","t":"Başka bir ayet-i celile de ise Allah Teâlâ şöyle buyurmuştur:"},{"k":"q","t":"\"Biz seni ancak âlemlere rahmet olarak gönderdik.\""},{"k":"p","t":"Said b. Cübeyr (r.a), İbn Abbas'ın (r.a) şöyle dediğini nakletmektedir: Muhammed (s.a.v) bütün insanlara rahmet idi. Ona iman edip kendisini tasdikleyen mutlu oldu. Ona iman etmeyen bile geçmiş ümmetlerin uğramış olduğu, yerin dibine geçmek ve suda boğulmak gibi (toplu) azaplardan kurtuldu."},{"k":"p","t":"İnsanlığın kurtuluşu için gönderilen son ve en büyük peygamber, Peygamberimiz Hz. Muhammed Mustafa (s.a.v) kameri aylardan Rebiülevvel ayının 12. gecesi doğmuştur. Mîladi takvime göre bu, 20 Nisan 571’e rastlamaktadır. Bu mübarek geceye ‘doğum günü’ anlamında olan ‘Mevlid Kandili’ denir. Sahih rivayetlerle aktarıldığına göre bu gün pazartesi günüdür. Nitekim İbn Abbas r.a. şöyle demiştir:"},{"k":"q","t":"“Rasulullah (s.a.v) pazartesi günü dünyaya geldi, ona pazartesi günü peygamberlik verildi, Mekke’den Medine’ye pazartesi günü hicret etti, Medine’ye girişi pazartesi günü oldu. Pazartesi günü de vefat etti.”"},{"k":"p","t":"Allah Rasulü (s.a.v)’in dünyayı teşrif ettiği gün olan bu tarih, müslümanlar için bir sevinç vesilesi olmuş ve bu güne İslâm âleminde büyük ehemmiyet verilmiştir."},{"k":"p","t":"Rasulullah’ın (s.a.v) dünyaya gelmesi insanlık tarihinin en önemli olaylarından biridir. Bu gece Hz. İbrahim’in (a.s) “Ey Rabbimiz! Onlara, içlerinden senin ayetlerini kendilerine okuyacak, onlara kitap ve hikmeti öğretecek, onları temizleyecek bir peygamber gönder. “diye yaptığı duaya, Hz. İsa’nın (a.s) “Ey İsrâiloğulları! Ben size Allah’ın elçisiyim, benden önce gelen Tevrat’ı doğrulayıcı ve benden sonra gelecek Ahmed adında bir peygamberi de müjdeleyici olarak geldim” müjdesine ve Hz. Âmine’nin rüyasına mazhar olan Muhammed Mustafa (s.a.v) dünyaya gelmiştir."},{"k":"p","t":"Nitekim Resûlullah Efendimiz (s.a.v) şöyle buyurmuştur:"},{"k":"q","t":"“Ben Allah katında, kitapların anasında (levh-i mahfûzda) Allah’ın son peygamberi olarak yazılıyım. Ben, İbrahim’in duası, İsa’nın müjdesi ve annemin rüyasıyım.”"},{"k":"p","t":"Diğer bir hadis-i şerifte Hz. Peygamber’in (s.a.v) Hz, Âdem’den (a.s) önce yaratılmış olduğu şöyle anlatılmıştır:"},{"k":"q","t":"“Âdem arşın üstünde Muhammed isminin yazılı olduğunu gördü. Onun hatırına affını istedi. Yüce Allah, Âdem’e (a.s) şöyle buyurdu: ‘’Muhammed olmasaydı seni yaratmazdım.”"},{"k":"p","t":"Cafer-i Sadık (r.a) demiştir ki: “Allah Teâlâ her şeyden önce Hz. Muhammed’in (s.a.v) nurunu yaratmıştır. Allah Teâlâ’nın birliğini ilk ikrar eden O’nun nuru ve ruhudur. Allah Teâlâ Kalem’e ilk olarak ‘Lâ ilâhe illallah Muhammedü’r-Rasulullah’ yazdırmıştır.”"},{"k":"p","t":"Rasulullah Efendimiz (s.a.v) dünyaya gelirken bazı olaylar meydana gelmişti. Doğuma az bir zaman kala, Hz. Âmine bir rüya gördü. Rüyasında, bedeninden çıkan bir nur, doğu ile batı arasına ne varsa hepsini aydınlatıyordu."},{"k":"p","t":"Rüya devam ederken gönülleri okşayan hoş bir ses duymuştu. Bu ses, ona doğumdan sonra yapacaklarını bildiriyordu: “Bir ve tek olan Allah’a (c.c) sığınırım’ de ve adını Muhammed koy, hâlini kimseye bildirme.”"},{"k":"p","t":"Hz. Âmine, doğum yaklaştıkça harikulade haller yaşamaya başladı. Gerçi daha önce de zaman zaman olağanüstü şeyler görüyordu. Fakat bu sefer çok daha başkaydı. Vakit geceye yaklaştıkça doğum yapacağı hissine kapıldı ve yakın komşusu Şifâ Hatun’a kendisine yardımcı olması için haber gönderdi. Şifâ Hatun beraberinden birkaç kadınla birlikte Hz. Âmine’nin evine geldiler."},{"k":"p","t":"Hz. Âmine birden evinin içinin bir nurla kaplandığını, etrafın gündüz gibi aydınlık olduğunu fark etti. Uzandığı yatağın yanında bir kâse vardı. Bu kâse nereden gelmişti, kim koymuştu, bilmiyordu. Kâsenin içinden birkaç yudum alınca içine bir ferahlığın dolduğunu hissetti. Derken güzellikleri göz alıcı bazı kadınlar geldi evine. Ama onları şimdiye kadar hiç görmemişti. Kendisi ve karnındaki yavrusu hakkında konuşuyorlar, birbirlerini ve Âmine’yi tebrik ediyorlardı. Hz. Âmine de, ”Yâ Rabbi, bunlar kimlerdir acaba?” diyerek merakla, hayretle onları izliyordu."},{"k":"p","t":"Dünya yaratıldı yaratılalı gelip geçen bu en hayırlı gecede, yeryüzünün her tarafından Allah’ın (c.c) emri ile gerçekleşen çeşit çeşit hadiseler oluyordu. Yalnız Hz. Âmine’nin evindekiler değil, Mekke içinde, yakın kabilelerde ve dünyanın her tarafında bu haller dikkatle gözlemleniyordu.- Yahudiler, astronomik/astrolojik bulgularla gökyüzüne bakıp parlak bir yıldızın doğduğu gece son peygamberin doğduğunu söylemişler, “artık İsrail oğullarından peygamberlik gitti” diyerek feryad etmişlerdi."},{"k":"p","t":"Aynı gece Kâbe’deki putlar baş aşağı devrilmiş, O zaman mukaddes sayılan Save Gölü’nün de o gece bir anda suyu çekilip kuruyuvermiş, İran hükümdarının sarayı beşik gibi sallanıp on dört sütunu parçalanarak yere düşmüş, Mecusilerin bin senedir söndürülmeden yanan ateşi birden sönmüştü. Bu durum Mecusi İran Devleti’nin on dört hükümdardan sonra Müslümanların eline geçeceğini sembolize etmektedir."},{"k":"p","t":"Yüce Allah’ın, Hz. Muhammed’i (s.a.v) resûl olarak göndermesinden ve insanları Hakk’a ve sırât-ı müstakîme yönlendirmesinden daha büyük bir lütuf yoktur. Bir mümin için dünyada ve âhirette elde edilecek bütün hayırların sebebi hidayet ve imandır. Bunlar ebedî saadetin anahtarıdır. Peygamber Efendimiz’in (s.a.v) en büyük mûcizesi yüce Allah’ın kendisine vahyettiği kelâmı ve hidayet kitabı Kur’ân-ı Kerîm’dir. Bu mûcizenin büyüklüğü bir âyette şöyle hatırlatılır: “Kendilerine okunmakta olan kitabı sana indirmemiz onlara yetmez mi?”"},{"k":"p","t":"Şayet Hz. Muhammed’in (s.a.v) peygamberliğine alâmet olarak, sadece bu kitap olsaydı yine de yeterdi."},{"k":"p","t":"Hâlbuki onun bundan başka yerde ve gökte sayılamayacak kadar mûcizesi vardır."},{"k":"p","t":"Yüce Allah’ın “Kuşkusuz onlar önceden apaçık bir sapıklık içindeydiler” âyeti bu kitap gelmeden önce insanların bulunduğu kötü hali haber vermektedir."},{"k":"p","t":"Hz. Peygamber’in yaşadığı devir gerçekten cahiliyenin bütün adetlerinin yürürlükte olduğu, Putperestliğin, haksızlığın, zulmün, adaletsizliğin kol gezdiği, kadınların hiçbir değerinin olmadığı, kız çocuklarının diri diri toprağa gömüldüğü bir devir olarak tarihe geçmiştir."},{"k":"p","t":"O gün insanlar şirk bataklığı içerisinde Allah’ı gerçek anlamıyla tanıyamamışlar, kendi elleriyle yaptıkları putlarını tanrı edinmişlerdi. Hz. İbrahim’in Hanif Dini’ne mensup muvahhidler/tek tanrıya inananlar bir elin beş parmağı kadardı. Bunlar arasında Zeyd b. Amr en-Nufeyl’in çaresizliği ibret acısıdır. Bu muvahhid kişi bir defasında Kâbe’ye gelerek ellerini açmış ve “Ya Rabbi, bugün kavmimin arasında benden başka İbrahim’in dinine inanan kimse kalmadı, keşke sana nasıl ibadet edileceğini bilseydim de öyle etseydim” diyerek avuçlarının içine secde etmişti. Zira din namına bildiği yalnızca Allah’ın birliği idi. Bugün her şeyi bilip de ilimleriyle amel etmeyenlerin/bildiklerinin gereğini yerine getirmeyenlerin kulakları çınlasın."},{"k":"p","t":"Yine ibretli bir hatıra olarak Hz. Ömer’in sözleri ciğerleri dağlayıcıdır."},{"k":"p","t":"Hz. Ömer İslam’dan önceki günlerini yad ederken, “bir olaya ağladığını, birisine de güldüğünü” anlatmaktadır."},{"k":"p","t":"Ağladığı olay şudur: Kendisinin bir kız evladı dünyaya geldiğinde onun utancıyla toprağa gömmek için onu yanına almış, çukuru kazarken kızı, gayet masumane şekilde babasının yüzüne sıçrayan toprağı temizlemeye çalışırken bir darbe ile kızını çukura atmış ve sonra da diri diri gömmüştü."},{"k":"p","t":"Güldüğü olay da şudur: Putperest Araplar yolculukta kullanmak üzere helvadan put yapmakta, tapınma anında ona tapınmakta, acıktıklarında da tapındıkları bu tanrılarını yemekteydiler. Aynısını Hz. Ömer de yapmıştı."},{"k":"p","t":"İşte İslam, böyle bir Ömer’den, cihan tarihine adını altın harflerle yazdıran adalet timsali bir Hz. Ömer (r.a.) ortaya çıkarmıştır."},{"k":"p","t":"Ahmed b. Hanbel (rah.) vefatından sonra rüyada görüldü; kendisine durumunun nasıl olduğu sorulunca, saadetine sebep olan şu nimeti dile getirdi: “Eğer Muhammed (s.a.v) olmasaydı, bizler Mecûsî olurduk.”"},{"k":"p","t":"Evet, eğer Hz. Muhammed (s.a.v) olmasaydı Iraklılar Mecûsî olurdu. Şam, Mısır ve Rum ehli Hıristiyan olurdu."},{"k":"p","t":"Araplar putlara tapar, müşrik olurdu. Ama yüce Allah, Hz. Muhammed’i (s.a.v) göndermekle kullarına merhamet etti; onları sapıklıktan kurtardı."},{"k":"p","t":"Hz. Peygamber (s.a.v) Yüce Allah’ın yanında o kadar kıymetli ve değerlidir ki O’nsuz Yaratıcı’yı bulmak ve kurtuluşa ermek asla mümkün değildir. O’nun faydası sadece Müslüman olanlara değil, azılı düşmanlarına bile erişmiştir. Aşağıdaki örnek bunu çok güzel anlatmaktadır. Bu örnekte Hz. Peygamber’in doğumuna sevinmenin, Mevlid gecesine kıymet vermenin, onu kutlamanın ve “Mevlid” okumanın çok faziletli olduğuna dair delil de bulunmaktadır."},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Abbas ve Ebu Leheb amcalarından ikisiydi. Ebu Leheb O’nun azılı düşmanı, amcası Abbas ise can dostuydu."},{"k":"p","t":"Süveybe Ebu Leheb’in cariyesiydi. Rasulullah’ı (a.s.) emzirmişti. Ebu Leheb’e Süveybe:"},{"k":"p","t":"“Kardeşin Abdullah’ın hanımı Âmine bir erkek çocuk doğurdu, biliyor musun?” dedi. Sevindi Ebu Leheb, ne de olsa kendi akrabasıydı, yeğeniydi. Kanı harekete geçti. Cariyesine: “Git, artık hürsün. Seni bağışladım!” dedi."},{"k":"p","t":"Azılı düşman Ebu Leheb, o biricik Allah Rasulü’ne sonradan neler yapmadı ki! Düşmanlığı hakkında ayet indi."},{"k":"p","t":"Abbas (r.a.), kardeşi Ebu Leheb’i öldükten sonra bir gün rüyasında gördü. O anlatıyor: “Sonradan Ebu Leheb’i çok kötü halde gördüm. Bana şöyle diyordu: “Öldükten sonra hep azap içindeyim. Ancak pazartesi günleri azabım hafifletiliyor. Çünkü o gün cariyem Süveybe’yi azad etmiştim.”"},{"k":"p","t":"Hafız Muhammed İbni Cezeri Şafii diyor ki: ‘’Ebu Leheb gibi azgın bir kâfirin azabı hafifleyince, O yüce Peygamberin ümmetinden olan bir mümin, Onun doğduğu gece sevinir, malını uygun yerlere dağıtır, ziyafet verir, böylece, Peygamberine olan sevgisini gösterirse, Allahü Teâlâ onu Cennetine sokar.’’"},{"k":"p","t":"İşte Mevlid gecesi Hak katında bu kadar değerli bir gecedir. Hatta bazı Müslüman âlimler bu gecenin -ancak yalnızca Hz. Peygamber’in doğduğu gecenin ki sadece bir tek gecedir ve o da geçmiştir, her yıl gelen Mevlid geceleri o bir tek gecenin tekrarıdır- Kadir gecesinden de kıymetli olduğunu bildirmişlerdir. Âlimlerin çoğunluğu ise Kadir gecesinin en kıymetli gece olduğunu söylemişlerdir."},{"k":"p","t":"Şehabettin el-Kastallânî, İbn Hacer el-Askalânî, İbn Hacer el-Heytemî, Celâleddin es-Süyûtî gibi bazı âlimler, Peygamberimiz’in (s.a.v) dünyaya gelmesi sebebi ile sevinmenin, bugün münasebetiyle muhtaçlara yardım etmenin, Peygamberimiz’e (s.a.v) şiirler (mevlid gibi) okumanın güzel birer amel olduğunu söylemişlerdir."},{"k":"p","t":"İmâm-ı Celâleddîn Abdurrahmân bin Abdülmelik el-Kettânî buyurdu ki: “Mevlid günü ve gecesi mübecceldir, yani şerefi, kıymeti çoktur. Kendisine tâbi olanlar için kurtuluş vesilesi olan Resûlullah (s.a.v.) Efendimizin doğumu için sevinmek, cehennem azabının azalmasına sebep olur. Bu geceye hürmet etmek, sevinmek, bütün senenin bereketli olmasına sebep olur. Mevlid gününün fazileti Cuma günü gibidir. Cuma günü, cehennem azabının durdurulduğu hadîs-i şerîf ile bildirilmiştir. Bunun gibi, Mevlid gününde de azâb olmaz. Mevlid geceleri sevincimizi göstermeli, çok sadaka vermeli, davet olunan ziyafetlere gitmelidir.”"},{"k":"p","t":"Mübarek gün ve geceler münasebetiyle Resûlullah’ı (s.a.v) yâd etmek, pek çok hayra vesiledir. Okunan mevlidlerde Allah’ı anma, Peygamberimize (s.a.v) övgü ve sâlat-u selam vardır. Allah’ı anmak ayeti kerimede geçtiği üzere ‘’En büyük fazilettir.’’"},{"k":"p","t":"Peygamber Efendimize (s.a.v) salât-u selam göndermek ise, ‘’Muhakkak ki Allah ve melekleri, Peygambere salât ederler. Ey iman edenler! Siz de ona salât edin ve tam bir içtenlikle selam verin’’ ayeti mucibince bizlere emredilmiştir."},{"k":"p","t":"Salât-u selam getirmek sünnet olup Peygamber Efendimiz’e (s.a.v) olan biatımızı yenilememiz dememektir."},{"k":"p","t":"İşte mevlid vesilesiyle hem salât-u selam sünnetini işlemiş hem de Hz. Peygamber’e (s.a.v) olan ahdimizi tazeleyip tekrarlamış oluruz."},{"k":"p","t":"Peygamber Efendimiz’i (s.a.v) övmek ve onun şefaatine nail olmak maksadıyla Rasûl-i Ekrem (s.a.v) hayattayken bile şiirler yazılmış, kasideler söylenmiştir."},{"k":"p","t":"Bediüzzaman hazretleri ‘’Cenab-ı Hak bu âdeti ebede kadar devam ettirsin ve Süleyman Efendi gibi mevlid yazanlara rahmet etsin, yerlerini cennetü’l-firdevs yapsın’’ demiştir."},{"k":"p","t":"Peygamberimizin (s.a.v) doğum yıldönümlerinden okunan mevlidlere saygı ve hûşu içinde dinlemek, onun mübarek ruhuna salât ve selam okumak hiç şüphesiz Sevgili Peygamberimiz’e (s.a.v) olan sevgi ve bağlılığın bir ifadesidir."},{"k":"p","t":"Allah dostları ve âlimlerimiz eskiden beri mevlide büyük önem vermişler ve bu günlerde mevlid tertip etmeye gayret göstermiş, insanları da buna teşvik etmişlerdir."},{"k":"p","t":"Tâbiînin büyüklerinden Hasan-ı Basrî hazretlerinin şöyle buyurduğu nakledilmiştir: “Uhud dağı kadar altınım olsun, ben onu Peygamberimiz’in mevlidini kutlamak için sarf etmek isterim.”"},{"k":"p","t":"Cüneyd-i Bağdadî hazretleri şöyle der: “Mevlid de hazır bulunan, onun kadrini kıymetini bilen kişi muhakkak ki büyük bir eman (güvence) kazanmıştır.”"},{"k":"p","t":"Hz. Mevlâna, “Mevlid okunan yerden belâlar gider” buyurmuştur."},{"k":"p","t":"Meşhur âlimlerimizden Fahreddin er-Razî hazretleri de şöyle buyurmuştur: “Herhangi bir şahıs, bir tuz, buğday veya yenilecek şeyler cinsinden başka bir şey üzerine mevlid okursa mutlaka o şeyde bereketler zuhur eder."},{"k":"p","t":"O yiyecek neye ulaştıysa onda da çok bereket belirir.”"},{"k":"p","t":"Yine meşhur hadis alimlerimizden İmam Suyûtî (rah) şöyle buyurmuştur: “Hangi evde veya mescidde yahut mahallede mevlid okunursa o evi, mescidi veya mahalleyi mutlaka melekler kuşatır, o mekanın ehline melekler feyz yağdırır. Allah Tealâ rahmet ve rızasıyla onları kuşatır.”"},{"k":"p","t":"Sâdât-ı kiram da Mevlid-i Nebî’ye büyük hürmet göstermişlerdir. Hz. Peygamber’i senenin sadece bir gününde veya bir haftasında değil her zaman hatırlamamız gerekir. Nitekim sâdât-ı kiram, mevlidi senenin belli bir gününde değil, aralıklarla okur, okutur, okunan yerde bulunur, hürmet ve sevgiyle dinlerler. Nitekim mevlid okutmak için zaman zaman ilim talebelerini hane-i saadetlerine davet ederler. Bazen mevlidin baş kısmını kendileri okur, devamını talebelere okuturlar."},{"k":"p","t":"Mevlidin okunduğu yere yiyecek ve içecekler konur. Bundan herkese, özellikle de talebelere ikram edilir."},{"k":"p","t":"Hatta mevlid dolayısıyla inen rahmetten, füyuzattan bereketlenmek gayesiyle bulgur, pirinç, nohut gibi yiyecekler getirilir, ortaya bırakılır. Daha sonra da bunlar tekrar geriye erzakların içine konulur."},{"k":"p","t":"S. Muhammed Raşid (k.s) hazretleri bir sohbetlerinde: ‘’Hz. Peygamberimiz Muhammed Mustafa (s.a.v.) eşrefi mahlûkat ve efdali peygamberdir. Ümmetlerin en efdali ümmeti Muhammeddir. Bu şeref Hz. Muhammed'in şerefinden gelmektedir. Onun ümmeti de diğer ümmetlere nispetle şereflidir, itibarlıdır.‘’ der ve şöyle bir menkıbe anlatır:"},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Hz. Musa (a.s.), Hz. Muhammed'in (s.a.v.) ve O'nun ümmetinin fazilet ve büyüklüğünü, Allah (c.c.) katındaki değerini Levh-i mahfuz'da gördükten sonra şöyle buyurur: \"Ya Rabbi! Hz. Muhammed'in (s.a.v.) ümmeti olamadım."},{"k":"p","t":"Bari ümmetini görenlerden olsaydım.\" O sırada İmam-ı Gazali'nin (rah.) ruhaniyeti oraya geliyor ve Hz. Musa (a.s.) ile görüşüyor. Hz. Musa (a.s.): Sen kimsin? diye sorunca, İmam-ı Gazali:"},{"k":"p","t":"Muhammed oğlu, Muhammed oğlu, Hamid oğlu İmam-ı Gazali'yim diye cevap verir. Bu cevap üzerine Hz. Musa (a.s.) Künyeni neden bu kadar uzun söyledin, yalnızca İmam-ı Gazali deseydin yetmez miydi? diye sorar. İmam-ı Gazali (rah.): Allah (c.c.) Hazretleri ile konuşmaya gittiğin zaman sana \"sağ elindeki nedir?\" diye sorduğunda, sen onu tanıtırken \"O benim asamdır. Ona dayanırım ve onunla davarlarıma yaprak silkerim ve onda benim başka hacetlerim de vardır\" diye uzun uzun anlattın, kısaca cevap verseydin yeterli olmaz mıydı?\" şeklinde sorusuna soruyla cevap verir. Hz. Musa (a.s.) da cevap olarak:"},{"k":"p","t":"Ben Allah'u Teâlâ (c.c.) ile biraz daha fazla konuşabilmek için uzun uzun açıkladım, der. İmam-i Gazali (rah) de cevap olarak:"},{"k":"li","m":"•","t":"Sen Allah (c.c.)'in büyük peygamberlerindensin. Kelimetullah'sın. Kitab verilenlerdensin. Onun için seninle daha fazla konuşabilme şerefine nail olmak için uzun açıklamada bulundum, der."},{"k":"p","t":"Rivayet edildiğine göre Âdem (a.s) şöyle demiştir: Allahu Teâlâ, Muhammed (s.a.v) ümmetine dört keramet ihsan eyledi. Onları bana bile yapmadı."},{"k":"li","m":"1.","t":"Benim tövbemi, ancak Mekke’de kabul eyledi; ama Ümmet-i Muhammed’in tövbesini her yerde kabul buyurur."},{"k":"li","m":"2.","t":"Ben giyiniktim; zelle (yasak ağaçtan yeme) işleyince üryan oldum. Ümmet-i Muhammed çıplak halde isyan ederler. Allah onları giydirir."},{"k":"li","m":"3.","t":"Ben, hata edince, eşimle aramı açtı, ama Ümmet-i Muhammed’e öyle yapmıyor. İsyan ederler kadınları ile araları açılmaz."},{"k":"li","m":"4.","t":"Ben, cennette hata ettim, oradan beni çıkardı. Ama Ümmet-i Muhammed cennetin dışında hata işlerler, cennete girerler."},{"k":"p","t":"Yine denildiğine göre, Allahu Teâlâ, bu ümmete beş ikramda bulunmuştur:"},{"k":"li","m":"1.","t":"Onları, kibirlenmemeleri için zayıf olarak yaratmıştır."},{"k":"li","m":"2.","t":"Yemeleri, içmeleri ve giyimleri kendilerine meşakkat vermemesi için onları küçük yaratmıştır."},{"k":"li","m":"3.","t":"Günahları en az seviyede olması için ömürlerini kısa tutmuştur."},{"k":"li","m":"4.","t":"Ahirette hesapları çabuk bitsin diye onları fakir yaratmıştır."},{"k":"li","m":"5.","t":"Kıyametin kopuşuna kadar kabirde en az kalanlar olmaları için, onları en son gelen ümmet kılmıştır."},{"k":"p","t":"Rasulullah Efendimiz (s.a.v) şöyle buyurmuştur: \"Cennet ehli yüz yirmi saftır. Bunlardan seksen safı bu ümmetten, kırk safı da diğer ümmetlerdendir.\""},{"k":"h","t":"Peki, bizler böylesine önemli bir geceyi nasıl değerlendirmeliyiz?"},{"k":"li","m":"•","t":"Bir Allah dostu bu ay için, bu aydaki Mevlid-i Nebi için öyle dermiş: “Bu ay, bu mübarek gün için yapılacak en güzel ibadet çok mutlu olmaktır.”"},{"k":"li","m":"•","t":"Bilhassa mübarek gecelere özel mevlid-i şerif okuması sağlanmalı, mevlidleri saygı ve hûşu içinde dinlemeli, Efendimiz (s.a.v)’in mübarek ruhuna salât ve selam okumalıyız."},{"k":"li","m":"•","t":"Mevlid kandili v.b mübarek geceler, duaların Allah’a arzedilmesi, pişmanlık gözyaşlarıyla günahların silinmesi, yapılan ibadetlere verilen sevabın katlanması bakımından birer büyük fırsattır."},{"k":"li","m":"•","t":"Öncelikle böyle zamanlarda kulluğumuzu gözden geçirerek, eksik ve hatalarımızı ele almalı ve bunları düzeltebilmenin yollarını aramalıyız. Yani hesaba çekilmeden önce burada kendimizi hesaba çekmeliyiz, her gece ve dünyalık işlerin muhasebesini yaptığımız gibi bugünlerde de manevi kazanç ve kayıplarımızın muhasebesi yapmalıyız ki ahiretteki hesabımız kolay olsun."},{"k":"li","m":"•","t":"Bu mübarek geceyi günahlarımızın affı için bir fırsat bilmeli ve bol bol tövbe ve istiğfarda bulunmalıyız."},{"k":"p","t":"Özellikle müslümanların içinde bulunduğu sıkıntıları düşünerek dua edip Allah’a yalvarmalıyız."},{"k":"li","m":"•","t":"Eğer kaza namazlarımız varsa bunları kılma yoluna gitmeli, kaza namazımız yoksa bile, çokça nafile namaz kılmaya çalışmalı ve özellikle geceleri iyi değerlendirmeliyiz."},{"k":"li","m":"•","t":"İmkânımız nispetinde çokça Kur’an okumalıyız."},{"k":"li","m":"•","t":"Akrabalarla, komşularla ve dostlarımızla olan yakınlığımızı bir kat daha artırmalı ve yapacağımız ziyaretlerle onların gönlünü almalıyız. Onları sohbet meclislerine davet, hayır hasenata teşvik ederek onlarında bu feyzli, bereketli zamanlardan istifade etmelerinin sağlamalıyız."},{"k":"li","m":"•","t":"Etrafımızdaki fakir fukaraya yardım etmeli, imkânımız ölçüsünde sadaka vermeli, fakir öğrencilerin okuması için onların elinden tutmalıyız. Çünkü bu zaman dilimlerinde vereceğimiz sadakalar veya zekâtlar bize kat kat sevap getirecektir. İftar yemeklerine katılmalı, gücümüz nispetinde iftar vermeli veya bir yudum su dahi olsa iftar yemeklerinde katkıda bulunabiliriz."},{"k":"p","t":"Âlemlere rahmet olarak gönderilen muazzez Peygamberimizin (s.a.v), doğumunu anarken, yalnız mevlid okumak, ilâhîler söylemek ve kandil simidi dağıtmak, bu geceyi yaşamak için yeterli değildir."},{"k":"p","t":"Allah Teâlâ kendisine nasıl kulluk yapacağımızı, içimizden seçmiş olduğu elçiye bakarak anlamamız ve hayata geçirmemizi bizlerden istiyor: “Andolsun ki, Rasulullah (s.a.v), sizler için güzel örnektir.”"},{"k":"p","t":"Rabbimizin bizden istediği kulluk görevini, Rasulullah (s.a.v.)’ın sünnetine bakarak yerine getirmekle yükümlüyüz."},{"k":"p","t":"Efendimiz (s.a.v)’in sünnetini başımıza taç, gönlümüze ilaç yapmadan dünyevi ve uhrevi huzuru elde etmek mümkün değil. Diğer bir ifade ile Cenab-ı Hak, Rasulünün sünnetine uymayı, hem Allah’ı sevmenin hem de Allah tarafından sevilmenin alameti ve günahların bağışlanmasına bir vesile sayıyor:"},{"k":"q","t":"“(Ey Habibim) De ki: Eğer Allah’ı seviyorsanız bana uyunuz ki, Allah da sizi sevsin ve günahlarınızı bağışlasın.”"},{"k":"p","t":"Efendimiz (s.a.v)’e uymanın ve en güzel şekilde O’nun yolundan gitmenin yolu da sünnet üzere yaşayan Allah dostlarını takip etmektir."},{"k":"p","t":"Gavs-i Sani (k.s) hazretleri bir sohbetlerinde şöyle buyurmuştur:"},{"k":"p","t":"‘’Bu dünya bir han gibidir; ahiret yolcusu bütün hazırlığını bu handa yapmalıdır. Yolda tedarik görülmez. Zira kervan yola çıkmıştır. Ölümle başlayan bir yolculuğun geri dönüşü yoktur. Yola çıkan kimsenin, hedefine ulaşması için belli bir yol ve usul takip etmesi gerekir. Başıboş ve hedefsiz yol giden kimsenin hedefine varması mümkün değildir."},{"k":"p","t":"Onun nereye varacağı da belli olmaz. Allah yolu da böyledir. O yolda Hz. Rasulullah’ın (s.a.v) izinden başka Allah'a giden bir yol ve kapı yoktur. Hz. Rasulullah'ın (s.a.v) hayatını yaşamak için de Allah dostlarına uymak gerekir. Hz. Peygamber'e (s.a.v) hakkıyla uymanın en güzel yolu, sünnet üzere yaşayan Allah dostlarını takip etmektir. Allah dostları, sünnet-i seniyyeyi kâl/söz olarak değil, hâl/hayat tarzı olarak yaşar ve yayarlar. Onlara uymakla iman selameti ile ölmek nasip olur. Böylece ebedi ahiret yolculuğu iman ile başlamış olur. En büyük saadet de budur.‘’ Ehl-i Beytten olan âlimler ve mürşidler, ümmetle Peygamberimizin (s.a.v) arasında en güzel bağı oluştururlar. Onlar bize Efendimizi (s.a.v) hatırlatırlar; çünkü O’nun hatırasıdırlar. Onları inkâr etmek veya onları hafife almak kişiyi çok büyük bir mahrumiyete sürükler."},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Şemseddin-i Mardinî şu olayı anlatmıştır:"},{"k":"p","t":"Bir gün Hz. Peygamber s.a.v.’i rüyada görmüştüm. Huzuruna varıp selam verdim. O ise benden yüzünü çevirdi."},{"k":"p","t":"Ağlayarak dedim ki: ‘’Yâ Resûlallah! Ben yıllardır senin hadislerini ve eserlerini anlamak için uğraştım. Dinle ilgili müşkülleri çözmek için didindim. Şimdi bu mahrumiyetin sebebi nedir?’’"},{"k":"p","t":"Resûlullah s.a.v. dedi ki:"},{"k":"p","t":"‘’Söylediklerin doğrudur. Fakat sen bizim kardeşimize inkâr gözüyle bakıyorsun. Bu da hoşumuza gitmiyor."},{"k":"p","t":"Yaptığın şey büyük bir günah, kötü bir cinayettir. Sen veliler hakkında iyi zan beslesen ne olur? Özellikle can evlatlarımızdan Mevlânâ hakkında…’’"},{"k":"p","t":"İşte ben bu rüya ile uyanınca halimden tövbe ettim, Mevlânâ’nın sadık bir müridi oldum."},{"k":"p","t":"Allah Teâlâ ayet-i kerimede şöyle buyurmuştur:"},{"k":"q","t":"\"Andolsun size kendinizden öyle bir Peygamber gelmiştir ki, sizin sıkıntıya uğramanız ona çok ağır gelir. O, size çok düşkün, müminlere karşı çok şefkatlidir, merhametlidir.\""},{"k":"p","t":"Bu meyanda Alvarlı Muhammed Lütfi Efendi (k.s) hazretleri şöyle buyurmuştur:"},{"k":"p","t":"Felekte hâsılı insan isen bir canı incitme, Günahkâr olma Fahr-i Âlemi Zişanı incitme."},{"k":"p","t":"Evet, Efendimiz (s.a.v) ümmetinin her bir ferdinin gaflet ve delaletinden dolayı üzüntü duyar. Fakat ümmetinin her bir rahmet ve hidayetinden dolayı da büyük bir sevinç duyar."},{"k":"p","t":"Gavs-i Sânî (k.s) hazretlerinin buyurduğu gibi: ‘’Gündüz gece çalışmak gerek çünkü gaye Efendimiz (s.a.v)’in keyfi gelsin.’’"},{"k":"p","t":"Kamil mürşitler Rasulullah (s.a.v) Efendimizin varisleridir. Onun diğer şerefli halleri gibi, kendisindeki muhabbet ve merhamet ahlakına da varis olduklarından, Efendimizin ümmetini kendi nefisleri gibi kabul ederler. Efendimiz (s.a.v)’in yaptığı gibi bu ümmetin günahkâr fertleri için gözyaşı dökerler."},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Cüneyd-i Bağdâdî hazretlerinin başka bir şehirde yaşayan müridlerinden biri anlatır:"},{"k":"p","t":"Bir gün pazarda gezerken bir güzel kadın gördüm, defalarca baktım. Sonra pişman oldum, tövbe istiğfar ettim."},{"k":"p","t":"Akşam eve geldiğimde eşim, Efendi, bugün yüzünüzü kararmış görüyorum, acaba nedendir, dedi."},{"k":"p","t":"Aynayı alıp baktığımda, hakikaten yüzümün kararmış olduğunu gördüm. Neden olduğunu düşündüm, aklıma o kadına baktığım geldi. Bir mağaraya çekildim, günlerce gözyaşı döktüm, günahımın affı için Allah Teâlâ’ya yalvardım. Yine de huzurlu olamadım. Sonra hatırıma, Cüneyd-i Bağdâdî hazretlerini ziyaret etmek geldi. Bağdat’a gittim. Şeyhin evine varıp kapıyı çaldığımda bana, Gir ya Abdullah, sen Ruhbe’de günah işle, biz Bağdat’ta bu günaha istiğfar edelim öyle mi, dedi."},{"k":"p","t":"İçeri girdim, mübarek elini öpüp oturdum. Şaşırmış ve çok utanmıştım. Devamla şöyle buyurdu:"},{"k":"p","t":"‘’Pişmanlık ve tövbe büyük bir nimettir. Kalbin imdadı olmadan, organların dinin emrine uyması çok güçtür."},{"k":"p","t":"Büyüklerin sevgisi olmayınca, kalbin imdadı olmaz. Bunları yapmak ancak Allah adamlarının işidir. Büyükleri seven mahrum kalmaz.’’"},{"k":"p","t":"Evet, bugün bizler kendi günahlarımıza bile doğru düzgün gözyaşı dökemezken, bizim için gözyaşı döken, dua ve istiğfar eden bu muhammedî ahlakla ahlaklanmış Allah dostlarına tabi olmak ve yolunca gitmek Efendimiz (s.a.v)’in keyfini getirmek demektir. Bilinçli ümmet olma şuurunu elde etmektir."},{"k":"p","t":"Allah Teâlâ, sadatların himmet ve bereketiyle, bu gecenin bereketinden, feyzinden, rahmetinden bolca bizleri nasiplendirsin inşallah. Âmin."}],"mins":20,"cat":"Peygamberimiz"},{"id":"tasavvuf","title":"Tasavvufun Terbiye Sanatı","sub":"Sohbet yazısı","desc":"Nefsin terbiyesi, mürşidin görevi ve zikrin önemi","color":"#5B3B5E","paras":[{"k":"ar","t":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم"},{"k":"ar","t":"اَلْحَمْدُ لِلَّه رَبِّ الْعَالَمِينَ وَالصَّلاَةُ وَالسَّلاَمُ عَلَى رَسُولِنَا مُحَمَّدٍ وَعَلَى اٰلِهِ وَاَصْحَابِهِ اَجْمَعِينَ"},{"k":"ar","t":"قَدْ اَفْلَحَ مَنْ زَكّٰيهَا ۞ وَقَدْ خَابَ مَنْ دَسّٰيهَاۜ ۞"},{"k":"p","t":"“Nefsini günahlardan (Allah’a ortak koşmaktan, ibadetsizlikten, kötü duygu ve fiillerden vb.) arındırıp ıslah ederek ibadet ve taatle meşgul olan kimse kurtuluşa ermiştir. Nefsini saptırıp helâk ederek kötülüklere gömen kimse de ziyana ve hüsrana uğramıştır.” (Şems Suresi 9-10)."},{"k":"p","t":"Allah Teâlâ bu âyet-i kerimede kurtuluşu ve cennete girmeyi, insanın nefsini arındırmasına; ziyanı ve cehenneme girmeyi ise arındırmamasına bağlamıştır. Bu da nefsi tezkiye etmenin gerekli olduğunu ve insanın ancak bu sayede kurtulacağını gösterir."},{"k":"p","t":"Müslüman, Allah’a teslim olan kimse demektir. Müslüman nefsine teslim olmaz, iman ettiği Rabb’ine boyun eğer. Onun için müslüman, her zaman nefsi ile uğraşan ve onu teslim alan biri olmaldır."},{"k":"p","t":"Bu esasa ulaştıran en mühim yollardan biri; geniş lutuflara, faydalı sırlara ve parlak nurlara sahip olan; nefisleri kirlerden arındıran, kalpleri pisliklerden temizleyen, ruhları kurtuluş basamaklarına yükselten ve insanı başarıya ulaştıran tasavvuf yoludur. Nitekim Şeyh Muhammed Diyâüddin [kuddise sırruhû] bu manada, “Tarikatın gayesi, nefisleri kirlerden temizleyip tezkiye etmektir” buyurmuştur."},{"k":"p","t":"Tasavvuf, kalbi Allah [celle celâluhû] ile tanıştırıp huzura kavuşturma yollarını öğreten ve bunu bizzat gerçekleştiren bir terbiye sistemidir. Kalp temizliği ve güzel ahlâk, dinin bâtınî fıkhıdır. Buna Kur’an’da takva denir. Takvaya ulaşmak için yapılan mücadeleye ise tezkiye denir"},{"k":"p","t":"Tasavvuf, nefsi arzu ve hastalıklarından temizlemek, istikamet üzere olmak, niyeti halis tutmak, edebe riayet etmek ve her an Allah Teâlâ il
