      el('div', {'class': 'bar'}, barFill));

    var body = el('article', {'class': 'reader', lang: 'tr'},
      el('h1', {'class': 'doc-title', text: d.title}),
      el('p', {'class': 'doc-sub', text: d.sub}));
    paintFont();

    /* ---- içindekiler ---- */
    var headers = [];
    d.paras.forEach(function(x, i){ if (x.k === 'h') headers.push({ i: i, t: x.t }); });
    if (headers.length > 1){
      var tocList = el('div', {'class': 'toc-list'});
      var toc = el('div', {'class': 'toc'});
      headers.forEach(function(h){
        var a = el('a', {'class': 'toc-item', href: '#p' + h.i, text: h.t});
        a.addEventListener('click', function(ev){
          ev.preventDefault();
          var t = document.getElementById('p' + h.i);
          if (t) t.scrollIntoView({block: 'start'});
          toc.classList.remove('open');
        });
        tocList.appendChild(a);
      });
      var tocBtn = el('button', {'class': 'toc-btn', type: 'button'}, icon('list', 20), ' İçindekiler');
      tocBtn.addEventListener('click', function(){ toc.classList.toggle('open'); });
      toc.appendChild(tocBtn);
      toc.appendChild(tocList);
      body.appendChild(toc);
    }

    /* ---- renkli işaretleme ve not ---- */
    var marks = {};
    try { marks = JSON.parse(store.get('sk-mark-' + id) || '{}'); } catch (e){ marks = {}; }
    function saveMarks(){ store.set('sk-mark-' + id, JSON.stringify(marks)); }
    var openBar = null;
    function closeBar(){ if (openBar && openBar.parentNode) openBar.parentNode.removeChild(openBar); openBar = null; }
    function applyMark(n, i){
      n.classList.remove('mark-y', 'mark-g', 'mark-p');
      var oldNote = document.getElementById('note' + i);
      if (oldNote) oldNote.parentNode.removeChild(oldNote);
      var m = marks[i];
      if (!m) return;
      n.classList.add('mark-' + m.color);
      if (m.note){
        var note = el('span', {'class': 'mark-note', id: 'note' + i, text: '📝 ' + m.note});
        n.parentNode.insertBefore(note, n.nextSibling);
      }
    }
    function openToolbar(n, i){
      var wasOpenHere = openBar && openBar.previousSibling === n;
      closeBar();
      if (wasOpenHere) return;
      var colors = ['y', 'g', 'p'];
      var swatches = colors.map(function(c){
        var b = el('button', {'class': 'mark-swatch mark-swatch-' + c, type: 'button', 'aria-label': 'Renkle işaretle'});
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          marks[i] = marks[i] || {};
          marks[i].color = c;
          saveMarks();
          applyMark(n, i);
          closeBar();
        });
        return b;
      });
      var swatchRow = el.apply(null, ['div', {'class': 'mark-swatches'}].concat(swatches));
      var noteBtn = el('button', {'class': 'mark-action', type: 'button', text: 'Not ekle'});
      var removeBtn = el('button', {'class': 'mark-action', type: 'button', text: 'Kaldır'});
      removeBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        delete marks[i];
        saveMarks();
        applyMark(n, i);
        closeBar();
      });
      var bar = el('div', {'class': 'mark-bar'}, swatchRow, noteBtn, removeBtn);
      noteBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        var input = el('input', {'class': 'mark-input', type: 'text', placeholder: 'Kısa bir not yazın…', value: (marks[i] && marks[i].note) || ''});
        var saveBtn = el('button', {'class': 'mark-action', type: 'button', text: 'Kaydet'});
        saveBtn.addEventListener('click', function(ev2){
          ev2.stopPropagation();
          var v = input.value.trim();
          marks[i] = marks[i] || { color: 'y' };
          marks[i].note = v;
          saveMarks();
          applyMark(n, i);
          closeBar();
        });
        bar.replaceChildren(input, saveBtn);
        input.focus();
      });
      n.parentNode.insertBefore(bar, n.nextSibling);
      openBar = bar;
    }

    d.paras.forEach(function(x, i){
      var n;
      if (x.k === 'h') n = el('h2', {text: x.t});
      else if (x.k === 'ar') n = el('p', {'class': 'ar', lang: 'ar', dir: 'rtl', text: x.t});
      else if (x.k === 'q') n = el('p', {'class': 'q', text: x.t});
      else if (x.k === 'li') n = el('p', {'class': 'li'}, el('span', {text: x.m}), el('span', {text: x.t}));
      else n = el('p', {text: x.t});
      n.id = 'p' + i;
      body.appendChild(n);
      if (x.k !== 'h'){
        n.classList.add('markable');
        n.addEventListener('click', function(ev){
          if (ev.target.closest && ev.target.closest('a')) return;
          openToolbar(n, i);
        });
        applyMark(n, i);
      }
    });
    body.appendChild(el('a', {'class': 'cta end', href: '#/kitaplik'}, 'Kitaplığa dönün'));

    app.replaceChildren(tools, body, dock('#/kitaplik'));

    function frac(){
      var max = document.documentElement.scrollHeight - window.innerHeight;
      return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    }
    var timer = null;
    function onScroll(){
      barFill.style.width = (frac() * 100).toFixed(1) + '%';
      clearTimeout(timer);
      timer = setTimeout(function(){ store.set('sk-pos-' + id, frac().toFixed(4)); store.set('sk-last', id); }, 250);
    }
    window.addEventListener('scroll', onScroll, {passive: true});
    cleanup = function(){ window.removeEventListener('scroll', onScroll); clearTimeout(timer); };

    requestAnimationFrame(function(){
      if (target != null){
        var t = document.getElementById('p' + target);
        if (t){ t.scrollIntoView({block: 'start'}); }
      } else {
        var p = getPos(id);
        if (p >= 0.02 && p < 0.97){
          var max = document.documentElement.scrollHeight - window.innerHeight;
          window.scrollTo(0, p * max);
        } else { window.scrollTo(0, 0); }
      }
      onScroll();
    });
  }

  /* ---- yönlendirme ---- */
  function route(){
    if (cleanup){ cleanup(); cleanup = null; }
    var h = location.hash.replace(/^#\/?/, '');
    var qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h;
    var q = qi >= 0 ? h.slice(qi + 1) : '';
    var parts = path.split('/');
    switch (parts[0]){
      case 'gunun': gunun(); break;
      case 'kitaplik': kitaplik(); break;
      case 'mubarek': mubarek(); break;
      case 'isaretler': isaretlerim(); break;
      case 'oku': reader(parts[1], q); break;
      default: home();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
