cede sevap verir. Musîbet sebebiyle günahları bağışlanır. Bu şekilde, Allah katındaki manevî derecesine ulaşır."},{"k":"p","t":"Bu konuda Hz. Peygamber [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"\"Kul, Allah’ın kendisi için takdir ettiği dereceye ameli ile ulaşamazsa, Allah onun canına, malına veya çocuğuna bir musîbet verir. Sonra da ona sabretme gücü ihsan eder. Böylece onu, kendisi için takdir ettiği mertebeye ulaştırır.\""},{"k":"p","t":"Peygamberler de musîbetlere maruz kalmışlardır. Mesela Hz. Peygamberimiz Efendimiz [sallallahu aleyhi vesellem], Taif’te taşlanmış, ayakları kan revan içerisinde kalmış, Uhud savaşında dişi kırılmış, yüzü yaralanmıştır. Halbuki peygamberler günahsız insanlardır. Dolayısıyla her musîbetin arkasında günah ve kusur aramak doğru değildir. Musîbetlere tahammül göstererek, insanlara örnek olmuşlardır. Mü’minlerin başlarına gelen musîbetler, sabredilebilirse hayır olur. Çünkü musîbetler, müminlerin sevap kazanmalarına,  günahlarının  bağışlanmasına  ve manevî derecelerinin artmasına sebep olur. Bu ise ancak sabırla mümkündür."},{"k":"p","t":"Musîbetlere Sabredenlere Allah’ın Af ve Mağfireti Vardır"},{"k":"q","t":"\"Musîbet\"; ansızın gelen belâ, sıkıntı, hoş olmayan şeyler, hedefine isabet eden mermi gibi insana şiddetle dokunan hadise ve felâketlerdir. Yüce Allah musîbete maruz kaldığında, \"biz Allah’ın kullarıyız ve O’na döneceğiz\" diyerek musîbeti sabırla karşılayan, Allah’tan gelene razı olan kimseye af ve mağfiret va’d etmektedir. Müslüman, musîbetler karşısında sabredebilir, söz, fiil ve davranışlarıyla isyana dalmazsa, bu musîbetleri sebebi ile günahları bağışlanır. Peygamberimiz [sallallahu aleyhi vesellem]:"},{"k":"q","t":"\"Müslümana, fenalık, hastalık, keder, hüzün, eza, can sıkıntısı ârız olmaz, hatta vücuduna bir diken batırılmaz ki, Allah bu musîbetler sebebiyle onun hatalarını ve günahlarını bağışlamış olmasın.\"  sözü ile bu gerçeği dile getirmiştir."},{"k":"p","t":"Musîbetlere sabreden Müslümanın günahları bağışlandığı gibi, ayrıca sabrı sebebiyle kendisine hesapsız derecede sevap verilir ve Allah katındaki manevî derecesi yükseltilir. Peygamber [sallallahu aleyhi vesellem], şu sözü ile bunu bize müjdelemiştir:"},{"k":"q","t":"\"Bir Müslüman’a bir diken hatta daha küçük bir şey batsa, Allah onu bu yüzden bir derece (manen) yükseltir ve onun günahını affeder.\""},{"k":"p","t":"Müslüman, deprem, yangın, sel felaketi, âfet ve benzeri bir musîbete maruz kalarak ölürse hükmen şehit olur. Peygamberimiz [sallallahu aleyhi vesellem];"},{"k":"q","t":"“Allah yolunda öldürülen şehittir. Mide ağrısı sebebiyle ölen şehittir. Suda boğularak ölen şehittir. Akciğer hastalığı sebebiyle ölen şehittir. Yıkık altında kalarak ölen şehittir. Hamile olarak ölen kadın şehittir. Yanarak ölen şehittir\"  buyurmuştur."},{"k":"p","t":"İnsan hakları hariç şehitlik, kişinin günahlarına keffâret olur. Bu itibarla mümin, musîbetler karşısında bağırıp çağırmaz, isyana dalmaz, musîbetlerden ibret alır, maddî ve manevî hatalarını düzeltir, günahlarına pişman olur ve Allah’a yönelir. Kaybettiklerine üzülmemeye çalışır, rûhen ve moralman çökmez, daha iyisini Allah’tan ister ve bu uğurda çalışır. Mü’minlerin maruz kaldıkları musîbetler ise bir hayırdır. Çünkü musîbetleri sebebiyle günahları bağışlanır, hesapsız derecede sevap verilir ve manevî derecesi artar."},{"k":"p","t":"Enes b. Mâlik’ten [radıyallahu anh], rivayet edildiğine göre Resûlullah [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Allah Teâlâ, hayrını dilediği kulun mükâfatını dünyada hemen verir. Fenalığını dilediği kulun yaptıklarının karşılığını ise kıyamet günü günahını yüklenip gelmesi için dünyada iken vermez.”"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] devamında şöyle buyurdu:"},{"k":"q","t":"“Mükâfatın büyüklüğü musibetin büyüklüğüne göredir. Allah Teâlâ bir toplumu sevdiği zaman onlara musibet gönderir. Kim uğradığı musibetlere rıza gösterirse, Hak Teâlâ da ondan razı olur. Kim de uğradığı musibetleri öfke ile karşılarsa Allah’ın gazabına uğrar.”"},{"k":"p","t":"Musîbetleri sabırla karşılayıp, Allah’ın takdirine rıza gösterebilen  kimseleri  yüce  Allah,  “hidayete  erenler” hakikat yolunu bulanlar olarak nitelemektedir."},{"k":"p","t":"Allah’ın sevgili dostları olan Veli kulları, kendilerine bahşedilen yüce sıfatlar ve kemallerle dolu övülmüş haller sebebiyle büyük bir sekinet ve hilme sahiptirler. Ayrıca insanlardan gelen eziyetlere karşı çok sabırlıdırlar. Çünkü insanların bilmedikleri bir şey öğrenmeleri, imanlarını kuvvetlendirecek bir sohbet dinlemeleri ve kendilerini ıslah edecek bir yüce yola girmeleri her şeye değerdir. Bu uğurda gördükleri ve çektikleri eziyetlere hiç aldırış etmezler."},{"k":"p","t":"Gavs-ı Bilvanisi Şeyh Seyyid Abdülhakim el-Hüseynî hazretleri [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Halkın eziyetlerine tahammül etmelisiniz. Tahammül etmek büyüklüktür. Allah Teâlâ Peygamberimiz’e [sallallahu aleyhi vesellem] bile şöyle buyuruyor:"},{"k":"q","t":"“Azim sahibi peygamberlerin sabrettiği gibi sen de sabret.” (Ahkâf 46/35)"},{"k":"p","t":"Mal, mülk, aile ve evlât sevgisinde dengeli davranmalısınız. Bunların varlığı da yokluğu da imtihan vesilesidir.”"},{"k":"p","t":"Molla Murad En-Nakşibendî [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Sabır, ilim ve sakinlik gönül bahçesidir; hırs, buğz ve kindarlık öldürücü zehirdir. Nefsini sabır okuyla öldürdüğün vakit, şeytanın yolu bir daha semtine uğramaz olur. Sabır, taat ve ibadetlerin sıkıntılarına karşı olur. Çünkü ibadetler, nefs-i emmâreye çok zor ve acı gelir. Bir de günahlardan uzaklaşmakla olur, zira nefis kötülük işlemeye meyleder, günah işlemek ister. İsyan etme konusunda sabretmek farzdır. Fakirliğe sabretmek de gerekir, çünkü o da zordur. Bu nedenle sabreden fakirler Allah [celle celâluhû] katında çok yücedirler. Evliyaullah çoğu fakirlik yolunu seçmişlerdir. Hakk’ın kazâsına razı olan kimse, kötülük ve çirkinlik yapmaz ve iyi iş eyler ise kazâya razı olması sebebiyle mükâfatlandırılır. Nitekim yüce Allah bir hadis-i kudsîde kazâya razı olmayanlar hakkında şöyle buyurmuştur: “Kim kazâma razı olmazsa ve verdiğim belaya sabretmezse benden başka bir Rab arasın.”  Dolayısıyla kazâya rıza ve belaya sabırdan başka çare yoktur. Rıza ve sabır sebebiyle belanın defolunduğu çoktur, sabretmeyenlerin ise tam tersi durumlara düştüklerini defalarca tecrübe ettik.”"},{"k":"p","t":"Mevlânâ Hâlid-i Bağdâdî [kuddise sırruhu] hazretlerinin Veba Salgını İle İmtihanı"},{"k":"p","t":"Bir Ramazan-ı Şerif ayının ardından, veba salgını baş gösterdi. Çok insan bu hastalığa yakalandı ve kurtulamadı. İnsanlar Mevlânâ Hâlid-i Bağdâdî [kuddise sırruhu] hazretlerine gelip şöyle dediler:"},{"k":"q","t":"“Efendim! Şimdi tam zamanıdır, Kudüs yolculuğuna çıkalım.”"},{"k":"q","t":"“Şimdi bu şehri terkedemeyiz. Burada kalmamız en doğrusudur.”"},{"k":"p","t":"O günden itibaren Mevlânâ Hâlid-i Bağdâdî [kuddise sırruhu] hazretleri bu hastalığın bulaşıcı olduğundan, gerekli önlemler alınmasına rağmen yine de ölenler olursa, onların şehid sayılacağından bahsetti ve şöyle sohbet etti:"},{"k":"q","t":"“Bir defasında Hz. Ömer (radıyallahu anh) Şam’a gitmek üzere yola çıkmıştı. Sarğ denilen yere geldiler. Orada Ebû Ubeyde b. Cerrâh (radıyallahu anh) ve beraberindekilerle karşılaştılar. Bu kişiler, o bölgede görev yapan İslâm ordularının komutanlarındandı. Onlar, Hz. Ömer’e Şam tarafında veba salgını olduğunu söylediler. Bunun üzerine Hz. Ömer (radıyallahu anh) durumu görüşmek üzere Ensar ve Muhacirden ileri gelen sahâbîleri yanına çağırdı. Kendilerine yola devam edip etmeme konusunda ne düşündüklerini sordu. Herkes görüşünü açıkladı. Ancak net bir karara varamadılar. Hz. Ömer (radıyallahu anh), ‘Beni bir müddet yalnız bırakın” dedi. Daha sonra görüşlerine itibar ettiği yaşlı ve herkesin çok değer verdiği büyük sahâbîlerle de istişare ederek kararını açıkladı:"},{"k":"p","t":"‘Ben sabahleyin geriye dönüyorum, peşimden siz de gelin.’"},{"k":"p","t":"Ebû Ubeyde b. Cerrâh (radıyallahu anh) bu kararı uygun görmedi ve, ‘Ey Ömer! Allah’ın kaderinden mi kaçıyorsun?’ dedi."},{"k":"p","t":"Hz. Ömer (radıyallahu anh), ‘Ey Ubeyde! Bu sözü keşke başkası söyleseydi de senden işitmeseydim. Evet biz, Allah’ın bir kaderinden kaçıyor, diğerine iltica ediyoruz. Hani sen deveyle seyahat ederken görmüşsündür; bir vadinin iki yamacı olur, bir tarafı yemyeşil diğer yanı ise kıraç ve kuraktır. Deveni yemyeşil bir yamaçta otlatman Allah’ın kaderinde değil de, kıraç yerde otlatman mı Allah’ın kaderi oluyor?’ dedi."},{"k":"p","t":"Tam o sırada Abdurrahman b. Avf (radıyallahu anh) hazretleri yanlarına geldi ve, ‘Ben, Peygamber Efendimiz’in [sallallahu aleyhi vesellem] şöyle buyurduğunu işittim’ dedi:"},{"k":"p","t":"‘Bir yerde veba salgını olduğunu işitince, oraya girmeyin, bulunduğunuz yerde veba salgını çıkarsa, kaçmak için orayı terketmeyin.’"},{"k":"p","t":"Bunun üzerine Hz. Ömer ve arkadaşları verdikleri isabetli karardan dolayı Allah’a şükrettiler ve geri döndüler."},{"k":"p","t":"Bu sebeple bizler de burada kalmalıyız. Hem Peygamber Efendimiz [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"p","t":"‘O, kâfirler için Allah’ın gönderdiği bir azap, sabrettikleri takdirde müminler için rahmet vesilesidir. Veba salgını bulunan bir yerde bulunan mümin, kendisine Allah’ın takdir edeceği hükmü ulaşacağını bilir, sevap kazanmak (ve başkalarına bulaştırmamak) maksadıyla orada kalır ve (karantina nedeniyle) dışarı çıkmazsa, mutlaka o kişiye şehid sevabının bir misli verilir.’ ”"},{"k":"p","t":"Mevlânâ Hâlid-i Bağdâdî hazretleri [kuddise sırruhu] veba salgını süresince insanlara çok sohbetler etti. Halkın yapması gereken en uygun davranışın, gerekli önlemleri aldıktan sonra sabretmek olduğunu anlattı."},{"k":"p","t":"Ama salgın hastalık çok canlar alıyordu. Mevlânâ Hâlid-i Bağdâdî hazretlerinin [kuddise sırruhu] göz bebeği Bahâeddin henüz beş yaşındayken Şevvâl ayının 28’inde (25 Mayıs 1827) Cuma günü şehid oldu. Onun ölümünden on gün sonra da ağabeyi Abdurrahman vefat etti. O da altı yaşındaydı. O da şehid oldu. İkisini aynı yere defnettiler.."},{"k":"p","t":"Gavs-ı Nizam Şeyh Seyyid Mübarek hazretleri [kuddise sırruhu] sabırla ilgili bir sohbetinde şöyle buyurmuştur:"},{"k":"q","t":"“Sabırlı olmalıyız. Hizmet ehli olan bir sofi eğer sabrı taç yapıp başına koymazsa başarılı olamaz, hizmet edemez. Hizmet ehlinin mutlaka sabırlı olması lazım. Mutlaka güçlü olması lazım. İnsan gücü yettiğince sabrı kendine telkin etmeli, yoksa ihtiyarlıkta çok zorluk çeker, en önemlisi ölüm zamanında sabredip tahammül etmektir. Sabrı taç yapacaksınız. Başınıza koyacaksınız. Allah [celle celaluhu] rızası için tahammülümüzü artıracağız. Bir sofiye sormuşlar; “sen bu huzuru, bu sabrı nasıl buldun?” demişler. Sofi demiş ki; “ben düşündüm, taşındım ve bildim ki benim rızkımı kimse yiyemeyecek işte o zaman rahatladım, ben anladım ki Rabbül Alemin beni görüyor, izliyor, o zaman haya ettim. Bir de ben anladım ki benim işimi kimse yapmayacak, o zaman işime koyuldum. Sonra düşündüm ki bunların sonunda ölüm var, o zaman ölüme hazırlandım” Sizin burada yaptığınız bir günlük hizmet bütün hayatınıza bedeldir. Sadatın [kudduse sirruhum] dergahı her birisi bir manevi hastane gibidir. Bizim tek duamız şu olmalı ki ‘Rabbül Alemin bizi bu sadatı kiramın hizmetinden ayırmasın.”"},{"k":"p","t":"Sonuç olarak, her türlü musîbet, ancak Allah’ın izni ve takdiri ile meydana gelmektedir. Ancak musîbetlerin meydana gelmesinde ya insanların maddî veya manevî kusurları vardır ya da Allah, kullarını imtihan etmektedir. Şirk, küfür, isyan ve zulümleri sebebiyle Allah, geçmişte pek çok insanı cezalandırmış, âfet, felaket ve musîbetlere maruz bırakmış ve helâk etmiştir."},{"k":"p","t":"Allah [celle celaluhu], musîbetler karşısında sabredenlerden olabilmeyi nasip eylesin. Amin"}],"cat":"Ahlak"},{"id":"edep-ve-haya","title":"Müslümanın En Güzel Elbisesi: Edep ve Haya","sub":"Sohbet notu","desc":"Edebin mahiyeti ve müminin en güzel elbisesi","color":"#6B4423","mins":32,"paras":[{"k":"h","t":"EDEP VE HAYA"},{"k":"p","t":"Edep, sözlükte, \"terbiye, güzel ahlâk, iyi davranış; incelik, kibarlık, naziklik, utanma, çekinme, hicap, hayâ etme” gibi manalara gelir. Hz. Mevlânâ, “İnsanı hayvandan ayıran şey edeptir” der."},{"k":"p","t":"Edep, her halde, her makamda ve herkese karşı layık olan davranışı sergilemektir. Yani, Cenâb'ı Hakk’a ve cümle halka karşı saygılı olmaktır."},{"k":"p","t":"Edep, nefsini tanıyıp haddini bilmektir. Edep, kul olduğunu bilip sahibine vefa göstermektir. Edep, kibri kırıp tevazua sarılmaktır. Edep, her şeyi layık olduğu yerine koymak ve herkese hak ettiği şekilde muamele etmektir..."},{"k":"p","t":"Edep, Cenâb-ı Hakk’ın ve yaratılmışların hukukunu güzelce korumaktır. Edep, hayâlı ve vefalı olmaktır. Edep, pişman olunacak şeyleri yapmamaktır. Kısaca edep, güzel ahlâktır. Kaygusuz Abdal ne güzel söylemiş:"},{"k":"h","t":"Edepli ol can isen\t\tMüştak-ı sultan isen"},{"k":"p","t":"Hakk'ı bil insan isen\t\tVar edep öğren, edep..."},{"k":"p","t":"Edep ve güzel ahlâk, eş anlamlıdır; ikisi de insanın Hakk'a ve halka karşı bütün işlerinde ölçüyü korumayı, dengeli olmayı ve istikamet üzere bulunmayı ifade eder. Dengeli olmak, güzel hali devamlı aynı korumaktır. Acı tatlı bütün hallerde istikametini bozmayan, dost ve düşmana karşı dürüstlükten ayrılmayan kimse dengeli insandır. Dengeli insan adaletlidir. Edep ve adalet, insanın akıl seviyesini gösterir. Bunun için velilerden Serî es-Sakatî [kudduse sirruhu], “Edep, aklın tercümanıdır\"  demiştir."},{"k":"p","t":"Resûlullah [sallallahu aleyhi vesellem], vücutta kalbin konumunu şöyle belirtmiştir:"},{"k":"q","t":"\"İnsanın vücudunda bir yer var ki orası güzel olursa bütün beden güzel olur, bozuk olursa bütün beden kötü olur. Dikkat edin o kalptir.\""},{"k":"p","t":"Kâmil mümin, her işinde yüce Mevlâ’sının rızasını arar. Olgun insanda ikiyüzlülük yoktur; o, iki farklı ve zıt halde bulunmaz; bazan doğru bazan eğri konuşmaz, sabah iyi ahlâklı, akşam kötü davranışlı olmaz, hem Allah'a [celle celaluhu] hem şeytana itaat etmez."},{"k":"p","t":"Edep ve güzel ahlâk bir bütündür. Edepli insanın bütün işleri, ibadetleri, hal ve hareketleri güzeldir. Onun her şeyi temizdir. Allah [celle celaluhu] için sevgisi her şeyi sarar ve o şeyi sevimli yapar. Edepli müminin yüce Allah'tan aldığı terbiye, hayatının her safhasında kendisini gösterir. Bu terbiye içinde onun kızması ve kavgası bile güzeldir. Çünkü kızması Allah [celle celaluhu] içindir ve kavgası edep içinde gerçekleşir."},{"k":"p","t":"Edepli ve dengeli insanın ibadeti gibi ticareti de düzgündür. Kalbi gibi dili de doğrudur. Niyeti gibi işi de sağlamdır. Gönlü gibi elbisesi de temizdir. Dostluğu gibi düşmanlığı da mertçedir. Edep onun için bir meleke haline gelmiştir. Edep, meleke haline gelirse güzel ahlâk olur."},{"k":"p","t":"Edepli insan, iyi kötü diye insan seçmez, herkese karşı edepli davranır. O, karşısındaki insanın davranış seviyesine göre değil, kendi terbiyesine göre muamele eder, insanlar bir yana, hayvanlara bile zulmetmez. Edepli insan başkasından zarar görebilir, fakat başkasına zarar vermez. Birileri onu aldatabilir, ancak o kimseyi aldatamaz. O, zulüm ve haksızlık görüp mazlum olabilir, fakat asla zalim olamaz."},{"k":"p","t":"Bugün erkek-kadın, âlim-cahil, köylü-şehirli bütün insanların en fazla muhtaç olduğu şey edeptir. Edep, insanı hayvandan ayıran en önemli özelliktir."},{"k":"p","t":"Edep hiç kimseyi küçültmez, kıymetini düşürmez. Bilakis edep fakiri kıymetlendirir, zengini şereflendirir, genci süsler, ihtiyarı sevimli hale getirir. Edep, bir kadının en kıymetli cevheridir, hiç solmayan süsüdür. Bir kadın, edepten daha güzel bir elbise giymemiştir. Bir erkek, edepten daha güzel bir servet edinmemiştir. Bir baba çocuklarına edep ve güzel ahlâktan daha kıymetli bir miras bırakmamıştır, insanla kabre girecek tek servet edeptir. Edebin hediyesi cennettir."},{"k":"h","t":"Edep Öğrenmek İsteyene"},{"k":"p","t":"Sa'dî-i Şîrâzî [kudduse sirruhu] der ki:"},{"k":"q","t":"“Hz. Lokman’a [aleyhisselâm], ‘Edebi kimden öğrendin?’ diye sordular, ‘Edepsizlerden’ diye cevap verdi ve bunun nasıl olduğunu şöyle açıkladı: ‘Bana edepsizlerin neleri hoş görünmediyse onları yapmaktan kaçındım, bu edebi elde ettim.’”"},{"k":"h","t":"Bütün Şeref Onda"},{"k":"p","t":"Büyük veli Hücvîrî [kudduse sirruhu] der ki:"},{"k":"q","t":"\"İnsanın bütün kaybı, her işin esası olan edebi kaybetmesinden kaynaklanmaktadır. Bu, hep böyledir, değişmez. Din ve dünya işlerinin hepsi edeple güzel olur. Edep olmadan hiçbir güzel iş ortaya çıkmaz. Edep yerine göre farklı şekillerde olur. Halkın içinde gereken edep, güzel insanlığı ve mertliği muhafaza etmektir. Dindeki edep, sünnete uymaktır. Muhabbetteki edep, saygıyı gözetmektir. Bu üçü birbirine bağlıdır. Akıllı ve mert olmayan kimse, sünnete uyamaz. Sünnete uymayan kimse hürmeti koruyamaz. Allah’ın [celle celaluhu] zatına ve birliğine şahit olan âriflere hürmet, kalpteki takvadan ileri gelir. Onlara karşı edebi koruyamayan kimsenin terbiye yolunda hiçbir nasibi olmaz.”"},{"k":"p","t":"Edep öyle güzel bir elbisedir ki onu giyenleri ateş yakmaz."},{"k":"p","t":"Peygamber Efendimiz [sallallahu aleyhi vesellem], “Ben güzel ahlâkı tamamlamak için gönderildim” buyuruyor."},{"k":"p","t":"Süfyân-ı Sevrî (rahmetullahi aleyh) hazretleri, “Yirmi sene çalışılsa da edep öğrenilmeden ilim öğrenilmez” diyor."},{"k":"p","t":"Ahirette mîzana konacak en ağır, en faydalı amel, iman ve namazdan sonra güzel ahlâktır. Güzel ahlâk insanın kaybolmayan şerefi ve hiç solmayan süsüdür. Güzel ahlâk, cennetin bir numunesini dünyada yaşamaktır."},{"k":"p","t":"Allah Teâlâ buyurmuştur ki:"},{"k":"ar","t":"مَا زَاغَ الْبَصَرُ وَمَا طَغٰى ۞"},{"k":"q","t":"\"(Huzurumuzda) gözü (başka şeylere) kaymadı, haddi de aşmadı.”"},{"k":"p","t":"Denilmiştir ki: Âyette anlatılan durum, ilâhî huzurdaki edebi korumaktır."},{"k":"ar","t":"يَٓا اَيُّهَا الَّذِينَ اٰمَنُوا قُٓوا اَنْفُسَكُمْ وَاَهْلِيكُمْ نَاراً"},{"k":"p","t":"Allah Teâlâ buyurmuştur ki: 'Ey iman edenler, kendinizi ve ailenizi ateşten koruyun! \""},{"k":"p","t":"Âyetin tefsirinden İbn Abbas (radıyallahu anh) şöyle demiştir:"},{"k":"q","t":"\"Onlara dinlerini iyi öğretin ve kendilerini güzelce edeplendirin.\""},{"k":"p","t":"Hz. Âişe'nin (radıyallahu anha) rivayet ettiği bir hadiste Hz. Peygamber [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Çocuğun baba üzerindeki hakkı, ona güzel bir isim vermesi, güzel bir sütanne bulması ve güzel bir edep vermesidir.\""},{"k":"p","t":"Saîd b. Müseyyeb'in (rahmetullahi aleyh) şöyle dediği nakledilmiştir:"},{"k":"q","t":"\"Kim Allah Teâlâ'nın kendisi üzerindeki hakkını bilmezse, O'nun emir ve yasaklarına göre kendini edeplendirmezse, o kimse edepten uzaktır.\""},{"k":"p","t":"Hz. Peygamberin [sallallahu aleyhi vesellem] şöyle buyurduğu rivayet edilmiştir:"},{"k":"q","t":"\"Beni Rabbim terbiye etti ve edebimi ne güzel yaptı.\""},{"k":"p","t":"Edebin hakikati, bütün hayırlı sıfatların bir arada bulunmasıdır. Edepli insan, bütün hayırlı sıfatları kendisinde toplayan kimsedir."},{"k":"p","t":"İbn Atâ (rahmetullahi aleyh) demiştir ki:"},{"k":"q","t":"\"Edep, güzel haller içinde bulunmaktır.\" Kendisine, \"Bunun nasıl olduğunu açıklar mısınız?\" diye sorulduğunda şöyle demiştir: \"Gizli ve açıkta Allah Teâlâ'ya karşı edeple muamele etmendir. Sen böyle yaptığın zaman edepli bir kul olursun, dilinle güzel konuşmasını bilmesen bile!\""},{"k":"p","t":"Abdullah-ı Cerîrî (rahmetullahi aleyh) şöyle demiştir:"},{"k":"q","t":"\"Yirmi senedir halvet yerimde otururken ayaklarımı uzatıp da yatmadım. Allah Teâlâ ile birlikte olunca edebe dikkat etmek daha gerekli ve daha faziletlidir.\""},{"k":"p","t":"İbn Sîrîn'e (rahmetullahi aleyh), \"Hangi edep kulu Allah Teâlâ'ya daha fazla yaklaştırır?\" diye sorulunca şöyle demiştir: \"Allah'ın rabliğini bilmek, O'nun taatiyle amel etmek, rahatlık anında kendisine hamdetmek, sıkıntı anında sabretmek.\""},{"k":"p","t":"Yahya b. Muâz (rahmetullahi aleyh) şöyle demiştir:"},{"k":"q","t":"\"Bir ârif yüce Rabbine karşı edebini terkedince, helâk olanlarla birlikte helâk olur.\""},{"k":"p","t":"Hasan-ı Basrî'ye (rahmetullahi aleyh), \"İnsanlar edep hakkında çok şey söylediler; size göre insana dünyasında en faydalı olan ve âhirette de kendisini ilâhî rahmete en fazla ulaştıran edep hangisidir?\" diye sorulduğunda şöyle demiştir: \"Dinde fakih olmak (dini güzelce öğrenmek), dünyadan gönlünü çekmek ve yüce Allah'ın [celle celaluhu] senin üzerindeki hakkını bilmektir.\""},{"k":"p","t":"Sehl b. Abdullah-ı Tüsterî (radıyallahu anh) demiştir ki:"},{"k":"q","t":"\"Mânevi dereceleri yüksek kimseler, Allah Teâlâ'nın emrini yerine getirmede devamlı O'ndan yardım isteyen ve Allah Teâlâ'ya karşı gereken edebi korumada Allah için sabreden kimselerdir.\""},{"k":"p","t":"Abdullah b. Mübârek'in (radıyallahu anh) şöyle dediği nakledilmiştir: \"Bizler, çok ilimden ziyade, az da olsa edebe muhtacız.”"},{"k":"p","t":"Abdullah b. Mübârek (radıyallahu anh) demiştir ki: \"Ârif için edep, mânevî yola yeni giren kimse için tövbe gibi gereklidir.\""},{"k":"p","t":"Din ehlinin en çok üzerinde durduğu edepler; nefislerini güzel ahlâkla süslemek, Azalarıyla ilgili edepleri yerine getirmek, helâl-haram sınırlarına dikkat etmek ve kötü arzularını terketmektir."},{"k":"p","t":"Seçilmiş velîlerin daha çok üzerinde durduğu edepler ise; kalplerini temizlemek, sırlarının hal ve yönelişlerine dikkat etmek, sözlerini yerine getirmek, içinde bulunduğu vaktin hakkını korumak, vaktin gereğini yapmak, kalbe gelen boş düşüncelere fazla iltifat etmemek, yüce Allah'tan bir şey talep ettikleri ve ilâhî huzurda bulundukları zaman güzel edep içinde olmaktır."},{"k":"p","t":"Sehl b. Abdullah-ı Tüsterî (radıyallahu anh) şöyle demiştir:"},{"k":"q","t":"\"Kim, nefsini edeple terbiye ederse o, yüce Allah'a ihlâsla kulluk yapar.\""},{"k":"p","t":"Abdullah b. Mübârek (radıyallahu anh) demiştir ki:"},{"k":"q","t":"\"İnsanlar edep konusunda çok şey söylediler. Biz de diyoruz ki edep, nefsini tanımaktır.\""},{"k":"p","t":"Şiblî (radıyallahu anh) demiştir ki:"},{"k":"q","t":"\"Hak Teâlâ'ya dua ve niyaz ederken rahat ve serbest bir tavır için de olmak, edebi terketmektir.\""},{"k":"p","t":"Zünnûn-i Mısri (radıyallahu anh) şöyle demiştir:"},{"k":"q","t":"\"Arifin edebi bütün edeplerin üzerindedir; çünkü onun kalbini yüce Rabbi terbiye etmiştir.\""},{"k":"p","t":"Ebü'l-Hüseyin Nûrî (radıyallahu anh) demiştir ki:"},{"k":"q","t":"\"Kim, içinde bulunduğu vaktin edebini muhafaza etmezse; vakit onun için bir kınanma ve azap sebebi olur.\""},{"k":"h","t":"Kıssa: Basit Hesaplı Adam"},{"k":"p","t":"Cüneyd-i Bağdâdî (radıyallahu anh) şu olayı anlatmıştır:"},{"k":"q","t":"\"Bir cuma günü sâlihlerden biri yanıma gelerek, 'Benimle birlikte bir fakir dervişi gönder ona ikramda bulunayım, evimde yemeğimi yesin de beni sevindirsin' dedi. Ben sağa sola baktım, bir fakir gördüm, üzerinde ihtiyaç hali gözüküyordu. Onu çağırdım ve kendisine, 'Bu yaşlı amca ile git, yemeğini ye de kendisini memnun et' dedim."},{"k":"p","t":"Biraz sonra davet eden adam yanıma geldi ve, 'Ey Ebü'l-Kasım, bu fakir adam sadece bir lokma yedi, sonra çıktı gitti' dedi. Ben adama, 'Herhalde sen onu incitecek bir söz söyledin' dedim. Adam, 'Ona incitici bir şey söylemedim' dedi. Sağa sola bir göz attım, baktım ki fakir orada oturuyor. Ona, 'Bu adamı niçin tam olarak sevindirmedin, yemeğinden yemedin?' diye sordum, fakir şöyle dedi:"},{"k":"p","t":"'Efendim, Kûfe'den yola çıktım, Bağdat'a kadar geldim. Bu arada hiçbir şey yemedim. Sizin huzurunuzda açlığımdan dolayı benden kötü bir edebin ortaya çıkmasını hoş görmeyerek açlığımı gizledim. Siz beni çağırınca sevindim; çünkü teklif ilk olarak sizden gelmişti. Adamla gittim, ama kalben buna razı olmamıştım. Sofraya oturduğum zaman adam bana bir lokma vererek, 'Ye, bu benim için onbin dirhem gümüşten daha sevimlidir' dedi. Ondan bu sözü işitince kendisinin düşük himmetli ve basit hesaplı biri olduğunu anladım, yemeğini yemekten çekindim.'"},{"k":"p","t":"Cüneyd, fakiri davet eden adama, 'Ben sana ona karşı edepte kusur etmişsindir demedim mi?' dedi. O zaman adam, 'Yaptığıma tövbe ediyorum' dedi. Bunun üzerine Cüneyd fakirden tekrar adamla birlikte evine giderek onu sevindirmesini istedi.\""},{"k":"p","t":"Edep, kulun zahirinin ve bâtınının yani dışının ve içinin terbiye ile güzelleştirilmesidir. Kulun zahiri ve bâtını güzelleşince edepli bir sûfî olur."},{"k":"p","t":"Kim, sünnetin edebine sarılırsa, Allah Teâlâ onun kalbini marifet nuruyla nurlandırır. Allah'ın Habibi Hz. Muhammed'e [sallallahu aleyhi vesellem], emirlerine, fiillerine ve ahlâkına uymaktan, bir de söz, fiil, inanç ve niyet olarak onun edepleriyle edeplenmekten daha şerefli bir makam yoktur."},{"k":"p","t":"Yüce Allah'a hizmet ve kulluğun edebi; kul ne kadar çok amel de yapsa, kendisini o amele sevkeden yüce Rabbine nazar edip bütün yaptıklarını hiç görmektir."},{"k":"p","t":"Kul, yaptığı taatiyle cennete girer; edebiyle yüce Allah'a erer."},{"k":"p","t":"Din ehlinin en çok üzerinde durduğu edepler; nefislerini güzel ahlâkla süslemek, azalarıyla ilgili edepleri yerine getirmek, helâl-haram sınırlarına dikkat etmek ve kötü arzularını terketmektir."},{"k":"p","t":"Bir mürid/hak yolcusu, edebi terkederse, geldiği yere geri döner."},{"k":"p","t":"Ebû Ubeyd Kasım b. Sellâm'ın (radıyallahu anh) şöyle dediği nakledilir:"},{"k":"q","t":"\"Mekke'de bulunduğum sıralarda çoğu kez Kabe'nin hizasında otururdum. Bazan da, ayaklarımı uzatmış halde sırt üstü yatar, dinlenirdim. Bir gün bu halde uzanmış yatarken kadın velîlerden Mekkeli Âişe yanıma geldi; beni o halde görünce, 'Ey Ebû Ubeyd! Senin ilim ehli bir zât olduğunu söylüyorlar; bir söz de benden al: Yüce Rabbinin huzurunda edeple otur; yoksa ismin Allah'a yakın velîler defterinden silinir!' diye uyardı. Bu kadın, Hak dostu ariflerdendi.\""},{"k":"p","t":"Ariflerden biri der ki: \"Zahiren ve bâtınen/dışın ve içinle edebe sarıl. Zahirdeki edebi zayi eden kimse, zahiren cezalandırılır; iç alemindeki edebi zayi eden kimse ise, bâtınen/iç âleminde cezalandırılır.\""},{"k":"p","t":"Edep, kuvvede ve yaratılışta olan bir şeyi fiiliyata çıkarmaktır. Yaratılışı ve tabiatı güzel olan kimselerde, hak olan güzel işler meydana çıkar. İnsanın tabiatının şekillenmesi, Cenâb-ı Hakk'ın işidir; onun yaratılmasında insanın bir kuvveti yoktur. Bu durum, çakmak taşında ateşin bulunmasına benzer. Çakmak taşında ateşin bulunması yüce Allah'ın işidir; onun meydana çıkarılması ise insanın işidir. Edepler de böyledir; onun kaynağı güzel tabiatlar ve kula verilen ilâhî ihsanlardır."},{"k":"p","t":"Allah Teâlâ, sûfîlerin iç âlemlerini olgun ve olgunluğa erecek şekilde hazırlamıştır. Onlar güzel terbiye ve riyazet yolları ile Allah Teâlâ'nın nefislerinde yerleştirdiği kabiliyetleri ortaya çıkarırlar; böylece edepli ve güzel ahlâklı kimseler olurlar."},{"k":"h","t":"Bir Kul Gibi Oturmak"},{"k":"p","t":"Hâris el-Muhâsibî [kudduse sirruhu], kırk yıl arkasını duvara dayamadı. İki dizi üstüne çöküp oturmaktan başka türlü oturmadı. Kendisine sordular:"},{"k":"q","t":"\"Kendini neden böyle zora sokuyorsun?\" Şöyle dedi:"},{"k":"q","t":"\"Mevlâmı müşahede eylerken bir kul gibi oturmamaktan utanırım.\""},{"k":"h","t":"Edebe riayet etmeyen"},{"k":"p","t":"İnsanoğlu edepten mahrum ise ‘insan’ oluş sırrını kaybetmiştir. Çünkü insanı hayvandan farklı ve asil kılan edeptir. “Gönül gözümüzü açıp Allah kelamına bakınca görürüz ki ayet ayet bütün Kur’an’ın manası edeptir.” diyen Hz. Mevlâna’ya kulak verelim:"},{"k":"q","t":"“Edep insanın kendini tanımasıdır. Edebe riayet etmeyen bir kimse Allah’a yakın olamaz. İlim ve tahsilin insana kazandıracağı ilk şey edep ve incelik değilse, başka bir şey olamaz. Gerçek akıl ve tahsil sahiplerine hiç yakışmayan şey kontrolsüz davranışlardır ve edep dışı hareketlerdir. İnandığımız nizamın ve Kutsal Kitabımız’ın özü edeptir. Saygı ve edepte cimri olanın parada cömert olması bir kıymet ifade etmez. İslâm, iman ve namazla başlayıp erkân ve edeple devam eden ve derinleşen ilahi bir nizamdır. Ey insan! Anla ki insanın elindeki can ne ise edep de odur. İnsanın kalbindeki, göğsündeki nurlar edepten ibarettir. Ayağını iblisin kafasına koymak, ona hakim olmak istiyorsan gözünü aç anla ki, şeytanı öldüren edeptir.”"},{"k":"h","t":"Peygamberliğin Kırkta Biri"},{"k":"p","t":"Edep tacını giyen müslüman Allah Tealâ’nın razı olduğu kullara dönüşür. Allah’ın razı olduğu kulların birbiriyle münasebetleri de huzurlu bir toplum meydana getirir. Çünkü edep, ölçülü hareket etme, utanma, haddi aşmama, nezaket ehli olma, gönül kırmama gibi insanî eylemlerin hepsini içinde barındıran efsunlu bir güzelliktir. Bu güzelliğe bürünen insan da toplum içinde takdir edilen, sevilen şahsiyetli bir insan olur."},{"k":"p","t":"Beşeriyetin en güzel örneği Hz. Peygamber [sallallahu aleyhi vesellem]: “Güzel hal, düşünerek hareket etmek ve iktisat (ölçülü davranmak) peygamberliğin kırkta biridir.” buyurur. Bu sözden hareketle anlıyoruz ki insan edep tacıyla peygamberlik vasıflarından birini kazanıyor. Kazanılan edep, nezaket ehli, hürmete layık, cemiyet önünde daima saygı gören insanı meydana getiriyor. Edepten yoksun insan da gerçek değerini kaybediyor."},{"k":"p","t":"Abdurrahman es-Safurî, “Allah, hiçbir kimseye akıl ve edepten başka daha üstün bir bağışta bulunmamıştır. O ikisi gencin güzelliğidir. Şayet onları kaybederse hayatın en güzel şeyini kaybetmiş olur.” derken, akıl gibi büyük bir nimetle edebi yan yana zikretmesi de dikkat çekicidir."},{"k":"p","t":"İlahi aşka bizi götüren yollar da edepten ibarettir. Rabbimize varabilmek için varlığımızı edeple süslemek gerekir. Bu noktada Hz. Mevlâna ne güzel söyler: “Ey aşıklar nefsinizi edeple süsleyin. Zira aşk yollarının hepsi de edepten ibarettir.”"},{"k":"h","t":"Görüntü Güzel Ama"},{"k":"p","t":"Bir kısım insan, kibar, temiz ve sevimli gözükmek için bütün imkanlarını kullanır. Giydiği elbisede ufak bir bozukluk, yırtık, kir ve toza tahammül edemez. Onu düzeltmeden rahat edemez. Fakat aynı insan, yalan, iftira, alay, dedikodu, küfür, hakaret gibi dilinin bozuk konuşmalarından hiç rahatsız olmaz. Yaptığı çirkin işlerden kurtulmak istemez. İçindeki kibir, bencillik, haset, inkâr, gösteriş, hırs, tamah, şehvet, şöhret, korkaklık gibi kötü huylardan temizlenmeyi düşünmez. Bu durum da dengesizliktir. Yapılan işler ise haramdır."},{"k":"p","t":"Edepli insanda yalan ve yapmacık işler olmaz. İşi yapmacık ve gösteriş olan kimse, imanın tadını tadamaz. Çünkü bunlar münafıkların sıfatıdır. Bazı insanlar gelip camide Hakk’a ibadet ederler, çıkıp çarşıda halka ihanet ederler."},{"k":"p","t":"Bazıları namaz kılarken boynunu büker, tam bir huşu görüntüsü verir. Görenler kendisine hayran olur. Fakat kıldığı namaz, Allah katında azap sebebi olur. Çünkü o anda kalbi namazda değil, insanların bakışındadır. Niyeti Allah’ın rızası değil, halkın övgüsüdür. Bu da bir dengesizliktir. Bir çeşit münafıklıktır. İçi başka dışı başka olmaktır. İbadeti nefsin keyfine kullanmaktır. Şeklen güzel gözüküp, aslen bozuk olmaktır."},{"k":"p","t":"Rasulullah [sallallahu aleyhi vesellem] Efendimiz, ümmetini bu halden şiddetle sakındırmıştır. Bir gün, “nifak olan huşudan Allah’a sığınınız” buyurdu. Sahabe, “nifak olan huşu nasıl olur?” diye sordular. Efendimiz [sallallahu aleyhi vesellem] buyurdular:"},{"k":"q","t":"“Bedenin huşu içinde gözüküp kalbin nifakla dolu olmasıdır.”"},{"k":"p","t":"Bu hal kâmil müminin sıfatı değildir. Allah dostları en fazla bu tiplerden rahatsız olurlar. Güzel kulluğun ve ahlâkın temelinde Allah rızası vardır. Niyet hak olmazsa, ibadet ihanete dönüşür. Büyük velilerden Hace Ubeydullah Ahrar [kudduse sirruhu] şu olayı anlatır:"},{"k":"q","t":"“Mevlâna Nizamettin Hazretlerinin halkasında bulunanlardan birisi, bir gün mürşidinin huzurunda sahte bir tavırla başını önüne eğmiş, çenesini göğsüne dayamış murakabeye dalmış gibi bir vaziyet almıştı. Onu bu halde gören Hazret:"},{"k":"q","t":"“Hey! Başını yukarı kaldır. Senin üzerinden duman tüttüğünü görüyorum. Murakabeyle ne alakan var senin!” diye uyardı."},{"k":"h","t":"Tasavvufta Yol Almak Edeple Olur"},{"k":"p","t":"Nakşibendi büyükleri, Hz. Resûlullah [sallallahu aleyhi vesellem] Efendimizin öğrettiği hem zâhir hem de bâtıni edeplere sımsıkı sarılmışlardır. Seyru sülük esnasındaki sohbet, vird, hatme ve diğer zikirler zâhirî edepler içine girer."},{"k":"p","t":"Kalbin gaflet ve kötülüklerden temizlenmesi, nefsin terbiye edilmesi ve ruhun ilahi huzura yükselecek hâle getirilmesi de bâtınî edepler içine girer."},{"k":"p","t":"Edeb, her şeyi gereğince ve yerince yapmaktır. Bunun yolu da, bütün fikir ve fiillerde edeb abidesi, peygamberlerin imamı Hz. Resûlullah [sallallahu aleyhi vesellem] Efendimize uymaktır. Bütün Allah dostları, Hak yolunda ne elde etmiş iseler, Efendimizin edebine uyarak elde etmişlerdir."},{"k":"p","t":"Edebine göre yapılmayan şeyler ne kadar çok olursa olsun fayda sağlamaz. İnsan bir işin usulüne göre gitmez ise o işte ömrünü verse hayırlı bir sonuç alamaz."},{"k":"p","t":"Allah’ın yeryüzündeki şahidi ve hâlifesi olan ariflere hürmet kalpteki takvadan ileri gelir. Onlara karşı edebi koruyamayan kimsenin tasavvuf yolunda hiç bir nasibi olmaz."},{"k":"p","t":"Arifler: “Önce usul, sonra vusul” demişlerdir. Yani, maksadına ulaşmak isteyen kimse, önce o işin usulüne göre yola çıkarsa, hedefine varır, yoksa yolda kalır."},{"k":"p","t":"Büyük alim Abdullah b. Mubarek (radıyallahu anh) ne güzel söylemiş: “Bizler daha çok ilme değil, daha fazla edebe muhtacız.“"},{"k":"p","t":"Hak yoluna giren talip için ana sermaye edeptir. Edebi olmayanın Allah yolunda elde edeceği hiç bir şeyi yoktur."},{"k":"p","t":"Edeb, kalbte, sözde ve fiilde olur. Kalbin edebi, niyette ihlas ve samimiyettir. Bunların sonucu, Allah için sevmek, Allah için vermek, Allah için yermek ve Allah için menetmektir. Bu hâl, imanın en yüksek zirvesidir ve kâmil insan olmanın alametidir. O, Allah Tealanın sevdiği kullarına bir hediyesidir. Büyükler, bu ahlakın ihsan mertebesi olduğunu ve onun vücuda ancak zati zikir sayesinde yerleşeceğini belirtiyorlar. Zati zikir; her yerde, her işte, her hâlde kalb, ruh, sır ve diğer latifelerle Allah Teala’yı zikretmekten ibarettir."},{"k":"p","t":"Gavs-ı Bilvanisî Seyyid Abdulhakim el-Hüseyni [kudduse sirruhu] zikir ve edep hakkındaki bir sohbetinde şöyle buyurmuştur:"},{"k":"q","t":"“Bakınız, bu milletin başına ne geldiyse gafletten geldi. Şah-ı Hazne [kudduse sirruhu]: “gaflet kadar hiçbir kötü hâl yoktur” derdi. Kimin başına ne geldiyse nefsinin hilelerinden gafil kaldığı için gelmiştir. Bir kişi kendi kuvveti ile gafleti terk edemiyorsa edebe sarılsın. Şöyle ki, Rabbim her an her yerde beni görüyor diye düşünsün ve o konuda nefsini zorlasın. Açık ve gizli edeplere uymakla insanın kalbi uyanır. Böylece gaflet yok olur.“"},{"k":"p","t":"Sözün edebi, makama uygun söylenmesidir. Her makam, ayrı bir tarz ve tavır ister. Her söz yerinde, zamanında, gereği kadar söylenirse değerli ve geçerlidir. Söz, hacet kadar sarf edilmelidir. Sözde yalan ve yapmacık olmamalıdır. Söz sahibinin sözü ile özü, içi ile dışı aynı olmalıdır. Mürşide ve müminlere karşı samimiyet ancak böyle mümkün olur."},{"k":"p","t":"Fiilin/işin edebi, makama uygun davranmaktır. Her şahsın, her makamın, her ibadet ve taatın kendine has edebi vardır. Bütün edepler, sünnet-i seniyyede öğretilmiştir. Edep, Hakka ve halka karşı nasıl davranacağını bilmektir. Kısaca güzel ahlaktır. Bu edepleri, tek tek öğrenmeli ve güç nisbetinde yapmalıdır."},{"k":"p","t":"İlim edeple güzel olur. Hak yolcusu ancak edeple yol alır. Zikir, edeple fayda verir. İbadet edeple yapılırsa Allah’a yükselir. Tövbe, edeple kabul edilir. Bunun için Allah dostları talebelerinden her işte edep ister, edep bekler. Tasavvuf yolunda, bütün menzil ve makamlarda insanın önüne tek levha çıkar: “Edep Yâ Hû!”"},{"k":"p","t":"Mevlânâ Halid hazretleri de [kudduse sirruhu] bunu şöyle açıklar:"},{"k":"q","t":"“Edep hakikatte Allah Teâlâ tarafından ihsan edilen bir lütuftur. Çünkü her makamın kendine uygun bir edebi vardır. Bu edeplere riayet etmek için de sağlam bir himmete hatta ilhama ihtiyaç duyulur. Nitekim denilmiştir ki, ‘edebin kısımları, elde edilemeyecek kadar çoktur."},{"k":"p","t":"Yine tasavvuf yolundaki edeple ilgili Ebû Hafs Haddâd hazretleri [kudduse sirruhu] şöyle der:"},{"k":"q","t":"“Tasavvuf, tamamıyla edeplerden ibarettir. Her vaktin, halin ve makamın kendine göre bir edebi vardır. Her kim bu edeplere uymaya devam ederse Hak dostlarının ulaştığı makama ulaşır.\""},{"k":"h","t":"Edep ve Önemi"},{"k":"p","t":"Edep, her konuda haddini bilmek, sınırı aşmamak, insanlara iyi muamelede bulunmaktır. Hz. Peygamber'in [sallallahu aleyhi vesellem] buyurduğu ve davrandığı gibi hareket etmek, hataya düşmekten, yüz kızartacak, pişmanlık verecek şeylerden uzaklaşmaktır."},{"k":"p","t":"Edep, hakları korumak, Hakk'a ve halka karşı nasıl davranacağını bilmektir. Tasavvufun tek gayesi de, Hakk'a ve halka karşı edepli insan yetiştirmektir. Çünkü ilim, edeple birlikte güzel olur. Hak yolcusu ancak edeple yol alır. Zikir ancak edeple fayda verir. İbadet edeple yapılırsa Allah [celle celaluhu] kabul eder. Tövbe, edeple kabul edilir. Edebi olmayan kimse yarı yolda kalır, maksadına ulaşamaz. Bunun için Allah dostları müridlerinden her türlü iş ve amellerinde edepli olmalarını ister, edep bekler. Büyük ârif Ebû Hafs hazretleri şöyle demiştir:"},{"k":"q","t":"\"Tasavvuf, baştan başa edepten ibarettir. Çünkü her vaktin bir edebi, her makamın bir edebi vardır. Her halin de bir edebi vardır. Vakitlerle ilgili edebe riayet edenler, veli olan kimselerin makamına ulaşırlar. Edebi terkedenler, Allah Teâlâ'ya yakın olduklarını zannettikleri halde, O'ndan uzaktırlar. Bazı kullar da vardır ki kendilerinin zannettiklerinden daha yüksek bir mertebeye sahip, daha sevgilidirler.\""},{"k":"h","t":"Sûfînin Dikkat Etmesi Gereken Edepler"},{"k":"p","t":"Sûfî, Allah'ın emir ve yasaklarını yerine getirmeye çalışmalıdır. Farzları içtenlikle ve önem vererek yapmalıdır. Her zaman ve tüm işlerinde doğru istikametinden şaşmamalı ve takvaya sarılmalıdır. Daima sünnete uymalı ve sünnetleri yaşamaya çalışmalıdır. Yararlı işler yapmalı, güzel amellerini artırmalı, iki gününün eşit olmaması için çalışmalı ve olgunlaşmak için sürekli çaba göstermelidir. Bir işe başlarken niyeti halis olmalıdır. Görevlerini titizlikle yapmalı, onların değerini azaltacak davranışlardan kaçınmalıdır. Tüm işlerinde Allah Teâlâ'yı unutmamalı, alışveriş sırasında Allah'tan gafil olmamalıdır."},{"k":"p","t":"Allah Teâlâ'yı, Hz. Peygamber'i [sallallahu aleyhi vesellem], onun Ehl-i beytini, ashabını, velileri, ilmiyle âmil olan âlimleri ve salihleri sevmelidir."},{"k":"p","t":"Rızkını helâl yoldan kazanmalı, mekruh ve şüpheli şeylerden sakınmalıdır. Allah Teâlâ'nın üzerimizdeki nimetlerini devamlı düşünmeli ve bunlara şükretmeli; Allah Teâlâ'nın kazâ ve kaderine rıza gösterip karşı gelmemelidir."},{"k":"p","t":"Allah'ın [celle celaluhu] rahmetinden ümidini kesmemeli, O'nun gazabından ve sınamasından emin olmamalıdır. En ufak bir günah işleyince bile hemen tövbe edip bir daha tekrarlamamaya çalışmalıdır. Üzerinde herhangi bir kimsenin hakkı varsa ödemelidir."},{"k":"p","t":"Yatmadan önce işini ve gidişatını düşünmeli, hesap günü gelmeden kendi nefsini hesaba çekmelidir. Bu muhasebesi kendi aleyhinde olursa Allah'tan af dilemeli, lehine bulursa şükretmelidir. Uyumadan önce ölümü düşünerek bir insanın mutlaka ölümü tadacağını hatırlamalıdır. Uzun emelli olmamalıdır. Ömrünü yaşamakta olduğu andan ibaret kabul edip onu Allah rızasına sarfetmelidir."},{"k":"p","t":"Cemaatle namazda birinci safta, başlangıç tekbirinde bulunmaya gayret etmelidir. İkindi namazından sonra hatmeye, akşam ile yatsı arası rabıtaya, sabah namazından önce iki tulü arası zikre, gece namazına, her gün bir cüz Kur'an okumaya devam etmelidir. Fıkıh konularını öğrenmeye gayret etmeli, içinden çıkamadığı sorunları takva sahibi ve ilmine güvenilir âlimlerden sorup öğrenmelidir. Tasavvufla ilgili meseleleri, ehil kişilerden öğrenmeye dikkat etmeli, tasavvufu bilmeyen ve yaşamayan kişilerden sormamalıdır. Verdiği sözlerde durmalı, zararlı ve gereksiz sözleri sarfetmekten kaçınmalıdır. Çok yemenin, çok konuşmanın ve çok uyumanın edebe aykırı olduğunu bilmeli ve bunları azaltmaya çalışmalıdır."},{"k":"h","t":"İnsanlarla Beraberken Dikkat Etmesi Gereken Edepler"},{"k":"p","t":"Sûfî, insanların kusurlarını aramamalı, aksine kendi eksiklik ve ayıplarıyla ilgilenmelidir. Kardeşleri için her zaman iyi düşünceli olmalı ve kalbine gelen kötü duygulara kulak asmamalıdır. Allah'a isyan eden günahkârları görünce onların kalbini kırmamalı ve aşağılamamalıdır. İşlenen günaha buğzedip, işleyenin ıslahına dua etmelidir. Kendisini eleştiren olunca hatasını kabul etmelidir. Mürşidine, mürid kardeşlerine ve tüm müslümanlara özellikle cuma günü, ramazan ayında, arefe gününde, seher vakitlerinde, hac sırasında, yağmur yağarken, ezan ile kamet arasında, secdede, iki hutbe arasında dua etmelidir. Duayı yalvararak ve huşû ile yapmalı; korku ve ümit duygularını dengelemeli; Allah'ın niyazını kabul edeceğini ummalıdır. Duanın başında Allah Teâlâ'ya hamd etmeli, Hz. Peygamber'e [sallallahu aleyhi vesellem] salât ve selâm getirmeli ve duayı yine aynı şekilde bitirmelidir."},{"k":"p","t":"Zikir, sohbet ve ibadet toplantıları uzadığında ferah olmaya gayret etmelidir. Allah yolundaki ve ibadetlerdeki zorluklara ve insanlardan gelen eziyetlere katlanmalıdır. Nefsin arzu ve isteklerine karşı koymalıdır. Hangi yolda olursa olsun temiz ve takva sahibi müminlerin hepsini sevmelidir. Alçak gönüllü, yumuşak huylu, merhametli, açık elli olmalı ve insanlara karşı daima iyi niyetli olmalıdır."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdülbâki el-Hüseynî hazretleri [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Edeplere halkın içinde iken dikkat edin. Çünkü halk sizleri örnek alır. Sûfî edepli olmalıdır. Bu yolda olgunluğa el öpmekle değil, edeple erişilir. Edebe aykırı haller kalbe zarar verir.”"},{"k":"p","t":"Birine kefil olurken dikkatli olmalı; bu konuda duyarlı olmalıdır. Gaflet ehli ve istikameti bozuk olan kimselerle beraber olmamalı ve sohbet yapmamalıdır."},{"k":"p","t":"Ehli gaflet deyince, konuşması, düşüncesi, aklı fikri yalnız dünya olan insan demektir. Konuşurken alışverişten konuşur. Düşünürken geçimini, parasını, pulunu, makamını, mevkiini düşünür. Kalbi de dili de yalnız dünyayla meşgul olur. İşte bu ehl-i gaflettir. Hiç Allah Teâlâ hatırına gelmiyor. Sâdâtlar, evliyaullah, Hz. Peygamber, ölüm, ahiret hiç hatırına gelmiyor. Yalnız ve yalnız dünyayı düşünüyor. Bunlara ehl-i dünya ehl-i gaflet diyor büyükler. \"Böyle kimselerle beraber olanların zararı, aynen onlara benzemektir\" buyuruyor büyüklerimiz."},{"k":"p","t":"Oyun oynanan ve boş konuşulan toplantılara gitmemeli; kötü, kaba ve uygunsuz sözler dinlememelidir. Hiç kimseyle tartışmamalı ve iddiaya girmemelidir. Asık suratla değil, güler yüzle davranmalıdır. Hoşa gitmeyecek şeyleri görmemek için gözü sakınmalıdır."},{"k":"p","t":"Hiç kimseye öfkelenmemeli, gereksiz yere kızmamalıdır. Tartışma ve ağız dalaşı yapmamalıdır. Birine öfkelendiğinde ondan özür dilemeli, Cenâb-ı Hakk'a da istiğfar etmelidir. Haklı sebeple dahi olsa kimseye hakaret etmemeli; her gördüğünü Hızır [aleyhisselâm] veya veli diye düşünerek dua istemelidir."},{"k":"p","t":"Herhangi bir konuda iyice düşünmeden karar vermemelidir. Hiç kimseyi hor görmemeli, tüm yaratılmışlara şefkatle bakmalıdır."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdülbâki el-Hüseynî hazretleri [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Sûfîler birbirlerine karşı edepli olsunlar. Birbirlerine saygı göstersinler. Merhametli olsunlar; bu onlar için menfaatlidir. Gavs ve Seyda hazretlerinin tavsiyeleri vardır: İnsan tarikata girdiği zaman onun ahlâklı ve iyi biri olması gerekir ki, dışarıdaki insanlar onu görüp ahlâkından etkilensinler. Önceki haliyle yeni hali arasında mukayese yapsınlar. Tasavvufun güzelliğinden etkilensinler. Böylelikle tarikata giren kişi, insanları hayra sevketmiş olur.”"},{"k":"h","t":"Allah'a Karşı Edep"},{"k":"p","t":"Her insan, kulluk vazifelerini yerine getirmesi için yaratıldı. Bu nedenle herkes, Allah Teâlâ'nın yaratıcı, kendisinin yaratılmış olduğuna iman etmeli ve bunun bilincinde olmalıdır. Akıl ve bâliğ olan her insan, Allah'ın [celle celaluhu] emir ve yasaklarına uymakla mükelleftir. Hiçbir kimse, bu mükellefiyetin dışında kalmaz ve hiç kimseden mükellefiyet düşmez. Çünkü akıl ve bâliğ olan herkes, Allah'ın emir ve yasaklarına itaat etmekle mükelleftir."},{"k":"h","t":"Hz. Peygamber'e Karşı Edep"},{"k":"p","t":"Allah Teâlâ, Hz. Peygamber'e [sallallahu aleyhi vesellem] hürmet ve tazimi farz kıldı. Onun huzurunda, ondan önce konuşmayı, ona karşı edebe uymayan davranışlarda bulunmayı yasakladı."},{"k":"p","t":"Ashâb-ı kirâma (radıyallahu anhum), Hz. Peygamber'in [sallallahu aleyhi vesellem] ağzından çıkanları dikkatle dinlemelerini emretti. Herhangi bir şekilde muhalefet etmekten, seslerini onun sesinden fazla çıkarmaktan menetti. Ona hayattayken de bekâ âlemine göç ettikten sonra da hürmet etmelerini emretti. Onu, birbirlerini çağırdıkları gibi çağırmamalarını emretti. Ona, sevdiği isimler arasında en güzeli ile hitap etmelerini emretti. Onun yanında sesini alçaltarak konuşanları överek onlara af ve mağfiret buyuracağını, büyük bir mükâfata kavuşturacağını vaat etti."},{"k":"p","t":"Sahabe, Hz. Peygamber'e [sallallahu aleyhi vesellem] gözlerini kaldırıp doğrudan bakamazlardı. Etrafında otururlarken sanki başlarının üzerinde kuş varmış gibi otururlardı. Hz. Peygamber [sallallahu aleyhi vesellem] abdest aldığı zaman, onun abdest suyunu alabilmek için birbirleriyle yarışırlardı. Hz. Peygamber'in saçından bir tel düşünce, onu alabilmek için çok gayret gösterirlerdi. Onun emirlerine uyabilmek için canla başla çalışırlardı. Hz. Peygamber'in [sallallahu aleyhi vesellem] kapısını parmakları ile değil, âdeta tırnaklarıyla çalarlardı. Bir şey soracakları vakit, Hz. Peygamber'e hayalarından dolayı çekinirler, kendilerine söz verilmesini beklerlerdi."},{"k":"p","t":"Bunun gibi mürid de Hz. Peygamber'e [sallallahu aleyhi vesellem], onun ashabına, Ehl-i beyt'ine saygı ve hürmet etmeli, özellikle Ravza'da edebe çok riayet etmelidir."},{"k":"h","t":"Mürşide Karşı Edep"},{"k":"p","t":"Mürid, şeyhinin Hz. Peygamber'in [sallallahu aleyhi vesellem] vârisi olduğunu ve Hakk'a ancak onun vasıtasıyla ulaşacağını bilmelidir, ister onun huzurunda olsun, ister ondan ayrı bulunsun daima edebini muhafaza etmelidir. Bütün arzularını onun eline bırakmalı, gassalin (ölü yıkayıcının) elinde teneşirdeki ölü gibi olmalıdır."},{"k":"p","t":"Sesini onun sesinden yüksek çıkarmamalıdır. Onunla yüksek sesle konuşmak edepsizlik olur. Kendine gelen rahmani her feyzin, her keşfin onun vasıtası ile geldiğini bilmelidir."},{"k":"p","t":"Her mümin ziyaret için gittiği mürşid-i kâmili, Allah ve Rasulunün bir emaneti olarak görmelidir. Ona karşı yapacağı hürmetin, aslında Allah ve Resûlüne yapılan bir hürmet çeşidi olduğuna inanmalıdır."},{"k":"p","t":"Herkes kalbindeki Allah ve Peygamber sevgisini, kendisindeki edeb ve hürmet anlayışını, velilere karşı tavrıyla ölçebilir. Çünkü veli yeryüzünde Allah Teala’nın şahidi ve hâlifesidir. Hz. Resûlullah [sallallahu aleyhi vesellem] Efendimizin varisidir. Bir insan kendi zamanında yaşayan kâmil mürşidlere ve Rabbani alimlere ne derece hürmet ve edep gösterebiliyorsa, onun Hz. Peygambere karşı yapabileceği hürmet de ancak o kadardır. Bu bir ölçüdür."},{"k":"p","t":"Allah [celle celaluhu] ihlas ile amel eden kullarından eylesin. Amin"}],"cat":"Ahlak"},{"id":"kibrin-zararlari","title":"Kibrin Zararları","sub":"Sohbet notu","desc":"Kibrin zararları ve tevazunun üstünlüğü","color":"#8B2635","mins":23,"paras":[{"k":"p","t":"Kibir, büyüklenmek, büyüklük taslamak, ululuk iddia etmek, kendini başkalarından yüksek görmek, insanları aşağılamak, hakka boyun eğmemektir."},{"k":"p","t":"Şeytanı, Hz. Âdem'e [aleyhisselâm] secdeden alıkoyan kendini beğenmesi ve kendini Âdem'den üstün görmesidir. Nefis, insanda şeytanî duyguların mahalli olduğundan devamlı surette kendini beğenme duygusunu tahrik etmektedir. İlim, servet, nesep, güzellik, kuvvet, kudret ve mevki bu duyguyu harekete geçirip güçlendiren amillerdir. Hâlbuki bunların hepsi Hak vergisidir. Bunlara güvenmek, bunlarla övünmek insanın kendisinin kazanmadığı şeylerle avunmasıdır."},{"k":"p","t":"O öyle bir duygudur ki onunla kişi övünmeyi yalnızca kendine yakıştırır. Bunun için insan kendini herkesten daha büyük görür. Kibir, kişinin kendisinde bulunan ilim, mevki ve doğruluk gibi hususiyetleri başkasından üstün görmesidir. Bu durum, Allah'ın gazabına, insanların hoşnutsuzluğuna sebep olduğu için sahibini felakete götüren bir hastalıktır."},{"k":"p","t":"İnsan ruhunun arındırılması gereken kötülüklerden biri olan kibir, Râgıb-ı İsfahânî'ye (rahmetullahi aleyh) göre, \"Kendini beğenen insanın, bu isteğini nefsine tahsis ederek, kendini başkalarından daha büyük görmesidir.\""},{"k":"p","t":"Yaratılış itibariyle insanoğlu, her türlü güzellik ve olgunluğa elverişli bir yapıya sahiptir. Zira o, “Gerçekten biz âdemoğullarını aziz ve şerefli kıldık.” (İsra, 70) müjdesine muhataptır; insan yaratıkların en şereflisidir. Yine Kur'ân-ı Kerîm'de insan için, “Biz insanı en güzel şekilde yarattık.” (Tîn, 4) buyrulmuştur."},{"k":"p","t":"Âyetle şu denmiş oluyor: Biz insanoğlunu fıtrat ve yetenek açısından en güzel bir biçimde yarattık. Sonra insanoğlu, bu fıtratı ile yüce Allah'ın kendisine gösterdiği, açıkladığı ve iki yoldan birini seçsin, diye özgür bıraktığı çizgiden sapınca, biz de “Sonra onu, aşağıların aşağısına indirdik.” (Tîn, 5)"},{"k":"p","t":"Esfel-i safiline düşmemek, ahsen-i takvim çizgisinde yürüyebilmek, hiç şüphe yok ki özel bir gayret ve çabayı gerektirir. Abdullah b. Mesud'un (radıyallahu anh) ifadesine göre: “Tevazu hasis (cimri) kişiyi yükseltir. Kibir de yüksek kişiyi alçaltır.”"},{"k":"p","t":"İnsanın yaratılışına bakacak olursak, birtakım iyi ve kötü eğilimleri bir arada taşıdığını görürüz. Bu fıtratıyla insan ne melekler zümresinden ne de şeytanlar taifesindendir. Ancak melekler kadar saf ve temiz olabileceği gibi, hayvandan aşağı seviyelere düşmesi de söz konusudur."},{"k":"p","t":"O halde insanoğlunun maddî ve ruhî hayatında dengelerin önemi büyüktür. Zira insanın yaratılış itibariyle aşırılıklara kaçmaya temayülü vardır. İnsanoğlunun içine düştüğü hastalıklardan biri kibirdir. Kibir, kişinin kendini başkalarından büyük sayıp diğer insanları hor ve hakir görmesidir."},{"k":"p","t":"Kibir ve gurur kabalığın, hamlığın ve yetişmemişliğin tezahürüdür. Bu nedenle dinimizce yerilmiştir. Hatta o kadar ki kötülüğün simgesi olan şeytan, sırf kibri ve kendini her şeyden üstün görmesi sebebiyle Allah'ın esirgemesinden, bağişlayıcılığından ebediyen uzaklaştırılmıştır."},{"k":"p","t":"İnsanın asıl sıfatı âcizlik, noksanlık ve ihtiyaç halidir. İnsana düşen, bu asıl halini idrak edip tevazu içinde halini yüce Allah'a arzetmesidir. İnsanın böylesine ulvî bir tevazu hali, aynı zamanda onun gayet güzel ve sevimli bir kulluğudur."},{"k":"p","t":"Kişinin güzel giyinmesi, İslâm'a uygun süslenmesi, çevresinin düzenli olması, hatta pahalı eşya kullanması kibir değildir. Kibir, haktan yüz çevirmek ve onu reddetmektir. Yine kibir, hakkı ortadan kaldırmak, halkı aşağılamak ve kendini üstün görmektir."},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] kibri en özlü bir şekilde şöyle tanıtmıştır: “Kibir, kendisine hak gelince onu inkâr etmek ve insanları hafife alıp onları hor görmektir.”"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem]:"},{"k":"q","t":"“Cennete kibirden hiçbir şey giremez” diye buyurduğunda, orada bulunanlardan bir sahabi,"},{"k":"q","t":"“Ey Allah'ın Resulü! Ben, giyim kuşamım ile güzel görünmekten hoşlanırım, bu kibir midir?” diye sordu. Hz. Peygamber [sallallahu aleyhi vesellem],"},{"k":"q","t":"“Hayır, bu kibir değildir. Allah güzeldir, güzeli sever. Kibir hakkı küçük görmek ve insanlarla alay etmektir”  buyurdu."},{"k":"p","t":"Allah Resûlü [sallallahu aleyhi vesellem]: “Kalbinde hardal tanesi kadar iman olan hiç kimse cehenneme girmez; kalbinde hardal tanesi kadar kibir bulunan hiç kimse de cennete giremez”  diye buyurmuştur."},{"k":"p","t":"Hadisteki ifade kibirli insanın cennete giremeyeceğini anlatmaktadır. Ancak buradaki kibir, Allah'a ve Peygamber'e [sallallahu aleyhi vesellem] karşı gelip Hakk'ı reddetme şeklindeki kibirdir."},{"k":"p","t":"İmam-ı Gazali (rahmetullahi aleyh) kibri üçe ayırmaktadır:"},{"k":"p","t":"1- Allah’a karşı kibir, kibrin en kötüsü budur. İnsanı bu yola sürükleyen, cehalet ve azgınlıktır. Nemrut ve Firavun gibilerinin kibri böyledir. Bu kişiler, kendilerini ilah saymışlar, kul olduklarını reddetmişlerdir."},{"k":"p","t":"Bu gibiler hakkında Allah’u Teala şöyle buyurmuştur:"},{"k":"q","t":"“Bana kulluk etmeye tenezzül etmeyenler, aşağılık kimseler olarak cehenneme gireceklerdir.” (Mü’min 60)"},{"k":"p","t":"2- Peygamberlere karşı kibir: Bu da kendileri gibi bir insana uymayı kabul etmemektir. Bu, bazen körü körüne olur da kibri sebebiyle kendini haklı sanarak peygamberlere uymaz ve cehalet karanlığında kalır. Bazen de bilerek olur. Nefsi onu hakkı kabule ve peygambere uymasına engel olur ve şöyle der:"},{"k":"q","t":"“Şimdi, bizim gibi insana mı inanacağız?” (Mü’minun 47)"},{"k":"p","t":"3- İnsanlara karşı kibir: Bu kibir,kendilerini başkalarından üstün görme yanlışlığıdır. Halbuki hiçbir kimsenin buna hakkı yoktur. Büyüklük ve üstünlük ancak Allah’a aittir."},{"k":"p","t":"İnsanlara karşı olan kibir de çok yanlış bir yoldur. Çünkü insanlardan başlamak suretiyle Allah’a kibretmeye kadar insanı sürükler. İblis, Hz. Adem [aleyhisselâm]’a karşı bu şekilde kibirlenmişti."},{"k":"q","t":"“(İblis) Dedi ki: Beni ateşten, onu (Adem’i) çamurdan yarattın.” (Sad 76)"},{"k":"p","t":"Kendini  başkalarından üstün görüp  başkalarına horluk ve hakaretle bakan, bile bile, onlarda bulduğu hakkı reddedip kabul etmeyen kimse, insanlara karşı kibirlenmiş; Allah’ın emirlerine karşı gelen de Allah’a ve Resulüne  karşı kibirlenmiş olur."},{"k":"p","t":"Şunu da anlamak gerekir ki,kibrin olmasındaki en önemli etkenlerin başında şeytanın önderliğini yaptığı mukayese,baş olma ve şöhret sevgisi, insanda kibir meydana getirir. Bu nedenledir ki mü’minin ahlakında bir başkasıyla mukayese yapmak yoktur. Bundan başka mü’min beraber olduğu insanlar içinde kendine üstünlük vererek baş olması gerektiğini düşünmez ve asla birilerinin övgüsüne kapılarak da her hangi bir konuda şöhret yolunu seçmez. İşte bu alametler kibirli olmaya yeterde artar bile."},{"k":"p","t":"Kur'ân-ı Kerîm'de Cenâb-ı Hak [celle celaluhu] şöyle buyuruyor: “Küçümseyerek insanlardan yüz çevirme ve yeryüzünde böbürlenerek yürüme. Şüphesiz Allah kendini beğenmiş, övünüp duran kimseleri asla sevmez.” (Lokman, 18)"},{"k":"p","t":"Allah Resûlü [sallallahu aleyhi vesellem] şöyle buyurdular:"},{"k":"q","t":"“Önceki ümmetlerin hastalığı benim ümmetime de bulaşacak!” Ashab,"},{"k":"q","t":"“Ey Allah'ın Resûlü! O ümmetlerin hastalığı ne idi?” diye sorduklarında Allah Resûlü [sallallahu aleyhi vesellem] şöyle buyurdular:"},{"k":"q","t":"“Kibir ve gurur, varlığın çokluğuyla övünmek ve dünyalıkta yarışmak, karşılıklı kin tutmak ve kıskançlık. Bunların sonucunda Allah'a isyan ve kargaşa ortaya çıkar.”"},{"k":"p","t":"Bir gün Hz. Musa [aleyhisselâm] Rabb'ine münâcâtta bulunarak, “Ey Rabbim! Yarattıklarının arasında en çok kime buğzedersin?” diye sordu. Allah [celle celaluhu], “Ey Musa! En çok kibirlenenlere, kaba dilli olanlara, kibirden gözlerini kapatarak konuşan ve eli cimri olanlara buğz ederim” diye vahyetti."},{"k":"p","t":"Habîb b. Ebû Sâbit (rahmetullahi aleyh), Yahyâ b. Cu'de'den (radıyallahu anh) rivayet ediyor: Bir defasında Resûlullah [sallallahu aleyhi vesellem]:"},{"k":"q","t":"“Kalbinde zerre ağırlığınca kibir bulunan cennete giremez” buyurdu. Bunun üzerine bir adam:"},{"k":"q","t":"“Ey Allah'ın Resûlü! Benim elbisemin yeni ve temiz olması, ayakkabımın tokalı olması, kamçımın topuzlu olması hoşuma gidiyor. Bunlar da kibirden sayılır mı?” diye sordu. Resûlullah [sallallahu aleyhi vesellem] şöyle buyurdu:"},{"k":"q","t":"“Allah güzeldir ve güzelliği sever. Allah [celle celaluhu] kuluna bir nimet verdiği zaman, o nimetin eserinin kulunda görünmesini ister. Zelil, hakir ve fakir gibi görünmeyi ise sevmez. Kibir ise Hakk'ı hiçe saymak ve insanları hakir görmektir.”"},{"k":"p","t":"Fakih Ebü'l-Leys (rahmetullahi aleyh) der ki: Ebû Hüreyre'den (radıyallahu anh) ulaşan bir hadis-i şerifte Nebî Zîşan Efendimiz [sallallahu aleyhi vesellem] şöyle buyurmuştur: “Bana, cennete girecek ilk üç kişi ile cehenneme girecek ilk üç kişi gösterildi. Cennete girecek ilk üç kişi: Şehid, köle olması Rabbine ibadet etmesine engel olmayan kişi, çoluk-çocuk sahibi zayıf, darda kalmış fakir. Cehenneme ilk önce girecek ilk üç kişi ise şunlardır: Ona buna musallat olan, zulmeden yönetici, malı mülkü olmasına rağmen zekâtını vermeyen zengin, kibirlenen fakir.” -"},{"k":"p","t":"Allahu Teâlâ, şu ayetlerle, kibrin ne kadar büyük bir günah olduğunu beyan etmiştir:"},{"k":"q","t":"“O, büyüklük taslayanları asla sevmez.” (Nahl, 23)"},{"k":"q","t":"“Kibredip büyüklük taslayanların yeri Cehennem değil mi.” (Zümer, 60)"},{"k":"p","t":"İnsan kendini beğenip kibre kapılmamalı. Çünkü o, atılan bir sudan yaratılmıştır. Nitekim Rabbimiz buyurmuştur ki; “Şimdi insan baksın (düşünsün), neden yaratıldı? O, atılan bir sudan (meniden) yaratıldı!” (Târık, 5-6)"},{"k":"p","t":"Yahya b. Muaz demiştir ki: “Tevâzu, herkeste güzeldir; fakat zenginlerde daha güzeldir. Kibir, her insanda çirkindir, fakat fakirlerde daha çirkindir.”"},{"k":"p","t":"Hükemâdan birisine:"},{"k":"q","t":"“Hased edilmeyen bir nimet ve sahibine acınmayan bir belâ biliyor musunuz?” diye sorulunca:"},{"k":"q","t":"“Evet; hased edilmeyen nimet tevâzu, sahibine acınmayan belâ da kibirdir.” demiştir."},{"k":"p","t":"Ka'b Ahbâr (rahmetullahi aleyh) demiştir ki: “Kibirli kimseler kıyamet günü zerre büyüklüğünde insanlar halinde getirilir. Zillet her cihetten onları kuşatır. Sonra cehenneme sürüklenerek götürülürler. Orada kendilerine cehennem halkının bedenlerinden çıkan sular içirilir.”"},{"k":"p","t":"İbn Ataullah el-İskenderî [kudduse sirruhu] demiştir ki: “Büyüklük, Allah Teâlâ'ya mahsustur. İnsan benliğini, küçüklük ve aşağılık toprağına gömmelidir. Çünkü gömülmeden bitenin, doğması ve büyümesi düşünülemez.”"},{"k":"p","t":"Ebû Ali Rûzbârî [kudduse sirruhu] der ki: “Yükselen ancak tevazu ile yükselir. Alçalan da ancak kibirle alçalır.\""},{"k":"p","t":"Fudayl b. iyâz [kudduse sirruhu] demiştir ki: “Nefsinde bir değer gören kimsenin, tevazudan nasibi yoktur.”"},{"k":"p","t":"Bir zat şu olayı anlatmıştır: “Tavaf esnasında (halifenin görevlilerinden) birini gördüm. Etrafında bir sürü adam vardı; rahat tavaf etmesi için (diğer insanları yanından uzaklaştırıyor ve ona yer açıyorlardı. Aradan bir zaman geçti, ben bu adamı Bağdat Köprüsü üzerinde insanlardan bir şeyler isterken gördüm. Onun bu durumuna hayret ettim. Benim şaşırdığımı anlayınca şöyle dedi: ‘Ben bütün insanların tevazu gösterdiği yerde (tavafta) kibir gösterip kendimi beğendiğim için, Allah Teâlâ da insanların hiç tenezzül etmediği böyle bir yerde beni zillete düşürdü.”"},{"k":"h","t":"Allah’ın [celle celaluhu] Tevazu Ehlini Seçmesi"},{"k":"p","t":"İbadet ve taat ehli insanların da hayır-hasenatına, ibadet ve taatine güvenmek suretiyle kibir tuzağına düşme tehlikesi vardır. Mümin, buna karşı uyanık olmalıdır. Mümin hiçbir zaman ibadet ve taatlerinden dolayı kendini başkalarından üstün görmemelidir. İmam Mücâhid'in bildirdiğine göre: “Allah Teâlâ Hz. Nuh'un [aleyhisselâm] kavmini tufanda garkettiği vakit, dağlar böbürlendi ve başını yükseltti. Buna karşı Cudi dağı tevazu gösterdi. Çünkü onlar yüksek, Cudi ise alçak idi. Tevazu gösterdiği için Allah Teâlâ onu yüceltti ve Nuh'un gemisini onun tepesine kondurdu.”"},{"k":"h","t":"Kıssa: Hz. Hüseyin'in (radıyallahu anh) Tevazusu"},{"k":"p","t":"Fakih Ebü'l-Leys (rahmetullahi aleyh) der ki: Bir gün Hz. Hüseyin (radıyallahu anh) birkaç düşkün kişinin yanından geçiyordu. Bunlar yere serdikleri bir yaygı üzerinde ufak tefek ekmek kırıntılarını yiyorlardı. Hz. Hüseyin'i (radıyallahu anh) görünce,"},{"k":"p","t":"- Ey Abdullah'ın babası (Hz. Hüseyin'in künyesi)! Buyur, yemeğimize katıl, dediler. Hz. Hüseyin (radıyallahu anh) bineğinden indi, içinden, 'Allah kibirlenenleri sevmez' (Nahl, 23) âyetini okudu ve sofraya oturarak onlarla beraber yedi. Sonra,"},{"k":"p","t":"- Ben sizin davetinize icabet ettim; Şimdi siz benim davetime icabet edin, dedi ve hep birlikte Hz. Hüseyin'in (radıyallahu anh) evine gittiler. Eve gidince Hz. Hüseyin (radıyallahu anh) hizmetçisine,"},{"k":"p","t":"- Evde ne varsa getir, buyurdu. Hizmetçi evde olan bütün yiyecekleri çıkardı, sofra kuruldu. Fakirler yedi, Hz. Hüseyin de (radıyallahu anh) onlarla beraber yedi. Fakirler yemekten arta kalanı yanlarında götürdüler."},{"k":"p","t":"İmam Gazali (rahmetullahi aleyh) şöyle der: “Kalbin içinde tedavi edilmesi gereken ve ibadet işinde kimsenin uzak kalamayacağı temel ahlakları inceledik; tedavi edilmesi gereken kötü huyların temelde dört şey olduğunu gördük. Bunlar, ibadet ehlinin afeti, kalplerin fitnesi, onu perdeleyen, kötüleştiren ve bozan şeylerdir. Bunlara mukabil, ibadet ehlini ayakta tutacak, ibadetlerin düzenini sağlayacak ve kalbi ıslah edecek şeylerin de temelde dört tane olduğunu tespit ettik."},{"k":"p","t":"Kalbin dört afeti şunlardır: Uzun emel, acelecilik, haset ve kibir."},{"k":"p","t":"Bunlara karşılık, kalbin ıslahını temin edecek dört güzel ahlak ise şunlardır: Kısa emel, işlerde teenni ve dengeli hareket etmek, halka karşı samimi ve tevazu ile davranmak, Yüce Allah’a karşı huşu içinde olmak."},{"k":"p","t":"İşte bunlar, kalbi bozan ve onu ıslah eden şeylerdir. Öyleyse, bu afetlerden korunmak ve güzel ahlakları elde etmek için bütün gayretini seferber et; o zaman sana lazım olanı elde eder, maksadına ulaşırsın.”"},{"k":"h","t":"Kibrin Zararları"},{"k":"p","t":"Kibir, başlıbaşına bir kötülük ve öldürücü bir hastalıktır. Cenab-ı Hak şöyle buyurur: “Hani biz meleklere (ve cinlere): Âdem'e secde edin, demiştik. İblis hariç hepsi secde ettiler. O yüz çevirdi ve büyüklük tasladı, böylece kâfirlerden oldu.” (Bakara, 34)"},{"k":"p","t":"Bu kötü haslet, amelleri lekeleyen ve dinin ayrıntıları (fürû'ât) ile ilgili konularına zarar veren diğer kötü hasletlere benzemez. Kibir, dinin aslına ve temeline zarar verir; dini ve akideyi kökünden zedeler. Eğer kibir güçlenir ve insan üzerinde üstünlük sağlarsa, Allah korusun imanın devam etmesi tehlikeye düşer. Kibir, insanları en azından şu dört tehlikeyle yüzyüze getirir."},{"k":"h","t":"Birinci zarar: Basiretin Kapanması"},{"k":"p","t":"Kibir, insanın basiretinin kapanmasına ve hakikatten mahrum kalmasına sebep olur. Allah Teala'nın ayetlerindeki incelikleri göremez, hükümlerindeki hakikatleri anlayamaz. Cenab-ı Hak şöyle buyurur: “Yeryüzünde haksız yere böbürlenenleri (kibirlenenleri) âyetlerimden uzaklaştıracağım. Onlar bütün mucizeleri görseler de iman etmezler. Doğru yolu görseler onu yol edinmezler. Fakat azgınlık yolunu görürlerse, hemen ona saparlar.” (A'râf, 146)"},{"k":"p","t":"Yine şöyle buyurur: “Allah, büyüklük taslayan (kibirlenen) her zorbanın kalbini işte böyle mühürler.” (Mümin, 35)"},{"k":"h","t":"İkinci zarar: Allah'ın Buğz Etmesi"},{"k":"p","t":"Kibirli insanlar, Cenab-ı Hakk'ın buğzunu üzerlerine çekerler. Ayet-i kerimede şöyle buyurulur: “Hiç şüphesiz Allah, onların gizleyeceklerini de açıklayacaklarını da bilir. O, büyüklük taslayanları asla sevmez.” (Nahl, 23)"},{"k":"p","t":"Nakledildiğine göre Musa [aleyhisselâm] şöyle demiş:"},{"k":"p","t":"- Ey Rabb'im! Yaratıkların içinde en çok buğz ettiklerin kimlerdir? Cenab-ı Hak buyurmuştur ki:"},{"k":"p","t":"- Kalbinde kibir bulunan, dilleri fahiş ve çirkin söz söyleyen, gözlerini hayra kapayan, elleri cimri ve ahlakı kötü olan kimselerdir!"},{"k":"h","t":"Üçüncü zarar: Dünya ve Ahirette Aşağılanma ve Ceza"},{"k":"p","t":"Kibir sahipleri için hem dünyada hem de ahirette aşağılanma ve ceza vardır. Hatem-i Esam der ki: \"Üç hal üzere ölmekten kaçınmak istedim: Kibir, hırs ve kendini beğenme. Zira Cenab-ı Hak kibir sahibini; yakınlarından en rezil olanların ve hizmetçilerinin elinde değersiz bir hale getirmeden dünyadan almaz. Hırslı bir kimseyi de bir kat elbiseye, bir yudum suya ve bir lokma ekmeğe muhtaç etmeden canını almaz. Kendini beğenenleri ise, kendi pisliklerine bulanmadıkça dünyadan çekip almaz.\""},{"k":"h","t":"Dördüncü zarar: Ahirette Azap ve Cehennem"},{"k":"p","t":"Hadis-i kudsîde Cenab-ı Hak şöyle buyurur: “Büyüklük (kibir) ridâm, ululuk da izarımdır. Bunlardan birini kim giyinmek isterse onu cehennem ateşine sokarım!” -"},{"k":"h","t":"Mümin Ve Kibir"},{"k":"p","t":"Kibir salih ve müttaki bir müslümanda bulunmaması gereken, tevhid ehline yakışmayan en kötü huylardandır. Kula kibir değil kulluk yakışır. Allah karşısında kendini kul ve zelil gören insan, Allah'ın büyüklüğüne teslim olur ve O'nun çizdiği sınırları aşmaz."},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] kibri kötülemiştir. Kibrin zıddı olan güzel ahlâkı ve tevazuyu ise övmüştür. Bir hadisinde şöyle buyurmuştur: “Allah [celle celaluhu] bana şöyle vahyetti: Mütevazi olun, alçak gönüllü olun, öyle ki, biriniz diğerine karşı üstünlük taslamasın.”"},{"k":"p","t":"Bir diğer hadiste ise Allah Resûlü [sallallahu aleyhi vesellem] bütün insanları şöyle uyarmıştır: “İnsanlar, ya cehennem kömüründen başka bir şey olmayan ölmüş ecdatlarıyla övünmekten vazgeçerler yahut da Allah katında, burnuyla pislik yuvarlayan mayıs böceğinden daha adi bir seviyeye düşerler. Allah Teâlâ sizlerden Câhiliye kibrini temizledi. Artık bütün insanlar ya müttaki bir mümindir yahut bedbaht bir tacirdir. İnsanların hepsi Hz. Âdem'in evlatlarıdır. Âdem ise topraktan yaratılmıştır.”"},{"k":"p","t":"Kibir Allah'ın kullarına yakışmaz. Kula kulluk yakışır. Neticede hepimiz insanız. Halbuki insanlar arasında üstünlük sadece takva iledir. Nitekim Hz. Peygamber [sallallahu aleyhi vesellem], Veda haccında, binlerce müslümana yaptığı konuşmasında, insanlar arasındaki eşitliği en güzel şekilde ifade ederek şöyle buyurmuştur: “Ey insanlar! Rabb'iniz birdir, babanız da birdir. Dikkat ediniz, hiçbir Arab'ın Acem'e (Arap olmayana), siyahın beyaza (yani siyah ırkın beyaz ırka) herhangi bir üstünlüğü yoktur. Allah katında en üstün olanınız, en fazla takva sahibi olanınızdır.”"},{"k":"p","t":"Evet, üstünlük ancak takva iledir. Takvanın hakiki ölçüsü de Allah Teâlâ'nın katındadır. Kulun kendisinde değil."},{"k":"h","t":"Kıssa: Kibir İbadeti, Tövbe de Günahı Siler"},{"k":"p","t":"Rivayet edilir ki: Bir gün İsa [aleyhisselâm], İsrâiloğulları'ndan salih zannedilen bir kimse ile şehir dışına çıkmıştı. Halk arasında fâsıklıkla meşhur günahkâr bir adam da büyük bir eziklikle peşlerine takılmıştı. İstirahat için mola verildiğinde bu günahkâr kişi, samimi bir nedamet ve utanç hali içinde, gönlü kırık olarak onlardan ayrı bir yere oturdu ve merhametlilerin en merhametlisi olan Hak Teâlâ'nın yüce affına sığınarak: “Rabbim! Şu yüce peygamberinin hürmetine beni affet!” diye dua etti. Salih zannedilen kişi ise onu farkedince küçümsedi, hor ve hakir gördü. Ellerini semaya kaldırıp, “Allahım! Yarın kıyamet günü beni bu adamla birlikte haşreyleme!” diye ilticada bulundu."},{"k":"p","t":"Bunun üzerine Cenâb-ı Hak Hz. İsa'ya [aleyhisselâm] şöyle vahyetti: “Yâ İsa, kullarıma söyle; ikisinin de duasını kabul ettim. Boynu bükük mücrim kulumu affedip kendisini cennetlik kıldım. Halkın salih zannettiği kişiye gelince, onu da benim affettiğim kulumla beraber olmak istemediği için cennetlikler arasından çıkardım.”"},{"k":"p","t":"Kıssa: Hz. Ömer'in Diğerkâmlığı (Başkasını kendi nefsine tercih etmesi)"},{"k":"p","t":"Şam yolculuğunda Halife Ömer (radıyallahu anh) ve hizmetçisi deveye nöbetleşe binme konusunda anlaşmışlardı, insan haklarına riayet eden ve köle-efendi ayırımı yapmadan adaleti gözeten o büyük zat, kölesinin bütün ısrarına rağmen nöbetleşe binme şartını değiştirmemişti."},{"k":"p","t":"Şam'a yaklaşıldığında deveye binme sırası hizmetçiye gelmişti. Hizmetçi deveye bindi, Hz. Ömer de (radıyallahu anh) devenin yularından çekerek yola devam etti. İlerlerken yollarının üzerinde birikmiş bir su birikintisi ile karşılaştılar. Hz. Ömer (radıyallahu anh) ayakkabılannı çıkanp sol koltuğunun altına aldı ve suya girerek karşıya geçti. Tam bu sırada Şam valisi ve cennetle müjdelenen on sahâbîden biri olan Ebû Ubeyde b. Cerrâh onları karşılamaya gelmişti. Hz. Ömer'i (radıyallahu anh) bu halde görünce,"},{"k":"p","t":"- Ey müminlerin emîri! Şam halkının ileri gelenleri sizi karşılamak üzere buraya geliyorlar. Şam halkı saltanat ve debdebeye düşkündür. Sizi bu halde görmeleri iyi olmaz, dedi. Adalet ve hakkaniyet sultanı o büyük halife, şu veciz ve hikmetli cevabı verdi:"},{"k":"p","t":"- Allah [celle celaluhu] bizleri islâm ile aziz kılmıştır. Bundan sonra insanların söyleyecekleri hiç önemli değildir."},{"k":"h","t":"Kıssa: Ömer b. Abdülaziz'in Tevazusu"},{"k":"p","t":"Halife Ömer b. Abdülaziz'in (rahmetullahi aleyh) yanına bir gece misafir gelmiş. Yatsı namazını kılmışlar. Misafir yanında otururken Halife hazretleri de masasına oturmuş, bir şey yazıyormuş. Bu sırada kandilin yağının bitmek üzere olduğunu gören misafir:"},{"k":"p","t":"- Ey müminlerin emîri, müsaade ederseniz kandilin yağını doldurayım, demiş."},{"k":"p","t":"Halife hazretleri buyurmuşlar:"},{"k":"p","t":"- Misafiri hizmette kullanmak mürüvvet değildir (insanlığa yakışmaz). Bunun üzerine misafir:"},{"k":"p","t":"- Bari köleyi uyandırayım, deyince bu defa halife şöyle buyurmuş:"},{"k":"p","t":"- Köle daha yeni uyumuştur. Bu saatte onu uyandırmak da adalete uygun değildir."},{"k":"p","t":"Böylece halife hazretleri, bizzat kalkıp yağ kabını alarak kandili doldurmuş ve düzeltmiştir. Misafir, bu derece yüksek bir tevazuyu garipseyerek halife hazretlerine:"},{"k":"p","t":"- Bu hizmeti görmek için neden kendiniz kalktınız, deyince halife şöyle buyurmuş:"},{"k":"p","t":"- Ne oldu? Hizmete kalktım Ömer'dim, hizmetten döndüm yine Ömer'im, insanların Allah katında sevimli olanı, tevazu sahibi ve alçak gönüllü olanıdır."},{"k":"h","t":"Kibirden Kurtulmanın Çaresi"},{"k":"p","t":"Kibir bir hastalıktır. Bu hastalığa yakalanmamak için kibirli insanlardan uzak durmalıdır. Onlarla samimiyet, dostluk kurmamalıdır. Kibirli ile oturup kalkan bir müddet sonra kibirli olur."},{"k":"p","t":"Kibir nefsanî bir hastalık olduğu için nefsi azdırmamak çok önemlidir. Azgınlaşan nefis kibirlenir, gururlanır, kendini bir şey zanneder. Bu sebeple nefis terbiyesine önem vermelidir. Bu sebeple fakir olduğu halde kibirli, varlıklı olduğu halde mütevazi kişilere rastlamak mümkündür. Nefsini terbiye edebilen, ona söz geçiren kişi zengin de olsa fakir de olsa tevazu ehlidir."},{"k":"p","t":"Dünya sevgisi, dünyayı elde etme hırsı kibre sebep olur. İstediğini ele geçirince kendini üstün zanneder. Bu sebeple dünya malından gönlünü çekmelidir. Mal ile ilgili dinî vecibelerini yerine getirmelidir. Zekâtını vermeli, fitresini ödemeli, kurbanını kesmeli fakirlere dağıtmalıdır."},{"k":"p","t":"Allah [celle celâluhû] yolunda mal harcamak kişideki dünya hırsını törpüler, ona düşkünlüğü köreltir."},{"k":"p","t":"Çevremizde kibirli insanlar varsa onlara incitmeden nasihat etmelidir. Bu durumdan kurtulması için camiye, sohbete, hizmete, bir mümin kardeşini ziyarete, hasta ziyaretine vb. davet etmelidir."},{"k":"h","t":"Allah Dostlarının Ahlâkı"},{"k":"p","t":"Hak dostları tevazu sahibi kişilerdir. Onların meclislerinde tevazu hâkimdir. Eller önde, başlar eğiktir. Herkes hizmet etmenin, Allah [celle celâluhû] yolunda bir işin ucundan tutmanın yarışı içindedir. Onların tevazu ahlâkı talebelerine de yansır."},{"k":"p","t":"Gavs-ı Kasrevî hazretleri [kuddise sırruhû] şöyle anlatmıştı:"},{"k":"q","t":"“Bir gece mürşidim Şah-ı Hazne’nin tekkesine gittim. Müridler, dervişler dergâhı iyice doldurmuşlardı. Hava soğuktu. Çoğu sûfî yatmıştı. Bir kenara da ben uzanıp yatayım dedim. Ama üzerime örtecek bir şey bulamadım."},{"k":"p","t":"Üzerime örtmek için sadece bir hasır bulabildim. Tam uyuyacakken baktım, sûfînin biri üzerine örtmek için bir örtü arıyor. Halinden belli ki çok da üşümüş. Kendi kendime,"},{"k":"p","t":"‘Ben üşüsem ne olur, yeter ki Şah-ı Hazne’nin bu dervişi üşümesin!’ dedim. Arkamı dönerek üzerimdeki hasırı hafifçe sırtımdan attım!"},{"k":"p","t":"Derken o sûfî, bu hasırın kullanılmadığını düşünerek aldı. Üstüne örttü ve uyudu.”"},{"k":"p","t":"Gavsı Cihan Şeyh Seyyid Abdulbaki El-hüseyni Hazretleri [kudduse sirruhu] şöyle buyurmuştur;"},{"k":"q","t":"“Hak tâlibi bir sûfî tavus kuşu gibi olmalıdır, karga gibi olmamalıdır. Tavus kuşu, vücudunun onca güzelliğini görmez, ayaklarının siyahlığına bakar, boynunu büker. Sûfî de bu düşünce ve hal üzere olmalı, sahip olduğu güzel hallere değil, nefsinin kusurlarına bakmalıdır. Çünkü insanın iyi hallerine bakması kendisinde kibir ve gurura sebep olur. Tavus kuşu o kadar güzel renkli olmasına rağmen siyah bacağından dolayı mahcuptur. Karga ise, iki renkli olduğu, ağzı her pisliğe değdiği halde sanki kendisinden başka kuş yokmuş, en güzel kuş kendisiymiş gibi avaz avaz bağırır. Halim, yumuşak ve tevazu sahibi olun; sizleri tenkit edenleri anlamaya çalışın. İnsan kendini ne kadar hakir görürse Allah’ın huzurunda o kadar büyür. Kâbe çukurda olduğu halde manen yüksektedir. İnsan nefsini ne kadar çok yüksek görürse, Allah onu o kadar alçaltır.”"},{"k":"p","t":"Allah [celle celaluhu], nefsimize bir an göz açıp kapayacak bile kadar kibre kapılmaktan muhafaza eylesin. Amin"}],"cat":"Ahlak"},{"id":"ahde-vefa","title":"Ahde Vefa ve Sözünde Durmak","sub":"Sohbet notu","desc":"Söz vermenin, ahde vefanın önemi ve örnekleri","color":"#2E5A6B","mins":30,"paras":[{"k":"q","t":"“Sözünde durma, verdiği sözlere bağlı kalma, özü ve sözü doğru olma anlamına gelen ahde vefa, İslâm ahlâkının en önemli prensiplerinden biridir. Kur’an’a göre ahde vefa, iman ederek Allah [celle celaluhu] ile ahidleşmiş ve böylece kendisini hür iradesiyle kendisini sadakat yükümlülüğü altına sokmuş olan müminin ahlâkî bir borcudur."},{"k":"p","t":"İster insanlara, ister Allah’a [celle celaluhu] karşı verilmiş olsun her ahid ve söz, yükümlülük şartlarını taşıyan her insanı borçlu ve sorumlu kılar. Bu sorumluluğun yerine getirilmesine ahde vefa veya ahde riayet denilir."},{"k":"p","t":"Ahdin (sözleşmenin) gereğine uymak vaciptir."},{"k":"p","t":"Yüce Allah [celle celaluhu] bir ayet-i kerimede şöyle buyurmuştur:"},{"k":"ar","t":"وَبِعَهْدِ اللّٰهِ اَوْفُواۜ"},{"k":"q","t":"“Allah’ın ahdini yerine getiriniz.”"},{"k":"p","t":"Tefsirlerimize göre Allah’ın [celle celaluhu] ahdi, Allah’ın [celle celaluhu] bize teklif etmiş olduğu ahitler, emirler, nehiyler ve aynı zamanda bizim Allah’a [celle celaluhu] veya Allah [celle celaluhu] adına başkalarına verdiğimiz sözler, adaklar, yeminler, akitler demektir. Dolayısıyla Kur’an’ın bu ayetine göre dinimizde ahdi bozmak haramdır."},{"k":"p","t":"Vefa ise verilen söze uymak ve gereğini yapmak demektir. Verilen söze uymamak ise vefasızlıktır. Vefalı davranan kimseye “vefakâr” denir."},{"k":"p","t":"En büyük vefakârlık ise Allah’ı [celle celaluhu] tanımak ve Allah’a [celle celaluhu] verilen iman ve ibadet sözünü ifa etmektir. En büyük nankörlük kulun rabbini inkâr etmesidir."},{"k":"p","t":"Resûlullah Efendimiz [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Ahdin güzelliği (verilen sözün yerine getirilmesi) imandandır.”"},{"k":"q","t":"“Güvenilir olmayan kimsenin imanı, ahde vefası olmayan kimsenin de dini yoktur.”"},{"k":"h","t":"İlk Ahid"},{"k":"p","t":"Ahde vefanın en önemlisi ve en birincisi “Bezm-i Elestte” Allah’a [celle celaluhu] verilen sözdür. Bu sözü Kur’an-ı Kerim’de yüce Allah [celle celaluhu] bizlere şöyle hatırlatır:"},{"k":"ar","t":"وَاِذْ اَخَذَ رَبُّكَ مِنْ بَنِٓي اٰدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَاَشْهَدَهُمْ عَلٰٓى اَنْفُسِهِمْۚ اَلَسْتُ بِرَبِّكُمْؕ قَالُوا بَلٰىۚۛ شَهِدْنَاۚۛ اَنْ تَقُولُوا يَوْمَ الْقِيٰمَةِ اِنَّا كُنَّا عَنْ هٰذَا غَافِلِينَۙ ۞"},{"k":"q","t":"“Ve o zaman ki, Rabbin Âdemoğullarından, onların sırtlarından zürriyetlerini aldı. Ve onları kendi nefisleri üzerine şahit tuttu. “Ben sizin Rabbiniz değil miyim?” Dedi, onlar da evet, şahidiz dediler. “Bu da kıyamet günü biz bundan muhakkak ki, gafiller idik” dememeniz içindir.”"},{"k":"p","t":"İmam-ı Azam (rahmetullahi aleyh) şöyle der:"},{"k":"q","t":"“Allah Teâlâ [celle celaluhu] Hz. Âdem’in [aleyhisselâm] zürriyetini, küçük karınca şekli üzerinde, Hz. Âdem’in [aleyhisselâm] neslinden yaratmış, onlara akıl vererek hitap etmiş, emir ve yasaklarda bulunmuştur. O’nun Rableri olduğunu ikrar etmişlerdir. Kulların bu ikrarları iman olmuştur. Bu sebeple bütün kullar, bu iman fıtratı üzerine doğarlar”"},{"k":"p","t":"Allah [celle celaluhu], İsrailoğullarına hitaben bütün insanlığa şöyle ikaz buyuruyor:"},{"k":"ar","t":"يَا بَنٓيِ اِسْرَٓاءِيلَ اذْكُرُوا نِعْمَتِيَ الَّتٓيِ اَنْعَمْتُ عَلَيْكُمْ وَاَوْفُوا بِعَهْدِٓي اُوفِ بِعَهْدِكُمْ وَاِيَّايَ فَارْهَبُونِ ۞"},{"k":"q","t":"“Ey İsrail oğulları! Size verdiğim nimetlerimi hatırlayın, bana verdiğiniz sözü yerine getirin ki, ben de size vadettiklerimi vereyim. Yalnızca benden korkun.”"},{"k":"p","t":"Diğer ayet-i kerimelerde de şöyle buyrulmuştur ki bu işin ciddiyetini belirtir:"},{"k":"ar","t":"يَٓا اَيُّهَا الَّذِينَ اٰمَنُٓوا اَوْفُوا بِالْعُقُودِۜ"},{"k":"q","t":"“Ey iman edenler! Akitleri yerine getiriniz.”"},{"k":"ar","t":"وَاَوْفُوا بِالْعَهْدِۚ اِنَّ الْعَهْدَ كَانَ مَسْؤُ۫لاً"},{"k":"q","t":"“Verdiğiniz sözü de yerine getirin. Çünkü verilen söz, sorumluluğu gerektirir.”"},{"k":"p","t":"Müslüman şu ayet-i kerimelerde buyrulduğu gibi olmalıdır:"},{"k":"ar","t":"وَالَّذِينَ هُمْ لِاَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَۙ ۞"},{"k":"q","t":"“Yine onlar (o müminler) ki, emanetlerine ve ahidlerine riayet ederler.”"},{"k":"p","t":"Hadis-i şeriflerde şöyle buyrulmuştur:"},{"k":"q","t":"“Bir kavim ahdinden dönerse Allah onlara düşmanları musallat eder”"},{"k":"q","t":"“Beş şey toplumda yaygın hale gelirse artık o toplumda hiçbir hayır kalmamıştır. Bunlar: Zinanın yaygın olması, Ölçü ve tartıda hile yapılması, Zekât ile yardım edilmemesi, Ahitlerin ifa edilmemesi, Allah’ın kitabı ile adalet üzere hükmedilmemesi”"},{"k":"p","t":"Abdullah bin Ebü’l-Hamsa (radıyallahu anh) anlatıyor:"},{"k":"q","t":"“Peygamber olmadan önce Resûl-i Ekrem’e [sallallahu aleyhi vesellem] alış-verişle ilgili bir şey vermek için filan gün filan yerde buluşmak üzere sözleştik. Fakat ben unuttum, ancak üçüncü gün hatırladım. Gittim baktım ki, Resûl-i Ekrem [sallallahu aleyhi vesellem] orada bekliyor. Beni görünce:"},{"k":"q","t":"“Delikanlı beni yordun. Üç günden beri seni burada bekliyorum” buyurdu.”"},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Hz. Ömer (radıyallahu anh) arkadaşlarıyla sohbet ederken, huzura üç genç girerler, derler ki:"},{"k":"p","t":"- Ey halife bu aramızdaki arkadaş bizim babamızı öldürdü ne gerekiyorsa lütfen yerine getirin. Bu söz üzerine Hz. Ömer (radıyallahu anh) suçlanan gence dönerek:"},{"k":"p","t":"- Söyledikleri doğrumu diye sorar. Suçlanan genç der ki evet doğru bu söz üzerine Hz. Ömer (radıyallahu anh):"},{"k":"p","t":"- Anlat bakalım nasıl oldu diye sorar. Bunun üzerine genç anlatmaya başlar, der ki:"},{"k":"p","t":"- Ben bulunduğum kasaba hali vakti yerinde olan bir insanım ailemle beraber gezmeye çıktık kader bizi arkadaşların bulunduğu yere getirdi. Hayvanlarımın arasında bir güzel atım var ki dönen bir defa daha bakıyor hayvana ne yaptıysam bu arkadaşların bahçesinden meyve koparmasına engel olamadım. Arkadaşların babası içerden hışımla çıktı atıma bir taş attı atım oracıkta öldü. Nefsime bu durum ağır geldi, ben de bir taş attım babası öldü, kaçmak istedim, fakat arkadaşlar beni yakaladı, durum bundan ibaret, dedi."},{"k":"p","t":"Bu söz üzerine Hz. Ömer (radıyallahu anh) söyleyecek bir şey yok bu suçun cezası idam, madem suçunu da kabul ettin. Bu sözden sonra delikanlı söz alarak:"},{"k":"p","t":"- Efendim bir özrüm var. Ben memleketinde zengin bir in
