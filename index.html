e beraber olmaktır. Tasavvufun başı şer‘-i şerife uymak, sonu ise mâsivadan yüz çevirip Allah Teâlâ’dan gayrısına gerek duymamaktır."},{"k":"p","t":"Tasavvuf, yakîn makamlarının tamamlayıcısıdır. Faydası büyük olup zâhir ve bâtını imar eder. Allah Teâlâ ile ünsiyeti gerçekleştirir, O’nun rızasını elde etmeye vesile olur. Kalpleri kirlerden temizler, nefisleri kötü davranışlardan tezkiye eder."},{"k":"p","t":"Bu nedenle tasavvuf, âzalarla yapılan amellerden daha mühim olan kalp amelleri ile ilgilenir. Zira bâtın, zâhirin esası ve kaynağıdır. Bâtının bozulması, zâhirin bozulmasına sebep olur. Bununla beraber kalp amelleri, şeriatın zâhirine bağlıdır."},{"k":"p","t":"İbn Hacer-i Heytemî’nin (rahmetullahi aleyh) naklettiği gibi:"},{"k":"q","t":"“Kalple işlenen günahlar, dış azalarla işlenen günahlardan daha tehlikelidir. Çünkü onlar, sonuçta imanı zedeler, ibadetin kabul edilmesini engeller, amellerin sevabını yok eder. Gizli günahların çoğu insanı şirke sürükler, nifaka bulaştırır, dinden bile çıkarır. Ayrıca kalpte yer eden gizli günahlar, devamlıdır, her zaman insanı tehlikeye sokar. Zahiri günahlar ise böyle değildir.”"},{"k":"p","t":"Tasavvufun ana konusu, batınî fıkıhtır. Batınî fıkıh, insanın iç âlemini oluşturan kalp, ruh, nefis ve diğer latifelerin tezkiye, terbiye, terakki ve inkişaflarını hedefleyen mânevî, nuranî, kalbî bir ilimdir."},{"k":"p","t":"Zahirî fıkıh vücudumuzun dış azaları ile yapacağı ibadet ve vazifeleri inceleme konusu yaptığı gibi, batınî fıkıh diyebileceğimiz tasavvuf da kalple ilgili ibadet ve ahlakları temel konusu yapmıştır."},{"k":"p","t":"Tasavvufun hedefi, kalbin ihsan mertebesine ulaşmasıdır. İhsan, kalbin gafletten uyanması ve mânevî kirlerden arınması sonucu yakin haline ulaşır. Yakin, kalbin Cenâb-ı Hakk’ı görüyor gibi bir şuur ve hassasiyete sahip olması demektir. Bu hal, her mümin için bir hedeftir."},{"k":"p","t":"Zira Rasulullah Efendimiz’in [sallallahu aleyhi vesellem] işaret ettiği gibi din; iman, İslâm ve ihsandan oluşmaktadır. Din imanla başlamakta, ibadetlerle tamamlanmakta, ihsanla olgunluğa ulaşmaktadır."},{"k":"p","t":"İnsanın kemâline mâni olan düşmanları başında nefis, şehvet ve şeytanı gelir. Allah Teâlâ bizlere, nefsin terbiye edilmediği takdirde insanları kötülüklere sevkettiğini ve şeytanın da apaçık bir düşman olduğunu bildirmektedir."},{"k":"p","t":"Terbiye etmekle yükümlü olduğumuz, bu sebeple mahşerde birinci derecede sorumlu bulunduğumuz ve her an şerrinden Allah’a sığınmayı istemeye mecbur olduğumuz içgüdümüz nefsimizdir. Nefsi terbiye etmenin iki temel yolu vardır. Bunlardan biri nefsin gücünü kuvvetini azaltmakla, diğeri ise zikre kuvvetle yönelip aşkın, şevkin, muhabbetin, Allah Teâlâ’ya yönelmesiyle olur."},{"k":"p","t":"Bunun için de nefsi, dinin edepleri ile edeplendirmek ve onu haramlardan sakındırmak gerekir. O zaman Allah kalbe nur indirir ve o kalp huzur bulur. Kalbin ferahlığa yürüdüğü bu yolda muhakkak ki nefse zor gelen şeyler olacaktır. Bu durumda kişi, sıkıntılara sabrederek nefsinin muhalefet edip kalbini Allah Teâlâ’ya teveccüh etmelidir. Böyle yapan kimse; gaflet perdesini yırtar, günah işlemeyi bırakır, ibadetlerden lezzet alır. Nefsini terbiye edenin Allah’a muhabbeti, insanlara sevgi ve merhameti çoğalır."},{"k":"p","t":"İnsan-ı kâmil olma yolunda kişinin manevi terbiyesi nefsi bilmekten geçer. Molla Câmî hazretleri [kuddise sırruhû] Nefehâtü’l-Üns adlı eserinde şöyle buyurur:"},{"k":"p","t":"“Marifet-i ilâhiye dört şeyi bilmekle mümkündür:"},{"k":"li","m":"1.","t":"Nefsini bilmek"},{"k":"li","m":"2.","t":"Dünyayı bilmek"},{"k":"li","m":"3.","t":"Ahireti bilmek"},{"k":"li","m":"4.","t":"Allah’ı bilmek"},{"k":"p","t":"Kişinin hikmete kavuşabilmesi için önce nefsinin farkında olması gerekir. Nitekim Hz. Resûlullah [sallallahu aleyhi vesellem] bir hadis-i şeriflerinde şöyle buyurmuştur:"},{"k":"q","t":"“Nefsini tanıyan Rabb’ini tanır.”"},{"k":"p","t":"Takva ve edebin kaynağı mârifetullahtır yani Allah’ı [celle celâluhû] tanımaktır. Mârifetullah, bütün ilimlerin yerine geçer. Ona sahip olan kimse, her ilmin özünü ve hedefini elde etmiş olur. Diğer ilimler ise mârifetullahın yerine geçemez. Zengin-fakir, erkek-kadın bütün mükellefler mârifetullah ilmine muhtaçtır. Çünkü Rabb’ini tanımayan kimse O’nu sevemez, sevemeyen de temiz kulluk edemez."},{"k":"p","t":"Mârifetullahın sonu muhabbetetullaha uzanır. Muhabbetullaha mazhar olan kişi fenâ ve bekâ mertebelerine nail olur. Bu makamlarla gönül, aşk ve şevkte yüksek makamlara ulaşır."},{"k":"p","t":"Herkesin nasibince yararlandığı seyru süluk insanın ihlâsına vesiledir, bu da tasavvufî hayatla yani Allah’ı [celle celâluhû] çokça zikredip, takvalı yaşamla elde edilir."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdulbaki El-hüseyni Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Şeriatsız tarikat olmaz. Bir evin yapımında temeli için kullanılan demir ve beton eksik olursa bina sağlam olmaz, çabuk çöker. Tarikatın temeli de şeriattır. Temeli sağlam olmayan tarikat ehli de çabuk yoldan çıkar.”"},{"k":"p","t":"Her yüce ahlâkta ve övülmüş sıfatta en üstün örnek, beşeriyetin efendisi Hz. Muhammed Mustafa’dır [sallallahu aleyhi vesellem]. O, her şeyde tam bir örnek teşkil eder."},{"k":"p","t":"Hak Teâlâ, Resûl-i Ekrem’i [sallallahu aleyhi vesellem] terbiye etmiş ve terbiyesini en güzel şekilde gerçekleştirmiştir. O da ümmetinin her tür övülmüş huy ve olgun davranış üzere, terbiyesine büyük bir özen göstermiştir."},{"k":"p","t":"Kur’an ve Sünnet ahlâkını yaşayan salih kullar geçmişte de günümüzde de güzel ahlâkta birer örnektirler. Bu onların hayatında ve yaşantılarında açıkça görülür. Büyük velî Hamdûn el-Kassâr [kuddise sırruhû] şöyle der:"},{"k":"q","t":"“Geçmiş büyüklerin ahlâk ve yaşantılarını inceleyen, kendi kusurlarını anlar ve büyüklerden geri kalma sebeplerini öğrenir. Ashâb-ı kirâmın, selef-i sâlihinin, velilerin hayat hikâyelerini okumak, insanın iyiliğe yönelmesine ve iyi huylu olmasına sebep olur.”"},{"k":"p","t":"Âriflerin her hali bir nasihattır, öğüttür. Onlar kimseyi kırmazlar, incitmezler ve tek arzuları Allah Teâlâ’ya teveccüh üzere yaşamaktır."},{"k":"p","t":"Mevlana Gavs-ı Nizam Hazretleri [kuddise sırruhû] buyurmuştur ki:"},{"k":"q","t":"“Tasavvuf ve tarikat güzel ahlâktan ibarettir. Hz. Peygamber’in [sallallahu aleyhi vesellem] uyguladığı terbiye sisteminin tâ kendisidir. Allah Teâlâ, ilâhî terbiyenin merkezine onu koymuştur. Onun sünnetine uymayan kimse, nefsiyle bin yıl mücâhede ve mücadele etse bile terbiye olamaz, bir başkasını da terbiye edemez.\""},{"k":"h","t":"İnsan Kendiliğinden Yetişmez"},{"k":"p","t":"Kâmil bir mürşide intisap etmek gereklidir. Zira insan kendiliğinden yetişmez. Nitekim ârifibillâh Şeyh Ebû Ali ed-Dekkâk [kuddise sırruhû], mürşidin lüzumuna işaret ederek şöyle demiştir:"},{"k":"q","t":"“Bir başına bakımsız olarak kendiliğinden biten ve yetişen ağacın meyvesi olmaz. Meyvesi olsa da tatsız olur, lezzetli olmaz. Her şeyin bir sebebe bağlı olmasının gerekliliği, Allah Teâlâ’nın değişmez kanunudur. Zira O, her şeyi bir sebebe bağlamıştır. Zâhirî doğum ve çoğalma, anne ve babasız mümkün olmayacağı gibi, manevi doğum denilen marifet de kâmil mürşidin terbiyesine girmekle gerçekleşir, kendiliğinden gerçekleşmez.”"},{"k":"p","t":"Zâhirî ilimleri tahsil etmek, insanın bâtın ilmini tahsil etme ihtiyacını ortadan kaldırmaz, mutlaka bâtın ilminin de tahsil edilmesi gerekir. Nitekim geçmişten günümüze bu yolun büyüklerden birçok âlim, zâhir ilmini tahsil ettikten sonra, bâtın ilmini, terbiye yoluyla tahsilin zaruretine inanmışlar ve bu yolun sâliklerinden olmuşlar. Onlar, zâhirî ilimlerle yetinmeyip, bâtınî ilmi gerçekleştirmek gayesiyle, mürşidlerin manevi terbiyelerine girmişlerdir."},{"k":"p","t":"İmam Gazâlî [kuddise sırruhû], tasavvufa yönelişini ve seyrü sülûk yolundaki zevki tattıktan sonra durumunu şu şekilde dile getirmektedir:"},{"k":"q","t":"“Kesin olarak anladım ki sûfîler hakikaten Allah yolunu bulan kimselerdir. Onların gidişleri, gidişlerin en güzeli; gittikleri yol, yolların en doğrusu; ahlâkları ahlâkların en temizi ve en güzelidir. Şayet dünyadaki bütün akıllı insanların akılları, hikmet sahiplerinin hikmetleri, şeriatın bütün teferruatını bilen zâhir ulemasının ilimleri, onların gidişat ve ahlâkından bir şey değiştirmek ve yerine daha iyisini koymak üzere bir araya gelseler, buna muvaffak olamazlar. Çünkü onların zâhir ve bâtınlarındaki hareket ve duyguların hepsi, nübüvvet kandilinin nurundan alınmıştır. Yeryüzünde ise nübüvvet nurundan başka hidayet rehberi, nur kaynağı yoktur.”"},{"k":"p","t":"Tasavvufun gayesi Allah’ın rızasını kazanmaktır. Evliyaullahın yanında bulunanlar günahlardan sakınıp işlerini hayra çevirirler. Çünkü salihlerin meclislerinde Rabbü’l- âlemin’in ihsan ve bereketi vardır."},{"k":"p","t":"Bâyezîd-i Bistâmî’nin [kuddise sırruhû] yanına gelen bir derviş, “Beni Allah’a yaklaştıracak bir amel tavsiye et” deyince Bâyezîd [kuddise sırruhû] ona şu nasihatte bulunmuştur."},{"k":"q","t":"“Allah Teâlâ’nın velî kullarını sev! Sev ki onlar da seni sevsinler. Onların gönlüne girmeye çalış! Çünkü Allâh, o âriflerin kalblerine her gün 360 defa nazar eder. Onlardan birinin kalbinde senin adını görürse, seni bağışlar.”"},{"k":"h","t":"Mürşidin Görevi"},{"k":"p","t":"Mürşid, insanlığın irşadı ve kurtuluşu için görevlendirilmiş velidir. O, insanları karanlıktan aydınlığa, dalâletten hidayete, cehaletten ilme sevkeden kâmil bir insandır. Yoldan haber verir, rehberliği ile yolumuzu aydınlatır."},{"k":"p","t":"Tasavvuf yolu, kulu terbiye eden ve kalbi manevi kirlerinden arındıran bir yoldur. Bu arındırmanın Kur’ân-ı Kerîm’deki adı “tezkiye”dir. Gerçek manada insanları tezkiye eden ise yüce Allah’tır. Nitekim, “Eğer Allah’ın size lutfu ve merhameti olmasaydı, sizden hiçbiriniz asla temize çıkamazdı. Fakat Allah, dilediği kimseyi tertemiz kılar” (Nûr Suresi, 21) buyrulmaktadır. Allah Teâlâ, tezkiye için birçok peygamber ve veli göndermiştir."},{"k":"p","t":"Nitekim büyük müfessir İsmall Hakkı Bursevî [kudduse sirruhu] bu âyeti tefsir ederken şöyle demiştir: “Tezkiye ve kalbi arındırma işi Allah’ın takdiridir. O dilediği kimsenin kalbini temizler, tezkiye eder ve mâsivadan arındırır. Çünkü Allah Teâlâ, fazl ve keremiyle rahmet ve merhameti ile kulunu itaatine muvaffak kılar ve bunun için sebepler halk eder. Fakat Allah’ın muradına göre bu manevi temizliğin nasıl olacağını insana gösteren bir mürşid gereklidir. Hiç şüphesiz insanları Allah’a ulaştıran en büyük vesile, Hz. Resûlullah’tır [sallallahu aleyhi vesellem]. Ondan sonra irşadla görevli ârifler gelir. Bunun içindir ki Şeyhülislâm Abdullah el-Ensârî [kudduse sirruhu] şöyle demiştir: ‘Hadis ve şeriat ilminde birçok üstadım olmuştur. Tarikattaki mürşidim ise Şeyh Ebü’l-Hasan el-Harakânî’dir [kudduse sirruhu]. Eğer kendisini görüp irşad halkasına katılmasaydım, hakikati tanıyamazdım.’ Demek ki irşad ehli mürşid-i kâmiller, hidayet yolunda rehberdirler. Kâmil bir insanı bulup ona teslim olmak, en büyük ganimet ve onun meclisine katılmak bulunmaz bir nimettir.”"},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Sâdâtları ziyarete gelirken trafik kazası geçiren ve hanımı kaybeden bir sûfî, Gavs-ı Cihan Şeyh Seyyid Abdulbaki El-hüseyni Hazretlerine [kuddise sırruhû] maruzatı olduğunu söyleyip (kendi evladını kastederek),"},{"k":"li","m":"•","t":"Efendim, evladınız ne yazık ki namazını kılmıyor. Başını da örttüremiyoruz. Bunları şikâyet için söylemiyorum ama ne yaptıysak olmadı, nasihatler kâr etmedi. Sâdâtın duasından başka çaremiz kalmadı, dedi. Gavs-ı Cihan Hazretleri [kuddise sırruhû]:"},{"k":"li","m":"•","t":"Sûfî, biz dua edeceğiz. İnşallah iyi olacak, deyip kızının tövbe alıp almadığını sordu sofiye. Sûfî tövbe almadığını söyleyince de,"},{"k":"li","m":"•","t":"Ona görevli birinden tövbe aldırın, buyurdu."},{"k":"p","t":"Sâdâtların yanında birkaç gün geçiren sûfî, memleketine döndüğünde kızını tesettürlü bir halde görünce oldukça şaşırdı. Yakînen anladı ki Allah’ın katında sâdâtların kıymeti çok fazladır. Sûfî, kızına tesettüre bürünüp namaza başlamasının hikmetini sorunca kızı,"},{"k":"li","m":"•","t":"Üç gün önce annemi rüyamda gördüm. Bana nasihat etti. Sâdâtları anlattı. Dünya hayatının geçici olduğunu söyledi. Anneme, “Bana öbür âlemi anlatır mısın?” dediğimde de, “Buranın güzellikleri anlatmakla bitmez. İnsanın aklı hayali almaz. Sizin dünyada güzel dediğiniz şeylerin burada hiçbir kıymeti yok. Mukayese dahi edilemez. Kızım, dünya hayatı nokta gibidir. Asıl hayatsa burada başlıyor” dedi. Hazır annemi bulmuşken sarıldım, “N’olur beni bırakıp da gitme diye ağladım” ama annem, “Bana bu kadar müsaade verildi kızım” deyip gözden kayboldu, dedi."},{"k":"p","t":"Salihler Allah Teâlâ tarafından mahfuz kılınmışlardır. Onların gönüllerinde mâsivâ yoktur, kibir ve haset de kalplerinden silinmiştir. Evliyaullahla ünsiyet eden kimsenin de gönlü temizlenir, bâtınî ve zâhirî işleri kolaylaşır."},{"k":"p","t":"Salihler Hak Teâlâ’ya âşıktırlar ve onların yanında olan kimseler de âşıklık meşrebine bürünürler. Evliyaullah, meclislerinde bulunanlara âşıklığın vefasını ve sadakatini aşılarlar."},{"k":"p","t":"Kişinin tasavvuf ilmini yani mârifet ilmini öğrenmesi lazımdır. Çünkü bu ilim, insana Allah’ı tanıtır, öğretir ve anlatır. Her mümine, sahih iman ve düzgün ibadet farz olduğu gibi kalp temizliği, nefs terbiyesi ve güzel ahlâk da farzdır. Kişi dünyaya olan ilgi ve alakasını kesip nefsâni istek ve arzularından kurtulduğunda kalbi ve ruhu feraha kavuşur."},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Bir insan Allah dostunun ahlâkıyla ahlâklandığı zaman hiç kimse ona kızmaz, ters bakamaz. Asıl gaye, nefsin kırılmasıdır. İnsan nefsini ayaklar altına almazsa kemalata eremez. Eğer bir kişi, “Sûfî olayım” diyorsa nefsin peşini bırakması, nefsini terbiye edip onun hilelerine aldanmaması lazımdır. Ama ne yaparsak yapalım, nefis daima peşimizdedir; o hiçbir zaman bizim iyiliğimizi istemez. O halde onu terbiye etmek gerekir. Nefsin terbiyesi de bir mürşid-i kâmilin elini tutmakla, onun terbiyesinde yetişmekle mümkün olur. İnsanın mutlaka bir mürşid-i kâmile ihtiyacı vardır.”"},{"k":"p","t":"İnsanlara tasavvuf eğitimi veren bütün tarikatlar, müridi Allah’a ulaştırma esasına dayanır. Aralarındaki fark sadece insanı Allah’a kavuşturmakta izlenen metotlarda görülür. Nakşibendî yolunun büyüklerinde görülen metotlar, müride en kolay ve en uygulanabilir olan tasavvufî eğitim olarak görülmektedir. Zira Nakşibendî yolunun büyükleri olan sâdât-ı kirâm, müridlerini Allah’a kavuştururken onları tevhid mertebelerinin en yüce olanına ulaştırırlar."},{"k":"p","t":"Nakşibendî yolunun pîri Şah-ı Nakşibend hazretleri [kuddise sırruhû], “Bizim usulümüz, halkın içinde Cenâb-ı Hak ile beraber olmaktır. Yolumuz sohbet yoludur. Halvette (halktan kaçmakta) şöhret, şöhrette ise âfet vardır. Hayır ve bereket; cemiyette, halkın içinde bulunup bir araya gelmektedir” buyurarak bu yolu tercih eden bir müridin uyması gereken usul ve meşrebi belirtmişlerdir.”"},{"k":"h","t":"Tasavvuf Kalp Amelleri İle İlgilenir"},{"k":"p","t":"Hz. Resûlullah [sallallahu aleyhi vesellem] hadis-i şeriflerinde şöyle buyurmuştur:"},{"k":"q","t":"“Dikkat edin! İnsanın bedeninde bir et parçası vardır ki o iyi ve sağlam olursa bütün beden sağlam olur. O bozuk olursa bütün beden bozuk olur. Bilesiniz ki o, kalptir.”"},{"k":"p","t":"Kur’ân-ı Kerîm’de ve hadislerde kalbin mahiyeti ve tarifi üzerinde değil, işlevleri ve nitelikleri üzerinde durulmuştur. Kur’an ve hadiste geçen kalp kelimesi insanın anlama, kavrama, düşünme yönünü, başka bir ifadeyle insanı insan yapan ve diğer canlılardan ayıran temel özelliğini dile getirir. İnsanın idrak eden, bilen ve kavrayan tarafı olduğu için kalp ilâhî hitaba muhataptır, yükümlü ve sorumludur."},{"k":"p","t":"Kalp ruhun sarayı, insanın aslıdır. İnsanı kalbi temsil eder çünkü insana ait özellikler kalpte toplanmıştır. İçine nur inmeyen kalp, aslî safiyetini kaybeder ve asıl görevini yapamaz hale gelir. Bu defa kalp, hasta olur ve inkârın, isyanın, cehaletin ve kötü ahlâkların merkezi durumuna gelir."},{"k":"p","t":"Kalp günah işlendikçe zayıflar, kirlenir, katılaşır ve tedavi edilmezse de ölür. Üzerine perde çekilir, hak ile batılı ayırt edemez ve felâkete düşer. Kalp vücudu temsil ettiği için kalbin iyi ve kötü durumu bütün organları etkiler."},{"k":"p","t":"Müminin bu âlemde kalbinden başka sermayesi yoktur. Akıl ve idrak ehli kimse kalbini ihmal etmez, onun terbiyesini basite almaz ve kalbini sadece Allah Teâlâ’nın sevgisi ile doldurur. Kalbinin zarar ve ziyana düşmesinden korkan kimse tefekkür ile hareket edip her an pişmanlık ve nedâmet üzere yaşar."},{"k":"p","t":"Bu yüzden Allah Resûlü [sallallahu aleyhi vesellem], ashabının dikkatini kalplerini ıslah etmeye yönlendirmiş ve onlara Cenâb-ı Hakk’ın kullarının kalplerine nazar ettiğini öğretmiştir."},{"k":"h","t":"Tasavvuf Terbiyesinde Zikrin Önemi"},{"k":"p","t":"Tasavvufta seyir, cehaletten ilme, kötü huylardan güzel huylara, kendi varlığından geçip Hakk’ın varlığına doğru harekettir. Sülûk ise Rabbü’l âlemin’e kavuşmak için bir rehberin öncülüğünde çıkılan manevi yolculuktur."},{"k":"p","t":"Seyr-i sülûktan murat, kulun kendini ve Rabb’ini tanımasıdır. Gafletten uyanıp insanî sıfatlara doğru adım atarak hedefe doğru yol almasıdır. Nitekim zikir insanı kemâle ulaştırır ve sırât-ı müstakîm yoluna bağlar."},{"k":"p","t":"Zikir, nefsin manevi terbiyesidir. İnsanı gaflet hastalığından kurtaran en tesirli yoldur. Tasavvufta hedef, kalbi gafletten uyandırıp yüce Allah’a bağlayarak ebedî huzuru elde etmektir. Bunun en kolay yolu, kalbi devamlı zikirle meşgul etmektir. Zikir, kalbi yüce Allah’a bağlayan en kısa, en kolay menzildir."},{"k":"p","t":"Zikrin en büyük fazileti, zikreden kulu, Cenâb-ı Hakk’ın özel olarak huzurunda zikretmesidir. Zira zikrin mukabili zikirdir. Allah Teâlâ âyet-i kerimede şöyle buyurmuştur:"},{"k":"ar","t":"فَاذْكُرُونٓيِ اَذْكُرْكُمْ"},{"k":"p","t":"“Taat ve ibadetle beni anın ki ben de sizi mağfiretle (bağışlayarak) anayım.” (Bakara Suresi, 152)."},{"k":"p","t":"Büyük müfessir Fahreddin Râzî [rahmetullahi aleyh] der ki: “Kul ancak diliyle zikir, âzalarıyla şükür kalbiyle fikir içinde kaybolup bütün varlığı ile devamlı Allah’a kulluk yaptığında gerçek insan olur.”"},{"k":"p","t":"Kalbinde; dünya sevgisi, kibir, haset, riya, gaflet, makam hırsı, ihanet gibi şeytanî özellikler bulunan kimse, Allah yolunda bir rabbânî âlimin, bir mürşid-i kâmilin elinden tuttuğu zaman, önce kalbinin bu kötülüklerden temizlenmesi hedeflenir. Zira ilâhî huzurda kabul görmek ve Allah Teâlâ tarafından sevilmek, kalbin bütün kötülüklerden tamamen temizlenmesine bağlıdır. Sonra güzel ahlâk ile donatılmak gelir. Manevi seyir, sefer ve ilâhî huzurda kabul görmek ancak bundan sonra olur."},{"k":"p","t":"Bu mübarek yolda kalbin temizlenmesi için en tesirli ilaç, mürşid-i kâmilin nazarı ve onun nezareti altında yapılan zikirdir. Gafletten uzak yapılan zikir, zikreden kimseyi Rabbine yaklaştırır."},{"k":"p","t":"Yüce Allah bir kuluna ikram ettiğinde, ya ona vehbî bir cezbe verir ya da onu razı olduğu şeylere yönlendirerek ilâhî cezbeye ulaştırır. Veyahut kâmil (kemale ermiş) ve mükemmil (başkasını kemale erdiren) bir şeyhin eli altında terbiye görmesini sağlar. Mürşid, müride başta bahsedilen nuranî letâif üzerinde zikir yapmasını telkin eder. Bu zikirlerin devamı ile nefsin karanlık ve kasveti bu letâiften giderilir."},{"k":"p","t":"Şah-ı Nakşibend [kuddise sırruhû] “Bizim terbiye yolumuz sohbet üzerine kuruludur. Hayırlar, Allah için salih insanlarla beraber olmadadır. Onlarla sohbete devam ede ede hakiki imana kavuşmak nasip olur” buyurmuştur."},{"k":"p","t":"Nitekim ahirette iyilerle beraber olabilmek için, dünyada da onlarla beraber olmak, onları sevmek, onların yolundan gitmek gerekir."},{"k":"p","t":"Onbir kandilden biri olan Nigâhdâşt (Teveccühü gözetmek): Tasavvuf terbiyesinde maksat, usulüne uygun yapılan devamlı zikirle kalbi beytullah kılmaktır. Bu nedenle zikrullahtaki feyiz ve devamlılığı korumaya yönelik esaslar konmuştur. Bunlardan biri olan “nigâhdâşt”, mâsivâya yönelmemesi için bakışımızı, yani ilgi ve teveccühümüzü kontrol altında tutmak demektir."},{"k":"p","t":"Devamlı zikir halinde bulunmanın mümine kazandırdığı meziyeti Seyyid Muhammed Raşid hazretleri [kuddise sırruhû] bir sohbetlerinde söyle dile getirmiştir:"},{"k":"q","t":"\"Nakşibendilik’te esas olan insanın kalbidir. Yapılacak zikir ise kalbin ıslahı ve çalışması içindir. Çalışmaya başlayan bir kalp aynen saate benzer, sahibi başka işlerle meşgul olsa bile o saat gibi çalışmasına devam eder. Şayet saat çalışmıyorsa sahibine bir fayda temin etmez. Aynı zamanda kalbi çalışanın durumu, dükkanı dolu olup kazancı çok olan kimseye benzer ki çalışmaya başlayan kalbi, her vakit devamlı olarak Allah'ın zikriyle meşgul eder. Bir saniye, bir dakika bile boş durup gafil olmaz. Kalbi zikirden boş olanın durumu da dükkanı boş olana benzer. Kalbi bir dakika zikrederse geri zamanı boş geçer, haliyle kendisine de bir dakikalık zikir yazılır.\""},{"k":"p","t":"Gavs-ı Cihan [kuddise sırruhû] hazretleri şöyle buyurmaktadır:"},{"k":"q","t":"“Sofi üç gün zikir çekmese kalbi hasta olur. Beş-on gün, bir-iki, üç ay, dört ay zikir çekmezse kalbi (iyice) hasta olur ve ölür. Zikir kalbin hakkıdır.”"},{"k":"p","t":"Allahu Teala bizi ve tüm ümmeti terbiye olan kullarından eylesin. günahlardan uzak durup, nefsini ıslah edecek ibadet ve taatle meşgul olan kimselerden eylesin. Dünya ve ahirette salih kulları ile beraber eylesin. Amin"},{"k":"ar","t":"و اخر دعوانا أن الحمد لله رب العالمين"}],"mins":15,"cat":"Tasavvuf ve Zikir"},{"id":"tasavvuf-ve-terbiye","title":"Tasavvuf ve Terbiye","sub":"Sohbet notu","desc":"Nefis terbiyesi, mürşide bağlılık ve zikrin yolu","color":"#4A5D8A","mins":20,"paras":[{"k":"ar","t":"قَدْ اَفْلَحَ مَنْ زَكّٰيهَا ۞ وَقَدْ خَابَ مَنْ دَسّٰيهَاۜ"},{"k":"q","t":"“Nefsini günahlardan (Allah’a ortak koşmaktan, ibadetsizlikten, kötü duygu ve fiillerden vb.) arındırıp ıslah ederek ibadet ve taatle meşgul olan kimse kurtuluşa ermiştir. Nefsini saptırıp helâk ederek kötülüklere gömen kimse de ziyana ve hüsrana uğramıştır.” (Şems 91/9-10)."},{"k":"p","t":"Allah Teâlâ bu âyet-i kerimede kurtuluşu ve cennete girmeyi, insanın nefsini arındırmasına; ziyanı ve cehenneme girmeyi ise arındırmamasına bağlamıştır. Bu da nefsi tezkiye etmenin gerekli olduğunu ve insanın ancak bu sayede kurtulacağını gösterir."},{"k":"p","t":"Müslüman, Allah’a teslim olan kimse demektir. Müslüman nefsine teslim olmaz, iman ettiği Rabb’ine boyun eğer. Onun için müslüman, her zaman nefsi ile uğraşan ve onu teslim alan biri olmaldır."},{"k":"p","t":"Nefsi, dinin edepleri ile edeplendirmek ve onu haramlardan sakındırmak lazımdır. O zaman Allah kalbe nur indirir ve o kalp huzur bulur. Kalbin ferahlığa yürüdüğü bu yolda muhakkak ki nefse zor gelen şeyler olacaktır. Bu durumda kişi, sıkıntılara sabrederek nefsinin başına vurup kalbini Allah Teâlâ’ya teveccüh etmelidir. Böyle yapan kimse; gaflet perdesini yırtar, günah işlemeyi bırakır, ibadetlerden lezzet alır. Nefsini terbiye edenin Allah’a muhabbeti, insanlara sevgi ve merhameti çoğalır."},{"k":"p","t":"İnsanın kemâline mâni olan düşmanları başında nefis, şehvet ve şeytanı gelir. Allah Teâlâ bizlere, nefsin terbiye edilmediği takdirde insanları kötülüklere sevkettiğini ve şeytanın da apaçık bir düşman olduğunu bildirmektedir."},{"k":"p","t":"Terbiye etmekle yükümlü olduğumuz, bu sebeple mahşerde birinci derecede sorumlu bulunduğumuz ve her an şerrinden Allah’a sığınmayı istemeye mecbur olduğumuz içgüdümüz nefsimizdir. Nefsi terbiye etmenin iki temel yolu vardır. Bunlardan biri nefsin gücünü kuvvetini azaltmakla, diğeri ise zikre kuvvetle yönelip aşkın, şevkin, muhabbetin, Allah Teâlâ’ya yönelmesiyle olur."},{"k":"p","t":"İnsan-ı kâmil olma yolunda kişinin manevi terbiyesi nefsi bilmekten geçer. Molla Câmî hazretleri [kuddise sırruhû] Nefehâtü’l-Üns adlı eserinde şöyle buyurur:"},{"k":"q","t":"“Marifet-i ilâhiye dört şeyi bilmekle mümkündür:"},{"k":"li","m":"1.","t":"Nefsini bilmek"},{"k":"li","m":"2.","t":"Dünyayı bilmek"},{"k":"li","m":"3.","t":"Ahireti bilmek"},{"k":"li","m":"4.","t":"Allah’ı bilmek"},{"k":"p","t":"Kişinin hikmete kavuşabilmesi için önce nefsinin farkında olması gerekir. Nitekim Hz. Resûlullah [sallallahu aleyhi vesellem] bir hadis-i şeriflerinde şöyle buyurmuştur:"},{"k":"q","t":"“Nefsini tanıyan Rabb’ini tanır.”"},{"k":"p","t":"Takva ve edebin kaynağı mârifetullahtır yani Allah’ı [celle celâluhû] tanımaktır. Mârifetullah, bütün ilimlerin yerine geçer. Ona sahip olan kimse, her ilmin özünü ve hedefini elde etmiş olur. Diğer ilimler ise mârifetullahın yerine geçemez. Zengin-fakir, erkek-kadın bütün mükellefler mârifetullah ilmine muhtaçtır. Çünkü Rabb’ini tanımayan kimse O’nu sevemez, sevemeyen de temiz kulluk edemez."},{"k":"p","t":"Mârifetullahın sonu muhabbetetullaha uzanır. Muhabbetullaha mazhar olan kişi fenâ ve bekâ mertebelerine nail olur. Bu makamlarla gönül, aşk ve şevkte yüksek makamlara ulaşır."},{"k":"p","t":"Herkesin nasibince yararlandığı seyru süluk insanın ihlâsına vesiledir, bu da tasavvufî hayatla yani Allah’ı [celle celâluhû] çokça zikredip, takvalı yaşamla elde edilir."},{"k":"p","t":"Tasavvuf, kalbi Allah [celle celâluhû] ile tanıştırıp huzura kavuşturma yollarını öğreten ve bunu bizzat gerçekleştiren bir terbiye sistemidir. Kalp temizliği ve güzel ahlâk, dinin bâtınî fıkhıdır. Buna Kur’an’da takva denir. Takvaya ulaşmak için yapılan mücadeleye ise tezkiye denir"},{"k":"p","t":"Tasavvuf, nefsi arzu ve hastalıklarından temizlemek, istikamet üzere olmak, niyeti halis tutmak, edebe riayet etmek ve her an Allah Teâlâ ile beraber olmaktır. Tasavvufun başı şer‘-i şerife uymak, sonu ise mâsivadan yüz çevirip Allah Teâlâ’dan gayrısına gerek duymamaktır."},{"k":"p","t":"Tasavvuf, yakîn makamlarının tamamlayıcısıdır. Faydası büyük olup zâhir ve bâtını imar eder. Allah Teâlâ ile ünsiyeti gerçekleştirir, O’nun rızasını elde etmeye vesile olur. Kalpleri kirlerden temizler, nefisleri kötü davranışlardan tezkiye eder."},{"k":"p","t":"Nitekim Şeyh Muhammed Diyâüddin [kuddise sırruhû] bu manada, “Tarikatın gayesi, nefisleri kirlerden temizleyip tezkiye etmektir” buyurmuştur."},{"k":"p","t":"Bu nedenle tasavvuf, âzalarla yapılan amellerden daha mühim olan kalp amelleri ile ilgilenir. Zira bâtın, zâhirin esası ve kaynağıdır. Bâtının bozulması, zâhirin bozulmasına sebep olur. Bununla beraber kalp amelleri, şeriatın zâhirine bağlıdır. Nitekim Şeyh Ebû Said el-Harrâz [kuddise sırruhû], “Zâhirle çelişen her bâtın bâtıldır” buyurmuştur."},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Tarikat, şeriatın üstünde kurulmuş takva makamıdır. Şeriatsız tarikat olmaz. Bir evin yapımında temeli için kullarılan demir ve beton eksik olursa bina sağlam olmaz, çabuk çöker. Tarikatın temeli de şeriattır. Temeli sağlam olmayan tarikat ehli de çabuk yoldan çıkar.”"},{"k":"p","t":"Her yüce ahlâkta ve övülmüş sıfatta en üstün örnek, beşeriyetin efendisi Hz. Muhammed Mustafa’dır [sallallahu aleyhi vesellem]. O, her şeyde tam bir örnek teşkil eder."},{"k":"p","t":"Hak Teâlâ, Resûl-i Ekrem’i [sallallahu aleyhi vesellem] terbiye etmiş ve terbiyesini en güzel şekilde gerçekleştirmiştir. O da ümmetinin her tür övülmüş huy ve olgun davranış üzere, terbiyesine büyük bir özen göstermiştir."},{"k":"p","t":"Kur’an ve Sünnet ahlâkını yaşayan salih kullar geçmişte de günümüzde de güzel ahlâkta birer örnektirler. Bu onların hayatında ve yaşantılarında açıkça görülür. Büyük velî Hamdûn el-Kassâr [kuddise sırruhû] şöyle der:"},{"k":"q","t":"“Geçmiş büyüklerin ahlâk ve yaşantılarını inceleyen, kendi kusurlarını anlar ve büyüklerden geri kalma sebeplerini öğrenir. Ashâb-ı kirâmın, selef-i sâlihinin, velilerin hayat hikâyelerini okumak, insanın iyiliğe yönelmesine ve iyi huylu olmasına sebep olur.”"},{"k":"p","t":"Âriflerin her hali bir nasihattır, öğüttür. Onlar kimseyi kırmazlar, incitmezler ve tek arzuları Allah Teâlâ’ya teveccüh üzere yaşamaktır."},{"k":"p","t":"Mevlana Gavs-ı Nizam Hazretleri [kuddise sırruhû] buyurmuştur ki:"},{"k":"q","t":"“Tasavvuf ve tarikat güzel ahlâktan ibarettir. Hz. Peygamber’in [sallallahu aleyhi vesellem] uyguladığı terbiye sisteminin tâ kendisidir. Allah Teâlâ, ilâhî terbiyenin merkezine onu koymuştur. Onun sünnetine uymayan kimse, nefsiyle bin yıl mücâhede ve mücadele etse bile terbiye olamaz, bir başkasını da terbiye edemez.\""},{"k":"h","t":"İnsan Kendiliğinden Yetişmez"},{"k":"p","t":"Kâmil bir mürşide intisap etmek gereklidir. Zira insan kendiliğinden yetişmez. Nitekim ârifibillâh Şeyh Ebû Ali ed-Dekkâk [kuddise sırruhû], mürşidin lüzumuna işaret ederek şöyle demiştir:"},{"k":"q","t":"“Bir başına bakımsız olarak kendiliğinden biten ve yetişen ağacın meyvesi olmaz. Meyvesi olsa da tatsız olur, lezzetli olmaz. Her şeyin bir sebebe bağlı olmasının gerekliliği, Allah Teâlâ’nın değişmez kanunudur. Zira O, her şeyi bir sebebe bağlamıştır. Zâhirî doğum ve çoğalma, anne ve babasız mümkün olmayacağı gibi, manevi doğum denilen marifet de kâmil mürşidin terbiyesine girmekle gerçekleşir, kendiliğinden gerçekleşmez.”"},{"k":"p","t":"Zâhirî ilimleri tahsil etmek, insanın bâtın ilmini tahsil etme ihtiyacını ortadan kaldırmaz, mutlaka bâtın ilminin de tahsil edilmesi gerekir. Nitekim geçmişten günümüze bu yolun büyüklerden birçok âlim, zâhir ilmini tahsil ettikten sonra, bâtın ilmini, terbiye yoluyla tahsilin zaruretine inanmışlar ve bu yolun sâliklerinden olmuşlar. Onlar, zâhirî ilimlerle yetinmeyip, bâtınî ilmi gerçekleştirmek gayesiyle, mürşidlerin manevi terbiyelerine girmişlerdir."},{"k":"p","t":"İmam Gazâlî [kuddise sırruhû], tasavvufa yönelişini ve seyrü sülûk yolundaki zevki tattıktan sonra durumunu şu şekilde dile getirmektedir:"},{"k":"q","t":"“Kesin olarak anladım ki sûfîler hakikaten Allah yolunu bulan kimselerdir. Onların gidişleri, gidişlerin en güzeli; gittikleri yol, yolların en doğrusu; ahlâkları ahlâkların en temizi ve en güzelidir."},{"k":"p","t":"Şayet dünyadaki bütün akıllı insanların akılları, hikmet sahiplerinin hikmetleri, şeriatın bütün teferruatını bilen zâhir ulemasının ilimleri, onların gidişat ve ahlâkından bir şey değiştirmek ve yerine daha iyisini koymak üzere bir araya gelseler, buna muvaffak olamazlar."},{"k":"p","t":"Çünkü onların zâhir ve bâtınlarındaki hareket ve duyguların hepsi, nübüvvet kandilinin nurundan alınmıştır. Yeryüzünde ise nübüvvet nurundan başka hidayet rehberi, nur kaynağı yoktur.”"},{"k":"p","t":"Tasavvufun gayesi Allah’ın rızasını kazanmaktır. Evliyaullahın yanında bulunanlar günahlardan sakınıp işlerini hayra çevirirler. Çünkü salihlerin meclislerinde Rabbü’l- âlemin’in ihsan ve bereketi vardır."},{"k":"p","t":"Bâyezîd-i Bistâmî’nin [kuddise sırruhû] yanına gelen bir derviş, “Beni Allah’a yaklaştıracak bir amel tavsiye et” deyince Bâyezîd [kuddise sırruhû] ona şu nasihatte bulunmuştur."},{"k":"q","t":"“Allah Teâlâ’nın velî kullarını sev! Sev ki onlar da seni sevsinler. Onların gönlüne girmeye çalış! Çünkü Allâh, o âriflerin kalblerine her gün 360 defa nazar eder. Onlardan birinin kalbinde senin adını görürse, seni bağışlar.”"},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Sâdâtları ziyarete gelirken trafik kazası geçiren ve hanımı kaybeden bir sûfî, Gavs-ı Cihan Hazretlerine [kuddise sırruhû] maruzatı olduğunu söyleyip (kendi evladını kastederek),"},{"k":"p","t":"- Efendim, evladınız ne yazık ki namazını kılmıyor. Başını da örttüremiyoruz. Bunları şikâyet için söylemiyorum ama ne yaptıysak olmadı, nasihatler kâr etmedi. Sâdâtın duasından başka çaremiz kalmadı, dedi. Gavs-ı Cihan Hazretleri [kuddise sırruhû]:"},{"k":"p","t":"- Sûfî, biz dua edeceğiz. İnşallah iyi olacak, deyip kızının tövbe alıp almadığını sordu sofiye. Sûfî tövbe almadığını söyleyince de,"},{"k":"p","t":"- Ona görevli birinden tövbe aldırın, buyurdu."},{"k":"p","t":"Sâdâtların yanında birkaç gün geçiren sûfî, memleketine döndüğünde kızını tesettürlü bir halde görünce oldukça şaşırdı. Yakînen anladı ki Allah’ın katında sâdâtların kıymeti çok fazladır. Sûfî, kızına tesettüre bürünüp namaza başlamasının hikmetini sorunca kızı,"},{"k":"p","t":"- Üç gün önce annemi rüyamda gördüm. Bana nasihat etti. Sâdâtları anlattı. Dünya hayatının geçici olduğunu söyledi. Anneme, “Bana öbür âlemi anlatır mısın?” dediğimde de, “Buranın güzellikleri anlatmakla bitmez. İnsanın aklı hayali almaz. Sizin dünyada güzel dediğiniz şeylerin burada hiçbir kıymeti yok. Mukayese dahi edilemez. Kızım, dünya hayatı nokta gibidir. Asıl hayatsa burada başlıyor” dedi. Hazır annemi bulmuşken sarıldım, “N’olur beni bırakıp da gitme diye ağladım” ama annem, “Bana bu kadar müsaade verildi kızım” deyip gözden kayboldu, dedi."},{"k":"p","t":"Salihler Allah Teâlâ tarafından mahfuz kılınmışlardır. Onların gönüllerinde mâsivâ yoktur, kibir ve haset de kalplerinden silinmiştir. Evliyaullahla ünsiyet eden kimsenin de gönlü temizlenir, bâtınî ve zâhirî işleri kolaylaşır."},{"k":"p","t":"Salihler Hak Teâlâ’ya âşıktırlar ve onların yanında olan kimseler de âşıklık meşrebine bürünürler. Evliyaullah, meclislerinde bulunanlara âşıklığın vefasını ve sadakatini aşılarlar."},{"k":"p","t":"Kişinin tasavvuf ilmini yani mârifet ilmini öğrenmesi lazımdır. Çünkü bu ilim, insana Allah’ı tanıtır, öğretir ve anlatır. Her mümine, sahih iman ve düzgün ibadet farz olduğu gibi kalp temizliği, nefs terbiyesi ve güzel ahlâk da farzdır. Kişi dünyaya olan ilgi ve alakasını kesip nefsâni istek ve arzularından kurtulduğunda kalbi ve ruhu feraha kavuşur."},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Bir insan Allah dostunun ahlâkıyla ahlâklandığı zaman hiç kimse ona kızmaz, ters bakamaz. Asıl gaye, nefsin kırılmasıdır. İnsan nefsini ayaklar altına almazsa kemalata eremez. Eğer bir kişi, “Sûfî olayım” diyorsa nefsin peşini bırakması, nefsini terbiye edip onun hilelerine aldanmaması lazımdır. Ama ne yaparsak yapalım, nefis daima peşimizdedir; o hiçbir zaman bizim iyiliğimizi istemez. O halde onu terbiye etmek gerekir. Nefsin terbiyesi de bir mürşid-i kâmilin elini tutmakla, onun terbiyesinde yetişmekle mümkün olur. İnsanın mutlaka bir mürşid-i kâmile ihtiyacı vardır.”"},{"k":"h","t":"Tasavvufî Terbiyede Meşrep"},{"k":"p","t":"Mevlana Gavs-ı Nizam Hazretleri [kuddise sırruhû] buyurmuştur ki:"},{"k":"q","t":"“Tasavvufta müridin de mürşidin de meşrebi önemlidir. Bu sebeple mürid, kime intisap edeceğini ve hangi meşrepten su içeceğini iyi bilmelidir. Onun içindir ki Nakşibendî meşrebine göre seyrü sülûk yapan ve kalbini ıslaha çalışan bir mürid, bu yolun ve önündeki mürşidinin kendi hastalığı için en güzel ilaç olduğunu, ancak diğer hak tarikatların da güzel olduğunu bilmelidir."},{"k":"p","t":"İnsanlara tasavvuf eğitimi veren bütün tarikatlar, müridi Allah’a ulaştırma esasına dayanır. Aralarındaki fark sadece insanı Allah’a kavuşturmakta izlenen metotlarda görülür. Nakşibendî yolunun büyüklerinde görülen metotlar, müride en kolay ve en uygulanabilir olan tasavvufî eğitim olarak görülmektedir. Zira Nakşibendî yolunun büyükleri olan sâdât-ı kirâm, müridlerini Allah’a kavuştururken onları tevhid mertebelerinin en yüce olanına ulaştırırlar."},{"k":"p","t":"Nakşibendî yolunun pîri Şah-ı Nakşibend hazretleri, “Bizim usulümüz, halkın içinde Cenâb-ı Hak ile beraber olmaktır. Yolumuz sohbet yoludur. Halvette (halktan kaçmakta) şöhret, şöhrette ise âfet vardır. Hayır ve bereket; cemiyette, halkın içinde bulunup bir araya gelmektedir” buyurarak bu yolu tercih eden bir müridin uyması gereken usul ve meşrebi belirtmişlerdir.”"},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Şah-ı Hazne [kuddise sırruhû] irşada başladığında o çevrede bulunan şeyhler, ağalar hep ona karşı gelmişti. O ağalardan biri bütün şeyhleri ve ağaları evine davet etti. Şah-ı Hazne [kuddise sırruhû] de bir müridiyle birlikte davete icabette bulundu. Kapının önünde yer buldu, ora- ya oturdu. Herkes onun aleyhinde konuştu. Ev sahibi olan ağa Şah-ı Hazne'ye [kuddise sırruhû] dönerek,"},{"k":"p","t":"- Şeyh Ahmed, herkes senin aleyhinde konuşuyor, sen bir şey demeyecek misin, deyince"},{"k":"p","t":"Şah-ı Hazne [kuddise sırruhû]:"},{"k":"p","t":"- Müsaade edilirse iki kelâm söyleyeceğim, dedi. Ağa,"},{"k":"p","t":"- Buyur söyle, dedi. Şah-ı Hazne [kuddise sırruhû]:"},{"k":"p","t":"- Eğer biz bu işi Allah için yapıyorsak Allah bizi muvaffak edecektir. Dünya gelse bize zarar veremeyecektir. Ama bizim niyetimiz Allah değilse hiç dertlenmeyin, Allah bizim foyamızı kısa zamanda açığa çıkaracaktır, buyurdu."},{"k":"p","t":"İşte biz de Şah-ı Hazne [kuddise sırruhû] gibi söylüyoruz."},{"k":"p","t":"İnsanlar her zaman hata yapabilir. Bizler de hata yapabiliriz. Hâşâ, peygamber değiliz. Bakın, ben yakınımdakilere devamlı olarak, \"Benim hatamı görürseniz mutlaka gelin, beni ikaz edin\" diyorum. \"Nasıl ikaz ederiz, diye utanmayın. Hata gördüğünüzde mutlaka ikaz edin\" diyorum.”"},{"k":"h","t":"Tasavvuf Kalp Amelleri İle İlgilenir"},{"k":"p","t":"Hz. Resûlullah [sallallahu aleyhi vesellem] hadis-i şeriflerinde şöyle buyurmuştur:"},{"k":"q","t":"“Dikkat edin! İnsanın bedeninde bir et parçası vardır ki o iyi ve sağlam olursa bütün beden sağlam olur. O bozuk olursa bütün beden bozuk olur. Bilesiniz ki o, kalptir.”"},{"k":"p","t":"Kur’ân-ı Kerîm’de ve hadislerde kalbin mahiyeti ve tarifi üzerinde değil, işlevleri ve nitelikleri üzerinde durulmuştur. Kur’an ve hadiste geçen kalp kelimesi insanın anlama, kavrama, düşünme yönünü, başka bir ifadeyle insanı insan yapan ve diğer canlılardan ayıran temel özelliğini dile getirir. İnsanın idrak eden, bilen ve kavrayan tarafı olduğu için kalp ilâhî hitaba muhataptır, yükümlü ve sorumludur."},{"k":"p","t":"Kalp ruhun sarayı, insanın aslıdır. İnsanı kalbi temsil eder çünkü insana ait özellikler kalpte toplanmıştır. İçine nur inmeyen kalp, aslî safiyetini kaybeder ve asıl görevini yapamaz hale gelir. Bu defa kalp, hasta olur ve inkârın, isyanın, cehaletin ve kötü ahlâkların merkezi durumuna gelir."},{"k":"p","t":"Kalp günah işlendikçe zayıflar, kirlenir, katılaşır ve tedavi edilmezse de ölür. Üzerine perde çekilir, hak ile batılı ayırt edemez ve felâkete düşer. Kalp vücudu temsil ettiği için kalbin iyi ve kötü durumu bütün organları etkiler."},{"k":"p","t":"Müminin bu âlemde kalbinden başka sermayesi yoktur. Akıl ve idrak ehli kimse kalbini ihmal etmez, onun terbiyesini basite almaz ve kalbini sadece Allah Teâlâ’nın sevgisi ile doldurur. Kalbinin zarar ve ziyana düşmesinden korkan kimse tefekkür ile hareket edip her an pişmanlık ve nedâmet üzere yaşar."},{"k":"p","t":"Bu yüzden Allah Resûlü [sallallahu aleyhi vesellem], ashabının dikkatini kalplerini ıslah etmeye yönlendirmiş ve onlara Cenâb-ı Hakk’ın kullarının kalplerine nazar ettiğini öğretmiştir."},{"k":"h","t":"Tasavvuf Terbiyesinde Zikrin Önemi"},{"k":"p","t":"Tasavvufta seyir, cehaletten ilme, kötü huylardan güzel huylara, kendi varlığından geçip Hakk’ın varlığına doğru harekettir. Sülûk ise Rabbü’l âlemin’e kavuşmak için bir rehberin öncülüğünde çıkılan manevi yolculuktur."},{"k":"p","t":"Seyr-i sülûktan murat, kulun kendini ve Rabb’ini tanımasıdır. Gafletten uyanıp insanî sıfatlara doğru adım atarak hedefe doğru yol almasıdır. Nitekim zikir insanı kemâle ulaştırır ve sırât-ı müstakîm yoluna bağlar."},{"k":"p","t":"Zikir, nefsin manevi terbiyesidir. İnsanı gaflet hastalığından kurtaran en tesirli yoldur. Tasavvufta hedef, kalbi gafletten uyandırıp yüce Allah’a bağlayarak ebedî huzuru elde etmektir. Bunun en kolay yolu, kalbi devamlı zikirle meşgul etmektir. Zikir, kalbi yüce Allah’a bağlayan en kısa, en kolay menzildir."},{"k":"p","t":"Zikrin en büyük fazileti, zikreden kulu, Cenâb-ı Hakk’ın özel olarak huzurunda zikretmesidir. Zira zikrin mukabili zikirdir. Allah Teâlâ âyet-i kerimede şöyle buyurmuştur:"},{"k":"ar","t":"فَاذْكُرُون۪ٓي اَذْكُرْكُمْ"},{"k":"q","t":"“Taat ve ibadetle beni anın ki ben de sizi mağfiretle (bağışlayarak) anayım.” (Bakara 2/152)."},{"k":"p","t":"Büyük müfessir Fahreddin Râzî [rahmetullahi aleyh] der ki: “Kul ancak diliyle zikir, âzalarıyla şükür kalbiyle fikir içinde kaybolup bütün varlığı ile devamlı Allah’a kulluk yaptığında gerçek insan olur.”"},{"k":"p","t":"Kalbinde; dünya sevgisi, kibir, haset, riya, gaflet, makam hırsı, ihanet gibi şeytanî özellikler bulunan kimse, Allah yolunda bir rabbânî âlimin, bir mürşid-i kâmilin elinden tuttuğu zaman, önce kalbinin bu kötülüklerden temizlenmesi hedeflenir. Zira ilâhî huzurda kabul görmek ve Allah Teâlâ tarafından sevilmek, kalbin bütün kötülüklerden tamamen temizlenmesine bağlıdır. Sonra güzel ahlâk ile donatılmak gelir. Manevi seyir, sefer ve ilâhî huzurda kabul görmek ancak bundan sonra olur."},{"k":"p","t":"Bu mübarek yolda kalbin temizlenmesi için en tesirli ilaç, mürşid-i kâmilin nazarı ve onun nezareti altında yapılan zikirdir. Gafletten uzak yapılan zikir, zikreden kimseyi Rabbine yaklaştırır."},{"k":"p","t":"Yüce Allah bir kuluna ikram ettiğinde, ya ona vehbî bir cezbe verir ya da onu razı olduğu şeylere yönlendirerek ilâhî cezbeye ulaştırır. Veyahut kâmil (kemale ermiş) ve mükemmil (başkasını kemale erdiren) bir şeyhin eli altında terbiye görmesini sağlar. Mürşid, müride başta bahsedilen nuranî letâif üzerinde zikir yapmasını telkin eder. Bu zikirlerin devamı ile nefsin karanlık ve kasveti bu letâiften giderilir."},{"k":"p","t":"Şah-ı Nakşibend [kuddise sırruhû]:"},{"k":"q","t":"“Bizim terbiye yolumuz sohbet üzerine kuruludur. Hayırlar, Allah için salih insanlarla beraber olmadadır. Onlarla sohbete devam ede ede hakiki imana kavuşmak nasip olur” buyurmuştur."},{"k":"p","t":"Nitekim ahirette iyilerle beraber olabilmek için, dünyada da onlarla beraber olmak, onları sevmek, onların yolundan gitmek gerekir."},{"k":"p","t":"Onbir kandilden biri olan Nigâhdâşt (Teveccühü gözetmek): Tasavvuf terbiyesinde maksat, usulüne uygun yapılan devamlı zikirle kalbi beytullah kılmaktır. Bu nedenle zikrullahtaki feyiz ve devamlılığı korumaya yönelik esaslar konmuştur. Bunlardan biri olan “nigâhdâşt”, mâsivâya yönelmemesi için bakışımızı, yani ilgi ve teveccühümüzü kontrol altında tutmak demektir."},{"k":"h","t":"Tasavvuf Terbiyesinde Rabıtanın Önemi"},{"k":"p","t":"Mürşid-i kâmiller kalbi fâni sevgi ve sevgililerin bağından çözüp ebedî sevgiliye, Cenâb-ı Hakk’a bağlarlar. Bu sebepten mürid, mürşidiyle olan hukukuna özen göstermeli ve kendisi için ilâhî feyiz vesilesi olan pirine kalben müteveccih olmalıdır. Çünkü salih kulların kalpleri feyiz ve nur kaplarıdır. Bu kaptan istifadenin en tesirli yolu da rabıtadır. Resûlullah [sallallahu aleyhi vesellem] bir hadis- i şeriflerinde şöyle buyurmuştur:"},{"k":"q","t":"“Allah Teâlâ’nın yeryüzünde yaşayanlar içinde (feyiz ve nur) kapları vardır. Rabbinizin kapları salih kullarının kalpleridir.”"},{"k":"p","t":"Rabıta, yakîne ulaşmış, müşâhede makamına çıkmış, Allah’ın ahlâkı ile süslenmiş, bütün latifeleriyle ilâhî zikre dalmış kâmil bir mürşidi hayal edip kalbi ona bağlamaktır."},{"k":"p","t":"Diğer bir manayla rabıta, bir müridin kalbini mürşidinin kalbine bağlayıp oradan ilim, sevgi, feyiz ve nur almasıdır."},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] rabıtanın her zaman ve her yerde yapılmasının kıymetini şöyle anlatmıştı:"},{"k":"q","t":"“Şeyh Abdurrahman Tâhî [kuddise sırruhû] halifesi Şeyh Fethullah [kuddise sırruhû] ile hacca gitmişlerdi. Hac vazifesini yaptıktan sonra Medine’ye geldiler. Ravza-i Mutahhara’ya yaklaştıklarında Şeyh Fethullah [kuddise sırruhû] mürşidinin rabıtasını yapmaya başladı. Şeyh Abdurrahman Tâhî [kuddise sırruhû] ona dönüp, “Molla Fethullah, burada da mı sâdâtın rabıtasını yapıyorsun?” diye sordu. Şeyh Fethullah [kuddise sırruhû], “Evet efendim. Asıl burada sâdâtın rabıtasını yapmam lazım. Sâdâtın rabıtası olmasa ben bu perişan halimle, nasıl Peygamber Efendimiz’in [sallallahu aleyhi vesellem] huzuruna çıkarım. Ben rabıtaya en çok burada muhtacım” dedi.”"},{"k":"p","t":"Teslimiyetle yapılan bir rabıta, kalbi uyandırmak, onu zikre geçirmek, şeytanın aldatıcılıklarından korumak için bir yoldur. Rabıta, kalbe atılan vesvese oklarını engellemek, kalbe gelen kötü düşünceleri defetmek için bir usuldür."},{"k":"p","t":"Allahu Teala bizi ve tüm ümmeti terbiye olan kullarından eylesin. günahlardan uzak durup, nefsini ıslah edecek ibadet ve taatle meşgul olan kimselerden eylesin. Dünya ve ahirette salih kulları ile beraber eylesin. Amin"}],"cat":"Tasavvuf ve Zikir"},{"id":"kul-hakkindan-kacinmak","title":"Kul Hakkından Kaçınmak","sub":"Sohbet notu","desc":"Kul hakkı, helalleşmenin önemi ve ibretli kıssalar","color":"#7A3B3B","mins":20,"paras":[{"k":"ar","t":"وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ ۞"},{"k":"q","t":"“Ben cinleri ve insanları, ancak bana kulluk etsinler diye yarattım.” (Zariyat Suresi, 56)"},{"k":"p","t":"Kul, Allah'a tam bir teslimiyetle boyun eğen, emir ve yasaklarına titizlikle uyan, isyandan kaçınan insanı belirtir. Kulluk insanın varoluş nedenidir. Çünkü Allah insanları ve cinleri kendisine kulluk etmeleri için yaratmıştır. Kulluk, sahibi tanımayı, ona teslim olmayı, emrinden çıkmamayı gerektirir. Kulun sahibini tanıması da O’na iman etmesiyle gerçekleşir. Sonra güç yetirebildiğince adım adım kulluğun gereklerini yapmasıyla gerçekleşir."},{"k":"p","t":"Kulun sorumlulukları Allah’ın [celle celâluhû] hakkı ve kulların hakkı olarak ikiye ayrılır. Namaz, oruç, zikir gibi ibadetler Allah’ın [celle celâluhû] hakkı sayılırken, gıybet etmemek, hırsızlık yapmamak, adam öldürmemek, ölçü ve tartıda hile yapmamak, borcunu ödemek gibi sorumluluklar da kulların haklarından yer alır."},{"k":"p","t":"Aslında kulların hakkı da Allah’ın [celle celâluhû] hakkı olarak sayılmaktadır zira bu hakka riayet etmek yine yüce Allah’ı emridir. Karşıdakinin hakkını çiğneyen hem ona karşı haksızlık ve zulüm yapmış olduğu gibi Allah’ın [celle celâluhû] emrini de çiğnemiş olmaktadır."},{"k":"p","t":"İnsanlar arasındaki ilişkiler sebebiyle meydana gelen haklara kul hakkı denir. İnsan hayatta başkaları ile sürekli irtibat halindedir. Alışveriş yapar, konuşur, sohbet eder, okula gider, işe gider, trafikte araç kullanır, toplu taşıma araçlarına biner, ilim öğrenir, ibadet eder."},{"k":"p","t":"Bunları yaparken çoğunlukla başkaları ile birlikte olur. Bir aile içinde doğar, büyür, kardeşleri, akrabaları, komşuları olur. Bu durumlarda birlikte olduğu kişilerle arasında etkileşim olur. Davranışları birbirine tesir eder. Çeşitli haklar oluşur. Bunlara kul hakkı denir. Kimsenin hakkını çiğnememeye, karşıdakinin hakkında eksiklik yapmamaya özen göstermelidir. Aksi halde kul hakkını çiğnemek sayılır ki büyük vebaldir."},{"k":"p","t":"Kul hakkına riayet etmek dinimizin bize yüklediği önemli bir mesuliyettir. Bu mesuliyeti yerine getirmek gerekir. Hakka girmek, kul hakkını çiğnemek ise haram olarak görülmüştür."},{"k":"p","t":"Müslümanlar arasında bugün geçerli olan kul hakkı anlayışında da önemli bir eksiklik görmek mümkün. Kul hakkının, sadece müslüman kardeşinin malını cebren veya türlü aldatmacalarla ele geçirmek olduğu zannediliyor. Oysa kul hakkı kavramı bu kadar dar bir anlama sahip değil."},{"k":"p","t":"Ufacık da olsa bir insanın hatırını kırmak, gönlünü incitmek de kul hakkıdır. Öğretmen okulunda, işçi fabrikasında, memur dairesinde, esnaf dükkânında, müftü fetvasında, hâkim hükmünde vazifesini eksiksiz ve âdil bir şekilde ifa ediyorsa, ancak o zaman görevini İslâmî ölçüler içinde, kul hakkına riayet ederek yapıyor demektir. Hangi alanda olursa olsun, layıkıyla yapılmayan vazife, bir şekilde kul hakkına tecavüzdür. Yerine göre bazan tüyü bitmemiş yetimlerin, bazan tek tek helâlleşme imkânı asla olamayacak kalabalıkların haklarının vebali altında kalmaktır."},{"k":"p","t":"Diğer taraftan, menfaat tutkusuyla ya da vurdumduymazlıkla sorumlulukların idrakinden uzak yapılan işler, toplumun genelini etkileyecek musibet ve felaketlerin sebebidir. Alınan ücret ve bedellere haram karışıyor demektir."},{"k":"p","t":"İnsan kendi nefsini, isteklerini ve menfaatlerini her şeyin önüne koyduğu zaman, geride ne Allah rızasını gözetmek kalır, ne de kul hakkına riayet etmek… Böyle olunca da sağa sola fazla dikkat etmeden daima şahsî isteklerini önde tutar. Kendince açıkgözlülük yaparak başkalarının hakkını yemekten kaçınmaz."},{"k":"p","t":"Mesela insanların beklediği bir sıraya bir yerinden girerek işini bir an önce halletmeye çalışır. Su ve elektrik giderlerini ödememek için kendince yöntemler geliştirir. Toplu ulaşım araçlarında ücret ödememeye çabalar. Kamu veya malını malını kendi hesabına kullanmaktan çekinmez. Bir hizmet mevkiinde bulunuyorsa bunu kişisel iktidar ve menfaat aracı olarak görür. Ama düşünmez ki, bunu yaptığında nice insanın hakkına girmektedir. Ahirette insanın karşısına binlerce kişinin alacaklı olarak çıkmasından kötü ne olabilir?"},{"k":"p","t":"İslâm dininde en temel olarak korunan haklardan biri kul hakkıdır. Dinî konuların büyük bölümü kul haklarını içine alan konuları oluşturur. Anne babaya, arkadaş, akraba, kardeşlik hukuku, alışveriş ticaret hukukuna riayet etmek, adaletli olmak, haksızlıktan, yalandan, gıybetten, hırsızlıktan, adam öldürmekten, faizden, rüşvetten kaçınmak vb. konular hep kul hakkını ilgilendiren konulardır."},{"k":"p","t":"Başkalarına zarar vermemek hususunda Rabbimiz şöyle buyurmaktadır:"},{"k":"ar","t":"وَاعْبُدُوا اللّٰهَ وَلَا تُشْرِكُوا بِهِ شَيْـًٔا وَبِالْوَالِدَيْنِ اِحْسَانًا وَبِذِى الْقُرْبٰى وَالْيَتَامٰى وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبٰى وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ وَابْنِ السَّبِيلِۙ وَمَا مَلَكَتْ اَيْمَانُكُمْۜ اِنَّ اللّٰهَ لَا يُحِبُّ مَنْ كَانَ مُخْتَالًا فَخُورًاۙ ۞"},{"k":"q","t":"“Allah’a ibadet edin ve O’na hiçbir şeyi ortak koşmayın. Ana babaya, akrabaya, yetimlere, yoksullara, yakın ve uzak komşuya, yakın arkadaşa, yolcuya, ellerinizin altında bulunanlara (hizmetçi vs.) iyi davranın. Allah kendini beğenen ve daima böbürlenip duran kimseyi sevmez.” (Nisâ Suresi, 36)"},{"k":"h","t":"Allah Resûlü’nün Örnek Oluşu"},{"k":"p","t":"Hz. Peygamber Efendimiz’in [sallallahu aleyhi vesellem] sıfatı Muhammedü’l-emîn’ idi. O güvenilirdi. Buna o vasıf kendisini tanıyan dost düşman herkes tarafından verilmişti. Resûl-i Ekrem’i [sallallahu aleyhi vesellem] öldürmek isteyen insanlar dahi, “Muhammed [sallallahu aleyhi vesellem] haksızlık eder” dememişlerdir. Hatta onu yatağında öldürmek isteyenler dahi kıymetli eşyaları Resûlullah Efendimiz’in [sallallahu aleyhi vesellem] yanında emanet durmakta idi. Hicret esnasında yatağında Hz. Ali’yi [radıyallahu anh] yatırarak emanetleri sahiplerine iade ettikten sonra hicret etmesini emretmişti."},{"k":"p","t":"Peygamber Efendimiz’in [sallallahu aleyhi vesellem] gençlik yıllarında Mekkeliler Kâbe’yi onarmıştı. Bu sırada Hacerülesved taşının yerine yerleştirilmesi sırasında anlaşmazlık çıkmış, hatta savaş çıkacak duruma gelmişti. Bunun ancak, ilk olarak gelen kişinin hakemliği ile çözülebileceğine karar verdiler."},{"k":"p","t":"İlk gelen Resûlullah [sallallahu aleyhi vesellem]‘idi. Bu duruma çok sevindiler. Genç yaşta olmasına rağmen kimseye haksızlık yapmayacağına herkesin kanaat getirdiği Muhammedü’l-emîn [sallallahu aleyhi vesellem] gelmişti. Peygamber Efendimiz [sallallahu aleyhi vesellem] Hacerülesved taşının bir örtünün üzerine konup, örtünün her bir köşesinden her bir kabile reisinin tutup kaldırmasını sağladı. Yerine konulacak hizaya gelince de Resûlullah Efendimiz [sallallahu aleyhi vesellem] taşı yerine yerleştirdi. Böylece kimseye haksızlık yapmayan Resûl-i Ekrem Efendimiz’in [sallallahu aleyhi vesellem] feraseti ile büyük bir karışıklık önlenmiş oldu."},{"k":"p","t":"Peygamber Efendimiz [sallallahu aleyhi vesellem] bir hadislerinde şöyle buyurmaktadır:"},{"k":"q","t":"“Müslümanın müslümana karşı kanı, malı ve ırzı haramdır.”"},{"k":"p","t":"Yine Efendimiz [sallallahu aleyhi vesellem] birinin arazisinden bir bölümünü gasp eden kimse hakkında da şöyle buyurmuştur:"},{"k":"q","t":"“Kim bir karış toprak gasp ederse, Allah kıyamet gününde onu yedi kat yerden kafasına geçirir.”"},{"k":"p","t":"Bu ve buna benzer birçok hadis-i şeriflerinde Fahr-i Âlem [sallallahu aleyhi vesellem], insanlara zulüm ve haksızlık yapılmamasını emrediyor. Birbirine haksızlık edenlerin, gönül kıranların, kul hakkına riayet etmeyenlerin, mümin kardeşlerine şu üç günlük dünya hayatını zindan edenlerin, kıyamet gününde büyük cezalara çarptırılacağını çok dikkat çekici anlatımlarla bildiriyor. Buna karşılık ana babaya, akrabaya, komşuya, yabancıya, yolda kalmışa, muhtaç durumda olanlara iyilik ve ihsanda bulunanların da mükâfata, cennete ereceklerini beyan ediyor."},{"k":"p","t":"Bizim inancımız, bırakın zarar vermeyi, rızası olmadan bir kimsenin malından ufacık da olsa faydalanmayı bile yasaklamıştır."},{"k":"p","t":"Unutmayalım ki Müslüman, Efendimiz'in [sallallahu aleyhi vesellem] beyanıyla 'başkasının elinden ve dilinden emin olduğu' kişinin adıdır."},{"k":"p","t":"Bu sebeple kul hakkı deyip geçmemek gerekir. İnsanın üzerindeki kul borcu, borçların en büyüğü, ahiret açısından da en korkulanıdır. Rabbimiz kul hakkını şehitlerden bile affetmiyor. Hak ettikleri şehitlik makamına, ancak kullara olan borçları ödendikten sonra çıkabiliyorlar."},{"k":"p","t":"Nitekim Hz. Peygamber Efendimiz [sallallahu aleyhi vesellem] cenaze namazını kıldıracağı mevtanın üzerinde kul hakkının olup olmadığını da soruyor, ölenin borcu varsa, kul hakkı vardır üzerinde, diyerek namazını kıldırmıyor, başkalarının kıldırmasına havale ederek insanlara borçlu gitmeme konusunda böyle uyarıcı mesajlar sunuyordu."},{"k":"p","t":"Ebû Katâde Hâris b. Ribʻî [radıyallahu anh] anlatıyor:"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] ashabının arasında ayağa kalktı ve onlara,"},{"k":"q","t":"“Allah yolunda cihad etmek ve Allah’a iman etmek, amellerin en faziletlisidir” buyurdu."},{"k":"p","t":"O sırada bir adam ayağa kalkıp, “Yâ Resûlallah! Şayet ben Allah yolunda öldürülürsem, bu benim günahlarıma kefâret olur mu” diye sordu. Hz. Resûlullah [sallallahu aleyhi vesellem]:"},{"k":"q","t":"“Evet, şayet sabrederek, karşılığını Allah’tan bekleyerek ve arkanı dönüp kaçmayıp ileri atılarak Allah yolunda öldürülürsen bu, günahlarına kefaret olur” buyurdu."},{"k":"p","t":"Ardından adama,"},{"k":"q","t":"“Nasıl demiştin?” diye sordu. Adam,"},{"k":"q","t":"“Eğer ben Allah yolunda şehid olursam, bu benim günahlarıma kefâret olur mu?, demiştim” dedi. Hz. Resûlullah [sallallahu aleyhi vesellem] tekrar,"},{"k":"q","t":"“Evet, şayet sabrederek, karşılığını Allah’tan bekleyerek ve arkanı dönüp kaçmayıp ileri atılarak Allah yolunda öldürülürsen, borçlarından başka bütün günahlarına kefâret olur. Bunu bana Cibrîl söyledi” buyurdu."},{"k":"p","t":"Allah Resûlü [sallallahu aleyhi vesellem] insanlarla kurduğu ilişkilerde çok dikkatli davranmış ve kim olursa olsun üzmemek, zarar vermemek için çabalamıştır. Dört halife ve ashâb-ı güzîn de bu yolda yürümeye özen göstermişlerdir. Özellikle sert tabiatıyla bilinen Hz. Ömer [radıyallahu anh], mesele kul hakkına ve insanların incinmesine geldiğinde, âdeta titreyerek hareket etmiştir. “Faruk” (ayıran) sıfatı doğru ile yanlışı, hak ile bâtılı ayırması adaletli olması sebebiyle kendisine verilmiştir."},{"k":"h","t":"Asıl İflas Eden"},{"k":"p","t":"Ebû Hüreyre’den [radıyallahu anh] rivayet edildiğine göre bir gün Hz. Resûlullah [sallallahu aleyhi vesellem]:"},{"k":"q","t":"“Müflis kimdir biliyor musunuz?” diye sordu. Ashap:"},{"k":"q","t":"“Bize göre müflis parası ve malı olmayan kimsedir” dediler. Bunun üzerine Resûl-i Ekrem [sallallahu aleyhi vesellem] şöyle buyurdu:"},{"k":"q","t":"“Ümmetimin içindeki esas müflis; kıyamet günü namaz, oruç ve zekâtla gelir. Şuna sövmüş, buna iftira atmış, şunun malını yemiş, bunun kanını dökmüş ve şunu dövmüştür. Bu sebeple onun sevaplarından o kimselere verilir. Eğer üzerindeki borç ödenmeden önce sevapları biterse, haksızlık ettiği o kimselerin günahlarından alınarak o kimseye yüklenir. Sonra da o kimse cehenneme atılır.”"},{"k":"p","t":"İnsanın kazandığı paranın helallik ve haramlığı dini açıdan olduğu kadar mânevî açıdan da önemlidir. Bakara Sûresi’nde,"},{"k":"ar","t":"وَلَا تَاْكُلُٓوا اَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ وَتُدْلُوا بِهَٓا اِلَى الْحُكَّامِ لِتَاْكُلُوا فَرِيقًا مِنْ اَمْوَالِ النَّاسِ بِالْاِثْمِ وَاَنْتُمْ تَعْلَمُونَ۟ ۞"},{"k":"p","t":"”Mallarınızı aranızda haksızlıkla yemeyin! İnsanların mallarından bir kısmını bile bile günah bir yolla yemek için o malları hâkimlere rüşvet olarak vermeyin!” (Bakara Suresi, 188) ikazı yapılmaktadır."},{"k":"p","t":"Ticaret yapanlar müşteriyi Müslüman olsun gayrimüslim olsun Allah'ın kulu olarak görmeli. 'Allah'ın bana gönderdiği müşteri, ona en iyi muameleyi yapayım.' diye düşünmesi lazım. Bir sanatkâr ise işin en güzel şekilde, müşterisine değil de Allah'a beğendirmek için yapmalı. Hak ettiğinden fazla ücret almamalı."},{"k":"p","t":"Nitekim savaşa giden Osmanlı askerlerinin uğradıkları bağ bahçeden aldıkları meyvenin parasını oraya bırakma titizliği göstermeleri de, kul hakkının savaşta bile ihmal edilmediğinin göstergesi oluyordu..."},{"k":"p","t":"Kul hakkına riayet edildiği zaman, hem kulların hakkı hem de Allah’ın [celle celâluhû] hakkını yerine getirmiş olur. Kişi hayatında kul hakkına riayet ettiğinde de kendi hayatı cennete dönüşür. Huzur içinde yaşar. Allah’ın [celle celâluhû] emrini yerine getirmenin, kimseyi üzmemenin huzuru kaplar. Her ne kadar kendisi haksızlıklarla karşılaşsa da o karşısındakine haksızlıktan kaçındığı sürece pişman olmaz, yüzü kızarmaz. Allah’ın [celle celâluhû] muhafazasını emrettiği bir hususu koruduğu için o kulundan razı ve memnun olur. Toplum arasında güven kazanır."},{"k":"p","t":"Kul hakları çiğnendiğinde ise şunlar meydana gelir: Allah’ın [celle celâluhû] emrini çiğneyerek haram işlemiş olur ve yüce Allah’ın gazabını kazanır. Kulların hakkına girerek üzerine onların vebalini alır. Haksızlığa uğradığını farkeden kişiyi üzmüş olur. Eğer o, kardeşi, komşusu, arkadaşı, akrabası ise, onların hakkını koruması gerekirken o hakkı zayi etmiş olur."},{"k":"p","t":"Karşıdaki haksızlığa uğradığını farketmediği durumlarda ise durum daha feci olur. Onun vebali ile bir ömür boyu yaşar. Şayet helâlleşmez ise meselenin çözümü ahirete kalır. İnsanlar arasında güvensizlik meydana gelir, huzur kalkar, can, mal, namus emniyeti kalmaz, adalet tesis edilemez. Müslümanların birliğine, beraberliğine, kardeşliğine zarar verir. Haksızlığa uğrayan mazlum, haksızlık eden de zulmeden kimse olur."},{"k":"h","t":"Kıssa"},{"k":"p","t":"İstanbul fethedildiğinde Fatih Sultan Mehmet Han, Yedikule zindanlarındaki ilim adamlarını ziyaret eder ve kendilerine sorar, \"Sizi niye zindana attılar?\""},{"k":"p","t":"Onlardan biri demiş ki: \"Kayser (Bizans imparatoru) bizi topladı, dedi ki, 'Osmanlı, Rumeli Hisarı'nı yaptırıyor. Bizans'ın kapıları kapanıyor. Ülkemizi nasıl koruyabiliriz?' Sıra bana gelince şöyle cevap verdim:"},{"k":"p","t":"'İmparatorum, biz Bizans'ı artık koruyamayız. Çünkü ahlaksızlık Bizans'ı çürüttü. Şimdi cepheye giden asker, geride bıraktıklarını kimseye emanet edemiyor. Osmanlı, Bizans'ı yıkmasa da Bizans zaten yıkılıyor.' Bunun üzerine imparator,"},{"k":"q","t":"\"Atın bunu zindana!\" diye emretti, 'Biz yüzyıllarca yaşamışız, Bizans'ı kimse yıkamaz!' diyenlere de mevki makam verdi.\""},{"k":"p","t":"Fatih Sultan Mehmet, adamı dinledikten sonra demiş ki: \"Sana şimdi bir ferman veriyorum. Osmanlı memleketlerini dolaş. Acaba Osmanlı Devleti ne kadar yaşayacak, bana bir bilgi ver.\""},{"k":"p","t":"O bilgin, bu emrin üzerine tüm Osmanlı topraklarını dolaşmaya başlamış. Bu esnada mahkemeleri de incelemiş. Bir mahkemede şöyle bir davaya şahit olmuş:"},{"k":"p","t":"Davacı olan köylü, kadı efendiye yalvarıyor: \"Ben bu adamdan sadece tarlayı satın aldım. Tarlanın içinden çıkan bu hazineye bir bedel ödemedim. Lütfen söyleyin, bu hazineyi alsın!\""},{"k":"p","t":"Diğer adam da demiş ki: \"Ben tarlayı bu adama satmışım. Artık içinden ne çıkarsa ona aittir. Hazineyi alamam, vebaldir.\""},{"k":"p","t":"Her iki adam da kul hakkına girmekten böylesine korkuyor. Kadı efendi adamlara bakmış, birinin oğlu, birinin kızı var. Demiş ki:"},{"k":"q","t":"\"Ben senin kızını, bunun oğluna nikahlıyorum, razı mısınız?\" Adamlar da peki demişler."},{"k":"q","t":"\"Çağırın oğlunuzu, kızınızı.\" demiş, onlara da sormuş, \"hayır\" diyen yok."},{"k":"p","t":"Kadı, \"Maşallah, o çıkan hazine de size düğün hediyesi.\" diyerek davayı bitirmiş. Bütün bunlara şahit olan ilim adamı, Fatih'in yanına gelmiş, \"Bu adalet devam ettiği müddetçe Osmanlı'nın ömrü çok uzun olur!\" diye müjde vermiş."},{"k":"h","t":"Vakıf Malına Zarar Vermek"},{"k":"p","t":"Başkalarının sahip olduklarına veya kamu ve vakıf malına zarar vererek hak arama iddiasının hak kavramıyla uzaktan yakından alakası olamaz. Özellikle kamu veya vakıf malına zarar verildiğinde milyonlarca kişinin hakkına girmiş olmaktadır. Ahiret endişesi olan bir insanın böyle büyük bir yükün altına girme cesareti olabilir mi?"},{"k":"p","t":"Bir mümin için kendi malı ne kadar kıymetliyse, başkasının malı da aynı kıymettedir. Mümin güvenilir insandır, emindir. Kendisine emniyet edilene zarar vermez. Sahibi görmese de her şeyi göreni bildiğinden eline diline dikkat eder. Allah’tan ve ahiret hesabından korkar."},{"k":"p","t":"Emevî halifelerinden Ömer b. Abdülaziz [rahmetullahi aleyh] halifeliği döneminde kul hakkı ve adalet konusunda son derece titiz davranırdı. Gece evde çalışacağı zaman iki kandili vardı, birini özel işlerinde birini de devlet ve millet işlerinde kullanırdı."},{"k":"p","t":"Kamu malına zarar vermeye gelince, bunun vebalinin ne kadar ağır olduğunu anlamak için şu ayete bir bakalım:"},{"k":"ar","t":"وَمَنْ يَغْلُلْ يَاْتِ بِمَا غَلَّ يَوْمَ الْقِيٰمَةِۚ"},{"k":"q","t":"“Her kim hıyanet eder, kamu malından bir şey aşırırsa, aşırdığını kıyamet günü yüklenip getirir.” (Âl-i İmrân Suresi, 161)"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] de ganimet mallarından iki kuruş bile etmeyen bir boncuğu çalmış olan birinin cenaze namazını kılmamıştır.  Yine Hayber’in fethinde ganimet eşyasından bir hırkayı aşıran kimse için de, kıyamette bu elbisenin onun üzerinde yanacağını belirtmiş, bir ayakkabı bağını kendisine ayıran kimseye de benzer şeyi söylemiştir."},{"k":"p","t":"Devletin malını haksız yere kullananlar tüyü bitmemiş yetime ve hak sahibi tüm insanlara, tek tek ahrette haklarını teslim edeceklerdir."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdulbaki el-Hüseyni hazretleri [kuddise sırruhû], vakıf malına gösterilmesi gereken öneme dikkat çekerek bir sohbetinde şöyle buyurmuştur:"},{"k":"q","t":"“Hizmetteki sadakat, vakıf malına kendi malını telef etmediğin gibi sahip çıkmandır. Bu kapıda sadık olan menfaat görür. Allah yolunda yapılan hizmette kendi çıkarlarını gözeten kimse cehennemdeki yerini hazırlıyor demektir. Çok dikkatli olun! Allah’ın huzuruna ak yüzle çıkın.”"},{"k":"h","t":"Üzerinde kul hakkı olan ne yapmalı?"},{"k":"p","t":"Allah [celle celâluhû] korkusuna sahip olan kişi kul hakkı çiğnemez. Allah’ın [celle celâluhû] haram saydığı bir fiili işleyemez. Allah [celle celâluhû] korkusu buna mani olur. Öldükten sonra dirilmenin, hesap vermenin var olduğuna inanan kişi kul hakkına girmez, bilir ki bunun hesabı var, ahirette o hak sahibi ile yüzleşmek var."},{"k":"p","t":"Kişi evvela kul hakkına girmemeye özen gösterir. Kul hakkı meydana gelmişse de bu günahtan dolayı tövbe etmeli ve o kişinin mutlaka hakkını ödemeli ve helâlleşmelidir."},{"k":"p","t":"Özellikle yolculuk öncesi, hac-umre öncesi, bayramlarda, hastalıklarda helâlleşmeyi unutmamalı. Bu durumları helâlleşmek için fırsat bilmelidir. Hesap, helâlleşme ahirete kalırsa zor olur. Ölen insanlara da haklarımızı helâl etmeliyiz"},{"k":"p","t":"Kul hakkının çarelerinden biri de salih kişilerle birlikte olmaktır. Kul hakkından uzak durmaya özenen kişilerle birliktelik kişide bir hassasiyet meydana getirir."},{"k":"p","t":"Üzerinde kul hakkı bulunan bir insan, diyar diyar dolaşarak da olsa muhatabını bulup helâllik dilemek mecburiyetindedir. Bu hak, gıybet, iftira, yalan isnadı.. vs. gibi manevî boyutlu haklar ise, ancak hak sahibiyle açıkça konuşularak helâllik istemelidir."},{"k":"p","t":"Esasen helallik istemeyi devamlı bir alışkanlık ve ahlâk haline getirmeli, mümkün oldukça oturup kalktığı herkesle her fırsatta sebebini de söyleyerek helalleşmelidir. Böylesi, ahirette o kimseyle hesaplaşmak için binlerce sene beklemekten çok daha kolaydır."},{"k":"p","t":"Hak sahibi, helallik isteyene hakkını helal etmek mecburiyetinde değildir. Ancak helal etmesi daha güzel ve daha kazançlıdır. Nitekim Kur’an-ı Kerim’de Hz. Rasulullah [sallallahu aleyhi vesellem]’in zatında bütün Müslümanlara hitaben buyurulur ki:"},{"k":"ar","t":"خُذِ الْعَفْوَ وَاْمُرْ بِالْعُرْفِ وَاَعْرِضْ عَنِ الْجَاهِلِينَ ۞"},{"k":"q","t":"“Sen affetme yolunu tut, iyiliği emret ve cahillerden yüz çevir.” (A'râf Suresi, 199)"},{"k":"h","t":"Sahabelerin Helalleşmeleri"},{"k":"p","t":"Yüce dinimiz İslam, ırk, cinsiyet ve inanç ayrımı yapmaksızın bütün insanların haklarını kutsal ve dokunulmaz kabul etmiş, bu hakların ihlaline karşı maddi ve manevi birçok müeyyide getirmiştir."},{"k":"p","t":"Hz. Bilal-i Habeşi (radıyallahu anh) hazretlerine bir gün sahabenin ileri gelenlerinden Hz. Ebu Zer Gıfari (radıyallahu anh) hazretleri; 'Kara kadının oğlu’ diye hitap edince;"},{"k":"p","t":"Hz. Bilali Habeşi (radıyallahu anh) çok üzülür mahcup olur ve hemen üzüntüsünü beyan etmek için Rasulüllah'a [sallallahu aleyhi vesellem] gelir ve Ebu Zer Gıfari'nin (radıyallahu anh) kendisine 'kara kadının oğlu’ dediğini ve bu kelimeden incindiğini söyler.."},{"k":"p","t":"Bu olay üzerine Rasulüllah Efendimiz [sallallahu aleyhi vesellem], Ebu Zer Gıfari Hazretlerine (radıyallahu anh) der ki; ‘Ya Eba Zer; derhal git ve Bilal’den özür dile ve onunla barış!’... bu söz üzerine Hz. Eba Zer (radıyallahu anh), derhal Hz. Bilali Habeşinin (radıyallahu anh) evinin önüne gelir, Hz. Bilali Habeşi’yi (radıyallahu anh) çağırır, yere yatar yanağını yere koyar ve der ki;"},{"k":"p","t":"‘Ya Bilal! senin o siyah ayağın benim bu beyaz yüzüme basmadıkça buradan kalkmayacağım yüzüme bas ve bana hakkını helal et diye hitap eder!’"},{"k":"p","t":"Bilal-i Habeşi’nin (radıyallahu anh), Ebu Zer'i (radıyallahu anh) tutup yerden kaldırırdı ‘Bu yüz basılmaya değil, öpülmeye layıktır’ dedi."},{"k":"p","t":"Kul hakkı için helallik aldıktan sonra tevbe edip bir daha yapmamaya karar vermeli…"},{"k":"p","t":"Allah affedicidir. Kul, tevbe ettiğinde bütün günahları affedilir. Allah kendisine ortak koşmayı affetmez ve yine Allah'ın affetmediği tek günah kul hakkıdır. Yüce Allah dilediği kimselerin şirk dışındaki bütün günahlarını bağışlayabileceğini haber verdiği halde kul haklarına karışmamaktadır."},{"k":"p","t":"Allah Teâlâ, bizi kul hakkına girmekten muhafaza eylesin. Âmin"}],"cat":"Ahlak"},{"id":"hatme-i-hacegan","title":"Hatme-i Hacegân ve Zikir Meclisleri","sub":"Sohbet notu","desc":"Zikir meclisleri ve Hatme-i Hâcegânın fazileti","color":"#2F5233","mins":39,"paras":[{"k":"p","t":"Zikir Hak yolcusunun en önemli amelidir. Bu yüzden tasavvuf terbiyesinin ana hedefi, kalbi uyandırmak ve yüce Allah’a [celle celâluhû] bağlamaktır. Bütün mesele kalbin uyanmasıdır. Kalbi uyanmayan bir kimse taklitten bir türlü kurtulamaz. İbadetin gerçek tadını alamaz. İlâhî emirlerdeki hikmeti ve inceliği kavrayamaz."},{"k":"p","t":"Gavs-ı Cihan hazretleri (k.s) bir sohbetlerinde zikir hakkında şöyle buyurdu:"},{"k":"q","t":"“Zikir kalbin gıdasıdır; gıdasını almayan kalp zayıflar ve sonra ölür. Kalp ancak zikir ile beslenir, kuvvetlenir, tatlanır, manen hayat bulur. Haramlar ve işlenen günahlar ise şeytanın gıdasıdır. İşlenen günahlar, insanın kalbini zayıflatır; onun düşmanı olan nefsi ve şeytanı kuvvetlendirir. Bu nedenle, insanın içinde kalp, nefis ve şeytan devamlı mücadele halindedir. Rabbü’l-âlemîn [celle celâluhû], ‘Bilesiniz ki kalpler ancak Allah ’ın [celle celâluhû] zikriyle huzur bulur' buyurmuştur.”"},{"k":"p","t":"Allah Teala [celle celâluhû]  her anı zikirle dolu olan akıl sahiplerine dikkatle buyurmuştur ki; “Onlar, ayakta dururken, otururken, yanları üzerine yatarken (her vakit) Allah'ı [celle celâluhû] anarlar, göklerin ve yerin yaratılışı hakkında derin derin düşünürler (ve şöyle derler:) Rabbimiz [celle celâluhû]! Sen bunu boşuna yaratmadın. Seni tesbih ederiz. Bizi cehennem azabından koru!”"},{"k":"p","t":"Hak Teâlâ [celle celâluhû] diğer bir ayette de şöyle buyuruyor: \"Onlar, bıkıp usanmaksızın gece gündüz (Allah'ı) [celle celâluhû] tesbih ederler.\""},{"k":"p","t":"Diğer bir ayet de şöyledir: \"Onlar öyle erlerdir ki herhangi bir ticaret ve alışveriş kendilerini Allah'ı [celle celâluhû] zikretmekten, namazı kılmaktan ve zekâtı vermekten alıkoymaz. Onlar, yüreklerin ve gözlerin (dehşetten) ters döneceği günden korkarlar.\""},{"k":"p","t":"Ebü’d-Derdâ’nın (r.a) rivayet ettiği hadis-i şerifte Resûlullah Efendimiz (s.a.v) zikrin insana ne kazandırdığını şöyle anlatır:"},{"k":"q","t":"“Size amellerinizin en hayırlısını, Rabb’iniz [celle celâluhû] katında en temiz olanını, derecenizi en çok yükseltenini, altın ve gümüş infak etmekten, düşmanla karşılaşıp onları öldürmenizden veya onlarla savaşırken şehid düşmenizden daha hayırlı olanını haber vereyim mi? Bu amel, Allah’ı [celle celâluhû] zikretmektir.”"},{"k":"p","t":"Hz. Peygamber’in (s.a.v) zikrin faziletiyle ilgili hadislerinden bazıları şöyledir:"},{"k":"q","t":"“Her şeyin bir temizleyeni vardır, kalbi temizleyen de Allah Teâlâ’nın [celle celâluhû] zikridir .”"},{"k":"q","t":"“Her şeyin bir cilası vardır, kalbin cilası da Allah’ı [celle celâluhû] anmaktır.”"},{"k":"q","t":"“Rabb’ini [celle celâluhû] zikredenle etmeyen diri ile ölü gibidir.”"},{"k":"q","t":"“İçinde Allah [celle celâluhû] zikredilen ev ile Allah [celle celâluhû] zikredilmeyen evin misali, ölü ve dirinin misali gibidir.”"},{"k":"q","t":"\"Kim bir yere oturur da orada yüce Allah'ı [celle celâluhû] hiç zikretmezse, bu kendisi için bir noksanlık ve Allah [celle celâluhû] katında kınama sebebi olur. Kim bir yere uzanır da orada yüce Allah'ı [celle celâluhû] hiç zikretmezse, bu kendisi için bir noksanlık ve Allah [celle celâluhû] katında bir kınama sebebi olur. Kim bir yolda yürür de bu esnada yüce Allah'ı [celle celâluhû] hiç zikretmezse bu kendisi için bir noksanlık ve Allah [celle celâluhû] katında kınama sebebi olur.\""},{"k":"p","t":"Ebu Süleyman Dârânî (k.s.) der ki: “Cennete bir ova var, kul Allah’ı [celle celâluhû] zikre başladı mı melekler bu sahaya ağaç dikmeye başlarlar. Bazan meleklerden biri ağaç dikme işine ara verir. Neden duruyorsun? Diye sorulunca, namına ağaç diktiğim şahıs zikre ara verdi, (fütur getirdi) de ondan, diye cevap verirler."},{"k":"p","t":"Büyük ariflerden İbrahim b. Ethem (rh.a) zikrin güzelliği konusunda şöyle der: “Yüce Rabbim [celle celâluhû] kendisini seven ve çokça zikreden dostlarının kalbine öyle bir zevk koymuştur ki, eğer dünya sultanları bunun ne kadar tatlı olduğunu bilselerdi onu ele geçirmek için bütün ordularıyla ariflerin kalbine hücum ederlerdi. Ancak Allah [celle celâluhû] dostları onu gizlerler, sultanlar da ondan habersizdirler.”"},{"k":"h","t":"Zikir Meclisleri"},{"k":"p","t":"Hz. Peygamber (s.a.v) zikir meclislerini cennet bahçesi olarak tanıtmaktadır. Bir gün,"},{"k":"q","t":"“Sizden biriniz cennet bahçesini görürse hemen girsin ” buyurdu. Sahabiler,"},{"k":"q","t":"“Cennet bahçesi nedir?” diye sordular. Allah Resûlü [celle celâluhû],"},{"k":"q","t":"“Zikir meclisidir” diye cevap verdi."},{"k":"p","t":"İbn Ömer’in rivayetinde Resûl-i Ekrem (s.a.v), yukarıda anlatılan cennet bahçelerinden bahsettikten sonra hadisin devamında,"},{"k":"q","t":"“Allah Teâlâ’nın [celle celâluhû] seyyar melekleri vardır, zikir yerlerini ararlar, buldukları vakit onları kuşatırlar.  buyurdu."},{"k":"p","t":"Allâme İbn Allân es-Sıddıkî, el-Ezkâr şerhinde bu hadisi açıklarken şöyle diyor:"},{"k":"q","t":"“Zikir meclisine uğradığınız zaman siz de onlar ile zikredin veya onların zikirlerini dinleyin. Zira onlar şu anda ve gelecekte de cennet bahçelerindendirler. Nitekim Allah Teâlâ [celle celâluhû], ‘Rabb’inin makamından korkan için iki cennet vardır.’ buyurmuştur.”"},{"k":"p","t":"Ebû Hüreyre (r.a.) ve Ebû Said el-Hudrî’nin (r.a.) rivayetlerinde Allah Resûlü (s.a.v) şöyle buyurmuştur:"},{"k":"q","t":"“Herhangi bir kavim bir yerde toplanır ve Allah Teâlâ ’yı [celle celâluhû] zikrederlerse, zikirleri esnasında melekler onları tavaf edip kuşatır, rahmetullâh onları kaplar, üzerlerine bir sekine nâzil olur ve zikir meclisinde bulundukları müddetçe Allah Teâlâ [celle celâluhû] kendi indindeki meleklere onları göstererek bakın benim şu kullarıma diyerek onlarla iftihar eder.”"},{"k":"p","t":"Hz. Muâviye’den (r.a) rivayet edildiğine göre Allah Resûlu (s.a.v) bir gün ashabının yanına çıktı, onların halka kurup Allah’ı [celle celâluhû] zikrettiklerini görünce,"},{"k":"q","t":"“Burada oturup ne yapıyorsunuz?” diye sordu. Onlar,"},{"k":"q","t":"“Allah’ı [celle celâluhû] zikir ve hamdetmek için toplandık” dediklerinde, Resûl-i Ekrem."},{"k":"q","t":"“Şimdi Cebrâil geldi ve bana Allah’ın [celle celâluhû] sizinle meleklere övündüğünü haber verdi ’’dedi."},{"k":"p","t":"Bir gün Ebû Hüreyre (r.a) sokakta gördüğü halka,"},{"k":"q","t":"“Burada boşu boşuna ne duruyorsunuz; koşun mescide, orada Resûl-i Ekrem’in mirası bölünüyor. Siz de hakkınızı alın” der. Halk hemen mescide koşar ve böyle bir şey olmadığını görünce geri döner. Vaziyeti Ebû Hüreyre’ye (r.a) anlatırlar ve,"},{"k":"q","t":"“Biz bir taksimata tesadüf etmedik” derler. Ebû Hüreyre (r.a),"},{"k":"q","t":"“Ya ne gördünüz?” diye sorunca, onlar,"},{"k":"q","t":"“Kimi Kur’an okuyor, kimisi zikir yapıyor” dediler. Ebû Hüreyre (r.a),"},{"k":"q","t":"“İşte Resûl-i Ekrem’in mirası odur” dedi."},{"k":"p","t":"Ebû Hüreyre’nin (r.a) bildirdiğine göre Allah Resûlü (s.a.v) şöyle buyurdular:"},{"k":"q","t":"“Allah Teâlâ’nın [celle celâluhû] bazı melekleri vardır ki bunların vazifeleri yollarda dolaşıp ehl-i zikrin bulundukları yerleri aramaktır. Böyle zikir meclislerini de buldukları zaman hemen birbirlerine seslenip toplanırlar ve yeryüzünden gökyüzüne kadar o meclisin üzerini doldururlar. O zaman Cenâb-ı Hak [celle celâluhû] her şeyi bildiği halde onlara sorar:"},{"k":"p","t":"- Kullarım ne diyorlar? Melekler:"},{"k":"p","t":"- Seni zikir, tesbih, tekbir, tahmid ve temcid ediyorlar. Allah Teâlâ [celle celâluhû],"},{"k":"p","t":"- Onlar beni gördüler mi, diye sorar."},{"k":"p","t":"- Hayır, vallahi görmediler, derler. Tekrar sorar:"},{"k":"p","t":"- Beni görseler ne yaparlardı? Melekler:"},{"k":"p","t":"- Seni görselerdi sana olan tahmidleri ve ibadetleri çok şiddetlenir, tesbihleri artardı. Allah Teâlâ [celle celâluhû] yine sorar:"},{"k":"p","t":"- Peki, benden ne isterler? Melekler:"},{"k":"p","t":"- Cenneti isterler. Allah Teâlâ [celle celâluhû]:"},{"k":"p","t":"- Cenneti gördüler mi? Melekler:"},{"k":"p","t":"- Hayır, vallahi görmediler. Allah Teâlâ [celle celâluhû]:"},{"k":"p","t":"- Görseler nasıl olurdu? Melekler:"},{"k":"p","t":"- Görseler daha çok isterlerdi. Allah Teâlâ[celle celâluhû] :"},{"k":"p","t":"- Bir sıkıntıları var mı? Melekler,"},{"k":"p","t":"- Evet yâ Rab, cehennem ateşinden korkuyorlar, ondan sana sığınıyorlar, derler. Cenâb-ı Hak [celle celâluhû] yine merhametle sorar:"},{"k":"p","t":"- Onlar cehennemi görmüşler mi? Melekler,"},{"k":"p","t":"- Hayır, yâ Rab, görmediler, eğer görselerdi daha çok sakınırlar ve daha çok sığınırlardı, derler. O zaman Allah Teâlâ [celle celâluhû] şöyle buyurur:"},{"k":"p","t":"- Siz şahit olun ey meleklerim, ben onlara muhakkak mağfiret ettim."},{"k":"p","t":"Resûlullah (s.a.v) sözüne devamla şunu anlattı:"},{"k":"p","t":"- Meleklerden biri,"},{"k":"p","t":"- Onların arasında kendilerinden olmayan ve bir işi için gelen falan kimse de vardır, der. Allah Teâlâ [celle celâluhû]:"},{"k":"p","t":"- Onlar öyle bir cemaattir ki onların arasında bulunanlar da şaki olmazlar.”,"},{"k":"p","t":"Bir rivayette, Efendimiz (s.a.v), mescitte zikredenlerin yanına gelerek: “Sizin üzerinize Allah’ın [celle celâluhû] rahmetinin indiğini gördüm; ona sizinle ben de ortak olmak istiyorum.” buyurdular ve halkaya oturdular."},{"k":"p","t":"Yine Efendimiz (s.a.v), mescitte halka şeklinde toplanmış bir grup ashabının yanına uğradı. Onlara:"},{"k":"q","t":"“Burada ne yapıyorsunuz?“ diye sordu. Halkadakiler:"},{"k":"q","t":"“Allah’ı [celle celâluhû] zikrediyoruz, bizi İslam’a ulaştırdığı ve ihsanlarda bulunduğu için O’na hamd ediyoruz.” Dediler. Efendimiz (s.a.v) onlara:"},{"k":"q","t":"“Allah [celle celâluhû] için soruyorum, siz gerçekten bunun için mi oturdunuz?” diye sordu; Sahabeler:"},{"k":"q","t":"“Vallahi biz ancak bunun için oturduk.” dediler. Bunun üzerine Efendimiz (s.a.v):"},{"k":"q","t":"“Yanlış anlamayın, ben sizi suçlamak için yemin etmenizi istemedim. Ben sizin asıl niyetinizi öğrenmek ve size şu müjdeyi vermek için geldim. Bana Cibril geldi ve haber verdi ki: Allah [celle celâluhû] sizinle melekleri yanında övünmektedir.“"},{"k":"p","t":"Diğer bir hadiste de:"},{"k":"q","t":"“Herhangi bir topluluk sırf Allah [celle celâluhû] rızası için toplanıp Allah’ı [celle celâluhû] zikrederse, görevli bir melek semadan onlara şöyle seslenir: “Günahlarınız affedilmiş olarak kalkın, hiç şüphesiz günahlarınız iyiliğe çevrildi.“,"},{"k":"h","t":"Hatm-i Hâcegân"},{"k":"p","t":"Hâcegân, \"ulu zatlar, efendiler, büyük hocalar\" demektir. Hatm-i hâcegân \"büyük velilerin tertip, talim ve tatbik ettikleri hatim\" demektir. Bu zikre hatim ve hatme denmesinin bir sebebi şudur: Bu yolun büyükleri, müridleri ile bir meclis kurduklarında toplantıyı bu zikirle bitirirlerdi. Onlara has bir uygulama olarak bu zikre \"hatm-i hâcegân\" denilmiştir."},{"k":"p","t":"Bu zikirlere hatim denmesinin bir diğer sebebi, içinde okunan Fâtiha ve İhlâs'ların hatim sevabına denk olmasındadır. Çünkü Hz. Resûlullah (s.a.v), İhlâs sûresini üç defa okuyan kimsenin Kur'an'ı bir kere hatmetmiş gibi sevap elde edeceğini müjdelemiştir. Büyük hatmede toplam 1000 adet ihlâs sûresi okunmaktadır. Bu da üç yüz otuz üç (333) Kur'an hatim sevabına denktir."},{"k":"p","t":"Hatm-i hâcegân, sâdât-ı Nakşibendî nazarında çok kıymetlidir. Onun için büyükler bu zikre çok önem vermişlerdir. Öyle ki çok ciddi bir hastalık ve zor yolculuk halleri hariç, bütün ömürleri boyunca bu zikri yapmışlardır."},{"k":"p","t":"Nakledildiğine göre Sultan Seyyid Muhammed Raşid (k.s.) hazretleri, müridleriyle birlikte karayolu ile hac yolculuğuna çıkmıştı. Hazret, yolculukta bile hatmeyi terk etmemişti. Hatta çölde arabaların arkasında halka kurdurarak hatmeyi yaptırmıştı."},{"k":"p","t":"Muhammed Diyaüddin (k.s) birinci dünya savaşı Rus işgalinde savaşın en şiddetli zamanlarında talebeleriyle cemaat olup vakit namazlarını kıldırıyor, ikindiden sonra hatme yaptırıyordu. Etraftan, cephede olduklarını, namazı cemaatle kılmanın veya hatmenin gerekmediğini söyleyenler oluyordu. Muhammed Diyaüddin hazretleri her defasında onlara şöyle diyordu:"},{"k":"p","t":"- Cihat vazifeye mani değilse, biz hem cihat ederiz hem de vazifelerimizi hakkıyla yaparız."},{"k":"p","t":"Hatme, hem cemaat hem de ferdî olarak yapılan bir halka zikridir. Kitap ve Sünnet'te övülen ve teşvik edilen zikir çeşitlerinden biridir. Nitekim Kur'ân-ı Kerîm'de sabah akşam dua, ibadet ve zikir edenlerle beraber bulunmaya şöyle teşvik edilmiştir:"},{"k":"q","t":"\"Sabah akşam Rab'lerine, O'nun rızasını dileyerek dua edenlerle birlikte candan sebat et. Dünya hayatının süsünü isteyerek gözlerini onlardan çevirme.\""},{"k":"p","t":"Bu âyet-i celile nâzil olduğu zaman, Resûl-i Ekrem (s.a.v) evinden çıktı ve bu yalvaran topluluğu aramaya koyuldu. Bu esnada üzerlerindeki elbiselerinden başka bir şeyleri olmayan, başı açık, derisi kuru bir topluluğa rastladı. Hepsi Allah'ı [celle celâluhû] zikrediyorlardı. Onlarla beraber oturdu ve,"},{"k":"q","t":"“Allah'a [celle celâluhû] hamdolsun ki ümmetimden de benim kendileriyle birlikte sabretmemi emir buyurduğu kullar yaratmıştır.\" dedi."},{"k":"p","t":"Bu yolun büyükleri olan veliler, insanların Allah Teâlâ'ya [celle celâluhû] ulaşabilmesi için birtakım vesileler aramışlardır. Bunu da tecrübe ederek müridlerine öğr
