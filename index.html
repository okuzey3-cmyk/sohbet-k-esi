etmişlerdir. Hatm-i hâcegân da bunlardan biridir."},{"k":"p","t":"İşte halka şeklinde yapılan Hatm-i Hacegan da bu övülen zikir çeşitlerinden birisidir. Görüldüğü gibi halka hâlinde cemaatle zikir yapmak övülmüş fakat halkada ne okunacağı konusunda bir şey belirtilmemiştir. Bunun için, zikir sayılacak şeylerden ne okunsa zikir yapılmış ve bu müjdeye ulaşılmış olur. Hatmede okunan zikir ve dua çeşitleri de sünnet-i seniyyeden alınmıştır."},{"k":"p","t":"Hatmeyi bugünkü usul üzere Abdulhâlik Gücdevani Hz.leri tertip etmiştir. “Hatm-i Hâcegân” diye de anılır. Hâcegân, ulu zatlar, efendiler, büyük hocalar demektir. Hatm-i Hâcegân büyük velilerin tertip, talim ve tatbik ettiği hatim demektir."},{"k":"h","t":"En şerefli meclis"},{"k":"p","t":"Bir defasında Efendimiz (s.a.v) zikir için toplanan bir halkaya uğradı ve:"},{"k":"p","t":"”Ümmetim içinde benim kendileriyle birlikte olmamı emrettiği kimseleri yaratan Allah’a [celle celâluhû] hamd dolsun.” buyurarak aralarına oturup onları şereflendiler."},{"k":"p","t":"O günkü Müslümanların ilim ve zikir meclisini saadetli vücudu ve cenneti süsleyen kalb-i şerifi ile şereflendiren Efendimiz (s.a.v), daha sonra bu emaneti koruyan, Allah [celle celâluhû] için halka kuran, oturup Yüce Allah’ı zikreden, kendisinin tek mirası olan ilmi öğrenen kimseleri de yalnız bırakmaz. Allah Teala’nın [celle celâluhû] izniyle bu garib ümmetini de rûhâniyeti ile şereflendirir; sevgisi ve duası ile destekler."},{"k":"p","t":"Gavs-ı Bilvânisî (k.s) hatmedeki bu sır ve şeref hakkında şöyle sohbet buyurmuştur:"},{"k":"q","t":"“İnsanlar, bir araya gelip hatme/zikir yapmanın faziletini bilselerdi, hasta ya da sakat olsalardı bile yine de sürünerek hatmeye gelirlerdi. Çünkü hatmenin manevî reisi Hz. Rasûl-i Ekrem (s.a.v) Efendimizdir. O, bu meclislere manen teşrif buyurur ve oradakilerin dileklerini Allah Teala’ya [celle celâluhû] ulaştırır. Efendimizin (s.a.v) ilahi huzura arzettiği şeyler geri çevrilir mi?”"},{"k":"p","t":"Hangi Amel..."},{"k":"p","t":"Bir gün Gavsul Azam Şeyh Seyyid Abdülhakim Elhüseynî (k.s.) hazretlerine,"},{"k":"p","t":"- Efendim, bizler hatme yapıyoruz, sâdâtlar da buna çok ehemmiyet veriyorlar. Acaba bu hatmelerden bize ne gibi fayda var, diye soruldu. Hazret şu cevabı verdi:"},{"k":"p","t":"- Hatmenin birçok faydası vardır. Şu anda Resûl-i Ekrem (s.a.v) bana, \"Ümmetime en iyi ve en faydalı bir ameli tavsiye et\" diye buyursa benim hangi ameli tavsiye edeceğimi bilir misiniz? Hatm-i hâcegânı tavsiye ederim. Çünkü hatmenin reisi Resûl-i Ekrem'dir. Silsile-i Şerif okunmaya başladıktan sonra, Resûlullah'ın (s.a.v) ruhaniyeti başta olmak üzere, diğer bütün sâdâtların ruhaniyeti o halkaya iner ve orada bulunan bütün cemaatin arzularını kaydederler. Silsile okunması tamam olduktan sonra Resûl-i Ekrem'in (s.a.v) ve sâdâtların ruhaniyeti o halkada bulunanların arzu ve isteklerini doğrudan Rabbü'l-âlemin'e [celle celâluhû] arzederler. Resûlullah'ın (s.a.v) götürdüğü ve Allah'a [celle celâluhû]) arz ettiği istekler hiç reddedilmez."},{"k":"p","t":"Gavs-ı Bilvânisî (k.s.) bir sohbetinde hatme yapmanın ve zikretmenin ehemmiyetini şöyle dile getirmiştir:"},{"k":"q","t":"“İnsan, günde iki defa sâdâtın ruhaniyetini hazır etmeli ve nazarları altına girmelidir. Biri hatmede, biri de vird çekerken... Günde bir veya iki defa sâdâtın nazarına giren kimse için korku olmaz. Sâdât-ı Nakşibendi (ks) onları bırakmaz, Peygamber Efendimiz (sav) onu yalnız bırakmaz.”,"},{"k":"p","t":"Sultan Seyyid Muhammed Raşid Hz. (k.s.) hatme için şöyle nasihat etmiştir:"},{"k":"q","t":"“Sadat-ı Nakşibendi yanında hatme çok kıymetlidir. Hatmesiz kalınmamalıdır. İnsan Nakşibendi olduktan sonra nerede bir hatme yapılırsa hissesi içindedir. Bir defa hatme bir de vird çekerken sadatın ruhaniyetinin nazarı altına girmelidir. Tarikate girip de mazeretsiz olarak evde oturup da hatmeye girmeyen kimseyi ne Peygamber (s.a.v.) ne Sadat-ı Kiram (ks) tanır. Camiden ve hatmeden uzak kalmayınız.”"},{"k":"p","t":"Sultan Seyyid Muhammed Raşid Hz. (k.s.) diğer bir sohbetlerinde:"},{"k":"q","t":"\"Hatmede okunan sûre ve zikirler, Peygamber Efendimiz'in (s.a.v) ve diğer büyük zatların ruhuna bağışlandıkça, o ruhlar, zikir meclisinde bulunanları tanırlar. Bu tanışma, ahirette şefaate ulaşmaya ve sıkıntılı zamanlarda himmetin gelmesine vesile olur. Bir kişi, Nakşibendî (ks) olduktan sonra, bütün hatme meclislerindeki sevaptan istifade eder. Hayatta ve öldükten sonra da amel defteri kapanmaz.\""},{"k":"p","t":"Şeyh Abdurrahman-ı Tâhî hazretleri (k.s):"},{"k":"q","t":"\"Rabıta yapmak, sohbetlere devam etmek ve hatme, bu yolun en önemli esaslarındandır. Sûfîler bunlara devam etsinler. Sohbeti ise asla bırakmasınlar. Bütün himmet, cezbeyle yapılan sohbettedir.\""},{"k":"h","t":"Hatme Güzel Bir Sadaka-i Cariyedir"},{"k":"p","t":"Hatme/hatim, hem dünya hem de ahiret hayatı için insana büyük faydalar sağlar, ölü de diri de hatmeden istifade eder. Hatme, hayatta olana şevk ve muhabbet katar, ölü olanın sevap defterine bile “salih amel” adıyla manevi kazanç sağlar. Henüz günah işleme yaşına gelmemiş, ergen olmamış çocuklara bile faydası vardır. Mesela çocuk yaşta olan kimsenin, işlediği iyiliklerin faydasını artırır ve o kişide ileride bunun karşılığı ortaya çıkartır. Onun için abdest almasını bilen, namaz kılmasını öğrenen ve hatme sırasında usulüne göre davranabilecek çocuğun hatmeye girmesine müsaade edilir."},{"k":"p","t":"Hatmede okunanların sevabı zikrin sonunda, önce Hz. Peygamber (s.a.v) Efendimize, peşinden Sahabe-i Kirâm ve Sâdâtı Kiram’ın (büyük veliler) ruhlarına hediye edilmektedir. Bu zikirlerin sevabı ayrıca bu silsileye tabi olan, onları sevip Allah [celle celâluhû] yolunda talebelik yapan bütün müntesiplere ve diğer meşreplerdeki Hak yolcularının ruhlarına da hediye edilmektedir."},{"k":"p","t":"Bu zikir sadece mürşid tarafından belirli günlerde tek bir yerde değil, bu yola müntesip olanların bulunduğu hemen her yerde, her gün yapılmaktadır. Allah [celle celâluhû] rızası için böyle bir halkaya girip kıyamete kadar yapılacak zikir ve hayırların sevabına hissedar olmaktan daha kârlı hangi yatırım vardır? Bu ne güzel bir sadaka-i cariyedir ki, sahibine kıyamete kadar sevap ve nur akıtmaya devam eder."},{"k":"p","t":"Muhammed b. Hânî hazretleri (k.s), Âdâb kitabında, Mevlânâ Halid Zülcenaheyn’in (k.s) şu sözünü nakleder:"},{"k":"q","t":"“Bu tarikat-ı Nakşibendîyye’nin çocukla ihtiyara, ölüyle diriye menfaati birdir.”"},{"k":"p","t":"Ölen kabrinde, kalan dünyada iken menfaat görür. Zürriyetimiz kesildi, bir Fatihaya muhtaç olduk; o zaman Nakşibendi sofisi olarak ölürsek, dünyada kıyamet kopana kadar nerede bir Nakşibendî hatm-i hâcegânı kurulursa, muhakkak bize de sevabından gelir. Bugün dünyanın değişik yerlerinde her gün binlerce hatm-i hâcegân yapılıyor. Onun için kimse kabrinde garip kalmaz. Okunan bin İhlâs sûresi ve İnşirah sûresi, Mülk ve Nebe sûresinin sevabı illâ ki kabrimize de gelir."},{"k":"p","t":"Gavs-i Bilvanisi (k.s) Hz.leri şöyle buyurmuştur:"},{"k":"q","t":"“İnsanda muhalefet olmadıktan sonra, Nakşibendî (ks) olduktan sonra nisbet devam eder, kesilmez. Bağda da olsa, dağda da olsa menfaati her zaman devam eder. Okunan her Fatiha'ya, yapılan her hatmeye o da dahil olur. İnsan Nakşibendî olduktan sonra, ister mürid, isterse sâlik olsun, bütün yapılanlardan istifade eder. Nerede bir hatme yapılırsa hissesi içinde olur.”"},{"k":"h","t":"Hatme-i Hâcegânın Hikmetleri"},{"k":"p","t":"Sâdât-ı kiramdan Şeyh Abdurrahman-ı Tâhî hazretlerinin (k.s) ilk halifesi, Muhammed Sami Erzincânî (Pîr-i Sâmi) hazretleri (k.s), İmam Birgivî hazretlerinin Tarikat-ı Muhammediyye adlı eserinden naklettiği bir sohbetinde şunları anlatır:"},{"k":"q","t":"“Şah-ı Nakşibend hazretleri (k.s) buyurmuş: “Bu yol ahlâk yoludur. Kötü ahlâkı değiştirip yerine iyi olan ahlâkı, huyları koymak içindir.” Kötü ahlâkı ıslah etmek her mümin için farzdır. Kötü ahlâkın ıslahı ise ancak tarikat ameliyle mümkündür. Yetmiş dokuz kötülenmiş ahlâk karşısında yetmiş dokuz da övülmüş güzel ahlâk vardır. Hatmede okunan yetmiş dokuz İnşirâh sûresi (Elemneşrahleke), müridin bu kötü huyların ilacı ve tedavisi için okunur. Bir kimse bunu tek başına okusa, elbette faydasını görür, ama ne kadar? Denizin yanında damla ne kadarsa o kadar! Bu sûre, “Biz senin kalbini açmadık mı? Senden yükünü indirmedik mi?”  mealindeki âyetlerle başlar. Mürid, hatme esnasında kendisine taş verilmemiş de olsa, hatme sırasında hemen hepsini okumuş gibi sevap alır. Ne kadar evliyanın ervahı var ise o zikir meclisine iştirak eder."},{"k":"p","t":"Hatmede zâhirî hesaba göre bile otuz üç Kur’an hatmi yapmak gibi sevap vardır. Çünkü (büyük) hatmede 1000 defa ihlâs-ı şerife okunur. Üç İhlâs-ı şerife okumanın bir Kur’an hatmi kadar sevap olduğuna dair hadisler vardır. Şu halde büyük hatmede 333 Kur’an hatmi gibi sevap vardır. Bu yüce Nakşibendî yolu, Allah Teâlâ’ya [celle celâluhû] giden bir yoldur. Cenâb-ı Hakk’ın [celle celâluhû] bin bir güzel isminin tecellisine insanı ulaştırır."},{"k":"p","t":"İmam Nevevî hazretlerinin (rh.a) bildirdiğine göre; \"İhlâs-ı şerife sûresinin okunması, okuyanın yüce Allah'a [celle celâluhû] karşı muhabbetini artırır. Muhabbetin göstergesi ise istikamettir.'"},{"k":"p","t":"Tarikat, fâniliğin şuurunda olmak demektir. Kur’an-ı Kerîm’de mealen zikredildiği gibi: “Yeryüzünde olan her şey fânidir. ”  Bunun sırrını ortaya çıkarmak için hatme başlarken rabıta yapılır. Rabıta yapan, şeyhinde fâni olmayı öğrenir. Bu manevi hali (fenâ makamı) bilen de Resûlullah’da (sav) ve Rabb’inde [celle celâluhû] fâniliği idrak eder. Onun için bu tarikat, tövbe ile başlar. Hatmeye başlarken yirmi beş defa “estağfirullah” denir. Bunu yaparken parmağınızla sayın. Elinizdeki taş miktarınca okuyun; ne bir eksik ne bir fazla."},{"k":"p","t":"Hatme duası bitince de Kur’an’dan bir sûre okunur. Hatme sevaptır niyetiyle bu zikre girilmez. Bu niyetle gelen yorulur. Çünkü hatme, bu tarikatın bir amelidir. Tarikatın ameli ise terkedilmez. Sevap zaten onun içindedir. Büyükler buyurmuş: “Cenneti istemek Allah [celle celâluhû] dostlarına haramdır. Cennet, ancak yüce Allah’ın [celle celâluhû] cemalini görme yeridir. Onun için cennet istenir.” Mürid de (yüce Allah’ın [celle celâluhû], Resûlullah’ın ve mürşidinin razı olduğu işleri yaparak) efendisinin rızasını kazanmaya bakmalıdır. Onun rızasını kazanmadan, yine onun mülkünden elinde bir şey geçmiş olsa bile neye yarar? Ama onun rızasını kazanırsan varını yoğunu sana ikram eder.”"},{"k":"h","t":"Yâ Bâki Entel Bâki"},{"k":"q","t":"“Ya Bâkî ente’l-bâkî” cümlesi, ameliyat eden cerrah gibi kalbi günahlardan keser. Bu ameliyatın yapılması gerekir, çünkü insan mahiyeti itibariyle her şeye muhabbet duyacak istidatta yaratıldığından kalbi birçok sevgiliyle dolar. Sevgilisi ne kadar çoksa derdi de o kadar çoktur. Bu sevgililerin de vefası olmaz, hepsi başa dert olup giderler. İnsan kalbi bunun ıstırabını yaşar. Allah’tan [celle celâluhû] gayrı her şey insanı terk eder. İşte gerçek aşk da, O’nu, hiç terk etmeyecek olanı sevmektir. Ne o sevgili son bulur, ne O’nu sevmek..."},{"k":"p","t":"İnsan neyi severse ona koşar. Nakşibendî büyükleri, sahte sevgilerden kurtulup gerçek sevgiliye yönelmenin ilacını bulmuşlardır. Çevrelerine toplanan insanlara, Allah’ın [celle celâluhû] nasip ettiği bu dermanı nasıl kullanacaklarını öğretirler."},{"k":"p","t":"Afyon uyuşturup alkol sarhoş ederken, bunun aksine, “bâkî olan, sonsuz olan yalnız sensin, senden gayrı her şey fani” anlamını taşıyan “Ya Bâkî ente’l-bâkî” cümlesi uyandırır, gerçeği, gerçek sevgiyi gösterir. Bu mana kalpte ve kanda dolaşırken, insanı geçici, bozulmaya, yok olmaya mahkum sevgililerden kurtarır. Kalbin, haddi sınırı olmayan bir sevme kabiliyeti vardır. Bu kabiliyete uygun sevgilinin de haddinin sınırının olmaması gerekir. Allah Tealâ’dan [celle celâluhû] başka bu özelliğe sahip sevgili olmaz."},{"k":"p","t":"Nakşibendî yolunun usulünden olan hatme-i hacegânı yapan kişi Allah’a şöyle der: “Ya Rabbî! Her sevgilim bırakıp gidiyor. Bedenimi sevdim, ihtiyarladı. Karımı sevdim, kocadı. Kızımı sevdim, el aldı. Paramı sevdim, yel aldı. Ya Rabbî, bana ebedi bir sevgili ver.”"},{"k":"h","t":"Hatme-i Hâcegânın Faydaları"},{"k":"p","t":"Bu yolun büyükleri olan velîler (sâdât-ı kirâm), insanların Allah Teâlâ’ya [celle celâluhû] ulaşabilmesi için birtakım vesileler aramışlardır. Bunu da tecrübe ederek müridlerine öğretmişlerdir. İşte hatme-i hâcegân da bunlardan biridir."},{"k":"p","t":"Sâdât-ı kirâm, hatme-i hâcegânın gelebilecek belâ ve musibetleri defettiğini, duaların Allah Teâlâ [celle celâluhû] tarafından kabul edilmesi için bir vesile olduğunu, aşağıda zikredileceği gibi Sâdât-ı kirâmın yaptığı usuller de gözetilerek yapıldığında müridlere sayısız mânevî faydalar sağlayacağını anlatmışlardır."},{"k":"p","t":"Nitekim Hâce Abdülhâlik-ı Gucdüvânî  (ks) ve Şah-ı Nakşibend (k.s) ve sâdât-ı kirâm, hatme-i hâcegânın, Allah’tan [celle celâluhû] dileklerin kabul edilmesinde, arzu ve isteklerin yerine gelmesinde çok tesirli olduğunu söylemişlerdir. Özellikle pazartesi, perşembe ve cuma günleri ikindi veya yatsı namazından sonra..."},{"k":"p","t":"Mürid, usulüne uygun olarak hatme-i hâcegân duası okunmaya başlayınca, hâsıl olacak sevabı başta sevgili Peygamber Efendimiz’in (s.a.v) mübarek ruhlarına ve Ehl-i beyt’ine gönülden bağışlar. Ayrıca hatme duası sırasında adı zikredilecek olan sâdât-ı kirâmın da ruhlarına hediye eder. Sâdât-ı kirâmın her birinden, Allah [celle celâluhû] tarafından muradının yerine getirilmesi için vesile olmalarını ister. Onlarla tevessül eder ve istimdat ister."},{"k":"p","t":"Hatme, hem zâhir hem de bâtında beraberliktir. Bu tür meclislere katılanlara, yüce Allah'ın [celle celâluhû] manevi askerleri yardım eder. Hatme, insanın içindeki günahları temizler. Hatmede Rabbü'l-âlemin, dostlarının üzerine rahmet ve nurunu indirir. Biz de rahmet ve nurun olduğu yere gidersek istifade etmiş oluruz."},{"k":"p","t":"Gavs-ı Bilvânisî Seyyid Abdülhakim (k.s) hazretleri de, “Büyük hatmede on dört Fâtiha, salavat-i şerifeler, 1000 İhlâs-ı şerife, İnşirâh sûresi okunur. Bütün bu okunanlar Peygamber Efendimiz’e ve sâdât-ı kirâma hediye edilirler. Tabii ki karşılıksız kalmaz; insana büyük menfaatler temin eder” buyurmaktadır.,"},{"k":"h","t":"Hatmi Hâcegân Bela Ve Musibetleri Defeder"},{"k":"p","t":"Şah-ı Hazne yazmış olduğu bir mektupta hatmenin zahiri faydaları hususunda şöyle buyuruyor:"},{"k":"q","t":"\"Hatme hakkında, bu tarikatın büyük zatlarından rivayet olunan usul şudur: Onlar hatm-i hâcegânı, bir bela ve hadise vukuunda çok yaparlardı. Hınıs ve Varto depremlerinden sonra Erzurum'dan Kasrik'e gittim. Bu depremlerde çok az hasar gören ve yıkılmayan evlerin hatmi hâcegân evleri olduğunu bana söylediler. Hatm-i hâcegân ve sohbetler belaların kalkmasına ve rızkın artmasına sebep olur. Size gelince, sizler, hatmi hâcegânı günde bir sefer yapmalısınız. Artırmamalısınız, eksiltmemelisiniz.\""},{"k":"h","t":"Kıssa: Hatmeyi İhmal Etmenin Sonucu"},{"k":"p","t":"Şeyh Şâmil hazretleri Ruslar tarafından esir alınınca onlara, hacca gitmek istediğini söylemiş ve serbest bırakılmıştı. Hacca giderken mürşidi Cemâleddin Kumukî (k.s.) hazretlerinin yanına uğramıştı. Şeyh Cemâleddin hazretleri, Şeyh Şâmil'e, \"Otuz yıldan fazla Ruslar'la mücadele ettin ve onlara hep galip geldin. Ne zaman hatmeyi terk ettin, işte o zaman Ruslar'a esir düştün\" buyurdu."},{"k":"h","t":"Hatmede İnsanın İçi Temizlenir"},{"k":"p","t":"Rabbü’l-âlemîn [celle celâluhû], dostlarının üzerine rahmet ve nurunu indirir. Biz de rahmet ve nurun olduğu yere gidersek istifade ederiz. O vakit Allah [celle celâluhû]  bizi sever. İşte Allah’ın [celle celâluhû] sevgisini kazanabilmek için içimizi temizlememiz gerekir. Allah’ın [celle celâluhû] zikredildiği yere rahmet iner. Allah’tan [celle celâluhû] gayrısının isminin anıldığı yere ise zulmet... Mürşidimize rabıta yaparken, hatme yaparken İlâhî rahmet yanımıza gelir. Günahlardan temizlenmemiz o zaman daha kolay olur."},{"k":"p","t":"Hatme, insanın içindeki günahları temizler. Büyük hatmenin sevabı çoktur. Dergâhta yapılan hatmenin insana faydası ise çok daha fazladır. Bir de ikindi hatmesinden sonra Âmme, yatsı hatmesinden sonra da Tebâreke/Mülk sûresini okumak, hatmenin tesirini yedi kat artırır."},{"k":"p","t":"Hatme insana daha çok muhabbet kazandırır. Muhabbet alamayan kişi, kendi hatasından dolayı alamaz. Kişi tek başına da olsa hatme yapabilir/yapmalıdır. Yüce Mevlâ, sevdiğinin hatırına insanın içini temizler."},{"k":"p","t":"Hatmenin faydasını şöyle bir misalle anlatmak mümkün: Bir insan (büyük günah hariç) zulmet ve gaflet ehli insanların meclisinde oturup kalksa, bu oturup kalktığı meclislerin sayısı iki bini de bulsa, hatmeye girmekle o meclislerin zulmetinden ve manevi pisliğinden kirlenen kalp temizlenir."},{"k":"p","t":"Rahmetli Sultan Seyyid Muhammed Raşid hazretleri de (k.s) hatmeyi çamaşır makinesine benzetirdi ve, “Çamaşır makinesinin elbiseleri temizlemesi gibi hatme de insanın kalbini temizler” derdi."},{"k":"p","t":"Hatmenin sadece bize değil, hatmenin yapıldığı beldeye de faydası var. Ümmet-i Muhammed’in de menfaatine bir ameldir hatme... Âfet, deprem, savaş gibi pek çok hadiseyi savuşturur. Hatme, yapıldığı beldenin manevi bir sigortası gibidir."},{"k":"p","t":"Hatme meclislerinin sayısının artması, o beldenin çevrenin de çehresini değiştiriyor. (Dr. Ahmet Çağıl diyor ki) Ben bunu kendim tecrübe ettim. Çorum’da hatme meclisinin sayısı artmaya başladıkça başörtülü insanların çoğaldığını, başı açık gezenlerin azaldığını müşahede ettim. Bakın hatmenin menfaati sadece bize değil, etrafa da faydası var."},{"k":"p","t":"Üstat Bedîüzzaman Said Nursi (rh.a) hazretleri küçük hatme hakkında, “Nakşîler’in rüesasından (hocalarından) bir kısmı, bu iki cümle ile kendilerine bir hatme-i mahsus yapıp muhtasar (kısa) bir hatme-i Nakşiye hükmünde tutuyorlar. ‘Yâ bâkî ente’l-bâkî’ bir ameliyat-ı cerrahiye hükmünde kalbi mâsivadan tecrid (soyma) ediyor, kesiyor” demektedir. Görüldüğü üzere hatm-i hâcegândaki sözlerin muhtevası, kalbi Allah’tan [celle celâluhû] gayri düşünce ve muhabbetten kesiyor."},{"k":"h","t":"Kıssa: Hatmeden Uzaklaşma İlerlemeye Engel Olur"},{"k":"p","t":"Muhammed Emin Erbîlî  (rh.a) hazretlerinin yanında bulunan tanınmış âlimlerden Şeyh İbrahim Nâci şöyle anlattı:"},{"k":"q","t":"“Bir Cuma akşamıydı. O gece Ahmed-iBedevî hazretlerinin doğum yıl dönümüydü ve mevlid okutulacaktı. Ben de, ‘Bugün mübarek gündür, Ahmed-i Bedevî hazretlerini (ks) ziyaret edeyim’ dedim. Muhammed Emin Erbîlî hazretlerinden (ks) izin istedim. Bana, ‘Bu gece hatme yapacağız, gitmek istersen sen bilirsin’ dedi."},{"k":"p","t":"Aslında Muhammed Emin Erbîlî hazretleri (ks) , müridlerin hatmeye katılmaları konusunda çok titiz davranır ve şöyle derdi:"},{"k":"p","t":"‘Eğer bir mürid hatme yapmaktan uzaklaşırsa, tek başına çok zikir yapsa da bu yolda ilerleyemez. Hatme yapmayı geciktirirse, müridin mânevî gelişiminde tedricen noksanlık meydana gelmeye, darken hatme yapmayı tamamen terketmeye başlar, Allah [celle celâluhû] korusun! Kalp, yanmakta olan kandile benzer. Zikre devam etmek, kandile yağ koymak gibidir.  Hatmeye katılmak, kibritle kandili yakmaya benzer. Kandilin ışığından yararlanmak isteyen kişinin, hem yağa hem de kibrite ihtiyacı vardır.’"},{"k":"p","t":"Ben de bir an evvel mevlid merasimine yetişeyim diye hatmeye girmedim. Bir deveye binerek kervana katıldım. Bir müddet sonra şiddetli göz ağrısı başladı. Tanta’ya yaklaştıkça gözağrım arttı. Gece boyunca hiç uyuyamadım. Seyyid Ahmed-i Bedevî hazretlerinin (ks) kabri başında sabahladım. Ancak merasim için ne gelen vardı ne de giden. O sırada Seyyid Ahmed-i Bedevî hazretlerinin (ks) kabrine yöneldim:"},{"k":"p","t":"‘Mürşidime rica edin, o size kırmaz, beni affetsin’ diye medet diledim."},{"k":"p","t":"Aradan çok geçmedi. Göz ağrılarım geçti. Sanki hiç birşey olmamış gibiydi; rahatça görebiliyordum. Hemen deveme bindim. Doğruca Mısır’a geldim. Mevlânâ Muhammed Emin Erbîlî (ks) hazretleri beni görünce,"},{"k":"p","t":"‘Hoşgeldin’ dedi ve tebessüm etti.”"},{"k":"h","t":"Kıssa: Hatmedeki Ameliyat"},{"k":"p","t":"Dr. Ahmet Çağıl abimiz anlatıyor, Avukat bir kardeşimiz vardı. Almanya’da oturan kayınpederini ziyarete gittiklerinde kendisinin yaşadığı bir olayı bana şöyle anlattı: Kayınpederimin ortağı, kaynak yaparken gözüne metal parçası isabet etmiş ve bir gözü görmez olmuş. Hemen doktora götürmüşler. Alman doktor, muayene ettikten sonra,"},{"k":"p","t":"- Gözünde bir damar kopmuş, uçları da tamamen birbirinden uzaklaşmış. Tıbben yapabileceğimiz hiçbir şey yok, demiş."},{"k":"p","t":"Arkadaş çaresiz evine geliyor. Ve başına gelene katlanmaya çalışıyor. O günlerde de sufîlerin bulunduğu yere gidip gelmeye başlıyor. Tövbe alıyor, hatmelere katılıyor. Gözünün tekrar görmesi için hiçbir zaman bir başka yerden ve olaydan da medet ummuyor. Çünkü doktorlar, “Tıbben yapabileceğimiz hiçbir tedavi yok” dedikten sonra haline razı olmaya ve alışmaya da başlamış."},{"k":"p","t":"Bir gün hatmeye oturuyorlar. Gözlerini kapatıp, estağfirullah dedikten sonra Peygamber Efendimiz (s.a.v) yanında Gavs-ı Cihan hazretleri ks ile beraber hatmeye manen teşrif ediyor. Gavs cihan (ks)hazretlerinin ellerinde de tıp doktorlarının kullandığı aletler var."},{"k":"h","t":"- Sana göz ameliyatı yapacağız, diyor. Hiç korkma!"},{"k":"p","t":"Hatme bu arada devam ediyor. Mübarek, eliyle gözüne müdahale ediyor, o kopmuş olan damarları birbirine bağlıyor. Sonra da ameliyatı tamamlayıp gözden kayboluyor."},{"k":"p","t":"Adam diyor ki:"},{"k":"p","t":"- Hatmeden sonra gözümü açtım baktım. Her taraf aydınlık! Rahatlıkla görebiliyorum. O gün hemen beni muayene eden doktorun yanına vardım. Alman doktor gözlerine inanamayarak, “Tıbben bunun olması mümkün değil! Çünkü o gün baktığımda iki damarı birbirine eklemenin imkânı yoktu” dedikten sonra,"},{"k":"p","t":"- Bu, bir mucize! Ben Katolik bir hıristiyanım. Benim dinime göre böyle mucizeleri ancak İsa (a.s) yapabilir, dedi."},{"k":"p","t":"Ben de bunun üzerine başıma gelen hadiseleri kendisine anlattım. Alman doktor,"},{"k":"p","t":"- Kardeşim! Sizin bağlanmış olduğunuz manevi büyüğünüz, gerçekten çok büyük biriymiş. Sakın o büyük zattan ayrılmayın, dedi."},{"k":"p","t":"Avukat arkadaşım,"},{"k":"p","t":"- Ben bu hadiseyi duyunca pek inanamadım. Kayınpederimin ortağının yanına gittim. Bizzat kendisinden dinledim. Ancak o zaman kalbim mutmain oldu, dedi."},{"k":"p","t":"Semerkand dergisi 2010 yılı Nisan ayı sayısında  hatme-i hacegan konusu şöyle ele alınmıştır ; Kapılar örtülür, yalnızca daha önceden yol hazırlığını yapmış olanlar diz dize halkalanır sonsuzluk kervanının son katarında. \"Estağfurullah\", yolculuğun başlama komutudur. Yürüyüşümüzü zorlaştıracak, hızımızı kesecek bütün ağırlıklar yine \"Estağfirullah\" komutuyla terk edilir. Masivaya dalmamak, şeytanın çağırdığı yollara sapmamak için gözler kapatılır.\n\nFarkında olsak da olmasak da dünya üzerinden geçip giden birer yolcuyuz hepimiz. Tuttuğumuz yoldan, yürüyüşümüzden sorguya çekileceğiz. İmtihanımız bir yol tercihinden ibaret.\n\nRasul-İ Ekrem s.a.v.'in, Abdullah İbn Mes'ud r.a. ve yanındaki sahabi topluluğuna, elindeki çubukla toprağa çizip işaret buyurdukları üzere bir \"Allah'ın [celle celâluhû] yolu\" var bir de \"şeytanın her biri üzerinde durup insanları çağırdığı yollar\" var. Gerçi En'am suresinin 153. ayetindeki gibi \"sırat-ı müstakime, yani Allah'ın [celle celâluhû] dosdoğru yoluna uymak, bizi Allah'ın [celle celâluhû] yolundan ayıracak başka yollardan sakınmak\" konusunda birçok defa uyarılmışız. Kitap bunun için inmiş, Peygamber s.a.v. bunun için gönderilmiş, Dinimizin hükümleri, Sünnet, tasavvuf, güzergahı ayet ayet işaretlenen en doğru yolu tarif etmiş insanlara.\n\nFakat insan unutabilen, şaşırabilen bir varlık. Bu yüzden şeytana kanıp dünyaya aldandığı, nefsine yenik düştüğü oluyor Yanlış yollara sapabiliyor. Yolun doğrusunu bilmek, sırat-ı müstakimde bir kere bulunmak yetmiyor üstelik. Dosdoğru yolda sürçmeden, sağa sola kaymadan sürekli yürümek, her adımda yolun doğruluğundan emin olmak da gerekiyor.\n\nBöyle sağlıklı ve sürekli bir yol tutuş zikirle mümkün. Zikir bir uyanıklık, kendinde olma, hatırlama hali. insanın Yaratıcısını, yaratılış maksadını, Elest Bezmi'ndeki ahdini, ölümü, ahireti, hesabı hatırlaması, hep akılda tutmasıdır zikir Onun için Kur'an zikirdir, Rasulullah s.a.v.'in tebliği zikirdir, namaz zikirdir. Onun için Efendimiz s.a.v., Veda Hutbesi'nde bir kere daha ikaz etmiştir Müslümanları: \"Size iki şey bıraktım. Onlara sıkıca yapıştığınızda hiçbir vakit sapıklığa düşmezsiniz. Onlardan biri Allah’ın [celle celâluhû] Kitabı, öteki de Peygamberinin sünnetidir.\"\n\nHatme-i Hacegan\n\n       Buna rağmen insan yakasını gafletten büsbütün kurtaramaz, Dünya yolculuğunda ne zaman, hangi adımının kabir çukuruna isabet edip vücudunu toprağa karacağını da bilemez, Ahiret saadetini gölgeleyecek bir sapma, bir kötü akıbet tehlikesi hep başının üzerindedir. Öyleyse düştüğünde tutup kaldıracak, şaşırdığında istikametini düzeltecek vesileler lazımdır insana. Bu vesilelerle ona kim olduğu, nereden gelip nereye gittiği sürekli hatırlatılmalıdır. Ancak Kuran ve Sünnet ışığında yol alabileceği, istikamet sahibi velilerin ayak izlerini takip etmekle yoldan çıkmayacağı tembihlenmelidir.\n\n       Tasavvuf büyükleri işte bu hatırlatma ve tembihin devamlılığı için, yine ayet ve hadislerden hareketle değişik zikir usulleri öğretmiş bağlılarına. \"Hatme-i Hacegan\" dediğimiz halka zikri bunlardan biri, 'Beni anın ki ben de sizi anayım\" (Bakara, 152) hitabı mucibince Allah [celle celâluhû] katında anılma şerefine ulaşma, hidayete nail olma talebinin ifadesi, \"Ayakta, otururken, yanları üstünde iken Allah 'ı [celle celâluhû] zikreden\" (Al-i İmran, 191) akıl sahiplerinin kafilesine katılma gayreti... Esasen \"oturdukları bir meclisten Allah'ı [celle celâluhû] zikretmeden, Hz. Peygamber s.a.v.'e salat ve selam okumadan kalkan cemaat için bir zarar yazılacağını bilen ceddimiz, bulundukları her meclisin sonunda dua etmeyi, zikri, salat ve selam okumayı adet haline getirmiştir. Nitekim Hacegan silsilesinin sertacı Abdülhalik Gücdüvanî k.s. hazretleriyle başlayıp bugüne kadar gelen Hatme-i Hacegan usulü, Nakşibendiyye bağlılarının sohbet meclislerinin hatimesinde, yani sonunda yapılan bir zikirdir. \"Hatme\" yahut \"hatm\" diye adlandırılmasının bir sebebi bu. Diğer sebebi ise hatme esnasında okunan Fatiha ve ihlas-ı Şerifeler... Fatiha, \"esas'ül-Kur'an\"dır. Efendimiz s.a.v. de \"ihlas suresini okumanın Kur'an-ı Kerim'in üçte birinin okumak gibi\" olduğunu haber vermiştir. Dolayısıyla Fatiha veya üç ihlas okumak Kur'an-ı Azimüşşan'ın icmalen, kısaca hatmedilmesidir.\n\nBir yürüyüş talimi\n\nHatme-i Hacegan, sırat-ı müstakimi sadece tarif etmekle yetinmeyip, aynı zamanda yürüyerek nasıl yol alınacağını gösteren bir peygamberi takip gayretidir. Yolu O'nun gibi, O'nun uyguladığı usul ve erkanla tutmanın talimidir. Denkleri bağlar gibi kapılar örtülür, yalnızca daha önceden yol hazırlığını yapmış olanlar diz dize halkalanır sonsuzluk kervanının son katarında. \"Estağfirullah\", yolculuğun başlama komutudur. Yürüyüşümüzü zorlaştıracak, hızımızı kesecek bütün ağırlıklar yine \"Estağfirullah\" komutuyla terk edilir, Masıvaya dalmamak, şeytanın çağırdığı yollara sapmamak için gözler kapatılır; kalp gözü, kılavuz silsilesinin son halkasında. bu kafilenin rehberinde odaklanır. Nihayet sılaya giden yolun kapısı \"Fatiha\" ile açılır ve yürüyüş başlar. Salavat-ı şerîfeler hem ritmimizi hem istikametimizi belirlemektedir. Şimdi, Her salavat-ı şerife Efendimiz s.a.v.'den bize kalan bir izdir. O izi sürüyor olmanın sevincidir, o sevinci yaşatana dua ve teşekkürdür. Fakat kolay değildir. Allah Rasulü s.a.v.'in izinden yürümek. Yorucudur, meşakkatlidir, Dizlerde takatin tükendiği, göğüslerde nefesin kesildiği olur. Tam bu demde \"inşirah\" süresiyle göğüsler genişletilir, yorulunca yeniden yol alma arzusu ateşlenir, \"İhlas\" okumak, yolun sahibinin, rotayı tayin edenin, bizi yürüyüşümüzle sınayanın huzurunda resmi geçit saadetini yaşamaktır. Yeniden \"Fatiha\" ve bu seferki kapı Cennet bahçelerine açılmaktadır. Yolun sonudur. Sonsuzluk kervanının peşinde cennette cem olunmuştur. İçtima vaktidir; tekmil gerekir.\n\nÖnce Rasul-i Ekrem s.a.v.'e salavat-ı şerifelerle tekmil verilir. Sonra, O'nun izine basarak yürüyen, böylece bu izlerin bugüne kadar muhafazasıyla bizim de yol almamıza vesile olan Sadat-ı Kiram'a... Okunan her salavat-ı Şerife, her \"kaddesallahu sırruh\" niyazı, yürüyüp yol eyleyenlere bir teşekkür olduğu kadar, \"Sonsuzluk kervanı, peşinizdeyim ben, kararlılığının da ikrarıdır.\n\nEn güzel söz, en güzel yol\n\nFakat Hatme-i Hacegan neticede bir yürüyüş talimidir. Ekseriya \"Amme\" yahut \"Nebe\" süresiyle, yani her vakit akılda tutmamız gereken o kaçınılmaz sonun, kıyamet gününün haberiyle biter. Bölük bölük mahşer yerine sevk edileceğiniz o gün \"yevm'ül hak\"tır. İnsan Rabbi’nin huzuruna varacak, tuttuğu yolun götürdüğü akıbetle karşılaşacaktır mutlaka. Bazen de \"Tebareke\" ile yani \"Mülk\" süresiyle nihayetlenir. Hatme-i Hacegan. Orada da, mülkü elinde tutan Alemlerin Rabbi'nin, güzel amellerle sırat-ı müstakim üzere yürüyüp yürümeyeceğimizi denemek için hayatı ve ölümü yarattığı beyan duyurulur. Madem bir deneme yahut imtihandır, uyarılmakla birlikte, ucu cennete veya cehenneme varan yollardan birini tercihte muhayyer bırakılmıştır insan.\n\nİbn Mes'ud r.a.'dan rivayet edilen bir hadis-i şerifte. \"Muhakkak ki en güzel söz Allah [celle celâluhû] 'in Kitabı Kur’an-ı Azimuşandır. En güzel yol da Muhammed s.a.v. ‘in yoludur.\" buyurulur. İşte Hatme-i Hacegan, \"en güzel yolda, en güzel sözleri\" söyleyerek yürümenin talimidir. Sırat-ı müstakimi tercihin, yolun doğrusunu tutmanın imkanıdır. Hatme halkasından çıkıp gündelik hayat kat edilirden hangi izlerin gözetileceği bellidir artık. Çünkü yolun tarifi önceden alınmış, nasıl yürüneceği öğrenilmiştir.\n\nVe elbette ne kadar çok talim yapılırsa, yoldan çıkma ihtimali o kadar azalacaktır."},{"k":"p","t":"Rabbim bizleri, kendisini hakkıyla zikredenlerden eylesin. Zikrini son nefesimize kadar, gafletsiz ve şuuruna vararak yapmamızı nasip eylesin. Amin…"}],"cat":"Tasavvuf ve Zikir"},{"id":"rahmanin-misafiri","title":"Rahmân'ın Misafiri Olma Şerefi","sub":"Umrenin Fazileti — Sohbet notu","desc":"Umrenin fazileti, Mekke ve Medine'nin edepleri","color":"#A5652A","mins":25,"paras":[{"k":"ar","t":"اِنَّ اَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي بِبَكَّةَ مُبَارَكاً وَهُدًى لِلْعَالَمِينَ فِيهِ اٰيَاتٌ بَيِّنَاتٌ مَقَامُ اِبْرٰهِيمَ وَمَنْ دَخَلَهُ كَانَ اٰمِناً وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ اِلَيْهِ سَبِيلاً وَمَنْ كَفَرَ فَاِنَّ اللهَ غَنِيٌّ عَنِ الْعَالَمِينَ"},{"k":"q","t":"“Şüphesiz, âlemlere bereket ve hidayet kaynağı olarak insanlar için kurulan ilk ev, Mekke’deki (Kâbe) dir. Orada apaçık nişaneler, İbrahim’in makamı vardır. Oraya giren emniyette olur. Yoluna gücü yetenlerin o evi haccetmesi, Allah’ın insanlar üzerinde bir hakkıdır. Kim inkâr ederse bilmelidir ki, Allah bütün âlemlerden müstağnidir.” (Al-i İmran Suresi, 96-97)"},{"k":"p","t":"Hac mevsimi dışında Kâbe’yi ziyaret etmeye “umre” denir."},{"k":"p","t":"Umre, Allah’ın davetini kabul edip yola çıkmaktır; Onun ‘’evim’’ dediği Kâbe’yi ziyaret etmektir. Allah Teâlâ, ‘’evim’’ dediği Kâbe’nin ziyaret edilmesini, insanların hepsinden tek tek istemektedir. Tabii ki gitme imkânı bulabildikleri takdirde. Bu ibadetle onların bütün günahlarını arındırmayı da vaat etmiştir. Analarından doğdukları gün gibi tertemiz."},{"k":"p","t":"Bir müminin evinden ayrılıp, mübarek beldeleri hac veya umre için ziyaret etmesi, insanın Yaratıcısı'na olan sevgisine işarettir. Müminin sevdiği her şeyini, vatanını, evini, ailesini, ana-babasını, kısacası onun için değer taşıyan her şeyi bir mukaddes gaye için terk edip, bu çileli ve zahmetli ama kudsi yolculuğa çıkabilmesi, ancak ondaki muhabbetullah duygusunu ifade eder."},{"k":"p","t":"Hz. Ömer (radıyallahu anh) bir hutbesinde şöyle buyurmuştur:"},{"k":"p","t":"‘’Ey insanlar! Sizin üzerinize, yolculuğa çıkılarak yapılan üç ibadet yazılmıştır: Sizin üzerinize hac ve umre yazılmıştır. Sizin üzerinize cihad yazılmıştır. Sizin üzerinize, kişinin, malını Allah yolunda harcamanın yollarını araması yazılmıştır. Nefsimi kudret elinde tutan Allah Teâlâ’ya yemin ederim ki, Allah yolunda nefsim ve malımla bu işlerden birini yapmak isterken ölmem, bana yatağımda ölmekten daha sevimlidir. Bu uğurda ölmenin şehitlik (mertebesinde bir ölüm) olduğunu söylemiş olsaydım, bunun şehitlik (mertebesine çıkaran bir ölüm) olduğunu düşündüğüm için söylerdim."},{"k":"p","t":"Peygamber Efendimiz [sallallahu aleyhi vesellem] şöyle buyurmuştur: “Kim Allah yolunda hac, umre ve gaza için çıkar da bu uğurda can verirse Allah'u Teâlâ o kişiye kıyamete kadar gaza, hac ve umre yapmış sevabı verir.”"},{"k":"h","t":"Umrenin Yapılış Şekli ve Hükmü"},{"k":"p","t":"Mikât sınırlarının birinde ihrama girilir ve niyet edilir. Kâbe’ye gelip tavaf yapılır, ardından Safa ve Merve tepeleri arasında sa’y yapılır, tıraş olunup ihramdan çıkılır. Böylece kişi umre yapmış olur. Ömürde en az bir kere umre yapmak Hanefî ve Mâlikî mezheplerine göre müekked sünnet, Şâfiî ve Hanbelî mezheplerine göre farzdır. Hanefî mezhebinden bazı âlimler, umrenin vâcip olduğu katindedirler."},{"k":"p","t":"Bir sefer umre yaptıktan sonra tekrar tekrar umre yapmak, imkân ve fırsatını bulanlara tavsiye edilmiş sevabı çok olan ve sünnette günahlara kefâret olduğu bildirilen faziletli bir ibadettir."},{"k":"p","t":"Denilmiştir ki: Yedi tavaf, bir umre’ye; üç umre de bir hacca bedeldir. Ayrıca umre, küçük hacdır."},{"k":"h","t":"Hac ve Umre Cihada Denktir"},{"k":"p","t":"Hz. Aişe (radıyallahu anha): “Ey Allah’ın Resulü, seninle cihad etmek üzere biz de sefere çıkmayalım mı? Zira ben Kur’an’da cihattan daha faziletli bir amel göremiyorum.” diye sorduklarında Efendimiz [sallallahu aleyhi vesellem] şu cevabı vermiştir:"},{"k":"q","t":"“Hayır, ancak, cihâdın en faziletli ve en güzeli hacc-ı mebrûrdur.” Hz. Aişe (radıyallahu anha) der ki: “Bunu işittikten sonra haccı hiç bırakmadım.”"},{"k":"p","t":"İbn Mace’deki rivayet şöyledir: Hz. Aişe (radıyallahu anha) der ki: “Ey Allah’ın Resulü, kadınlara da cihad var mı?” “Evet, içinde savaş olmayan bir cihad var ki Hacc ve umredir”"},{"k":"p","t":"Resulullah [sallallahu aleyhi vesellem] Efendimiz buyurdular ki: “Küçüğün, büyüğün, zayıfın, kadının cihadı hacc ve umredir.”"},{"k":"p","t":"Şeyh Ebü’l-Abbas el-Mürsî Hazretleri [kudduse sirruhu] şöyle buyurmuştur: “Mekke’ye varmaktan maksat Kâbe’yi görmek olmamalıdır. Asıl gaye, Kâbe’nin sahibi olmalıdır.”"},{"k":"h","t":"Hac ve Umre Günahları Temizler"},{"k":"p","t":"Resulullah [sallallahu aleyhi vesellem] Efendimiz buyurdular ki “Hacla umrenin arasını birleştirin. Zira bunlar tıpkı körüğün demirdeki pislikleri temizlemesi gibi günahları temizler.”"},{"k":"p","t":"Körüğün demirdeki pisliği temizlediği gibi hac ve umrenin de kişiyi temizlediği ifade ediliyor. Buradaki teşbih dikkat çekicidir. Körük demirdeki pisliği basit bir üfürme ile değil, ciddi bir yakma ile temizlemektedir. Hac ve umre ibadetinde, gerçekten nefsi alev alev yakan, temizleyen çeşitli ateşler, sıkıntılar vardır: Maldan harcamalar, açlık, susuzluk, yorgunluk, uykusuzluk… Bunlara sırf Allah c.c rızası için sabırla katlanmış olanlar tertemiz olacaktır."},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] şöyle buyurur: “Bir umre, diğer umreye kadar arada işlenenler için kefarettir. Hacc-ı Mebrûr’un (kabul edilmiş haccın) karşılığı cennetten başka bir şey değildir”"},{"k":"p","t":"Bu ibadetleri ve ayrıcalıkları başka beldelerde bulmak mümkün değildir. Umre ve hac burada yapılır. Başka memleketlerde ne yapılırsa yapılsın umreci ve hacı olunmaz."},{"k":"p","t":"Dikkat etmeli ki hadiste “haccın karşılığı cennettir” denmiyor, “mebrur (kabul edilmiş bir) haccın karşılığı cennettir” deniyor. Haccımızın mebrur olması için çok gayret göstermeliyiz. Bu kolay değildir. Bu amelin hükümlerini güzelce bilmeden, sabretmeden, gayret etmeden, çalışmadan ulaşılmaz."},{"k":"h","t":"Hacılar ve Umreciler Allah Teâlâ’nın Ziyaretçileridir"},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] şöyle buyurur: “Hacılar ve umre yapanlar, Allah’ın ziyaretçileri ve ona gelen elçileridir. O’ndan istediklerinde onlara verir, istiğfar ettiklerinde onları affeder, O’na dua ettiklerinde dualarına karşılık verir. Birisi için şefaat ettiklerinde şefaatleri kabul edilir.”"},{"k":"q","t":"“Allah yolunda cihad eden, hacceden ve umre yapan Allah’ın elçisidir. Çünkü Allah bunların yapılmasına kulları davet etti, onlar da icabet ettiler. Buna mukabil onlar da O’ndan (dilediklerini istediler), Allah da onlara istediklerini verdi.”"},{"k":"p","t":"Hac veya umreye giden kişilerden dua almak ve dualarına kendisini de ortak etmesi için ricada bulunmak sünnettir."},{"k":"p","t":"Nitekim umre yapmak için izin isteyen Hz. Ömer’e (radıyallahu anh), Resul-i Ekrem [sallallahu aleyhi vesellem]: “Kardeşçik! Duanda bana da yer ayırır mısın?” buyurmuştur."},{"k":"p","t":"Hz. Ömer der ki: “Bu öyle bir dua isteği idi ki, karşılığında bana dünyalar verilseydi hiç bu kadar sevinmezdim.”"},{"k":"p","t":"Hac ve umre, günler boyu süren bir ibadettir. Namaz, oruç, sadaka, bütün ibadetler kısa zaman içinde yapılır, ancak hac ve umre öyle değildir. İnsan evine dönene kadar ibadet halindedir. Onun için duası kıymetlidir."},{"k":"h","t":"İhram Giymek"},{"k":"p","t":"İhram; hac ve umre dışında yapılması mübah olan -koku sürünmek, tırnak kesmek, tıraş olmak gibi bazı şeyleri kendisine haram kılmaktır. Bu da niyet ve telbiye ile gerçekleşir. Bu ihramla hac veya umre başlamış olur."},{"k":"p","t":"İhramlı biri kefene sarılı ölü gibidir. Ölü hiçbir şey yapamadığı gibi ihramlı da bir kılını dahi koparamaz. Ameliyathaneye alınan hasta artık evinden ve yakınlarından uzak tutulur. Ona ameliyat hazırlığı yapılır ve ameliyat elbiseleri giydirilir. İhram bu manada manevi ameliyat için giydiğimiz ameliyat elbisemizdir."},{"k":"h","t":"Telbiyenin Sevabı"},{"k":"p","t":"Umre yolculuğu ihrama girmek ile başlar, ihramlı olmak da niyet ve telbiye ile olur. Umre heyecanı bu telbiye ile başlar. Daha Mekke-i Mükerreme’ye yüzlerce km kala hacı ve umreciler ihramlarını giyerler ve “Lebbeyk Allahümme…” nidaları ile bu kutlu beldeye adım adım yaklaşırlar."},{"k":"p","t":"Telbiye: “Lebbeyk Allahümme lebbeyk. Lebbeyke la şerike leke lebbeyk. İnne’l hamde ve’n ni’mete leke vel mülk la şerîke lek”"},{"k":"p","t":"Manası: “Buyur ey Rabbim huzuruna geldim, emrine geldim, bedenimle, ruhumla, içimle, dışımla, zahirimle, batınımla, malımla, mülkümle, her şeyimle senin emrine geldim ve sana teslim oldum. Sen ne emredersen başımla gözüm üstüne. Keyfinden vazgeç dersen vazgeçerim, alışkanlıklarından vazgeç dersen vazgeçerim. Hayatından vazgeç dersen vazgeçerim…” demektir."},{"k":"p","t":"Telbiye öyle bir zikirdir ki canlı cansız her şeyi heyecanlandırır. Böylece bu duaya iştirak ederler. Nitekim Sehl İbnu Sa’d (radıyallahu anh) anlatıyor: “Resûlullah [sallallahu aleyhi vesellem] buyurdular ki:"},{"k":"q","t":"“Telbiyede bulunan hiçbir müslüman yoktur ki, onun sağında ve solunda bulunan taş, ağaç, sert toprak onunla birlikte telbiyede bulunmasın, bu iştirak (sağ ve solunu göstererek) şu ve şu istikamette arzın son hududuna kadar devam eder.”"},{"k":"h","t":"Mekke-i Mükerreme’ye Geliş ve Fazileti"},{"k":"p","t":"Umre yapacak kimse, ihramlı olarak en kutlu şehir olan Mekke’ye gelir. Bu şehir Allah [celle celaluhu] ve Resulü [sallallahu aleyhi vesellem] katında çok değerlidir."},{"k":"p","t":"Mekke’ye “Ümmü‘l Kura / beldeleri aslı, anası” denmiştir. Çünkü o, yeryüzünde ilk yaratılan yerdir. Sonra yeryüzü onun altından döşenmiştir. Mekke, ilk yaratıldığı için ona “ümm/ana, asıl” denmiştir."},{"k":"p","t":"Peygamberimiz [sallallahu aleyhi vesellem] ; Mekke'yi fethinin ikinci gününde irad ettiği hutbesinde şöyle buyurmuştur: \"Ey insanlar! Şüphe yok ki, Allah, göklerle yeri, Güneş'le Ay'ı yarattığı gün, Mekke'yi de haram ve dokunulmaz kılmıştır.’’"},{"k":"q","t":"“Burası, Allah'ın haram ve dokunulmaz kıldığı bir bölgedir. Kıyamet gününe kadar da, haram ve dokunulmaz olarak kalacaktır. Mekke'yi haram ve dokunulmaz kılan Allah'tır [celle celaluhu]. Allah'a [celle celaluhu] ve âhiret gününe inanan kimseye, Mekke Hareminde kan dökmek, ağaç kesmek, helal olmaz!"},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] şöyle buyurur:“Bu ümmet, şu haram yerlere hakkı olduğu hürmeti gösterdiği müddetçe hayır üzere devam eder. Bu hürmete riayet etmediler mi helâk olurlar.”"},{"k":"p","t":"Mekke inananların ana vatanıdır. Hz. Havva annemiz ve Hz. Adem [aleyhisselâm] babamız burada yaşamışlardır. Efendimizin [sallallahu aleyhi vesellem] hanımları (radıyallahu anhum) oralıdır, onlar da bizim annelerimizdir. Kişi anavatanında rahat eder. Ayrıca o beldeleri Allah [celle celaluhu] “emin belde” diye adlandırarak buyurmuştur ki: “Oraya kim girerse, güven içinde olur”"},{"k":"p","t":"Resûli Kibriya Efendimiz, doğup büyüdüğü Mekke’den ayrılırken şöyle dedi: \"Sen ne hoş beldesin. Seni ne kadar seviyorum! Eğer kavmim beni buradan çıkmaya mecbur etmeseydi, senden başka bir yerde ikamet etmezdim.\""},{"k":"p","t":"Bunun üzerine, yüce Allah Habibini teselli eden şu ayeti indirdi: “Elbette, o Kur’ân’ın tebliğini üzerine farz kılan Allah, seni yine döneceğin yere (Mekke’ye) döndürecektir!”"},{"k":"h","t":"Kâbe-i Muazzama’yı Tavaf ve Mescid-i Haram’ın Fazileti"},{"k":"p","t":"Mekke’ye varan ziyaretçinin ilk işi Kâbe’ye varıp tavaf etmektir. Âdem [aleyhisselâm] ve Havva anamız, Cennet’ten indirildikleri zaman yeryüzünde hiçbir yerleşim yeri yoktu. Ama Kâbe-i Muazzama'nın yeri belliydi. Yüce Mevlâ, Âdem’e [aleyhisselâm] yerini bildirdi ve Meleklerle birlikte inşaatını yapıp tamamladı."},{"k":"p","t":"Böylece yeryüzünde insan için kurulmuş olan ilk ev Kâbe-i Muazzama oldu. Yüce Rabbimiz, bunu bize şöyle bildirdi:"},{"k":"q","t":"\"Şüphesiz, insanlar için kurulan ilk ev elbette Mekke'de, âlemlere rahmet ve hidayet kaynağı olarak kurulan Kâbe’dir.”"},{"k":"p","t":"Resulullah [sallallahu aleyhi vesellem] şöyle buyurmuştur: “Her kim beyte gelir, kadına yaklaşmaz, fısk işlemezse o kimse, anasından doğduğu gibi döner.”"},{"k":"p","t":"Hz. Resulullah [sallallahu aleyhi vesellem] şöyle buyurmuştur:“Benim şu mescidimde (Mescid-i Nebevî) kılınan namaz, Mescid-i Haram hariç başka mescidlerde kılınan bin namazdan daha faziletlidir. Mescid-i Haram’da kılınan bir namaz ise benim mescidimdeki yüz namazdan daha faziletlidir.”"},{"k":"p","t":"Başka hadis-i şeriflerde şöyledir:"},{"k":"q","t":"“Sema kapılarının aralandığı ve duaların kabul edildiği dört zaman vardır. Bunlar; müminlerin Allah yolunda düşmanla karşılaştıkları an, yağmur yağdığı an, namaz kılındığı an ve Kâbe görüldüğü andır.”"},{"k":"q","t":"“Allah, bu ev için her gün yüz yirmi rahmet indirir. Bunun altmışı tavaf edenler, kırkı namaz kılanlar, yirmisi de ona bakanlar içindir.”"},{"k":"p","t":"Gavsı Cihan Hazretleri [kudduse sirruhu] şöyle demiştir: “Kâbe’yi tavaf ederken dikkatli olun, birçok peygamberin medfun olduğu bir yerde bulunuyorsunuz. İsmail [aleyhisselâm] da oradadır.”"},{"k":"p","t":"Peygamberimiz [sallallahu aleyhi vesellem] Kâbe’yi çok severdi. Önceleri kıble Mescidi Aksa idi. O yüzden Mekke’de iken Ruknü Yemani ile Haceri Esved arasında namaz kılardı. O zaman hem Kâbe’ye hem de Mescid-i Aksa’ya yönelmiş olurdu."},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] şöyle buyurur: “Beytullah etrafındaki tavaf, namaz gibidir. Ancak bunda konuşabilirsiniz. Öyle ise, kim tavaf sırasında konuşursa sadece hayır konuşsun.”"},{"k":"p","t":"İbnu Abbâs (radıyallahu anh) anlatıyor: “Resulullah [sallallahu aleyhi vesellem] buyurdular ki: “Beyt’i kim elli defa tavaf ederse, günahlarından arınır ve tıpkı annesinden doğduğu gündeki gibi olur.”"},{"k":"p","t":"Taberânî’de şu açıklama yer alır: “Elli tavaftan maksad, bunun bir anda peş peşe yapılması demek değildir. Burada istenen, kişinin sevap defterinde elli tavafın bulunmasıdır. Bunu bir ömür içinde de tamamlamış olsa fark etmez.”"},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] şöyle buyurur: “Kişi tavaf için bir ayağını koyup diğerini kaldırdıkça her adımı sebebiyle Allah onun bir hatasını siler ve bir sevap yazar.”"},{"k":"p","t":"Behçet’ün Nüfüs’ta şöyle anlatılır: “Kâbe, insanlar ve melekler arasında müşterektir. Kâbe’yi her sene belirlenmiş sayıda insanlar ve melekler tavaf ederler. İnsanlardan tavaf edenlerin sayısı az olursa Allah [celle celaluhu] o sayıyı melekleri ile tamamlar.”"},{"k":"p","t":"Said b. El-Müseyyeb Hazretleri tabiinin ulularından bir velidir. Şöyle buyuruyor: “Kim, Kâbe’nin Allah’ın nazargâhı olduğuna iman eder ve bu niyetle ona bakarsa, anasından doğduğu günkü gibi günahlarından temizlenir.”"},{"k":"p","t":"Yunus b. Habbab Hazretleri [kudduse sirruhu] ise şöyle buyurmuştur: “Kâbe’ye bakmak, diğer beldelerde oruçlu olup namaz kılmak gibi kişiye sevap kazandırır.”"},{"k":"p","t":"Gavsı Sani [kudduse sirruhu] şöyle demiştir: “Gideceğiniz beldeler dünyanın en kutsal yerleridir. Vaktinizi boşa harcamayın. Varsa kaza namazlarınızı kılın. Kur’an-ı Kerim’i çok okuyun. Bol bol salavat-ı şerife getirin, dua edin. Virdlerinizi çekmeyi ihmal etmeyin. Alışverişle (fazla) meşgul olmayın.”"},{"k":"p","t":"Umreci niyetini kontrol etmelidir. Umreye gitmekten gaye sırf Allah [celle celaluhu] rızası olmalıdır. Bu niyeti süt gibi bembeyaz, su gibi tertemiz olmalıdır. Yoksa elde ettiği şey yorgunluk ve meşakkatten öte geçmez."},{"k":"h","t":"Hacerü’l Esved’in Fazileti"},{"k":"p","t":"Hacerü’l Esved, Âdem [aleyhisselâm] ile beraber cennetten indirildi. Âdem [aleyhisselâm] Kâbe-i Muazzama’ya yerleştirdi, Nuh tufanında Ebu Kubeys dağına emanet edildi, İbrahim [aleyhisselâm] Beytullah’ı bina ederken şimdiki yerine yerleştirdi."},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] buyurdular ki: “Muhakkak ki, Haceru’l-Esved, cennet yakutlarından bir yakuttur. O kıyamet günü, iki gözü, kendisini hak ve sıdk ile istilâm edenlere şahitlik yapan ve konuşan bir dili olduğu halde diriltilir.”"},{"k":"p","t":"Âbis b. Rebîa (radıyallahu anh) anlatıyor: “Ben Hz. Ömer’i (radıyallahu anh) Haceru’l-Esved’i öperken gördüm. Onu hem öptü, hem de: “Biliyorum ki sen bir taşsın, ne bir faydan ne de zararın vardır. Ben Resulullah’ı [sallallahu aleyhi vesellem] seni öperken görmeseydim, seni asla öpmezdim.” dedi.”"},{"k":"p","t":"Bir hadis-i şerif de şöyledir: \"Haceru'l-Esved, cennetten indi. İndiği vakit sütten beyazdı. Onu insanların günahları kararttı.\""},{"k":"p","t":"Yine Efendimiz [sallallahu aleyhi vesellem]: “Hacerü’l-Esved’in yeryüzünde Allah’ın sağ eli olduğunu ve kullarıyla onun vasıtası ile musafaha ettiğini, Hacerü’l-Esved’e dokunanın Allah’la biat etmiş olacağını” buyurmuştur."},{"k":"p","t":"İbnu Ömer (radıyallahu anh) anlatıyor: “Resûlullah [sallallahu aleyhi vesellem] Haceru’l-Esved’e yöneldi, ardından dudaklarını üzerine koyup uzun müddet ağladıktan sonra ondan ayrıldı. Bir de baktım ki, Hz. Ömer de yanında, o da ağlıyor. Resulullah [sallallahu aleyhi vesellem]: “Ey Ömer, gözyaşları burada dökülür.” dedi."},{"k":"h","t":"Hatim ve Hicr-i İsmâil’in Fazileti"},{"k":"p","t":"Rükn-i Irâkî ile Rükn-i Şâmî’nin arasında, altınoluğun karşısında, Kâbe’nin kuzeybatı tarafında, yerden  yükseklikte,  kalınlığında, yarım daire şeklindeki duvara “hatim” denir. Tavaf bu duvarın dışından yapılır. Bu duvar ile Kâbe arasındaki boşluğa da Hicr-i Kâbe veya Hicr-i İsmail denir."},{"k":"p","t":"Hz. İbrahim’in [aleyhisselâm] yaptığı Kâbe binasına bu kısım da dâhildi. Dolayısıyla Hatim’in iç kısmı Kâbe’den sayılır. Efendimizin [sallallahu aleyhi vesellem] peygamberliğinden beş yıl kadar önce Kâbe’nin Kureyş kabilesi tarafından yapılan tamiri sırasında inşaat malzemesi yetmediği için, bu kısım binanın dışında bırakılmıştır. Hz. İsmail [aleyhisselâm] ile annesi Hacer’in buraya defnedilmiş oldukları rivayet edilir."},{"k":"h","t":"Medine’nin Fazileti"},{"k":"p","t":"Umreciler Mekke’de umrelerini yapmakla beraber bir de umreden önce veya sonra Medine’de Efendimiz’i [sallallahu aleyhi vesellem] ziyaret ederek ibadetini taçlandırırlar."},{"k":"p","t":"Medine şehrinin özellikleri şunlardır:"},{"k":"li","m":"1.","t":"Efendimizin [sallallahu aleyhi vesellem] hicret yurdudur."},{"k":"li","m":"2.","t":"Hayatının son on yılı burada geçmiştir."},{"k":"li","m":"3.","t":"Kuran’ın büyük bir bölümü burada inmiştir."},{"k":"li","m":"4.","t":"İlk İslam devleti burada kurulmuş, İslamiyet buradan yayılmıştır."},{"k":"li","m":"5.","t":"Efendimiz [sallallahu aleyhi vesellem] bu şehirde vefat etmiş ve şu an da hala bu kutlu şehirde bulunmaktadır."},{"k":"li","m":"6.","t":"Adı “Yesrib” iken, peygamber şehri manasına gelen “Medine” olmuştur."},{"k":"li","m":"7.","t":"Bu belde halkı Efendimizin [sallallahu aleyhi vesellem] hemşerisi, ziyaretçileri de O’nun [sallallahu aleyhi vesellem] misafirleridir."},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] hicretten önce şöyle buyurdular: “Yüce Allah, onları (Ensar’ı) size kardeş yaptı ve Medine’yi size emniyet ve huzur bulacağınız bir yurt kıldı!”"},{"k":"p","t":"Resulullah [sallallahu aleyhi vesellem] buyurdular ki: “O Medine, gerçekten temizdir. Ateşin gümüşteki kirleri temizlediği gibi kişiyi temizler.”"},{"k":"h","t":"Mescid-i Nebevi’nin Fazileti"},{"k":"p","t":"Hac veya umre niyetiyle kutsal topraklarda bulunanların Efendimiz’in [sallallahu aleyhi vesellem] kabri şeriflerini ziyaret etmeleri vacip derecesinde önemli görülmüş, çok büyük bir mazereti olmadıkça terk edilmesi gaflet sayılmıştır. Hadis-i şeriflerde şöyle buyrulmuştur:"},{"k":"q","t":"“Şu üç mescidden başka hiçbir mescide sefer tertip edilmesi uygun olmaz. Bunlar Mescid-i Haram, Mescid-i Nebi ve Mescid-i Aksa’dır.”"},{"k":"p","t":"Her kim benim mescidimde ara vermeden kırk vakit namaz kılarsa o kimseye cehennem ateşinden beraat ve münafıklıktan kurtuluş yazılır.”"},{"k":"p","t":"Mescid-i Nebevi'de, Rasûlullah Efendimizin [sallallahu aleyhi vesellem] kabr-i seadetleriyle minber-i şerif arasında kalan kısma “Ravza (Cennet bahçesi)” denir. Bir hadis-i şerifte Efendimiz [sallallahu aleyhi vesellem] şöyle buyurmuşlardır: \"Evimle minberim arası, cennet bahçelerinden bir bahçedir.\""},{"k":"p","t":"Ravza-i Mutahhara’nın cennet bahçesi olarak nitelenmesi hakkında ulemanın çeşitli görüşleri vardır: Burası gerçek bir cennet bahçesidir, ahirette cennete nakledilecektir. Burada kılınan namazlar, okunan Kur’anlar, zikir ve dualarla rahmet inerek oluşan manevî huzur sebebi ile cennete benzetilmiştir. Buradaki ibadetler, cennetin yolunu açtığı için cennet bahçesi denilmiştir. O mübarek yerleri ziyaret eden kişi Ravza’da namaz kılmaya gayret etmeli, ancak namaz kılacağım diye itişip kakışarak insanlara eziyet vermemelidir."},{"k":"h","t":"Edep ve Hürmetin Önemi"},{"k":"p","t":"Umrenin fazileti edebe riayete bağlıdır. Kişinin bu ziyaret sayesinde kazanacağı sevap edebi ölçüsündedir. Hacc ve umreye giden sıradan bir yere değil, Allah’ın evine gitmektedir. Gittiği şehir Mekke, şehirlerin anası, en hayırlı beldedir. Medine, Hz. Peygamberin [sallallahu aleyhi vesellem] şehri, edep diyarıdır. O halde bu beldelere gidenler yolculuğunun başından sonuna kadar en üst seviyede edep ve hürmet içinde bulunmalıdırlar."},{"k":"p","t":"Hac, umre, hizmet, anne, baba veya velilerin ziyareti gibi Allah rızası için yapılan yolculuklarda edepler gidilecek yerde değil, evde başlar, yolda devam eder, gidilen yerde uygulanır. İnsan edebi korudukça nefsi uslanır. Hac ve umrede edebe ne kadar dikkat ederse nasibi o kadar çok olur."},{"k":"p","t":"Yüce Allah’ın “Evim” dediği başka yer yoktur: “Tavaf edenler, kendini ibadete verenler, rükû ve secde edenler için evimi (Kâbe’yi) tertemiz tutun.”"},{"k":"q","t":"“Habibim” dediği Peygamber Efendimiz [sallallahu aleyhi vesellem] ise Medine’dedir. Mekke-i Mükerreme’ ve Medine-i Münevvere’de yaşayanlara karşı saygılı davranmak ziyaret edeplerindendir. Çünkü onlar, Kâbe-i Muazzama’nın, ve Ravza-i Mutahhara’nın komşularıdır. Alışveriş yaparken bile yumuşak konuşmaya özen göstermek gerekir; tartışmaktan ve kırıcı sözler kullanmaktan kesinlikle sakınmalıdır. Nitekim ayet-i kerimede şöyle buyrulur: “Artık hacda cinsel ilişki, günaha sapmak, kavga etmek yoktur.” (Bakara Suresi, 197)"},{"k":"p","t":"Rasûlullah Efendimiz [sallallahu aleyhi vesellem] bir keresinde Hz. Ömer’e şöyle buyurdu:"},{"k":"q","t":"“Ey Ömer, sen güçlü kuvvetli bir kimsesin. Hacerü’l-Esved’i istilâm ederken zayıfları ezebilirsin. Bu yüzden dikkat et. Orayı tenha görürsen istilâm et. Aksi takdirde tekbir getir ve onu uzaktan selamla.”"},{"k":"p","t":"Hadisten de açıkça anlaşıldığı gibi Kâbe’yi tavaf ederken olsun, Hacerü’l Esved’i selamlarken olsun, asla, insanlara eziyet vermek doğru değildir."},{"k":"p","t":"Büyüklerimizden Abdülhakim el-Hüseyni [kudduse sirruhu], Ravza-i Mutahhara’yı ziyareti esnasında bahçede bir çocukla karşılaşır. Çocuk Medinelidir ve oyuncak kamyonuyla portakal kabuklarını taşımaktadır. Çocuk Abdülhakim el-Hüseyni’den [kudduse sirruhu] kendisiyle oynamasını ister, o da hemen çömelir ve uzun zaman Medineli çocukla oynar. Resul-i Ekrem Efendimizin [sallallahu aleyhi vesellem] hatırına, Medineli olduğu için çocuğu kırmaz ve çocuk vazgeçinceye kadar onunla meşgul olur."},{"k":"p","t":"Rahmetli Seyyid Muhammed Raşid [kudduse sirruhu] hazretleri şöyle buyurmuştur: ‘’Günde iki defa Cennetü’l-baki’yi ziyarete gidin. İçeri sokmazlarsa sahabelere selam verin.’’"},{"k":"h","t":"Allah Teâlâ’nın Misafirlerine Hürmet Göstermek"},{"k":"p","t":"Kıyamete kadar Kâbe’yi ziyaret edenler, Hz. İbrahim’in [aleyhisselâm] davetine “Lebbeyk Allahümme Lebbeyk!“ diye cevap verenlerdir. Bunlar, Allah’ın [celle celaluhu] sevdiği seçilmiş kullardır. O, sevmediği kullarını evinde misafir etmez. Ancak bir hikmet ve imtihan için olursa, o müstesna."},{"k":"p","t":"Ruhu’l-Beyan tefsirinde anlatıldığına göre, Ali bin Muvaffak adındaki âlim ve veli zata altmış kere hacca gitmek nasip olmuştu. Bir keresinde Kâbe’de Hicr bölgesinde:"},{"k":"q","t":"“Defalarca Beytullah’ı ziyaret ettim ama yaptığım haclar kabul oldu mu?“ diye düşünürken, oracıkta uyuyakaldı. Rüyasında bir ses:"},{"k":"q","t":"“Ey Ali, sen sevdiklerinden başkalarını evine davet eder misin?“ diye seslendi. Sevinçle yerinden kalkan İbn-i Muvaffak, hacıların Allah’ın [celle celaluhu] seçip davet ettiği sevgili kulları olduğuna kanaat getirerek huzur buldu."},{"k":"p","t":"Gavs-ı Cihan [kudduse sirruhu] bir sohbetinde şöyle anlatır:"},{"k":"q","t":"“Allah Teâlâ dileseydi Kâbe’yi dağlara, en yüksek tepelere kurardı. Fakat Mekke’nin en çukur yerinde halk etmiştir. Hal böyleyken Kâbe’nin Allah katında öyle bir değeri vardır ki suyun çukura aktığı gibi, Allah’ın c.c rahmeti oraya akar. Siz de alçak gönüllü, mütevazı olun ki Allah’ın c.c rahmeti gönlünüze dolsun, eliniz boş dönmeyesiniz. Orada ne hizmet bulursanız yapın. Mekke’de hacılar Allah Teâlâ’nın misafiridir. Onları üzerseniz Cenâb-ı Hakk’ı üzmüş olursunuz. Medine’de ise Hz. Peygamber’in [sallallahu aleyhi vesellem] misafiridir. Onları üzerseniz Resûlullah’ı [sallallahu aleyhi vesellem] üzmüş olursunuz. Dikkat edin, orada şeytan sizinle çok uğraşır.”"},{"k":"p","t":"Harem-i Şerif’e girenlerin emniyet ve güven içine girdiklerini bizzat Yüce Mevlâ bildiriyor. O halde Yüce Mevlâ’nın emniyet ve güven ihsan ettiği insanlara karşı çok daha hassas davranmak, onların kalplerini hoş etmek için gayret göstermek gerekir. Kalp kırıcı söz ve davranışlardan kesinlikle uzak durmalıdır."},{"k":"p","t":"Yüce Mevlâ, hac ve umre ibadeti esnasında her türlü cedelleşmeyi yasaklamıştır. Sözlü aşırılıklar, fiili taşkınlıklar, hatta kalbi bozuşmalar dahi yasaklanmıştır. Ayet-i kerimede Allah Teâlâ şöyle buyurur: “Artık hacda cinsel ilişki, günaha sapmak, kavga etmek yoktur.”"},{"k":"p","t":"Bu durumda Müslüman, bir taraftan dilini korurken diğer taraftan elini ve gönlünü de kollamalıdır. Allah’ın misafirlerine samimi duygular beslemeli, güzellik ve alçak gönüllülükle hitap etmeli ve hareketleriyle onları incitmemelidir."},{"k":"p","t":"Gavsı Cihan [kudduse sirruhu] bir gün şöyle sohbet etti:"},{"k":"p","t":"Mevlâna Halid [kudduse sirruhu] hacca giderken, Medine-i Münevvere’de biri önüne geçti ve:"},{"k":"q","t":"“Ya Halid, burada kimsenin haccına (işine) karışma. Sen haccına bak.” deyip kayboldu."},{"k":"p","t":"Mevlâna Halid, Mekke’ye vardığında, Kâbe’de Delail Hayrat okurken sırtını Kâbe’ye çevirmiş birini gördü. İçinden: “Cahil insan, niçin böyle yapıyor? İnsanlar Kâbe’ye günahlarının affı için gelip ağlayarak yalvarırken o sırtını çevirmiş duruyor.” diyerek içinden geçirdi. Bunun üzerine derviş Allah’ın [celle celaluhu] izniyle onun düşüncesine vakıf olup şöyle dedi:"},{"k":"q","t":"“İnsanlar yüzünü Kâbe’ye dönmüşler, ama sırtlarını Allah’a [celle celaluhu] çevirmişler. Bense sırtımı Kâbe’ye verdim ama yüzümü Allah’a c.c çevirdim. Önemli olan kalptir. Benim kalbimse Allah’a [celle celaluhu] bağlıdır” dedi."},{"k":"p","t":"Harem topraklarında bulunan bitkiler ve hayvanlara da özenle davranmalıdır. Resul-i Ekrem [sallallahu aleyhi vesellem] şöyle buyurmuşlardır: “Hiç şüphe yok ki, Allah yeri ve göğü yarattığı zaman bu şehri kıyamet gününe kadar muhterem kılmıştır. O, kıyamet gününe kadar Allah’ın muhterem kılmasıyla haram bir beldedir, onun dikeni koparılmaz, avı ürkütülmez, yitiğini ilân edecek kimseden başkası alamaz. Bitkisi de koparılmaz.”"},{"k":"p","t":"Bir âlim Gavs-ı Cihan hazretlerine [kudduse sirruhu] gelerek:"},{"k":"q","t":"“Efendim, müsaade ederseniz Medine’ye taşınmak istiyorum. Peygamberimize [sallallahu aleyhi vesellem] duyduğum iştiyak her geçen gün artmakta. Oralarda yaşamak, Ravzasına yüz sürmek en büyük muradım. Müsaadeniz olursa ömrümün geri kalan kısmını Peygamberimizin [sallallahu aleyhi vesellem] komşusu olarak geçirmek istiyorum.” dedi. Gavs-ı Cihan hazretleri [kudduse sirruhu]:"},{"k":"q","t":"“Orada bir kediye bile pist diyemezsin. Gözün alıyor mu?” diye sorunca o âlim:"},{"k":"q","t":"“Efendim, kendi çocuklarıma da mı kızamam?” dedi. Gavs-ı Cihan [kudduse sirruhu] hazretleri:"},{"k":"q","t":"“Evet, bir kediye bile pist diyemezsin.” dedi."},{"k":"p","t":"Kısacası, hac ve umre günler süren, yorucu bir ibadettir. Efendimizin [sallallahu aleyhi vesellem] “Allah’ım onu bana kolaylaştır” dediği, kolaylık istediği tek ibadettir."},{"k":"p","t":"Allahü Teâlâ, bu kutlu beldeleri edeble ziyaret etmeyi, oradan ise lütufla dönmeyi ve bu amelin defalarca tekrarını bizlere nasip etsin inşallah. Allah [celle celaluhu] muhabbetine ulaşabilmeyi nasip eylesin. Amin"}],"cat":"İbadet"},{"id":"musibetlere-sabir","title":"Musibetlere Sabretmenin Fazileti","sub":"Sohbet notu","desc":"Sabrın fazileti ve musibetler karşısında tavrımız","color":"#55506B","mins":30,"paras":[{"k":"p","t":"Diğer yaratılmışlardan farklı olarak kendisine akıl ve ruh verilmiş bulunan insan, geçici olarak bulunduğu bu dünyada o yaratılmışların tabi olmadığı bir imtihan içinde bulunmaktadır. Bu dünyada herkes imtihandadır:"},{"k":"p","t":"Kimi zenginlikle sınanır hiç farkında olmadan. Kimi kendisine verilen ilimle, bilgiyle denenir. Kimi fakirlikle imtihan edilir. Kimi hastalıklarla dahil edilir imtihana; Kimi de uzuvlarının tamlığıyla. Kimi makamla mevki ile, kimi güzelliğiyle; kimi de uzuvlarındaki herhangi bir eksiklikle. Kimi de duygusal bir rahatsızlıkla…"},{"k":"p","t":"Değişmeyen ilahi gerçek şu ki Allah'ın kendisine tevdi ettiği aklı başında olduğu sürece hiç bir insan, dünya hayatının hiç bir anında ilahi imtihanın dışında kalamamaktadır. Bu imtihanın gözcüsü, her şeyi bilen, her şeyi gören, her şeyi işiten yüce Yaratıcıdır."},{"k":"ar","t":"كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَاِلَيْنَا تُرْجَعُونَ"},{"k":"q","t":"\"Her can ölümü tadacaktır. Bir imtihan olarak sizi hayır ile de şer ile de sınıyoruz ve (sonunda hepiniz mutlaka) bize döndürüleceksiniz.\" (Enbiya 21/ 35)"},{"k":"p","t":"Dünya hayatında tabi tutulacağımız imtihan türünü seçme yetkisi bize ait olmadığına göre, bize düşen, tabi tutulduğumuz imtihanda elimizden geldiği kadarıyla başarı göstermeye çalışmaktır. Tabi tutulduğumuz imtihanda başarı göstermeye çalışmak yerine, imtihan şeklinden ve türünden şikayet etmenin, bize hiç bir yararı yoktur. Böyle bir tutumun sürdürülmesi, imtihanın kaybedilmesiyle sonuçlanır. Öyleyse yapılacak şey, imtihan tarzından şikayet ederek vakit kaybetmek değil, tabi tutulduğumuz imtihanda en güzel sonucu elde edebilecek şekilde davranmaktır."},{"k":"p","t":"Hz. Resûlullah [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Müminin durumu ne hayret vericidir. Zira her hali onun için hayra vesiledir ve bu yalnızca mümin için geçerlidir. Mümin, başına sevindirici bir durum geldiğinde buna şükreder ve bu onun için hayır olur, yine başına bir musibet geldiğinde sabreder, bu da onun için bir hayır olur.”"},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] şöyle buyurmuştur: “Allah Teâlâ, bir müslümanın başına gelen acıyı, hastalığı, sıkıntıyı, kederi, ezayı, gamı hatta ayağına batan dikeni bile günahlarına kefâret kılar.”"},{"k":"p","t":"Hz. Resûlullah [sallallahu aleyhi vesellem] şöyle buyurmuştur: “Kuvvetli kimse, güreşte insanları yenen değil, öfke anında nefsine hâkim olan kişidir.”"},{"k":"p","t":"Enes b. Mâlik [radıyallahu anh] anlatıyor:"},{"k":"p","t":"Bir gün Hz. Peygamber [sallallahu aleyhi vesellem], bir kabrin baş ucunda durmuş ağlayan bir kadının yanından geçti ve ona, “Allah’tan kork ve sabret” buyurdu. Kadın, ‘Beni rahat bırak, benim başıma gelen musibet senin başına gelmemiştir’ dedi. Resûl-i Ekrem’i [sallallahu aleyhi vesellem] tanıyamamıştı. Kendisine, ‘O, Allah Resûlü’dür’ denilince hemen kalkıp Resûlullah’ın [sallallahu aleyhi vesellem] kapısına geldi. Kapıda bekçilerin olmadığını gördü ve, ‘Ben sizi tanıyamamıştım’ dedi. Bunun üzerine Allah Resûlü de [sallallahu aleyhi vesellem], “Asıl sabır, musibetin geldiği ilk andaki sabırdır” buyurdu."},{"k":"p","t":"Hz. Ali (radıyallahu anh) şöyle buyurmuştur:"},{"k":"q","t":"“Sabır ayağı hiç sürçmeyen bir binektir. Sabırlı olmak, olayları geçiştirir, sızlanmak ise şeytana yardımcı olmaktır. Sıkıntıların da bir sonu vardır. Herkes, bir sıkıntıyla karşılaştığında, onun mutlaka bittiğini görecektir. O halde, akıllı olanın yapması gereken, sıkıntı geçene kadar sabırla beklemektir.”"},{"k":"p","t":"Cafer-i Sâdık [kuddise sırruhû] demiştir ki:"},{"k":"q","t":"“Allah Teâlâ peygamberlerine sabretmelerini emretti ve sabrın en yükseğini Resûlullah Efendimiz’e [sallallahu aleyhi vesellem] verdi. Çünkü Allah Teâlâ, “Habibim sabret, senin sabrın ancak Allah iledir” (Nahl 16/127) buyurarak, onun sabrının kendisiyle değil, Allah’la olduğunu bildirdi.”"},{"k":"p","t":"Cüneyd-i Bağdâdî [kuddise sırruhû], “Şüphesiz, Allah Teâlâ müminlere imanla, imana akılla, akla da sabırla ikram etmiştir. O halde iman müminin, akıl imanın, sabır da aklın süsüdür” demiştir."},{"k":"p","t":"Serî es-Sakatî [kuddise sırruhû] demiştir ki:"},{"k":"q","t":"“Sabır, farz ve faziletli olarak iki kısma ayrılır: Farz olan sabır; farzları yerine getirmeye ve haramlardan sakınmaya sabretmektir. Fazilet olan sabır ise; fakirliğe, ilk anında musibetlere, acıları gizleyerek şikâyet etmemeye, fakirliği gizlemeye, kendine verilen manevi ihsan ve kerametleri, görmüş olduğu ibret ve âyetleri saklamaya sabırdır.”"},{"k":"p","t":"Ömer b. Abdülaziz [radıyallahu anh] demiştir ki:"},{"k":"q","t":"“Allah Teâlâ bir kuluna, önce nimet verip peşinden onu alarak yerine sabır verirse; bu sabır, kendisinden alınan nimetten daha hayırlıdır.”"},{"k":"p","t":"Sehl b. Abdullah Tüsterî [kudduse sirruhu] demiştir ki:"},{"k":"q","t":"“Sabır, Allah Teâlâ’dan bir çıkış kapısı açmasını beklemektir. O, hizmetin en faziletlisi ve en yücesidir.”"},{"k":"p","t":"Serî es-Sakatî [kudduse sirruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Sabır odur ki yer gibi olasın. Yer, dağları taşır, âdemoğullarını taşır; üzerine her ne yüklenirse onları taşır. Onları taşımaktan şikâyetlenmez. İşte gerçek sabırlı böyledir; nefislerin istemediği şeyleri çekinmeden taşımalıdır. Böyle bir yük için de, “Bu bir musibettir” dememeli. “Nimet ve ihsan Allah’tan” demelidir.”"},{"k":"p","t":"Bazılarınca zannedildiği gibi, dünya hayatında nimetlere boğulmuş olan insanlar şanslı, bu nimetlerden mahrum bırakılmış olan insanlar şanssız değildir. Böyle bir anlayış, dünya hayatının geçici, Ahiret yurdunun ise kalıcı olduğunu göz ardı eden bir yaklaşımdır. Gerçekte herkes imtihana tabi tutulmaktadır."},{"k":"p","t":"Nitekim Allah [celle celaluhu] şöyle buyurur:"},{"k":"ar","t":"وَهُوَ الَّذى جَعَلَكُمْ خَلَائِفَ الْاَرْضِ وَرَفَعَ بَعْضَكُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِيَبْلُوَكُمْ فى مَا اتيكُمْ اِنَّ رَبَّكَ سَريعُ الْعِقَابِ وَاِنَّهُ لَغَفُورٌ رَحيمٌ"},{"k":"q","t":"\"O sizi yeryüzünün halifeleri yapan, verdiği nimetler konusunda sizi sınamak için bazınızı bazınıza üstün kılandır...\" (En'am, 6/ 165)"},{"k":"p","t":"Bu ayette zikredilen 'size verdiği nimetler' ifadesi insana verilmiş olan her çeşit nimeti kapsayan bir ifadedir. Yani insana verilen vücut organları ve fonksiyonları, yetenekler, mal/mülk, güç/kuvvet, bilgi, sosyal konum ve benzeri her çeşit nimet... Hiç şüphesiz insan, bu nimetlerin hepsinden sorguya çekilecektir."},{"k":"ar","t":"ثُمَّ لَتُسْئَلُنَّ يَوْمَئِذٍ عَنِ النَّعيمِ"},{"k":"q","t":"\"Sonra o gün nimetlerden mutlaka sorguya çekileceksiniz.\" (Tekâsür,102/ 8)"},{"k":"p","t":"Bazen ilahi imtihan çok ağır ve çetin olur."},{"k":"p","t":"İşte zaman zaman insanlar; deprem, sel felaketi gibi tabii; ölüm, hastalık, yaralanma, zulüm, şiddet gibi kişisel; fitne, fesat gibi de sosyal âfetlere maruz kalmaktadırlar. Bu afetler ise cana ve mala zarar vermekte, insanlar bundan etkilenmekte, acı çekmektedir. Öyleyse bütün bu musîbetler niçin meydana gelmektedir? Tabiî âfetlerin meydana gelmesinde insanların davranışlarının etkisi var mıdır? Yoksa bunlar sadece birer imtihan ve takdiri ilâhi midir? İnsanlar âfet ve musîbetler karşısında ne yapmalıdırlar? Abdullah b. Mesud [radıyallahu anh] anlatıyor:"},{"k":"p","t":"Bir gün Resûlullah’ın [sallallahu aleyhi vesellem] yanına gittim, sıtmaya tutulmuştu. Kendisine,"},{"k":"p","t":"- Ey Allah’ın resûlü, sıtma hastalığından dolayı çok fazla rahatsızlık çekiyorsun, dedim. O da,"},{"k":"p","t":"- Evet, sizden iki kişinin çektiği kadar rahatsızlık çekiyorum, buyurdu. Ben,"},{"k":"p","t":"- Bu sebeple size iki kat mükâfat vardır, dedim. O da,"},{"k":"p","t":"- Evet. Allah Teâlâ, ayağına batmış olan bir diken veya başına gelen daha büyük bir ezadan dolayı müslümanın günahlarını affeder. O müslümanın günahları, ağacın yapraklarının dökülmesi gibi dökülür, buyurdu."},{"k":"p","t":"Rabbimiz [celle celaluhu] şöyle buyurmaktadır:"},{"k":"ar","t":"وَلَنَبْلُوَنَّكُمْ بِشَىْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْاَمْوَالِ وَالْاَنْفُسِ وَالثَّمَرَاتِ وَبَشِّرِ الصَّابِرينَ ۞ اَلَّذينَ اِذَا اَصَابَتْهُمْ مُصيبَةٌ قَالُوا اِنَّا لِلّهِ وَاِنَّا اِلَيْهِ رَاجِعُونَ ۞ اُولئِكَ عَلَيْهِمْ صَلَوَاتٌ مِنْ رَبِّهِمْ وَرَحْمَةٌ وَاُولئِكَ هُمُ الْمُهْتَدُونَ ۞"},{"k":"q","t":"\"Mutlaka sizi biraz korku ve açlıkla; mallardan, canlardan ve ürünlerden eksiltmekle sınayacağız. Sabredenleri müjdele! Onlar, başlarına bir musibet geldiğinde, “Doğrusu biz Allah’a aidiz ve kuşkusuz O’na döneceğiz” derler. İşte rablerinin lütufları ve rahmeti bunlar içindir ve işte doğru yola ulaşmış olanlar da bunlardır.” (Bakara, 2/155-157)"},{"k":"p","t":"Cenab-ı Allah, bu âyetiyle insanları mutlaka deneyeceğini bildirmektedir. Allah’ın sözü haktır, doğrudur. İnsanlar dünyada farklı şekillerde denenmektedirler. Allah, imtihan karşısında insanların sabırlı olmalarını istemekte ve sabırlı olanlara af ve rahmetini müjdelemekte ve böyle davrananların hidayete ermiş/doğru yolu bulmuş kimseler olduğunu bildirmektedir."},{"k":"p","t":"Ayette geçen \"Elbette / mutlaka sizi imtihan ederiz\" ifadesinde kesin beyan vardır. Şüpheleri gidermek, her insanın ayette sayılan hususlardan biri veya bir kaçı ile deneneceğini kesin olarak bildirmek için âyette te’kid edatları kullanılmıştır."},{"k":"p","t":"Bakara suresinin bu 155-157. ayetlerinde şu hususlar dile getirilmektedir:"},{"k":"li","m":"•","t":"İnsanlar Dünyada İmtihana Tabi Tutulurlar"},{"k":"p","t":"Ayette insanların şu dört konuda imtihana tabi tutulacağı bildirilmektedir: Korku ile imtihan, açlıkla imtihan, mal ve ürünlerden noksanlaştırma ile imtihan, yakınların ölümü ile imtihan."},{"k":"p","t":"a) Korku ile imtihan:"},{"k":"q","t":"\"Korku\"; üzülme ve sevinme gibi insanda doğuştan var olan bir duygudur. \"Korku duygusu\"; insanın aldığı eğitim, öğretim, yetiştiği toplum, gelenek ve görenekler ve sahip olduğu inançlara göre farklılık arz eder. \"Korku\", terbiye ve telkinlerle değişebildiği gibi azalıp çoğalabilir de. \"Korku\", insanda iradeye bağlı ve irade dışı olabilir. İnsanlarda yalnızlık, yükseklik, işsiz kalma, yakınlarını ve dostlarını kaybetme, yoksulluk ve benzeri korkular vardır. Âyette geçen ve havf kelimesi ile ifade edilen korku Allah korkusudur."},{"k":"q","t":"\"Korku\", Allah’ın kullarını bir imtihanı olduğu gibi, aynı zamanda psikolojik bir cezalandırma yöntemidir. Yüce Allah şöyle buyurmaktadır:"},{"k":"ar","t":"وَضَرَبَ اللّهُ مَثَلًا قَرْيَةً كَانَتْ امِنَةً مُطْمَئِنَّةً يَاْتيهَا رِزْقُهَا رَغَدًا مِنْ كُلِّ مَكَانٍ فَكَفَرَتْ بِاَنْعُمِ اللّهِ فَاَذَاقَهَا اللّهُ لِبَاسَ الْجُوعِ وَالْخَوْفِ بِمَا كَانُوا يَصْنَعُونَ"},{"k":"q","t":"\"Allah (ibret için size) bir şehri örnek verdi. Bu şehir güvenli (ve) huzurlu idi. Rızkı o şehre her yerden bol bol gelirdi. Sonra onlar, Allah’ın nimetlerine karşı nankörlük ettiler. Allah da onlara, yaptıklarından ötürü açlık ve korku (havf) sıkıntısı tattırdı.\" (Nahl, 16/112)"},{"k":"p","t":"Bu ayette sözü edilen şehir Mekke’dir. Mekke, Harem-i Şerîf hürmetine âfetlerden emîn, halkı rahat, huzurlu ve müreffeh idi. Nimetlere nankörlük edip, Allah’ın son elçisi Hz. Muhammed [sallallahu aleyhi vesellem]’i yalanladılar, Ona ve müslümanlara zulmettiler. Allah da onlara açlık ve korku verdi. Ayette geçen açlık, Mekkelilerin yedi yıl kıtlıkla müptela olmaları; korku ise Allah’ın onlara müslümanları musallat kılmasıdır, şeklinde yorumlanmıştır."},{"k":"p","t":"b) Açlıkla İmtihan:"},{"k":"p","t":"Açlık, nimet azlığının, kıtlığın ve yokluğun ifadesidir. Bütün canlılara rızklarını veren Allah’tır. Yeryüzünde ve gökyüzünde bulunan her şeyi Allah, insanlar için var etmiştir."},{"k":"p","t":"İnsanlar, Allah’ın bu sayısız nimetlerinin bir kısmından emek sarf etmeden yararlanırlar, bir kısmını elde etmek için çalışmak zorundadırlar. Sözgelimi temiz hava, su ve güneş enerjisi gibi nimetlerden insan emek sarf etmeden yararlanırken; meyve, sebze, ekmek ve benzeri ürünlerden yararlanabilmesi için emek sarf etmesi gerekmektedir."},{"k":"p","t":"İnsanın emek sarf ederek elde ettiği nimetlerin yetişmelerini sağlayan da yine Allah’tır. Buğdayı eken insandır ama, toprağa buğdayı yetiştirme kabiliyeti veren, yer altı ve yer üstü suları, güneş enerjisi ve sıcaklığı yaratan Allah’tır. Bunlar olmadan sadece insanların çalışması işe yaramaz. Kıtlığın olmasında, ürünlerin az yetişmesinde insanın çalışmamasının etkisi varsa da, Allah yağmur yağdırmadığı, ürünlere şiddetli soğuk ve dolu zarar verdiği zaman insanın yapacağı bir şey yoktur. Bazı yıllar ürün az, bazı yıllar çok olur. Bunda Allah’ın kullarını imtihanı vardır. Zenginlik ve fakirlik de aynı şekilde insanın çalışıp çalışmamasının yanında, Allah’ın nimet ve servet verip vermemesi ile ilgilidir. Bütün tedbirlere rağmen fakirlik, yoksulluk, kıtlık, pahalılık ve benzeri olumsuzlukların yaşanmasının, ilâhî imtihan olduğu da bir vâkıâdır."},{"k":"p","t":"c) Mal ve Ürünlerden Noksanlaştırma ile İmtihan:"},{"k":"p","t":"İnsanların emek ve gayretleri mal ve mülkün elde edilmesinde önemli olmakla birlikte, gerçekte mülkü insana veren Allah’tır. İnsanın sahip olduğu nimetlerin, mal ve mülkün, ihmal, israf ve benzeri sebeplerle noksanlaşması ve yok olması söz konusu olduğu gibi, bunun ilâhî imtihan sebebi ile de gerçekleşmesi söz konusudur. Mesela hayvanlara yıldırım çarpması, ürünlere dolu ve kasırganın zarar vermesi, yağmurların yağmaması, kuraklık, şiddetli yağmur sonucu sel felaketinin taşınır ve taşınmaz mallara zarar vermesi, deprem gibi âfetlerle insanın, mal ve mülkü zarar görüp noksanlaşabilir. Ayet bu gerçeğe işaret etmektedir."},{"k":"p","t":"Yüce Allah, hakiki sebebi unutarak, nimet karşısında sevinen ve şımaran, imtihan karşısında üzülen ve yakınan insanları kınamaktadır:"},{"k":"ar","t":"فَاَمَّا الْاِنْسَانُ اِذَا مَا ابْتَليهُ رَبُّهُ فَاَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبّى اَكْرَمَنِ ۞ وَاَمَّا اِذَا مَا ابْتَليهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبّى اَهَانَنِ ۞"},{"k":"q","t":"\"İnsan, Rabbi onu deneyip de kendisinde ikramda bulunduğunda, ona bol bol nimetler verdiğinde, ‘Rabbim bana ikram etti’ der. Ama onu deneyip rızkını daraltınca, ‘Rabbim beni aşağıladı’ der.\" (Fecr, 89/15-16)"},{"k":"p","t":"d) Yakınların Ölümü ile İmtihan:"},{"k":"p","t":"Her canlı mutlaka ölümü tadacaktır. Bu, ilâhî bir yasadır. İnsanlar, Allah’ın takdir ettiği yaşama süresi dolunca ölmektedirler. Bazen ölümler, çocuk ve genç yaşlarda da olabilmektedir. İnsan, sevdiklerini, eşini, kardeşlerini, çocuklarını bir hastalık veya âfet ve kaza sonucu kaybedebilmektedir. Bütün bunlar, insanlar için birer imtihandır. Yüce Rabbimiz [celle celaluhu] şöyle buyuruyor:"},{"k":"ar","t":"اَلَّذى خَلَقَ الْمَوْتَ وَالْحَيوةَ لِيَبْلُوَكُمْ اَيُّكُمْ اَحْسَنُ عَمَلًا وَهُوَ الْعَزيزُ الْغَفُورُ"},{"k":"q","t":"“O, hanginizin daha güzel amel yapacağını sınamak için ölümü ve hayatı yaratandır. O, mutlak güç sahibidir, çok bağışlayandır.” (Mülk, 67/2)"},{"k":"p","t":"Aslında hayatın kendisi bir imtihan sürecidir. Allah, kulunu, onun imanını ve sabrını ölçmek için hayır ve şer, iyilik ve kötülük, nimetler, musibetler, ahde vefa ve benzeri birçok şeyle imtihan edebilir. İnsanların bütün bu sayılan hususlara karşı sabırlı olması, feryâd-ü fîgan etmemesi erdemli bir davranıştır. Âyet, imtihan karşısında insanın tavrının bu olması gerektiğini ifade etmektedir. Sabır, en çetin imtihanlardan başarı ile çıkmayı sağlayacak bir anahtardır."},{"k":"li","m":"•","t":"İnsanların Musîbetlere Karşı Sabırlı Olmaları Gerekir"},{"k":"p","t":"Allah, biraz korku ve açlıkla; mallardan, canlardan ve ürünlerden biraz noksanlaştırmak suretiyle imtihan edeceğini bildirdikten sonra, \"sabredenleri müjdele\" buyurmakta ve onların kendilerine bir musîbet dokunduğunda, \"Biz Allah’ın kullarıyız ve biz O’na döneceğiz\" dediklerini haber vermektedir. Böylece Allah, hem insanların musîbet ile karşılaşabileceklerini, hem de musîbetler karşısında nasıl tavır takınmaları gerektiğini bildirmektedir."},{"k":"p","t":"İlâhî imtihanın dışında, musîbetlerin meydana gelmesinde 3 etken daha vardır: İlâhî irade, ilâhî takdir ve insanların davranışları."},{"k":"p","t":"a)\tİlâhî İrade:"},{"k":"ar","t":"وَاَنَّهُ هُوَ اَضْحَكَ وَاَبْكَى۞ وَاَنَّهُ هُوَ اَمَاتَ وَاَحْيَا ۞"},{"k":"q","t":"“Kâinatı ve içindeki canlı ve cansız bütün varlıkları yaratan, yaşatan, düzene koyan, öldüren ve dirilten, insanları güldüren ve ağlatan Allah’tır.” (Necm, 43-44)"},{"k":"ar","t":"كُلُّ نَفْسٍ ذَآئِقَةُ الْمَوْتِ وَاِنَّمَا تُوَفَّوْنَ اُجُورَكُمْ يَوْمَ الْقِيَمَةِ فَمَنْ زُحْزِحَ عَنِ النَّارِ وَاُدْخِلَ الْجَنَّةَ فَقَدْ فَازَ وَمَا الْحَيَوةُ الدُّنْيَآ اِلاَّ مَتَاعُ الْغُرُورِ"},{"k":"q","t":"“Allah, dilediğini yapar, dilediğini aziz, dilediğini zelil eder, Mülk Onundur, mülkü dilediğine verir, dilediğinden alır.” (Âl-i İmran, 3/185)"},{"k":"p","t":"Doğumlar, ölümler, tabiat olayları, âfetler ve musîbetler kısaca iyi veya kötü, hayır veya şer her şey, O’nun izni ve iradesi ile meydana gelir. Dolayısıyla insanların canlarına ve mallarına zarar veren musibet ve âfetler de, ancak Allah’ın izni ve takdiri ile olmaktadır."},{"k":"ar","t":"مَآ اَصَابَ مِنْ مُصِيبَةٍ اِلاَّ بِاِذْنِ اللهِ وَمَنْ يُؤْمِنْ بِاللهِ يَهْدِ قَلْبَهُ وَاللهُ بِكُلِّ شَىْءٍ عَلِيمٌ"},{"k":"q","t":"\"Size  isabet  eden  her türlü musîbet ancak Allah’ın izni ile olur.\" (Teğâbün, 11)"},{"k":"q","t":"\"Müslümanı üzen her şey musîbettir.\" Her türlü musîbet de ancak Allah’ın izni ile meydana gelmektedir. Allah izin vermese, hiçbir musîbet meydana gelmez. Kâinatta başıboşluk ve düzensizlik yoktur. “Hiçbir şey, O’nun izni olmadan meydana gelemez.” Allah’ın izni olmadıkça, insanlar canlarını bile teslim edemezler."},{"k":"p","t":"Allah bu gerçeği şöyle bildirmektedir:"},{"k":"ar","t":"وَمَا كَانَ لِنَفْسٍ اَنْ تَمُوتَ اِلاَّ بِاِذْنِ اللهِ كِتَاباً مُؤَجَّلاً"},{"k":"q","t":"\"Allah’ın izni olmadan hiç kimse ölmez. (Ölüm) belirli bir süreye göre yazılmıştır.\" (Âl-i İmrân, 3/145)"},{"k":"p","t":"b) İlâhî Takdir:"},{"k":"p","t":"Diğer taraftan insanın başına gelen musîbetler, ilâhî takdirin birer sonucudur. Cenab-ı Allah şöyle buyurur:"},{"k":"ar","t":"قُلْ لَنْ يُصِيبَنَا اِلاَّ مَا كَتَبَ اللهُ لَنَا هُوَ مَوْلَينَا وَعَلَى اللهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ"},{"k":"q","t":"\"(Ey Peygamberim! İnsanlara) De ki: Bize ancak Allah’ın yazdığı  (takdir  ettiği)  şey  isabet eder.\" (Tevbe, 9/51)"},{"k":"p","t":"Görüldüğü üzere, Cenab-ı Allah mübarek kelamında; gerek yer yüzüne gerekse canlara isabet eden musîbetlerin önceden bir Kitap’ta, ilmi ilâhînin nakşedildiği Levh-ı Mahfuz’da yazılı olduğu bildirilmektedir. Allah’ın ilmi, geçmişi de geleceği de kuşatmıştır. Doğumundan ölümüne kadar, ömür boyu insanların ne yapacaklarını da, kâinatta neler meydana geleceğini de bilir. Bu bilgisine göre, her şeyi önceden bir Kitap’ta yazmıştır."},{"k":"p","t":"Cenab-ı Allah, musîbetler karşısında insanların üzülmemelerini, feryad-ü fîgan etmemelerini istemektedir. Çünkü, bütün olup bitenler Allah’ın izni ve takdiri ile olmuştur. İnsanın, \"niçin bunlar oldu, niçin bunlar başıma geldi?\" diye isyan etmesinin, sonucu değiştirmesi söz konusu değildir."},{"k":"q","t":"\"Musîbetler, Allah’ın takdiri ile olmuştur\" deyip, sabırlı ve metanetli olmak gerekir. Sabırlı olmak; musîbet karşısında tedbir almamak, musîbetlerden sonra gerekenleri yapmamak ve haklarını aramamak anlamına gelmez. Biliyoruz ki, Allah \"çok merhametlidir\" ve \"insanlara zerre kadar zulmetmez.\""},{"k":"p","t":"Mala ve cana zarar veren musîbetlerin meydana gelmesinde ilâhî irade, takdir ve imtihanda insanların davranışlarının etkisi de var mıdır? Kur’ân ve hadislere baktığımızda, cevabın ‘evet’ olduğunu görüyoruz."},{"k":"p","t":"c) İnsanların Kusurları:"},{"k":"p","t":"Musîbetlerin meydana gelmesinde insanların kusurlarının da bulunduğunu yüce Allah, bir çok âyette bildirmektedir. Mesela:"},{"k":"ar","t":"وَمَآ اَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ اَيْدِيكُمْ وَيَعْفُوا عَنْ كَثِيرٍ"},{"k":"q","t":"\"Başınıza  gelen  her hangi bir musîbet, kendi ellerinizin  yaptığı  (işler, kusurlar) yüzündendir. Allah yaptıklarınızın çoğunu affediyor (da bu yüzden size musîbet vermiyor).\" (Şura, 30) ayeti, bu gerçeği açıkça ifade etmektedir. Peygamberimiz [sallallahu aleyhi vesellem];"},{"k":"q","t":"\"Bir kula isabet eden az veya çok felâketler ancak günah- ları sebebiyledir. Allah ise günahların çoğunu bağışlıyor\" buyurmuş ve yukarıdaki âyeti okumuştur."},{"k":"p","t":"Bu âyet ve hadisler, insanların başına gelen musîbetlerde insanların işledikleri hata, kusur ve kötü amellerin etkili olduğunu göstermektedir. Allah, zulümleri sebebiyle bir çok toplumu çeşitli âfetlerle cezalandırmış ve helak etmiştir."},{"k":"p","t":"Allah’ı, âyetlerini ve peygamberlerini inkâr etmek, Allah’a ortak koşmak, münafıklık yapmak, Allah ve Peygamberin emir ve yasaklarına isyan etmek, insan haklarını ihlâl etmek gibi, ilâhi iradeye uymayan her türlü davranış zulümdür. Musîbetler, insanların imtihan için veya maddî veya manevî kusurları sebebiyle gelebileceği gibi, müminin manevî derecesini artırmak için de gelebilir. Yüce Allah Kur’an’da;"},{"k":"ar","t":"وَلِكُلٍّ دَرَجَاتٌ مِمَّا عَمِلُوا وَمَا رَبُّكَ بِغَافِلٍ عَمَّا يَعْمَلُونَ"},{"k":"q","t":"\"İnsanların yaptığı amellere göre (Allah katında) dereceleri vardır\" buyurmaktadır. (En’am, 6/132)"},{"k":"p","t":"Mü’minler, bu derecelerine yaptıkları ibadetleriyle ulaşamazlarsa, Allah onlara bir musîbet verir, sabır ihsan eder, böylece hesapsız dere
