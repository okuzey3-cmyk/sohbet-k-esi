sanım babam rahmetli olmadan bana epey bir altın bıraktı. Gelirken kardeşim küçük olduğu için saklamak zorunda kaldım. Şimdi siz bu cezayı infaz ederseniz yetimin hakkını zayi ettiğiniz için Allah [celle celaluhu] katında sorumlu olursunuz. Bana üç gün izin verirseniz ben emaneti kardeşime teslim eder gelirim. Bu üç gün için de yerime birini bulurum der."},{"k":"p","t":"Hz. Ömer (radıyallahu anh) dayanamaz der ki:"},{"k":"p","t":"- Bu topluluğa yabancı birisin, senin yerine kim kalır ki? Der. Sözün burasında genç adam ortama bir göz atar der ki,"},{"k":"p","t":"- Bu zat benim yerime kalır, o zat Hz. peygamber Efendimizin [sallallahu aleyhi vesellem] en iyi arkadaşlarından, daha yaşarken cennetle müjdelen Amr ibni As’ dan (radıyallahu anh) başkası değildir. Hz. Ömer (radıyallahu anh) Amr’a (radıyallahu anh) dönerek,"},{"k":"p","t":"- Ey Amr (radıyallahu anh) delikanlıyı duydun, der. O yüce sahabe:"},{"k":"p","t":"- Evet, ben kefilim, der ve genç adam serbest bırakılır."},{"k":"p","t":"Üçüncü günün sonunda vakit dolmak üzere ama gençten bir haber yoktur, Medine’nin ileri gelenleri Hz. Ömer’e (radıyallahu anh) çıkarak gencin gelmeyeceğini, dolayısıyla Amr ibni As’a (radıyallahu anh) verilecek idamın yerine, maktulün diyetinin verilmesini teklif ederler, fakat gençler razı olmaz ve babamızın kanı yerde kalsın istemiyoruz, derler."},{"k":"p","t":"Hz. Ömer (radıyallahu anh) kendinden beklenen cevabı verir, der ki,"},{"k":"p","t":"- Bu kefil babam olsa fark etmez, cezayı infaz ederim."},{"k":"p","t":"Hz. Amr ibni As (radıyallahu anh) ise tam bir teslimiyet içerisinde der ki,"},{"k":"p","t":"- Biz de sözümüzün arkasındayız."},{"k":"p","t":"Bu arada kalabalıkta bir dalgalanma olur ve insanların arasından genç görünür. Hz. Ömer (radıyallahu anh) gence dönerek der ki,"},{"k":"p","t":"- Evladım gelmeme gibi önemli bir fırsatın vardı neden geldin. Genç vakurla başını kaldırır ve:"},{"k":"p","t":"- Ahde vefasızlık etti demeyesiniz diye geldim, der."},{"k":"p","t":"Hz. Ömer (radıyallahu anh) başını bu defa çevirir ve Amr ibni As’a (radıyallahu anh) der ki,"},{"k":"p","t":"- Ey Amr (radıyallahu anh) sen bu delikanlıyı tanımıyorsun nasıl oldu da onun yerine kefil oldun? Amr ibni As (radıyallahu anh):"},{"k":"p","t":"- Bu kadar insanın içerisinden beni seçti, insanlık öldü dedirtmemek için kabul ettim der. Sıra gençlere gelir derler ki,"},{"k":"p","t":"- Biz bu davadan vazgeçiyoruz, bu sözün üzerine Hz. Ömer (radıyallahu anh):"},{"k":"p","t":"- Ne oldu biraz evvel babamızın kanı yerde kalmasın diyordunuz ne oldu da vazgeçiyorsunuz?"},{"k":"p","t":"Gençlerin cevabı dehşetlidir:"},{"k":"p","t":"- Merhametsiz insan kalmadı demeyesiniz diye."},{"k":"h","t":"Peygamber’e [sallallahu aleyhi vesellem] Vefa"},{"k":"p","t":"Allah'a karşı olan vefadan sonra en ulvi ve en gerekli vefa Peygamber Efendimize [sallallahu aleyhi vesellem] olan vefadır. Bu vefa Rabbine yalvarış ve yakarışlarında ümmetini hep önde tutan, ümmetim ümmetim diye dua eden rahmet peygamberine olan vefamızdır. O ümmetini dualarının evveline koyarken bizlerin O'na olan vefamızı yerine getiremeyişimiz büyük bir vefasızlık örneği olur."},{"k":"p","t":"Peygamber efendimize vefa; onun sünneti seniyyesine, hadisi şeriflerine, emrettiklerine ve nehyettiklerine sımsıkı sarılmak, onun ahlakı ile ahlaklanma niyeti ve gayretinde olmak, hayatını okuyup öğrenmek hatıralarını yâd etmek, bıraktığı emanete sahip çıkmak ile olur. Çünkü Peygamber Efendimiz [sallallahu aleyhi vesellem] üsve-i hasenedir."},{"k":"p","t":"Peygamber Efendimize olması gereken vefayı en iyi sahabi efendilerimizden öğrenebiliriz. Uhud harbinin dehşetli anlarında müşrikler Peygamber efendimizi öldürmek için var güçleri ile saldırıda bulundukları sıralarda, Efendimizin yanında  bulunan sahabilerin kendilerini etten bir duvar gibi sarmaları gelen oklara kendilerini siper etmeleri vefanın en yüksek örneklerinden biridir."},{"k":"p","t":"Vefanın bir başka örneği ise Hudeybiye günü müşrikler ile anlaşmaya giden Hz.Osman’ın (radıyallahu anh) teklifinin kabul edilmeyip müşrikler tarafından kendisine dilersen sen tavafını yapabilirsin demeleri üzerine \"Hazret-i Peygamber Kâbe'yi tavâf etmedikçe ben de edemem. Ben Beytullâh'ı, ancak O'nun arkasında ziyâret ederim. O'nun kabûl edilmediği yerde ben de yokum.\" diyerek Resulullah Efendimiz’e [sallallahu aleyhi vesellem] olan sadakatini ve vefasını göstermiş olmasıdır."},{"k":"p","t":"Buna karşılık Efendimiz [sallallahu aleyhi vesellem] sahabilerden teker teker ellerini tutarak biat alırken Hz Osman (radıyallahu anh) orada bulunmadığı için kendi (diğer) elini tutarak ‘Ya Rabbi bu da Osmanın biatidir’ diyerek Hz Osman’ı da (radıyallahu anh) biat edenlerin içine katmıştır."},{"k":"p","t":"Allah Teâlâ, Fetih suresinde şöyle buyurmaktadır;"},{"k":"ar","t":"اِنَّ الَّذِينَ يُبَايِعُونَكَ اِنَّمَا يُبَايِعُونَ اللّٰهَؕ يَدُ اللّٰهِ فَوْقَ اَيْدِيهِمْۚ فَمَنْ نَكَثَ فَاِنَّمَا يَنْكُثُ عَلٰى نَفْسِهِۚ وَمَنْ اَوْفٰى بِمَا عَاهَدَ عَلَيْهُ اللّٰهَ فَسَيُؤْتِيهِ اَجْراً عَظِيماً"},{"k":"q","t":"“Sana yeminle bağlılık sözü verenler gerçekte bu sözü Allah’a vermiş oluyorlar, Allah’ın eli onların elleri üzerindedir. Bu sebeple kim Allah’a verdiği ahdi bozarsa ancak kendi aleyhine bozmuş olur, Allah’a verdiği sözün gereğini yerine getirene ise Allah yakında büyük ödül verecektir.” (Fetih Suresi, 10)"},{"k":"p","t":"Bizlerde yaşantımızda Resulullah Efendimiz’in [sallallahu aleyhi vesellem] sünnetine uyarak ona olan vefamızı yerine getirmiş oluruz."},{"k":"p","t":"Ubâde b. Sâmit’ten (radıyallahu anh) nakledildiğine göre, Hz. Peygamber [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Bana kendi adınıza altı şeyin güvencesini verin, ben de size cennetin güvencesini vereyim: Konuştuğunuzda doğru söyleyin, söz verdiğinizde sözünüzü tutun, size (bir şey) emanet edildiğinde ona riayet edin, iffetinizi koruyun, gözlerinizi (bakılması yasak olandan) sakının ve ellerinizi (haramdan) çekin.”"},{"k":"p","t":"Başka bir hadisi şerifte ise Allah Resulü [sallallahu aleyhi vesellem] şöyle buyurmuştur:"},{"k":"q","t":"“Münafığın alameti üçtür: Konuştuğunda yalan söyler, söz verdiğinde tutmaz, emanete hıyanet eder.”"},{"k":"p","t":"Vefa Peygamberlerin, Velilerin ve Salih Kulların Ortak Özelliklerinden Ve Ahlaklarından Biridir"},{"k":"p","t":"Başta Peygamber Efendimiz [sallallahu aleyhi vesellem] olmak üzere, bütün peygamberlerin hayatı birer vefa örneğidir."},{"k":"p","t":"Peygamber Efendimiz [sallallahu aleyhi vesellem], Mekke nin fethinden sonra bir müddet orada kalınca, Ensardan bazıları Peygamber Efendimiz’in [sallallahu aleyhi vesellem] bir daha Medine’ye dönüp dönmeyeceği hususunda endişeye kapılıp kendi aralarında hüzünlü bir şekilde konuşmaya başlamışlardı."},{"k":"p","t":"Çünkü Allah Teâlâ, ona kendi doğup büyüdüğü mukaddes beldenin fethini nasip etmişti. Hal böyle olunca Ensar’da kendi düşüncelerince haklı olarak böyle bir varsayıma kapılmışlardı. Durumdan haberdar olan Resulullah Efendimiz [sallallahu aleyhi vesellem] yanlarına giderek ne hakkında konuştuklarını sorar. Endişelerini öğrendikten sonra ise büyük bir vefa örneği olan şu sözleri söyler."},{"k":"p","t":"- ‘Ey Ensâr! Öyle bir şey yapmaktan Allâh'a sığınırım. Ben sizin memleketinize hicret ettim. Hayâtım hayâtınız; ölümüm de sizin yanınızdadır.’"},{"k":"p","t":"Bu vefâyı, vefat hastalığında mescide son ziyaretinde minbere çıktıklarında muhâcilere:"},{"k":"q","t":"\"Ey muhâcirler! Ensâra karşı iyi davranın! Onlar bir kıymettir. Onlar bana karşı sığınak olmuşlardı. İyilerine iyilikle muâmele edin, kötülük yapanları da affedin!..\"  buyurmak suretiyle o son demlerinde dahi ahde vefayı terk etmemiştir."},{"k":"p","t":"Resulullah Efendimiz [sallallahu aleyhi vesellem] ahdine ne kadar önem verdiğini daha kendisine peygamberlik gelmeden önceki hayatında bile ‘Muhammed’ül Emin’ diye anılmasından anlayabiliriz."},{"k":"h","t":"Mürşid-i Kâmil’e Vefa"},{"k":"p","t":"Müridlerin bir mürşide intisap ederken yaptıkları biat, verdikleri söz de bir ahittir. Buradaki ahdin manası, tam bir sadakat ve dürüstlükle kâmil mürşide bağlanacağına, harfiyen emirlerini yerine getireceğine söz vermek, bu uğurda her türlü meşakkat ve çileyi de göze almaktır."},{"k":"p","t":"Allah’ın [celle celaluhu] rızasını kazanmak büyük bir iştir. Nefsi terbiye etmeden, Allahu Teâlâ’nın rızası elde edilemeyeceği gibi, Hak dostlarının kapısına varmadan nefsin terbiye edilmesi de zor ve neredeyse imkânsızdır. Allah’a [celle celaluhu] vasıl olanların hemen tamamı, az veya çok Hak dostlarının terbiyesinden geçmişlerdir. Meselenin ehemmiyetinden dolayı Cenâb-ı Hak [celle celaluhu]:"},{"k":"ar","t":"وَاتَّبِعْ سَبِيلَ مَنْ اَنَابَ اِلَيَّۚ"},{"k":"q","t":"“Bana yönelenlerin yoluna uy.”"},{"k":"p","t":"Diye emretmiş, diğer bir ayet-i kerimede ise:"},{"k":"ar","t":"يَٓا اَيُّهَا الَّذِينَ اٰمَنُوا اتَّقُوا اللّٰهَ وَكُونُوا مَعَ الصَّادِقِينَ ۞"},{"k":"q","t":"“Ey iman edenler! Allah’tan korkunuz ve doğrular ile beraber olunuz.”  buyurmuştur."},{"k":"p","t":"Kalpleri Allah Teâlâ’nın [celle celaluhu] nazargâhı olan kâmil mürşitler, manevi Kâbe hükmündeki zatlardır. Hz. Resûlullah’ın [sallallahu aleyhi vesellem] sevgilisi, vekili, vârisi ve emanetidirler."},{"k":"p","t":"Dolayısıyla onlarla ahitleşmek, Allah [celle celaluhu] ve Resûlü [sallallahu aleyhi vesellem] ile ahitleşmektir. Onlara itaat etmek, Âlemlerin Rabbine ve iki cihan güneşine [sallallahu aleyhi vesellem] itaat etmektir. İsyan da yine onlara isyandır."},{"k":"p","t":"Mürşidi can-ü gönülden sevmek Allah [celle celaluhu] ve Resûlü’nü [sallallahu aleyhi vesellem] sevmeye ve kâmil imanı elde etmeye sebep olur. Hadis-i şerifte:"},{"k":"q","t":"“Allah’a yemin ederek söylüyorum ki, ben bir kimse için ailesinden, çoluk çocuğundan, anne babasından ve bütün insanlardan daha sevgili olmadıkça, o kimse gerçek manada iman etmiş olmaz.”  buyrulmaktadır. Tasavvuf âlimleri ittifak etmişlerdir ki, aynı şekilde bir mürid mürşidini sevmeden Hz. Fahri-i Kâinatı [sallallahu aleyhi vesellem] sevemez."},{"k":"p","t":"Mürid, mürşidinin sevdiği her şeyi sever. Onu üzen her şeye üzülür. Mürşidinin canını sıkan bir şey oldu mu, bunu ferasetiyle anlar ve derhal gereğini yapar. Huzura her varışta edeple varır. Gıyabında da edeple oturur, edeple kalkar. Zihninde, hayalinde, tasavvurunda, hatta rüyalarında bile onunla konuşur, onunla gezer. Hızır [aleyhisselâm] yanına gelse, kendisiyle konuşsa, kalbinin asıl iltifatı yine mürşidinedir. Zira ahdinde ve muhabbetinde ihlâslıdır. Bilir ki, bir kalpte iki padişah olmaz. Gönlünde çatallaşma başlayanların hemen hepsi yolda kalmışlardır."},{"k":"p","t":"Mürşide vefa göstermek, hakikatte Allah [celle celaluhu] ve Resûlü’ne [sallallahu aleyhi vesellem] vefa göstermektir ve ebedi selamete vesiledir."},{"k":"p","t":"Böyle bir selamet, ebedi kurtuluş, cefa çekmeye değmez mi?”"},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdülbâki el-Hüseynî hazretleri [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“İnsan, bu tarikat-ı âliyeye sadık olursa kazananlardan olur. Bu kapıda sadık, halim, mazlum olmak şarttır. Teslimiyetin en güzel örneği Hz. İbrahim ve Hz. İsmail’in [aleyhimesselâm] teslimiyetidir. Allah Teâlâ [celle celâluhû], “Emrolunduğun gibi dosdoğru ol!” (Hûd 11/112) buyuruyor. Bizim de böyle olmamız lazım. Sâdâtlar sûfîyi çağırıp bir şey söylerse, onu yapmalıdır. Bu sâdâtların size bir tavsiyesidir. Bir mürşid-i kâmile teslim olmak, onun sözünü tutmak, onun yolundan gitmek, ona itaat etmek gerekir. Ancak böyle olunursa bu kapıdan menfaat görülür.”"},{"k":"h","t":"Allah İçin Verilen Söze Sadakat"},{"k":"p","t":"Ariflerden birisi demiştir ki: “Allah’u Teala’nın kuluna ilham yoluyla söylediği iki tane sırrı vardır: Bunlardan birisi şudur: Kul, annesinin karnından çıkıp doğunca Allah’u Teala kendisine: “Ey kulum! Seni temiz ve nezih bir şekilde dünyaya çıkarttım, sana ömrünü emanet ettim ve seni onu emniyetle koruman için görevlendirdim. Artık bu emaneti nasıl koruyacağına ve huzuruma ne şekilde geleceğine bak."},{"k":"p","t":"Diğeri de kulun ruhu çıkarken olur. O zaman Allah Teala kula: “Ey kulum! Sana verdiğim emanetimi nasıl kullandın? Bana kavuşuncaya kadar seninle yaptığım ahde riayet ederek onu korudun mu? Eğer onu korudu isen ben de senin bu vefana karşılık olarak ecrini veririm. Eğer onu zayi etti isen sana hesabını sorar cezanı veririm.”"},{"k":"p","t":"Kulun, üstlendiği emanete sahip çıkması ve Allah Teala’nın kulundan onun muhafazasını istemesi, ayetlerde ifade edilmiştir:"},{"k":"p","t":"Kulun ömrü, kendisine verilmiş bir emanettir; eğer onu hak yolda geçirerek korursa, emanetini yerine getirmiş ve sahibine güzelce iade etmiş olur. Eğer onu küfür ve isyanla zayi ederse, Allah Teala’nın emanetine hainlik yapmış olur. Hiç şüphesiz Allah hainleri sevmez.  İhanet verilen sözün gereğini yerine getirmemektir. Halbuki mü’minlerin temel özelliklerinden birisi de Allah'a verdiği söze sadakat göstermeleridir."},{"k":"p","t":"Hz. Enes (radıyallahu anh) şöyle demiştir: Amcam Enes b. en-Nadr Bedir'e Resulullah [sallallahu aleyhi vesellem] ile birlikte katılmamıştı. Bu ona çok ağır gelmişti, bundan dolayı şöyle demişti: “Resulullah [sallallahu aleyhi vesellem]'ın ilk hazır bulunduğu gazada ben (nasıl oldu da) bulunamadım. Allah'a yemin ederim, eğer bundan sonra Allah, Resulullah ile birlikte bir savaşta benim de hazır bulunmamı takdir ederse, şüphesiz Allah neler yapacağımı görecektir.”"},{"k":"p","t":"Hz. Resulullah [sallallahu aleyhi vesellem] ile birlikte ertesi sene Uhud'da bulundu. Sa'd b. Malik (radıyallahu anh) ile karşılaştı. Ona: “Ey Ebu Amr nereye?” O da: “Cennet kokusu ne hoş? Ben bunu Uhud taraflarından alıyorum” dedi ve öldürülünceye kadar çarpıştı. Vücudunda kılıç darbesi, mızrak yarası ve ok yarası olmak üzere seksen küsur yara tesbit edildi. Halam en-Nadr kızı er-Rubayyi': “Ben kardeşimi ancak parmak uçlarından tanıyabildim” dedi. Ve bunun üzerine \"Mü'minler arasında Allah'a verdikleri sözde içtenlikle sebat gösteren nice yiğitler vardır. Onlardan kimisi adağını yerine getirdi, kimisi de beklemektedir. Onlar hiçbir şeyi değiştirmemişlerdir\"  ayeti nazil oldu.  Aşıkların verdikleri söze gösterdikleri sadakat ve teslimiyetin nişanesidir."},{"k":"p","t":"Sufiler, ilahi ve beşeri ahidlere sadakati tasavvufun esası olarak görmüşlerdir. Hatta bazı Allah dostlarına göre, tasavvuf ahde vefadan ibarettir. Onlar, insanın, \"Allah için şunu yapacağım\" diye zihninden geçireceği bir fikrin bile bağlı kalınması gereken bir ahid olduğu görüşündedirler. Zihinden geçen şeylere akid, dille ifade edilenlere ahid denir; her ikisini de ahid bilip bağlı kalmak gerekir. Şeriat nasıl din ise ahde vefa da dindir. Allah'ın ahdine bağlılık göstermeyenler şeriatın adabına da riayet etmezler."},{"k":"p","t":"Müridlerin tarikata girerken şeyhlere verdikleri söze de ahid denir. Bu ahidde, Allah'a ve Resulüne verilen ahde bağlı kalmanın lüzumu üzerinde durulur. Zira müridi yüksek mertebelere ulaştıracak olan bu bağlılıktır. Mürid şeyhe verdiği ahde, sıkıntılı ve rahatlık zamanlarında aynı derecede sadakatle bağlı kalıp asla ahdi bozmaz, biatta sebat gösterir. Müride merasimle giydirilen hırka, onun verdiği ahde vefa göstereceğinin sembolü olarak kabul edilir. Şeyhe verilen ahid müridin ona karşı samimi ve dürüst davranacağını, hiçbir emir ve tavsiyesine muhalefet etmeyeceğini ve hiçbir sırrını şeyhinden saklamayacağını taahhüt etmesi manasına gelir."},{"k":"p","t":"Müridin asıl işlerinden birisi de, Allah Teala’ya verdiği sözlerde durmaktır."},{"k":"p","t":"Geçekten, müritlik (manevi terbiye) yolunda Allah’a verdiği sözü bozmak, zahir ehline göre dinden çıkmak gibi tehlikelidir."},{"k":"p","t":"Sufilik, yüce Allah’a verilen kulluk ve dostluk sözünü korumaktan ibarettir."},{"k":"p","t":"Allah Teala kur’an-ı Mübin de mü’minleri işaret ederek şöyle buyurmuştur:"},{"k":"ar","t":"وَاَوْفُوا بِعَهْدِٓي اُو۫فِ بِعَهْدِكُمْ"},{"k":"q","t":"“…bana verdiğiniz sözü tutun ki, ben de size verdiğim sözü tutayım!”"},{"k":"p","t":"İbn Acibe el- Haseni (rahmetullahi aleyh) bu ayetin tefsirinde şöyle der:"},{"k":"q","t":"“Siz şeriatın hükümlerini yerine getirerek bana verdiğiniz kulluk sözünü yerine getirin; bende size tarikatın güzelliklerine ulaştırarak(mücahede ehline verdiğim) sözümü yerine getireyim. Siz tarikatın usulünce seyrü süluk ederek bana verdiğiniz söze vefa gösterin; bende sizleri hakikate ulaştırarak(mücahede ehlini bana ulaştıracağıma dair)sözümü yerine getireyim.”"},{"k":"h","t":"Sadık İnsanlaradan Örnekler"},{"k":"p","t":"Vefa, peygamberlerin, velilerin en belirleyici özelliklerinden olup, beşeri hayatı yüce bir seviyede taçlandıran manevi bir sıfattır. Bu itibarla bazı müfessirler, İslam'ı dil ile ikrar ve kalp ile tasdikten sonra, Allah Teala'nın kaza ve kaderine teslimiyet ve vefa olarak tarif etmişlerdir."},{"k":"p","t":"Vefakar kullar, ateş parçası olan nefslerini adeta bir gül bahçesine çevirmişlerdir. Bu öyle bir bahçedir ki, içinde iman, zikir, irfan, lütuf çiçekleri yetişir ve amel-i salih ırmakları akar. Böyle bir gönülün mükafatı da kendi haline uygun olur ki, bu Cennet-i Ala ve Cemalullah'dır. Böyle gönüllerin önünde ateşler bile vasıflarını değiştirerek gülistana dönerler. Nitekim Allah'ın halili Hz. İbrahim [aleyhisselâm] Nemrut tarafından ateşe atıldığında, Mevla'nın emriyle ateş, Hz. İbrahim'e [aleyhisselâm] serinlik ve selamet olmuştur. Zira “...çok vefakar olan İbrahim...” , nefs ateşini söndürmüş, Cenab-ı Hakk'a samimiyet ve sadakatini göstermişti."},{"k":"p","t":"Hak aşıklarının kutlu hayatlarında Allah için verdikleri söze gösterdikleri sadakat örnekleri mevcuttur."},{"k":"p","t":"Öncelikle her konuda olduğu gibi bu konuda da Hz. Peygamber Efendimiz [sallallahu aleyhi vesellem]'den sözüne daha sadık bir kimse yoktu. Ebu Cehil, Ebu Leheb ve daha Müslüman olmazdan evvelki haliyle Ebu Süfyan, O'nun doğruluğunu, iffetini, ahde vefasını biliyor ve kendilerine sorulduğu zaman bunu itiraf ediyorlardı. Aslında bütün düşmanları O'nun doğru söylediğini biliyorlardı. Fakat onların aşamadıkları nokta farklıydı."},{"k":"p","t":"Abdullah bin Ebu'l-Hamsa (radıyallahu anh) anlatıyor:"},{"k":"p","t":"Peygamber olmadan önce Hz. Resul-i Ekrem'e [sallallahu aleyhi vesellem] alış-verişle ilgili bir şey vermek için filan gün filan yerde buluşmak üzere sözleştik. Fakat ben unuttum, ancak üçüncü gün hatırladım. Gittim baktım ki, Resul-i Ekrem [sallallahu aleyhi vesellem] orada bekliyor. Beni görünce:"},{"k":"q","t":"“Delikanlı beni yordun. Üç günden beri seni burada bekliyorum” buyurdu."},{"k":"p","t":"Bedir savaşı için yola çıkıldığı esnada, Huzeyfe el-Yemani ile babası Huzeyl (radıyallahu anhuma), Peygamberimiz'in safında savaşmak üzere ardından yola çıkmışlardı. Müşrikler babaoğulu yolda görerek sorguya çektiler:"},{"k":"q","t":"“Siz herhalde Muhammed'in [sallallahu aleyhi vesellem] yanına gitmek istiyorsunuz” dediler. Onlar da:"},{"k":"q","t":"“Evet, bizim niyetimiz budur” dediler."},{"k":"p","t":"Bunun üzerine müşrikler, onlardan Medine'ye dönmek ve Peygamberimiz'le [sallallahu aleyhi vesellem] birlikte savaşmamak üzere söz aldılar."},{"k":"p","t":"Bir müddet sonra Huzeyfe ile babası Bedir'de Peygamberimiz'in huzuruna gelerek başlarından geçenleri anlattılar ve mücahitlerle birlikte savaşmak istediklerini söylediler."},{"k":"p","t":"Efendimiz [sallallahu aleyhi vesellem] onların müşriklere verdikleri sözü öğrenince, o anda savaşçıya çok fazla ihtiyacı olmasına rağmen şöyle buyurdu:"},{"k":"q","t":"“Hayır, siz Medine'ye dönün. Onlara verdiğiniz sözü yerine getirin. Biz de müşriklere karşı Allah'tan yardım isteriz. O'nun yardımı bize kafidir.”"},{"k":"p","t":"Allah Resulü [sallallahu aleyhi vesellem] oturmuş, Huneyn'de, Hevazin kabilesinden elde ettikleri ganimetleri taksim ediyordu. O esnada adamın biri Resulullah Efendimiz [sallallahu aleyhi vesellem]’in başı ucunda durdu ve"},{"k":"q","t":"“Hani senin bana bir sözün vardı” dedi. Resulullah [sallallahu aleyhi vesellem],"},{"k":"q","t":"“Doğru söyledin, dilediğini seç” buyurdu. Adam,"},{"k":"q","t":"“Çobanlarıyla birlikte seksen koyun isterim” dedi. Peygamber Efendimiz [sallallahu aleyhi vesellem],"},{"k":"q","t":"“Onlar senin oldu” buyurdu ve şöyle ekledi:"},{"k":"q","t":"“Az bile istedin. Hz. Musa’ya [aleyhisselâm], Hz. Yusuf’un [aleyhisselâm] kabrinin bulunduğu yeri gösteren kadın senden daha akıllı ve daha isabetli davrandı. Hz. Musa [aleyhisselâm], kadının isteyeceği şeyde onu hakem bırakmıştı. O da,"},{"k":"p","t":"‘Benim istediğim bana gençliğimi geri vermen ve seninle beraber cennete girmemdir’  demiştir.”"},{"k":"p","t":"Mevlana Gavs-ı Nizam hazretleri [kuddise sırruhu] şöyle buyurmuştur:"},{"k":"q","t":"“Dinimiz İslâm, güzel ahlâk sahibi olmak için gerekli olan her hususu emir ve tavsiye etmiş, kötü ve çirkin olan her hareketi de haram ya da mekruh olarak bize bildirmiştir. Her mümin başkalarına zarar verecek işlerden, haksızlıktan sakınmak zorundadır. Verdiği sözleri tutmalı, ahdini yerine getirmelidir. Bütün işlerinde dürüst olmalı, her daim doğru söylemelidir. Adalet üzere davranmalı, insaf sahibi olmalı, doğruluktan ayrılmamalıdır. Asla yalan söylememeli, iyi geçimli olmalı, gösterişten sakınmalıdır. Her işinde iyi niyet taşımalı, içini ve dışını temiz tutmalıdır.”"},{"k":"p","t":"Harun b. Rübab anlatıyor: “Abdullah b. Ömer’in (radıyallahu anh) vefat anı yaklaşmıştı. Şöyle vasiyet etti:"},{"k":"q","t":"“Kureyş’ten bir adam benim kızımı istemişti. Ben de ona söz verir gibi olmuştum. Vallahi! Bende münafıklığın üç alametinden biri bulunduğu halde Allah’ın huzuruna varmak istemem. Sizi şahit tutuyorum! Kızımı ona verdim.”"},{"k":"p","t":"Bir gün Abdulkadir Geylani'ye [kudduse sirruhu]; \"Bu işe başladığınızda, bu yola adım attığınızda, temeli ne üzerine attınız? Hangi ameli esas aldınız da böyle yüksek dereceye ulaştınız?\" diye sordular. Buyurdu ki:"},{"k":"q","t":"\"Temeli sıdk ve doğruluk üzerine attım. Asla yalan söylemedim. Yalanı kağıda bile yazmadım ve hiç yalan düşünmedim. İçim ile dışımı bir yaptım. Bunun için işlerim hep rast gitti. Çocuk iken maksadım, niyetim, ilim öğrenmek, onunla amel etmek, öğrendiklerime göre yaşamaktı. Küçüklüğümde Arefe günü çift sürmek için tarlaya gittim bir öküzün kuyruğundan tutunup, arkasından gidiyordum. Hayvan dile geldi ve dönüp bana; \"Sen bunun için yaratılmadın ve bununla emrolunmadın.\" dedi. Korktum, geri döndüm. Evimizin damına çıktım. Gözüme, hacılar gözüktü. Arafat'ta vakfeye durmuşlardı. Anneme gidip; \"Beni Allah’u Teala’nın yolunda bulundur. İzin ver, Bağdat'a gidip ilim öğreneyim. Salih zatları ve evliyayı bulup ziyaret edeyim.\" dedim. Annem sebebini sordu, gördüklerimi anlattım. Ağladı, kalkıp babamdan miras kalan seksen altının yarısını kardeşime ayırdı. Kalanını bana verip, altınları elbisemin koltuğunun altına dikti."},{"k":"p","t":"Gitmeme izin verip, her ne olursa olsun doğruluk üzere olmamı söyleyip, benden söz aldı. \"Haydi Allah selamet versin oğlum. Allah’u Teala için ayrıldım. Artık kıyamete kadar bir daha yüzünü göremem.\" dedi. Küçük bir kafile ile Bağdat'a gitmek üzere yola çıktım."},{"k":"p","t":"Hemedan'ı geçince, altmış atlı eşkıya çıka geldi. Kafilemizi bastılar. Kervanı soydular. İçlerinden biri benim yanıma geldi. \"Ey derviş! Senin de bir şeyin var mı?\" diye sordu. \"Kırk altınım var.\" dedim. \"Nerededir?\" dedi. \"Koltuğumun altında dikili.\" dedim. Alay ediyorum zannetti. Beni bırakıp gitti. Bir başkası geldi, o da sordu. Fakat o da bırakıp gitti. İkisi birden reislerine gidip, bu durumu söylediler."},{"k":"p","t":"Reisleri beni çağırttı. Bir yerde, kafileden aldıkları malları taksim ediyorlardı. Yanına gittim. \"Altının var mı?\" dedi. \"Kırk altınım var.\" dedim. Elbisemin koltuk altını sökmelerini söyledi. Söküp, altınları çıkardılar. \"Neden bunu söyledin?\" dediler. \"Annem, ne olursa olsun yalan söylemememi tembih etti. Doğruluktan ayrılmayacağıma söz verdim. Verdiğim sözde durmam lazım.\" dedim."},{"k":"p","t":"Eşkıya reisi, ağlamaya başladı ve; \"Bu kadar senedir ben, beni yaratıp, yetiştiren Rabbime verdiğim sözü bozuyorum.\" dedi. Bu pişmanlığından sonra tövbe edip, haydutluğu bıraktığını söyledi. Yanındakiler de, \"İnsanları soymakta, yol kesmede sen bizim reisimiz idin, şimdi tövbe etmekte de reisimiz ol\" dediler. Sonra, hepsi tövbe ettiler."},{"k":"p","t":"Kafileden aldıkları malları sahiplerine geri verdiler. İlk defa benim vesilemle tövbe edenler, bu altmış kişidir.\""},{"k":"p","t":"Rabbimiz'e karşı vefadan sonra en ulvi ve en gerekli vefa, alemlerin sultanı Habib-i Kibriya [sallallahu aleyhi vesellem]'e olan vefadır. Cenab-ı Mevla'dan ümmetinin selameti için feryad eden O'dur. Allah'ın kulları ateşe düşmesinler diye binbir zorlukla dolu bir hayata razı olan O'dur. İnsanların hidayetine vesile olmak için gösterdiği çabadan dolayı Rabbül Alemin tarafından “neredeyse kendini parçalayacaksın” diye uyarılan O'dur. O'na vefa, Sünnet-i Seniyye'sine sıkıca sarılmaktır."},{"k":"p","t":"Fahr-i Alem [sallallahu aleyhi vesellem]'e bu bağlılık ve vefa ümmeti içinde öyle derecelere ulaşmıştır ki, mübarek saç ve sakallarından, ayak izinin bulunduğu taşlara kadar her emaneti baş tacı edilmiştir. Tebliğ ettiği dinimizle birlikte, hırkasından asasına, kılıcından mühr-ü şerifine varıncaya dek günümüze kadar gelen bütün emanetlere ecdadımızın göstermiş olduğu itina, hürmet ve vefakarlığın eşsiz örneği olmuştur."},{"k":"p","t":"Her mümin, din büyüklerine karşı da vefasını göstermelidir. Rabbimiz'in emir ve yasaklarını, güzel ahlakı, ilmi, bizlere kadar ulaştıran İslam büyüklerimiz, rabbani alimlerimizdir. Cemiyetler onların irşad ve talimleriyle istikamet bulur ve manevi alemlerini tezyin ederek, ahirete hazırlanırlar."},{"k":"h","t":"Gavs-ı Cihan [kudduse sirruhu] Anmak"},{"k":"p","t":"Gavs-ı Cihan [kudduse sirruhu] hazretleri insanlık için rahmet olan, peygamber varisi, Rabbani bir alimdi. İlme ve alime büyük önem verirdi. Sevenlerini sağlam niyete, ilim öğrenmeye, zikir ehli olmaya, güzel ahlaka ve Peygamber Efendimiz [sallallahu aleyhi vesellem] ümmetine hizmet etmeye teşvik ederdi. Yakınlarını, talebelerini, ziyaretçilerini tebbessümden, duadan mahrum etmezdi. Gerektiğinde nasihat edip yol gösterirdi. Hayatı boyunca nasihat, dua ve bereketiyle kaç çaresize çare oldu. Dünya meşgalesinde mağlup olmuş, hayata küsmüş, yolları tıkanmış kaç kişi yeniden onunla derman buldu."},{"k":"p","t":"Gavs hazretlerinin köyüne gidenler onu vakit namazlarında görürlerdi. Çünkü her vakit için mescide, cemaatle namaza gelirdi. Namazları huşu ile uzun uzun kıldırırdı. Namazdan sonra tesbihata ve salavatlara büyük önem verirdi. Onun yanına varanlar imandan sonra en büyük meselenin namaz olduğunu hal dilinden anlardı. Geçmişteki büyük sufilerdeki tavır onda da vardı. İrşadı söz ile değil öz ileydi yani meşhur ifade ile kal ile değil hal ileydi."},{"k":"p","t":"Gavs-ı Sani hazretlerinin bütün ömrü ilim, ibadet, zikir, murakabe ve hizmetle geçti. Küfür, isyan ve ataletin hakim olduğu modern hayatta böylesi bir zatın kıymetinin hakkıyla bilinmesini beklemek gerçekçi değil. Ama Yunus Emre kuddise sirruhu hazretlerinin dediği gibi “Er yarın Hakk’ın divanında belli olur.”"},{"k":"p","t":"Allah [celle celaluhu], Rabbimize karşı verdiğimiz sözde ahde vefalı olmayı ve ihlas ile amel eden kullarından eylesin. Amin"}],"cat":"Ahlak"},{"id":"teheccud-fazileti","title":"Teheccüd Ehlinin Sıfatları ve Faziletleri","sub":"Sohbet notu","desc":"Gece ibadetinin fazileti ve teheccüd ehlinin sıfatları","color":"#3C3C6E","mins":8,"paras":[{"k":"p","t":"Yüce Allah, gece ibadet edenleri Resûlü Mustafa [sallallahu aleyhi vesellem] ile birlikte zikretmiştir. Bu güzel işe karşılık olarak vereceği mükâfatta onları peygamberinden ayırmayarak hepsini şöyle övmüştür:"},{"k":"q","t":"“Resûlüm, senin, gecenin üçte ikisinden daha azında, yarısında ve üçte birinde kalkıp ibadetle geçirdiğini ve senin yanında bulunan bir topluluğun da böyle yaptığını Rabb’in elbette biliyor” (Müzzemmil 73/20)."},{"k":"p","t":"Yüce Allah, bu sûrede gece Kur’an okumanın kalp için daha uyumlu ve bu okuyuşun ezberleme ve zikretme için daha elverişli olduğunu bildirmektedir. Yani, anlama ve hıfzetmede kalp dile uyar."},{"k":"p","t":"Yüce Allah, gece ibadet edenleri “âlim” ismini vermiş ve onları havf ve recâ/korku ve ümitle ibadet edenlerden yapmıştır. Ayrıca onlar için göz aydınlığı ve mutluluk vesilesi olacak mükâfatı katında gizlemiştir. Gece ibadet edenler âyette şöyle anlatılmıştır:"},{"k":"q","t":"“Yoksa inkârcı kimse, o geceleyin secde ederek ve kıyamda bulanarak ibadet eden, ahiretten çekinen ve Rabb’inin rahmetini dileyen kimse gibi midir?” (Zümer 39/9)."},{"k":"p","t":"Yüce Allah, diğer âyetinde şöyle buyurmuştur:"},{"k":"q","t":"“Ey resûlüm de ki: Hiç bilenlerle bilmeyenler bir olur mu? Doğrusu ancak, akıl sahipleri bunları hakkıyla düşünüp anlar” (Zümer 39/9)."},{"k":"p","t":"Bu âyetten anlaşılacak olan mana şudur:"},{"k":"p","t":"İşte bu şekilde gecelerini ibadetle geçirenlerle; mağrur, gafil, uykucu ve geceyi eğlence ile geçiren kimse bir olmaz. Çünkü şu gafil kimse, neden sakınacağını ve Rabb’inden neyi isteyeceğini bilmemektedir."},{"k":"p","t":"Yüce Allah, gece ibadet edenlerin dünyadaki vasıflarını ve ahirette onlar için hazırlanan nimetlerin özelliklerini şöyle anlatır:"},{"k":"q","t":"“Onlar geceleri Rab’lerine secde ederek ve kıyamda ibadet yaparak geçirirler” (Furkân 25/64)."},{"k":"q","t":"“Korkuyla ve umutla Rab’lerine yalvarmak üzere ibadet ettikleri için onların vücutları yataklarından uzak kalır” (Secde 32/16). Yani yataklarından kalkarlar. Azap korkusundan veya kendilerine vaat edilen mükâfatları elde etme arzusundan dolayı artık yatmakla huzur bulamazlar."},{"k":"q","t":"“Yaptıklarına karşılık olarak onlar için nice sevindirici ve göz aydınlatıcı nimetler saklandığını hiç kimse bilemez” (Secde 32/17)."},{"k":"p","t":"Denildi ki onların yaptığı geceyi ibadetle geçirmeleridir."},{"k":"p","t":"Yine şöyle denilmiştir: Onlar havf ve recâ/korku ve ümit ehlidirler. Havf ve recâ gaybın müşahedesiyle meydana gelen kalbî amellerdendir. Bu kimseler gizli olan amellerinde ihlâslı olduklarından dolayı Cenâb-ı Hak, kendilerine vereceği güzel karşılığı onlar için gizli tutmuştur."},{"k":"p","t":"Muhabbet ehli için, yüce Allah’ın cemalinden ve rızasından başka mutluluk vesilesi yoktur. Bunun için onlar, sadece Allah rızası için amel yaparlar. Âlimlerden biri,"},{"k":"q","t":"“Sabrederek ve namaz kılarak Allah’tan yardım isteyiniz” (Bakara 2/45) âyeti hakkında, “Buradaki namazdan maksat gece namazıdır” demiştir. Buna göre mana; nefsinizle olan mücâhedede gece namazı kılarak Allah’tan yardım isteyiniz. Yine bu namazla düşmanlarınıza karşı sabır ve sebat göstermede de yardım isteyiniz, demektir. Yüce Allah bir âyetinde şöyle buyurur:"},{"k":"q","t":"“O namaz, huşû sahibi olanların dışındaki kimselere ağır gelen bir ibadettir” (Bakara 2/45). Yani havf ve tevazu ehli için, bu ibadet, ağır ve cefa verici değil, aksine hafif, tatlı ve mutluluk verici bir ibadettir."},{"k":"p","t":"Resûlullah’a, “Falan kimse gece namazı kılıyor, fakat sabah olunca hırsızlık yapıyor!” denildi. Bunun üzerine Resûl-i Ekrem [sallallahu aleyhi vesellem;"},{"k":"q","t":"“Söylediğiniz o ibadet, yakında onu, yaptığı kötü işten alıkoyacaktır”buyurdu."},{"k":"p","t":"Hz. Peygamber [sallallahu aleyhi vesellem] şöyle buyurdu: “Abdullah b. Ömer, ne güzel bir insandır. Keşke gece namazı da kılsaydı.” Bundan sonra İbn Ömer’in gece namazını kaçırdığı hiç görülmemiştir."},{"k":"p","t":"Gece namazı hadislerde şöyle övülmüştür;"},{"k":"q","t":"“Gece namazına devam ediniz, çünkü o, Rabb’inizin rızasına ulaştıran ve günahlarınızı temizleyen bir ibadettir.”"},{"k":"q","t":"“Gece namaz kılmak sizden önceki salihlerin âdetidir. Bu namaz, sahibini kötülüklerden uzaklaştırır, günahları temizler, şeytanın hilelerini def eder, vücuttan hastalıkları uzaklaştırır."},{"k":"p","t":"Yüce Allah, gece namaz kılmayı salihlerin vasfı yaparak şöyle buyurmuştur:"},{"k":"q","t":"“Onların hepsi bir değildir, Ehl-i kitap içinde istikamet sahibi bir topluluk vardır ki gece saatlerinde secde ederek, namaz kılarak Allah’ın âyetlerini okurlar. Onlar, Allah’a ve ahiret gününe inanırlar. İyiliği emrederler, kötülükten nehyederler. Hayırlı işlere koştururlar. İşte bunlar, salih insanlardandır” (Âl-i İmrân 3/113, 114)."},{"k":"p","t":"Gece ibadetini, gecenin son üçte ikisinde yapmak müstehaptır. Bunun müstehap olan en az miktarı gecenin en son altıda biridir. Rivayet edildiğine göre Hz. Peygamber [sallallahu aleyhi vesellem], hiç ara vermeden gece sabaha kadar ibadet etmezdi. Gecenin bir kısmında uyurdu. Gece ibadeti yapmadan sabaha kadar uyuduğu da vâki değildir."},{"k":"p","t":"Şöyle denilmiştir: Gecenin ilk kısmında namaz kılmak teheccüd ehlinin yaptığı bir iştir. Ortasında namaz kılmak “kânitîn” diye tarif edilen salihler içindir. Gecenin sonunda namaz kılmak normal namaz ehlinin işidir. Fecirden sonra kalkıp namaz kılmak ise gafillere mahsus bir haldir."},{"k":"p","t":"Yusuf b. Mihrân yoluyla Abdullah b. Ömer’in şöyle dediği nakledilmiştir: “Arşın altında horoz şeklinde bir melek bulunur. Bu meleğin gagası ve ayakları yeşil inci ve zeberceddendir. Gecenin ilk üçte biri geçtiğin de kanat vurur, öter ve şöyle der: ‘Gece ibadetine kalkacaklar kalksınlar.’ Gecenin yarısı geçtiğinde yine kanat vurur, öter ve, ‘Teheccüd ehli kalksın’ der. Gecenin üçte ikisi geçtiğinde yine kanat vurur, öter ve, ‘Namaz ehli olanlar kalksınlar’ der. Sabah namazı olduğunda ise yine kanat vurur, öter ve, ‘Geceyi gafletle geçirenler üzerlerinde günahlarıyla birlikte kalksınlar’ diye seslenir.”"},{"k":"p","t":"Müridlerden biri üstadına, uzun süre uykusuz kaldığından şikâyet etti ve bunun kendisine zarar verdiğini dile getirdi. Sonra dedi ki: “Bana bir şey söyle ki onunla uyuyabileyim.” Üstadı onu şu karşılığı verdi: “Yavrum! Allah Teâlâ’nın gece ve gündüz gelen birtakım ilâhî tecellileri vardır. Uyanık kalpler onlardan nasibini alır. Gafil kalpler onlardan bir nasip elde edemez. O halde kendini bu ilâhî tecellilere hazırla, hayır bundadır.” Bunun üzerine talebe, “Üstadım, bu sözünüzle beni gece ve gündüz uyumamaya mahkûm ettiniz” dedi."},{"k":"p","t":"Hasan-ı Basrî şöyle diyordu: “Kul, işlediği günah sebebiyle geceleri namaz kılmaktan, gündüzleri de oruç tutmaktan mahrum kalır.”"},{"k":"p","t":"Âlimlerden biri şöyle demiştir: “Ey insan, oruç tuttuğunda kimin yanında ve ne ile iftar ettiğine dikkat et. Çünkü yediği şeye göre, kulun kalbi ve düşüncesi değişir, önceki güzel haline bir daha dönemez.”"},{"k":"p","t":"Bir diğeri şöyle demiştir: “Nice yiyecekler vardır ki sahibini gece ibadetinden engeller. Nice bakışlar vardır ki Kur’an okumaktan alıkoyar. Kul bir şey yer veya bir iş yapar da bunlardan dolayı bir sene boyunca gece ibadeti yapmaktan mahrum bırakılır. Güzel bir inceleme ve araştırma ile neyin güzel halleri artırıcı ve neyin de noksanlaştırıcı olduğunu bilebilirsin. Sen ancak işlediğin günahları azaltarak kayıplarını görebilir, onların ne olduğunu anlayabilirsin.”"},{"k":"p","t":"Şöyle denilir: “Gece namazının uzun olması, kıyamette rahatlık sebebidir ve bu namaz, kulun işlediği günahları temizler.”"},{"k":"p","t":"Âlimler, gündüz namazlarında, rükû ve secdenin fazla olmasını yani, fazla rekât kılmayı, gece namazlarında ise kıyamın uzatılmasını müstehap görüyorlardı. Bilinmelidir ki gece namazı bir bakıma Resûlullah [sallallahu aleyhi vesellem] için nâfile idi. Çünkü onun, farz namazlarda bir eksikliği yoktu. Bizler için ise farzlarımızı tamamlayıcı olduğundan daha gereklidir. Hz. Peygamber [sallallahu aleyhi vesellem] bir hadislerinde şöyle buyurmuştur:"},{"k":"q","t":"“Kişi akşam yattığında şeytan, başının üzerinde üç düğüm düğümler. O uykusundan uyanıp kalktığında, oturur ve Allah’ı zikrederse birinci düğüm çözülür. Abdest aldığında, ikinci düğüm çözülür. İki rekât namaz kıldığında ise düğümlerin hepsi çözülür. Böylece sabaha hoş bir halde huzur ve neşe içinde çıkar. Aksi halde tembel ve perişan bir vaziyette sabahlar.”"},{"k":"p","t":"Yine bir hadiste şöyle buyrulmuştur:"},{"k":"p","t":"Kişi, ibadetlerini yapmadan yatıp uyursa şeytan onun kulağına bevleder.”"},{"k":"p","t":"Diğer bir hadiste ise şöyle denmektedir:"},{"k":"q","t":"“Şeytan kişinin burnuna girer, onu yalar ve gözüne sürme çeker. Şöyle ki, burnuna girdiğinde ahlâkı kötüleşir. Onu yaladığında, kötü konuşmada aşırı gider. Gözünü sürmelediğinde ise artık sabaha kadar uyanamaz."},{"k":"p","t":"Gece ibadetine kalkmak için, şu üç şeye dikkat ederek kalbi kuvvetlendirmek gerekir: Helâl yemek, tövbede istikameti korumak, Allah’ın azabının korkusu ile hüzünlenmek yahut ilâhî müjdelerin şevki ile ümit içinde olmak."},{"k":"p","t":"Kulu, gece ibadetlerinden mahrum bırakan veya onu uzun süre gaflet içinde kalmaya mahkûm eden üç sebep vardır. Bunlar şüpheli yiyecekler yemek, devamlı günah işlemek ve dünya endişesinin kalbi iyice kaplamasıdır."}],"cat":"İbadet"},{"id":"ilim-ve-amel","title":"İlim ve Amel","sub":"Sohbet notu","desc":"İlim, amel ve ihlasın önemi; zikrin ve kitap sevgisinin faziletleri","color":"#5C4A78","paras":[{"k":"ar","t":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم"},{"k":"ar","t":"اَلْحَمْدُ لِلَّه رَبِّ الْعَالَمِينَ وَالصَّلاَةُ وَالسَّلاَمُ عَلَى رَسُولِنَا مُحَمَّدٍ وَعَلَى اٰلِهِ وَاَصْحَابِهِ اَجْمَعِينَ"},{"k":"ar","t":"قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَۜ اِنَّمَا يَتَذَكَّرُ اُو۬لُوا الْاَلْبَابِ"},{"k":"q","t":"“Ey resûlüm! De ki: “Hiç bilenlerle bilmeyenler bir olur mu?” Bunlar bir olmadığı gibi, itaat edenlerle etmeyenler de bir olmaz. Bu misallerden yalnızca temiz akıl sahipleri ibret ve öğüt alır.” (Zümer 39/9)"},{"k":"p","t":"Kişinin insan-ı kâmil derecesine yükselebilmesi için dört fazileti elde etmesi gerekir. Bunların başında ilim gelir. İlimsiz yol olmaz. Müminin, sûfînin biricik süsü ilimdir."},{"k":"p","t":"Şeyh Abdülhalik-ı Gucdüvânî hazretleri [kuddise sırruhû] buyuruyor:"},{"k":"q","t":"“İlmi olmayan sûfî şeytana maskara olur. İlmi olmayan vesvese ve nefsanî hilelerden kurtulamaz. Az bir ibadetle mağrur olur veya ibadetin şeklini değiştirerek dalâletten bir çukura düşer.”"},{"k":"p","t":"İlim, bir insanın dünya ve ahiretini mâmur edecek sebeplerin ilkidir. İlim, çocuğun dünyaya gelmesiyle, sağ kulağına ezan, sol kulağına kamet okunarak başlar ve ölünceye kadar devam eder. Ezanın muhtevasında bütün ilimler vardır. Ezan ve kamet okumanın ikinci hakikati, senin ömrün bir ezanla bir kamet arası kadar demektir, nasıl müezzin ezanın hemen ardından kamet getirir, bunun gibi dünya hayatının kısalığına işaret eder. İlim çocuğa telkinle başlayıp mezara kadar devam ettiği gibi, ilmin kazanılmasıyla da iman başlar."},{"k":"p","t":"Abdurrahman-ı Tâhî hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Kurtuluş şunlardadır:"},{"k":"li","m":"1.","t":"İlim: Ehl-i sünnet ve’l-cemâat inancı,"},{"k":"li","m":"2.","t":"Amel: Şeriatı yaşamak,"},{"k":"li","m":"3.","t":"İhlâs: Hâlisiyet ve sohbettir.”"},{"k":"p","t":"Şeyh Fethullah Verkanisî hazretleri [kuddise sırruhû] buyurmuştur ki:"},{"k":"q","t":"“Tarikat ve tasavvuf ihlâsı ele geçirebilmek için muhabbet-i ilâhiyye tahsilidir.”"},{"k":"p","t":"Tasavvuf ne yapar? Muhabbet kazandırır. Muhabbet de ilme, ihlâsa, amele, rızaya götürür. Muhabbet-i ilâhiyye tahsili şeriatın lezzetini ve ihlâsı kazanmak içindir. Yani tasavvuf, ibadet ve taatte ihlâsı kazanmak için muhabbet ve lezzet tahsilidir, lezzet okuludur. Kalbin, ruhun aşıdır. İman, kalbin, ruhun, dimağın lezzeti olup bu bir sanattır. Tasavvuf bu sanatı inkişaf ettirir. Allah Teâlâ [celle celâluhû] ibadetin çeşidine, çokluğuna değil hâlis oluşuna, lezzetine bakar."},{"k":"p","t":"İslâm dini insanın bâtınî ve zâhirî refaha ulaşması için kurallar getirmiştir. Bu kuralları kavramanın yolu okumaktır, öğrenmektir."},{"k":"p","t":"İnsanın neyin doğru neyin yanlış olduğunu bilmesi ilimden geçer. İlim insanı olgunlaştırır, kişiye bilmediği kapıları aralar ve feraset kazandırır."},{"k":"p","t":"Şeyh Fethullah Verkanisi [kuddise sırruhû] tarikata girişini şöyle anlatmaktadır:"},{"k":"q","t":"“İlim tahsilimi bitirdikten sonra şunu anladım ki zâhirî ilimlerle hakikate varmak mümkün değil. Aksine, tasavvuf köprüsünden geçmek ve kemal ehlinden bir kâmilin peşinden gitmek gerek.”"},{"k":"p","t":"Mehmed Molla Murad hazretleri [kuddise sırruhû] Mâ-hazar adlı eserinde bu hususta şöyle der:"},{"k":"q","t":"“İlim irfan sahibi olanlar şöyle tenbih etmişlerdir; Arkadaşlık edeceksen, üç kimse ile arkadaş ol."},{"k":"p","t":"Birincisi, ilim ve sanat ehli ile, onlarla yapılan arkadaşlık dünya ve ahiret saadetini kazandırır."},{"k":"p","t":"İkincisi, yüce ahlâklı kimseler, bunlar dostlarının hatasını örtüp nasihat konu sunda çaba sarfederler."},{"k":"p","t":"Üçüncüsü ise kinsiz, tamahsız, muhabbetleri doğruluk ve ihlâs üzere olanlardır."},{"k":"p","t":"Şu üç kişiden de çekinmek lazımdır;"},{"k":"p","t":"Birincisi, fısku fücûr erbâbıdır. Onların işi gücü şehvetlerinin peşinden koşmaktır. Onlara muhabbet beslemek ne dünya rahatına sebep olur, ne de âhiret rahmetine."},{"k":"p","t":"İkincisi yalancı ve hain olanlardır. Onlarla arkadaşlık elemli bir azap, büyük bir belâdır. Onlar senin söylediğin fitne içeren kelimeleri başkasına nakledip anlatırlar, başkalarından da sana korku ve ürküntü verecek sözleri aktarırlar. Yalanı doğru gibi gösterir, doğruyu da saçma sapan bir söz gibi aktarır."},{"k":"p","t":"Üçüncüsü, ahmak ve aptal olanlardır. Bunların sözlerine menfaat temininde güvenilmez, zararı uzaklaştırmak için de yaptıklarına inanılmaz. Zira genellikle onların iyi olduğunu düşündüklerinde şer vardır, faydalı olduğuna inandıkları görüşleri zararlıdır, zararlı olduğuna inandıkları şeylerde de fayda vardır. Öyleyse bu üç grup kimseyle yakınlık kurmaktan çekinmek gerekir.”"},{"k":"p","t":"Güzel ahlâk; ilim ve edep öğrenmekle, iyi insanlarla arkadaşlık etmekle elde edilir. Kötü ahlâk da bunun tersidir. Yani cahil kalmak, gaflete düşmek, edebi terketmek ve kötü insanlarla arkadaşlık etmekten hâsıl olur."},{"k":"p","t":"Kalp, kötü kimselerin yanında gaflete dalınca, şeytan da vesvese verir. Aydınlıkla karanlığın çarpışması gibi Allah Teâlâ’yı [celle celâluhû] anınca şeytan kaçar, unutunca da gelir. Vesvesenin en güzel ilacı ilim, zikir ve Allah Teâlâ’ya [celle celâluhû] sığınmaktır. Rabbü’l-âlemin [celle celâluhû], kalplerin cilasının takva, gıdasının zikir olduğunu bildirmiştir. Kalp, zikrin nuru ile hayrı ve şerri birbirinden ayırt edebilir. Allah [celle celâluhû] korkusu ile elde edilen edep ve güzel ahlâk, insana iman selâmetini ve ahiret saadetini temin eder."},{"k":"p","t":"Şeyh Fethullah Verkanisi kuddise sırruhû] şöyle buyurmaktadır:"},{"k":"q","t":"“Nakşibendî tarikatının ortaya çıkış gayesi amelde ihlâsı gerçekleştirebilmek için Allah’ın [celle celâluhû] zatına dönük muhabbetin meydana gelmesidir. Böylece insanın her türlü davranış, tutum ve sözlerini içeren tüm amelleri, hatta şakaları, hiçbir dünyevî veya uhrevî menfaat gütmeksizin, hatta herhangi terakki ve vuslat bile beklemeksizin sırf Allah [celle celâluhû] için yapmasıdır. Bu yüce hedefe varabilmek için şu şartlar gereklidir: Her şeyden önce Peygamber Efendimiz’in [sallallahu aleyhi vesellem] tebliğ ettiği şeriata, onu bid‘atler ve ruhsatlarla gölgelemeksizin uymak gerekir.”"},{"k":"p","t":"Şeyh Abdurrahman-ı Tâhî [kuddise sırruhû] diyor ki:"},{"k":"q","t":"“Bu tarikatın temeli şeriattır. Şeriata ters düşenin, güneşi ve ayı yere indirse bile tarikatla ilgisi yoktur. Kurtuluş ve tarikat, hiç bir hal ve makama sahip olmasa bile şeriat yolundan ayrılmayanlar içindir."},{"k":"p","t":"Tarikat, şeriatı takva üzere yaşamak içindir. Şeriatsız tarikat olmaz. Bir evin temelinde kullanılan demir, beton eksik olunca dışı ne kadar güzel olursa olsun o bina çöker. Tarikat da öyledir. Tarikatın temeli de şeriattır, ilimdir. Temeli sağlam olmayan tasavvuf ehli çabuk yoldan çıkar. Ama bina çok güzel olmasa bile temeli sağlam olursa bina yıkılmaz. Siz hiç buzun üzerine inşa edilen bir bina gördünüz mü? İnşa edilse de yıkılır. İlim de İslâm'ın temelidir.”"},{"k":"p","t":"Her insan ilmi öğrenmeli, amele sarılmalıdır. İlim ve amel olmadan bir yere varılamayacağı aşikâr! Daha da mühim olan ise imandır. İman esaslarını kalbe yerleştirmeden, itikadını düzeltmeden yapılan ameller, hiç kimseyi kurtaramayacaktır. Gelin hep birlikte iman nasıl olmalı, gözden geçirelim."},{"k":"p","t":"Gavs-ı Kasrevi Şeyh Seyyid Abdulhakim el-Hüseyni [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Sofi dininin ayakta kalmasını istiyorsa Akaid ve fıkıh kitaplarını elinden düşürmesin. Akaid ve fıkhı zayıf olan sofinin tasavvufi yaşantısı boşa gider.”"},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdulbaki el-Hüseyni [kuddise sırruhû] şöyle buyuruyor:"},{"k":"q","t":"“İlimsiz amel buz üzerine yapılan bina gibidir. Şeriat olmadan tarikat olmaz. Namaz olmazsa yaptığınız hatme, rabıta ve virdler de olmaz. Buraya gelip tövbe eden insanların bazıları belki de hayatlarında ilk kez camiye girip namaz kılıyor. Böyle insanlarla ilgilenmek, abdesti, guslü, namazı öğretmek gerekir. Dikkat edin, dergâhlarda fıkıh konuları üzerinde çok durun. Onlara öğretin. Fıkıh bilinmeden ibadet olmaz. İslâm'ın şartını, abdesti, namazı, Fâtiha'yı ve sûreleri bilmeden sûfîlik de yapsa faydasını göremez. Siz Allah"},{"k":"p","t":"İlim ve imandan sonra amel gelir. Mükellef olan her kişinin, dinî konularda neleri yapıp neleri yapmayacağı fıkıh kitaplarında açıklanmış olup, bu bilgileri yapacağı işlere, doğru olarak uygulaması ameldir. Amelsiz ilim, meyvesiz ağaca benzetilmiş olup, faydasız bir yük olur. Namazı öğrenmek ilim, namaz kılmanın farz olduğuna inanmak iman, namaz kılmak amel olur."},{"k":"p","t":"Bütün dinî emirleri bilmek, onlara inanmak amel safhasına geçmedikçe şahıs için bir kıymet taşımaz. Şu halde ilmin, imanın meyvesi de amel olur. Cenâb-ı Allah [celle celâluhû] amelin salihini ister. Şehvetin iffete, gazabın şecaate, ilmin hikmete, aklın akl-ı selime dönmesiyle adalet tecelli eder ve amel-i salih ortaya çıkar."},{"k":"h","t":"Menkıbe"},{"k":"p","t":"Abdurrahman Tâhî hazretleri [kuddise sırruhû] bulundukları yere yakın bir akarsuyun üzerine köprü yaptırmıştı. Köprünün açılışı için de o vilayetin yöneticisi davet edilmişti. Köprünün açılmasından hemen sonra öğle ezanı okununca Abdurrahman Tâhî hazretleri [kuddise sırruhû] ona,"},{"k":"p","t":"- Namaz vakti girdi. Haydi buyurun! Namaza kalkalım. Abdesti olmayanlar da alsınlar bize yetişsinler, dedi. Beldenin yöneticisi o söze binaen, \"Tamam\" deyip abdest için kalktığında halifesi Şeyh Fethullah Verkanisi [kuddise sırruhû]:"},{"k":"p","t":"- Efendim! Ben biliyorum ki bu kişi ömründe hiç namaz kılmamış, sizden utandığı için abdeste kalktı, deyince Şeyh Abdurrahman Tâhî hazretleri [kuddise sırruhû]:"},{"k":"p","t":"- İnşallah bu sebeple namaza başlar da bundan sonra belki hiç bırakmaz, dedi. Gerçekten de kılınan o namazdan sonra onun namazlarını hiç terketmediği görüldü."},{"k":"p","t":"Sizler de etrafınızdakilere bir vakit bile olsa namaza davet edin. Belki de o vesileyle namaza başlarlar ve bir daha hiç bırakmazlar.”"},{"k":"p","t":"İlim, amel etmek niyetiyle öğrenilir. Amel edilmeyecek ilim insana vebaldir. Yani kişi hem ilme talip olmalı hem de amele."},{"k":"p","t":"Şeyh Abdurrahman-ı Tâhî hazretleri [kuddise sırruhû] güzel amelleri teşvik etmek için bir sohbetinde şöyle buyurdu:"},{"k":"q","t":"“Farz namazlarınızı vaktinde ve cemaatle kılınız. Sünnetleri terketmeyiniz. Akşam namazından sonra kalbinizi mürşidinize bağlayınız. Bu esnada gaflette olursanız, bağı kuramazsınız. Bilhassa sabah namazlarından sonraki güzel amellerinizi terketmeyin. İki mağrib (güneş batışı) vakti arasında amel etmek, Nakşibendiler’in önemli bir özelliğidir. Nitekim Gavsü’l-Âzam hazretleri [kuddise sırruhû] hastalığında bile bunu terketmiş değildir. Bundan sonra iki tulu (güneşin doğuşu) vakti arasında ibadet etmek gelir. Hatta bu daha da önemlidir. Namazların arkasından söylenen tesbihler gereklidirler ve emir gereği oldukları için terkedilemezler. Tesbihlerden önce rabıta kurulurken gözler kapanmaz. Tesbihler de bu yüce tarikatın temel esaslarındandır.”"},{"k":"p","t":"İlimden gaye amel olduğu gibi, amelden sonra da ihlâs gelir. İhlâs, bir işi hiçbir şey düşünmeden yalnız Allah için yapmaktır. Bu olmazsa amel kabul olunmaz."},{"k":"p","t":"Ruhu’l-Beyan Tefsiri’nde İsmail Hakkı Bursevî hazretleri [kuddise sırruhû] şöyle buyuruyor:"},{"k":"q","t":"“Allah Teâlâ [celle celâluhû] bir kulun helakını isterse onu üç şeyle cezalandırır:"},{"k":"p","t":"Birincisi: ilim verir; ancak âlimlerin amellerinden mahrum eder."},{"k":"p","t":"İkincisi: sâlihlerin sohbetiyle rızıklandırır; ama o kişi, sâlihlerin hakkını bilemez. Sâlihlerin içinde, derviş oldum diye kendine paha biçmeye kalkar."},{"k":"p","t":"Üçüncüsü: kişi ibadet ehli olur; ancak ihlâs ve niyeti sahih olmaz.”"},{"k":"p","t":"Bir amelin fayda vermesi için iki temel unsur vardır:"},{"k":"li","m":"1.","t":"Yapılan iş, Allah Teâlâ’nın [celle celâluhû] emrine uygun olmalıdır."},{"k":"li","m":"2.","t":"Şirk ve riyâdan uzak tutulmalıdır."},{"k":"p","t":"Çünkü hedef bir işin Allah [celle celâluhû] rızası için yapılmasıdır."},{"k":"p","t":"Tasavvufun hedefi ise, insanı ihlâsa ve ihsan mertebesinde bu seviyeye yani kulluğa eriştirmektir."},{"k":"p","t":"İhsan mertebesi, Allah Teâlâ’ya [celle celâluhû] yakinen inanma ve O’nu görüyormuş gibi edeple kulluk yapma makamıdır. Bu mertebe dünyevî gayelerden temiz bir kalp ve sâfi bir sevgi ister. Bütün derdi dünya menfaatı olan bir kimse, zahiren kâmil mürşidin halkasından ve hatta hizmetinden hiç ayrılmasa bile, niyetini Allah [celle celâluhû] rızası yapana değin bir fayda göremez."},{"k":"p","t":"Büyük veli Şihâbüddin Sühreverdî [kuddise sırruhû] bu önemli konuya şu sözleriyle dikkat çeker:"},{"k":"q","t":"“Niyet, amelin başıdır. Amel niyete göre değer kazanır. Allah [celle celâluhû] yoluna girmek isteyen bir müridin, bu yola adımını atarken yapacağı en önemli şey şudur:"},{"k":"p","t":"Tasavvuf yolundaki büyüklerin yoluna girmeye, şekil ve hallerine bürünmeye, onlarla beraber bulunmaya Allah Teâlâ’nın [celle celâluhû] rızası için niyetlenmesi gerekir. Şüphesiz bir sâlikin velilerin yoluna girmesi, kendisinde bulunan kötü hâl ve durumlardan hicret edip kurtulması anlamına gelir.”"},{"k":"p","t":"Şeyh Fethullah Verkânisî [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"“Bizim yolumuzun gayesi, ibadetlerimizde samimiyeti kazanmak için Allah [celle celâluhû] sevgisini elde etmeye çalışmaktır. Samimiyet (ihlâs), dünya ve ahiret menfaati gözetmeksizin bütün söz, hareket ve ibadetlerin sadece Allah [celle celâluhû] rızasına dayanması demektir. Bu maksadı elde etmek, sünnete uymak ve gafleti yok etmekle olur.”"},{"k":"p","t":"Rabbimiz ayeti celilede ihlâslı kullarını müjdelemiş ve onların halini beyan etmiştir."},{"k":"ar","t":"وَبَشِّرِ الْمُخْبِتِينَۙ ﴿٣٤﴾ اَلَّذِينَ اِذَا ذُكِرَ اللّٰهُ وَجِلَتْ قُلُوبُهُمْ وَالصَّابِرِينَ عَلٰى مَٓا اَصَابَهُمْ وَالْمُقِيمِي الصَّلٰوةِۙ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ﴿٣٥﴾"},{"k":"q","t":"\"Ey Habibim! İtaatkâr ve mütevazi kimseleri cennetle müjdele!Onlar (o itaatkâr ve mütevazi olanlar) öyle kimselerdir ki, yanlarında Allah’ın [celle celâluhû] adı anılınca O’nun heybetinden kalpleri titrer, başlarına gelen zorluklara ve musibetlere karşı sabrederler, farz namazları vaktinde ve dosdoğru eda ederler ve kendilerine rızık olarak verdiğimiz şeylerden Allah [celle celâluhû] yolunda harcarlar. Yani hayır yollarında harcarlar ve sadaka olarak dağıtırlar.” (Hac 22/34-35)"},{"k":"p","t":"Ebû Bekir Vâsıtî [rahmetullahi aleyh] şöyle buyurmuştur:"},{"k":"q","t":"“Yapılan ibadetleri muhafaza etmek, onları yapmaktan çok daha zordur. Bunun misali çok çabuk kırılabilen bir cam gibidir; zorlamaya, sıkmaya gelmez. Ameller de böyledir. Yani amellere riya ucub (kibir) gibi kötü hastalıklar dokunsa hemen kırılıverir. Şayet biri amel etmeyi istese ancak nefsinden gelebilecek riyadan korksa; eğer kalbinden bunu çıkarabilirse çıkarmak için gayret etsin. Buna gücü yetmiyorsa, ameline devam etmelidir. Çünkü riya yapacağım korkusuyla ameli terketmek doğru olmaz. Bu kişi önce amelini yapar, bitirdikten sonra da eğer riya gibi hastalıklar karışmışsa Allah Teâlâ’ya [celle celâluhû] istiğfar eder. Belki böylelikle Allah Teâlâ [celle celâluhû] diğer amellerini ona ihlâs ile yapmayı muvaffak kılar.”"},{"k":"p","t":"Zikri olmayan nasıl ihlâslı olabilir. Kalplerin cilası, ilacı ve kuvveti zikirdir. Zikir, Salih amellerin ruhudur. Kişiyi özüne döndüren, ihlâsı kazanmasını sağlayan zikirdir."},{"k":"p","t":"Gavs-ı Cihan Şeyh Seyyid Abdulbaki el-Hüseyni [kuddise sırruhû] şöyle buyuruyor:"},{"k":"q","t":"“Kalbiniz ancak zikirle gıda alır ve temizlenir. Vird çekilmezse kalpte manevi pislikler, lekeler çoğalır hiçbir şeyden feyiz ve tat alamaz olur.  Vird çekilmezse kalbe Allah'ın [celle celâluhû] nuru girmez. Nurun girmediği kalp Allah'ı [celle celâluhû] anmayan kalp olur. Rahmetin girmediği yere ise şeytanın vesvesesi girer. Allah'ı [celle celâluhû] dahi unutturabilir. Kalp zikirle aydınlanır. Allah [celle celâluhû] insanın kalbine bakar. Zikirsiz olmaz. Az da olsa devamlı olması lazımdır. Hem dünyada hem de ahirette gerçek cenneti yaşayanlar zikir ehli olanlardır. Zikrin tadını alanlar onu bırakamazlar.”"},{"k":"p","t":"Büyük arif Mevlana Halid Bağdadi [kuddise sırruhû], sadık müridi Şeyhu’l-İslam Mekki Zade Mustafa Asım Efendiye yazdığı bir mektupta zikrin önemini kısaca şöyle anlatmıştır:"},{"k":"q","t":"“Sağlam bir itikada sahip olup, hak mezheplerden birisine uyarak farzları yerine getirdikten sonra, ibadetlerin en yücesi ve en faziletlisi olan gizli zikre devam etmek gerekir."},{"k":"p","t":"Zikir esnasında insan, Allahu Teala’nın [celle celâluhû] kendisini gördüğünü, işittiğini ve hiçbir şeyin O’ndan gizli kalmadığını bilmelidir. Burada bilmek taklit değildir. Tahkikle elde edilen bir ilimdir. Bu ilme yakin ilmi denir."},{"k":"p","t":"Bu ilme ulaşmak için, insanın Allah’tan [celle celâluhû] başka her şeyden yüz çevirip ihlas, edep ve sevgiyle sünnete sarılması gerekir. Bunun en güzel yolu, irşatla görevli Allah [celle celâluhû] dostlarından birisinin terbiyesi ve tasarrufu altına girmektir."},{"k":"p","t":"Gücünüzün yettiği kadar, gizli zikre özen gösteriniz, bu yolun büyüklerinin (Sadatı Kiram) himmet ve tasarruflarını üzerinize çekmeye çalışınız. Sahip olduğunuz yüksek rütbeler sizleri bunlardan alıkoymasın. Bu büyüklerden alacağınız azıcık nispet bile size çok şey kazandırır.”"},{"k":"p","t":"Gavs-ı Cihan Hazretleri [kuddise sırruhû] şöyle buyurmuştur:"},{"k":"q","t":"”Bu Tarikat-ı Nakşibendi’yenin gayesi cihattır. En büyük cihat nefis ve şeytan üzerinedir. İlk önce insan kendi nefsine dikkat etmesi gerekir. Nakşibendilerin amelleri, zikirlerinin gayesi kalp hidayeti içindir. Peygamberimiz (sallalahu aleyhi ve sellem) “Vücutta bir et parçası vardır o kalptir. Kalp hidayet bulursa bütün vücut hidayet bulur” buyuruyor. Kalp ifsat olunca bütün vücut ifsat olur. Kalp hidayet bulunca bütün vücut hidayet bulur. Bu tarikat-ı aliye’nin hedefi kalbin hidayetidir. Bu tarikat-ı aliye kalbin takvasıdır.”"},{"k":"p","t":"Öyleyse hal yoluna giren bir salik mürşidinin kendisine talim ettirdiği zikri aksatmadan yapmalıdır. Zira bilmelidir ki, kurtuluşu bu yoldadır."},{"k":"p","t":"Semerkand dergisinde yazarı tarafından kaleme alınan ‘’ilim aşkı’’ başlıklı yazıda şöyle bahsediliyor ;"},{"k":"h","t":"Kıssa"},{"k":"p","t":"İbni Hallikân Tarihi’nde geçen bir olaymış bu."},{"k":"p","t":"Amr bin el-Alâ adlı bir âlim, Haccac-ı Zalim’in zulmünden kaçıp Yemen taraflarında on sene kadar inzivaya çekilmiş. Bir gün bir kişinin diğerine Haccac-ı Zalim’in öldüğünü müjdelediğini ve “âlem onun şerrinden kurtuldu” anlamında bir Arapça beyit okuduğunu duymuş. Beytin içinde geçen “fercet” kelimesini işiten Amr diyor ki: “Hangisine daha çok sevineceğime şaşırdım. Zalim Haccac’ın ölmesine mi, yoksa uzun zamandır ‘fürcet’ diye bildiğim kelimenin aslında ‘fercet’ diye okunması gerektiğini öğrendiğime mi!”"},{"k":"p","t":"İşte bu zevkin adı ilim zevkidir. Bu zevk, bu aşk başka hiçbir şeyde bulunmaz. Bunu sadece ilim ehli, ilim taliplileri ve ilmin kadrini birazcık anlamış olanlar bilir. Geri kalanına bunu anlatmak çok zordur. Hele bizde ilimle uğraşan, hayatını ilme ve öğretmeye adamış kişilere genelde dudak bükülür. Çünkü bizim için servet kazandırmayan, makamı olmayan, siyasette isim yapmayan her iş kıymetsizdir."},{"k":"p","t":"Bilene değer vermeyen sürünmeye mahkûmdur. “Osmanlı büyüktü” deriz, doğrudur. Ama en çok bilene ve bilgiye verdiği değerle büyüktü. İnsanlar fıkıhtan kunduracılığa, mimarîden müziğe kadar neyi bilirlerse bilsinler, hürmet ve kıymet görürlerdi. Uzun asırlar güç değil bilgi öndeydi. Padişahların evlatları daha dört yaşında iken ilim tahsiline başlatılırdı. Son zamanlarına kadar bu böyleydi. Hâlâ “Neden bu perişan haldeyiz?” diye boşuna sormayalım."},{"k":"h","t":"İnsanın aynısı"},{"k":"p","t":"Ben ilmi de âlimi de çok severim. Ama gerçek âlimleri... Yani ilmiyle amel edenleri. Ahlâkı ile bilgisi bir olanları. Kendi ilgilendiğim ve sevdiğim konularda okumayı ve araştırmayı da severim. Büyük bir kitaplığım yok. Elektronik ortamda daha fazla kitabım var. Evde mütevazı kitaplığımı görenlerden çok işitmişimdir: “Yahu, yazık bu kadar kitaba niye para verdin?” İmrenen de, benden fazla kitabı olduğu için kitaplığıma küçümseyen gözlerle bakan da olmuştur."},{"k":"p","t":"Kitapla, ilimle alâkası olmayanlar bazen şöyle bir soru da sorarlar: “Bunların hepsini okudun mu?” Her seferinde tekrar tekrar anlatırım: “Kitap bir nimettir. Elinin altında olduktan sonra ihtiyaç olduğunda, bir konuyu merak ettiğinde alır okursun. Hepsini okumadım ama okumak için aldım.”"},{"k":"p","t":"Kitaplar insanlar gibidir. Aynen insanlar gibi onlar da çeşit çeşittir. Değerli kitap da vardır, değersizi de... Okunacak kitap da vardır, bakılacak kitap da... Elde tutulacak, tozu alınacak, göz hizasındaki veya alt taraftaki raflara konacak kitaplar da vardır. Pırıl pırıl, daha kapağı açılmamış kitaplar da vardır. Döne döne okunmaktan paramparça olmuş kitaplar da... Mesela bendeki Mesnevî tercümesi ve Şeyh Gâlib Dede Dîvanı sürekli açılmaktan, okunmaktan, çizilmekten, sayfaların kulakları kıvrılmaktan parça parçadır. Çünkü bu ikisi benim sırdaşım, dertdaşımdır. Sıkıntı anlarında onlarla hasbihal ederim."},{"k":"p","t":"Kitap okumanın vakti kişiden kişiye değişir. Ben şahsen kendimi zorlayarak okumayı ve yazmayı sevmem. Gönlüme, zuhurata bırakırım. Gönülden istek geldi mi, ilham doğdu mu şevk ortaya çıkar. O vakit önümde hiçbir şey duramaz. Okumam da, kavramam da, tefekkürüm de şahlanır. Bir oturuşta belki iki kitabı birden okurum. Veya bir oturuşta yirmi sayfa yazarım. Yeter ki kalpte muhabbet doğsun. Muhabbet varsa, gayret de vardır. Gayret varsa nisbet de vardır."},{"k":"h","t":"Kendini okutan kitaplar"},{"k":"p","t":"Her kitabın bir vakti vardır. Özellikle âriflerin kitapları hemen alınıp okunmaz. Çünkü onlar Rabbanî ilham ile yazılmıştır. O yüzden okunmazlar, okuturlar. Bir ârifin kitabını daha gönül kapınız açılmadan okursanız hiçbir şey anlayamazsınız. Ama o kapı açıldı mı okumadan yapamazsınız. Pek çok ârif ve şair, “bu kitabı ben yazmadım, bana yazdırıldı” der. Bu sözü çoğu anlayamaz. Bunu anlayabilmek için ilham nedir, onu bilmek gerekir. Birileri için, bir şeyler için değil, Allah için ilim yapan, beste yapan, şiir yazan, tasarım yapan insanlar bu sözü anlarlar. Çünkü kişi çabayla, zaman harcayarak, kendini zorlayarak bunları vücuda getiremez. Zaten bir eserin ruhundan o eserin “üretim” mi, “aktarım” mı olduğu anlaşılır. Tasavvuf kitapları da, bilim, edebiyat, şiir kitapları da, mimarlık ve müzik eserleri de hep böyledir. İnsana verdiği feyz de buradan gelir."},{"k":"p","t":"Bu kitaplar “benim de bir kitabım olsun” diye yazılmamıştır. O zatların gönüllerine inen Rabbanî nisbetle yazılmıştır. Bir bağ kurulup öyle yazılmıştır. Okuyanın da bu eserlere tevafuk etmesi, yani denk gelmesi için gönlünün Hak nuruna ve ilhamına açık olması gerekir. Gönül açılmayınca zihin, zihin açılmayınca göz de açılmaz. Bu gibi ilham eseri kitaplar o yüzden yazılmaz, yazdırılır; okunmaz, okutulur."},{"k":"p","t":"Tasavvuf ehli olmayan hatta biraz da mesafeli olan bir arkadaşım anlattı. İşyerindeki kitaplığında Mesnevî tercümesi varmış. “Onu okumak istiyordum ama bir türlü elime alamıyordum” diyor. O dönemde doktorasını tamamlaması için verilen sürenin bitimine az kaldığı için ders kitaplarından başka hiçbir şey okumama sözü vermiş kendine. Bir gün yine doktora için bir kitap üzerinde çalışırken birden ayağa kalkmış, elinde olmadan gitmiş raftan Mesnevî şerhini almış. “Kitabı aldım, başladım okumaya. Günlerce sadece Mesnevî okudum, bitirmeden bırakamadım” dedi."},{"k":"p","t":"Benim de Mesnevî ve Mektûbât-ı Rabbanî gibi irfan kitaplarını okumam böyle oldu. Yıllarca kitaplığımda durdular. Elim bir türlü onlara gitmedi. Kapaklarını bile açamadım. Halbuki mesela Mesnevî’yi kitaplığımda tam göz hizasındaki rafa yerleştirmiştim, “okumam lazım” diyerek. Hemen her gün yeni bir kitaba başlayayım diye raflara göz gezdirirken Mesnevî hep gözüme ilişiyordu ama içimden onu alıp okumak gelmiyordu. Otuz yaşıma geldiğimde ise bir gün elimde olmadan kalktım, kitabı aldım ve okumaya başladım. O gün bugün benim mahremimdir, sırdaşımdır Mesnevî."},{"k":"h","t":"Bilmeye duyulan sevgi"},{"k":"p","t":"İlim aşkı bir anlamda kitap aşkıdır. Mesela ta liseden tanıdığım bir arkadaşım var. Çok ahlâklı birisidir. Şu anda bir hukuk profesörü. Ben onu bildim bileli sürekli kitap alır. Daha da önemlisi okur. Hukuk’ta okurken okulun öğrettikleriyle yetinmedi. Mütevazı maaşıyla belki onbinlerce Osmanlıca, Arapça kitap satın aldı ve okudu. Yeni çıkan kitapları, antika kitapları takip eder, birini gördü mü, hemen gider alır. Parası yoksa evindeki eski kitaplardan birini satar, onun parasıyla yenisini alır."},{"k":"p","t":"Maalesef bizim memleket kitaptan uzak. Çoğu evlerimizde bir kitaplık bile yok. Olanlar ise çok az. Olsa bile gerçek kitaplar pek yok. Üniversiteye hazırlık kitapları veya okul kitapları... Toplumun vaziyeti bu: Bir kitap açıp da bir şeyler okumayız. O yüzden misafirliğe gittiğim bir evde kitaplık görünce çok sevinirim."},{"k":"p","t":"Aslında çocuklarımıza kitap sevgisini aşılamak kolaydır. Her alışverişe gittiğimizde çocuklarımızın her birine en azından ayda bir kitap seçip almasını istersek onlara da kitap sevgisini vermiş oluruz. Ama önce onları elimizdeki cep telefonundan, notebooktan, tablet bilgisayarlardan kurtarmak gerek. Bebeklerinin eline oyuncak diye cep telefonunu veren şuursuz anne babaları görünce çok kızıyorum. Zira çocuklarının zihin, gönül ve beden sağlığını mahvediyorlar, haberleri yok!"},{"k":"p","t":"Evet, kitap ve okumak güzeldir ama her şey değildir. Kitapseverliği abartanlar vardır. Benim de kitapseverliğim vardır ama abartmam. Kitaplar üstümüze kapanan değil, âleme açılan kapılardır. Bence hayatı kitap okumakla geçenlerin başka dertleri vardır. Bu dertten kaçıp kitaplara sığınırlar. Bunu anlarım ama çare kendini kitapların arasına hapsetmek değildir. Mutlaka en büyük kitap olan insana açılmak gerekir. İnsan gibi insanları, adam gibi adamları tanımak, onların meclisinde, sohbetinde bulunmak milyon kitap okumaktan evlâdır."},{"k":"h","t":"Kendisi olmuş insanlar"},{"k":"p","t":"İşi sadece kitap okumak olarak görmek de yanlış. Okuduğunu tefekkür edip güzellikleri kişiliğine katmıyorsan o okumanın bir manası yok. İlim, amel etmek içindir. O halde okumayı tek başına bir değer sayamayız. Okuduğundan ders çıkarmak, ibret almak esastır. İçselleştirmek esastır."},{"k":"p","t":"Bu hususta İmam Gazalî rh.a. için anlatılan menkıbeyi bilirsiniz: İmam Gazalî rh.a. genç yaşta medreseyi bitirir. Kitaplarını denk yapar, memleketine giden bir kervana katılır. Yolda eşkiyalar kervanın önünü keser, herkesi soyar. Bu arada Gazalî’nin kitap dengini görürler. Kitaplarını almaya kalkınca İmam Gazalî feryad eder: “Aman kitaplarıma dokunmayın!” Eşkiyabaşı sorar: “Niye, ne değeri var ki bunların?” İmam Gazalî cevap verir: “Onlar benim için çok değerli. Çünkü onların sayesinde ilim sahibi oldum. Onlarsız ne yaparım ben?” Eşkiyabaşı ibretlik bir cevap verir: “Sen nasıl ilim sahibisin ki, elinden kitapların alındığı zaman sende ilim namına bir şey kalmıyor?” İmam Gazalî rh.a.’i bu hikmetli söz çarpar ve medreseye geri dönüp bu kez her ilmi içselleştirerek, kendine katarak okur. Bildiğimiz, sevdiğimiz, hayran olduğumuz, feyz aldığımız o büyük zât böyle ortaya çıkar."},{"k":"p","t":"İşte İmam Gazalî rh.a. gibi gerçek âlimlerin yazdıkları asıl okunması gereken kitaplardır. Bana gençler okuma listesi sorduğunda genellikle “ne okursanız okuyun ama özellikle kendisi olmuş insanların kitaplarını okuyun” derim. Bunlar yazdıklarını yaşamış, yaşadıklarını yazmış insanlardır. Ârifler, samimi ve ahlâklı insanlar yani. Elbette benim de tavsiye ettiğim başka yazarlar, düşünürler var. Ama ilk yapılması gereken sağlam şekilde akaid ve fıkıh öğrenmektir. Dünyada da, ukbada da işe yarayacak budur."},{"k":"p","t":"Hayatımızda şunu düstur yapalım. Ne iş yaparsak yapalım önce düşünelim: “Bu iş Allah rızasına uygun, yararlı bir iş mi?” Eğer Allah rızasına uygunsa ne olursa olsun, ne pahasına olursa olsun yapalım. Çünkü Rabbimizin yardımı O’nun sevdiği iledir."},{"k":"p","t":"İmam Buharî’yi, İmam Gazalî’yi, Mevlâna’yı, Mevlâna Halid-i Bağdadî’yi (Allah’ın rahmeti hepsinin üzerine olsun) düşünelim. Bu zâtlar “Evimden uzakta ne işim var?” demediler. İlim ve irfan için memleketlerini bırakıp çok uzak diyarlara gittiler. Bu bir İslâm geleneğidir. Milyonlarca İslâm âlimi bir hadisi öğrenebilmek, bir kitabı elde etmek, bir âlimi görebilmek, bir mürşidden istifade etmek için binlerce kilometre seyahat etti, çileler çekti. Üstelik maddî beklentileri olmadan. Onların aileleri de yıllarca bu ayrılığa sabrettiler. Kolay bir şey değil."},{"k":"p","t":"İlim sadece sayfaların arasında değildir. Asıl ilim satırda değil sadırdadır; yani kalptedir. Ancak kalbi aklı olmuş kişiler insana fayda verebilir. Çünkü onlar size ilim ile amel etmenin ne olduğunu halleriyle, yaşayışlarıyla gösterirler. İmam Gazalî rh.a. ilim rütbelerinin en yükseğinde iken kalbinin hâlâ ihlâsa tam ulaşmadığını fark edip önce inzivaya çekilmiş, ardından bir mürşide bağlanmıştı. İmam Gazalî rh.a. ilimde bir zirve. O yüzden tahminim o ki, bağlandığı mürşid ondan ilimce daha aşağıda olan bir zattı. Ama kendini ve Rabbini çok iyi biliyordu. Demek ki o insanı kitaptan, irfanı bilmekten üstün tutmuş. Onun ismini bugün büyük hürmete layık hale getiren de bu tercihidir."},{"k":"p","t":"Hasılı ilmin de, ilim aşkının da hedefi irfandır. Yani kendini ve Rabbini tanımaktır. Güzel bir kul olmaktır."},{"k":"p","t":"Allahu Teala [celle celâluhû] cümlemize hayırlı ilim, ilim amel, amellerimizde ihlas nasip eylesin. Rabbimizi ona layık bir şekilde zikretmeyi nasip eylesin. Amin"},{"k":"p","t":"(Semerkand dergisi: İlim Aşkı)"},{"k":"ar","t":"و اخر دعوانا أن الحمد لله رب العالمين"}],"mins":27,"cat":"İlim"}],"exc":[{"doc":"kandil","p":99},{"doc":"kandil","p":102},{"doc":"nebi","p":83},{"doc":"tasavvuf","p":7},{"doc":"kandil","p":103},{"doc":"nebi","p":115}],"sohbetler":[]}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var DOCS = DATA.docs, EXC = DATA.exc, SOHBETLER = DATA.sohbetler;
  var app = document.getElementById('app');
  var root = document.documentElement;

  /* ---- güvenli saklama (bu telefona özel: yazı boyu, kaldığı yer) ---- */
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  var SIZES = [19, 22, 26, 31, 37];
  var step = parseInt(store.get('sk-fs'), 10);
  if (isNaN(step) || step < 0 || step > 4) step = 1;
  function applySize(){ root.style.setProperty('--fs', SIZES[step] + 'px'); }
  applySize();

  var THEME_ORDER = ['light', 'dark', 'contrast'];
  function autoThemeFromVakit(){
    try {
      var cached = store.get(vakitCacheKey(new Date()));
      if (!cached) return null;
      var vakit = JSON.parse(cached);
      var now = new Date();
      var mag = timeToDate(vakit.Maghrib), sun = timeToDate(vakit.Sunrise);
      return (now >= mag || now < sun) ? 'dark' : 'light';
    } catch (e){ return null; }
  }
  var savedTheme = store.get('sk-theme');
  if (savedTheme === 'dark' || savedTheme === 'light' || savedTheme === 'contrast'){
    root.setAttribute('data-theme', savedTheme);
  } else {
    var autoT = autoThemeFromVakit();
    if (autoT) root.setAttribute('data-theme', autoT);
    setInterval(function(){
      var manual = store.get('sk-theme');
      if (manual === 'dark' || manual === 'light' || manual === 'contrast') return;
      var t = autoThemeFromVakit();
      if (t) root.setAttribute('data-theme', t);
    }, 600000);
  }
  function isDark(){
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function currentTheme(){
    var t = root.getAttribute('data-theme');
    if (THEME_ORDER.indexOf(t) !== -1) return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  /* ---- yardımcılar ---- */
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'style') n.setAttribute('style', attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null) continue;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }
  function icon(name, size){
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size || 28); s.setAttribute('height', size || 28);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    var d = {
      play:  '<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',
      book:  '<path d="M2.5 5.5C5.6 4.3 8.6 4.6 12 6.8c3.4-2.2 6.4-2.5 9.5-1.3V19c-3.1-1.2-6.1-.9-9.5 1.3C8.6 18.1 5.6 17.8 2.5 19z"/><path d="M12 6.8v13.5"/>',
      home:  '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h4.5V14h3v5.5H18V10"/>',
      back:  '<path d="M15 5l-7 7 7 7"/>',
      moon:  '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
      sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>',
      up:    '<path d="M6 15l6-6 6 6"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/>',
      star:'<path d="M12 3.5l2.6 5.4 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9z" stroke-linejoin="round"/>',
      contrast:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
      share:'<circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 10.8l8-4.6M8 13.2l8 4.6"/>',
      list:'<path d="M4 6h16M4 12h16M4 18h16"/>'
    };
    s.innerHTML = d[name] || '';
    return s;
  }
  function docById(id){ for (var i = 0; i < DOCS.length; i++) if (DOCS[i].id === id) return DOCS[i]; return null; }
  function getPos(id){ var v = parseFloat(store.get('sk-pos-' + id)); return isNaN(v) ? 0 : Math.min(1, Math.max(0, v)); }
  function isFav(id){ return store.get('sk-fav-' + id) === '1'; }
  function setFav(id, v){ store.set('sk-fav-' + id, v ? '1' : '0'); }
  function lastRead(){
    var id = store.get('sk-last');
    if (!id) return null;
    var d = docById(id);
    if (!d) return null;
    var pct = Math.round(getPos(id) * 100);
    if (pct < 2 || pct >= 97) return null;
    return { d: d, pct: pct };
  }
  function normalize(s){
    return String(s || '')
      .replace(/İ/g, 'i').replace(/I/g, 'ı')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/ı/g, 'i')
      .trim();
  }
  function levenshtein(a, b){
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = []; for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++){
      var cur = [i];
      for (j = 1; j <= n; j++){
        var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[n];
  }
  function searchDocs(query){
    var q = normalize(query);
    if (!q) return DOCS.slice();
    var threshold = q.length <= 4 ? 1 : (q.length <= 8 ? 2 : 3);
    var scored = [];
    DOCS.forEach(function(d){
      var title = normalize(d.title), sub = normalize(d.sub), desc = normalize(d.desc);
      var score = null;
      if (title.indexOf(q) !== -1) score = 0;
      else if (sub.indexOf(q) !== -1 || desc.indexOf(q) !== -1) score = 1;
      else {
        var best = Infinity;
        title.split(/\s+/).forEach(function(w){
          var dist = levenshtein(q, w);
          if (dist < best) best = dist;
        });
        if (best <= threshold) score = 2 + best;
      }
      if (score !== null) scored.push({ d: d, score: score });
    });
    scored.sort(function(a, b){ return a.score - b.score; });
    return scored.map(function(x){ return x.d; });
  }

  function hicriParts(date){
    var o = {};
    HICRI_NUM_FMT.formatToParts(date).forEach(function(p){

    { m: 3, d: 12, name: 'Mevlid Kandili' },

  function nextKandil(){
    try {
      var today = new Date();
      for (var i = 0; i < 380; i++){
        var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
        var hp = hicriParts(d);
        for (var j = 0; j < KANDIL_FIXED.length; j++){
          if (hp.month === KANDIL_FIXED[j].m && hp.day === KANDIL_FIXED[j].d) return { i: i, name: KANDIL_FIXED[j].name };
        }
        if (hp.month === 7 && hp.day === 1){
          for (var k = 0; k < 7; k++){
            var rd = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i + k);
            if (rd.getDay() === 5) return { i: i + k, name: 'Regaip Kandili' };
          }
        }
      }
    } catch (e){}
    return null;
  }
  function allKandiller(){
    var today = new Date();
    var found = {};
    var results = [];
    var names = ['Mevlid Kandili', 'Regaip Kandili', 'Miraç Kandili', 'Berât Kandili', 'Kadir Gecesi'];
    try {
      for (var i = 0; i < 400; i++){
        if (names.every(function(nm){ return found[nm]; })) break;
        var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
        var hp = hicriParts(d);
        KANDIL_FIXED.forEach(function(k){
          if (!found[k.name] && hp.month === k.m && hp.day === k.d){
            found[k.name] = true;
            results.push({ name: k.name, date: d, i: i });
          }
        });
        if (!found['Regaip Kandili'] && hp.month === 7 && hp.day === 1){
          for (var k2 = 0; k2 < 7; k2++){
            var rd = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i + k2);
            if (rd.getDay() === 5){
              found['Regaip Kandili'] = true;
              results.push({ name: 'Regaip Kandili', date: rd, i: i + k2 });
              break;
            }
          }
        }
      }
    } catch (e){}
    results.sort(function(a, b){ return a.i - b.i; });
    return results;
  }

  var VAKIT_ORDER = [
    { k: 'Imsak', l: 'İmsak' },

    { k: 'Dhuhr', l: 'Öğle' },
    { k: 'Asr', l: 'İkindi' },

    { k: 'Isha', l: 'Yatsı' }
  ];
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function vakitDateStr(d){ return pad2(d.getDate()) + '-' + pad2(d.getMonth() + 1) + '-' + d.getFullYear(); }
  function vakitCacheKey(d){ return 'sk-vakit-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function vakitFallback(cb){
    for (var i = 1; i <= 3; i++){
      var d = new Date(); d.setDate(d.getDate() - i);
      var old = store.get(vakitCacheKey(d));
      if (old){ try { cb(JSON.parse(old)); return; } catch (e){} }
    }
    cb(null);
  }
  function fetchVakitler(cb){
    var today = new Date();
    var key = vakitCacheKey(today);
    var cached = store.get(key);
    if (cached){ try { cb(JSON.parse(cached)); return; } catch (e){} }
    try {
      var url = 'https://api.aladhan.com/v1/timingsByCity/' + vakitDateStr(today) + '?city=Istanbul&country=Turkey&method=13';
      fetch(url).then(function(r){ return r.json(); }).then(function(j){
        var t = j && j.data && j.data.timings;
        if (!t) throw new Error('no data');
        var vakit = {};
        VAKIT_ORDER.forEach(function(v){ vakit[v.k] = String(t[v.k]).split(' ')[0]; });
        store.set(key, JSON.stringify(vakit));
        cb(vakit);
      }).catch(function(){ vakitFallback(cb); });
    } catch (e){ vakitFallback(cb); }
  }
  function timeToDate(hhmm){
    var parts = String(hhmm).split(':');
    var d = new Date();
    d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
    return d;
  }
  function vakitInfo(vakit){
    var now = new Date();
    var times = VAKIT_ORDER.map(function(v){ return { k: v.k, l: v.l, d: timeToDate(vakit[v.k]) }; });
    var rangeStart = times[0].d;
    if (now < rangeStart) rangeStart = new Date(rangeStart.getTime() - 86400000);
    var next = null;
    for (var i = 0; i < times.length; i++){ if (times[i].d > now){ next = times[i]; break; } }
    if (!next) next = { k: 'Imsak', l: 'İmsak', d: new Date(times[0].d.getTime() + 86400000) };
    var mins = Math.max(0, Math.round((next.d - now) / 60000));
    var hh = Math.floor(mins / 60), mm = mins % 60;
    var countText = hh > 0 ? (hh + ' sa ' + mm + ' dk') : (mm + ' dk');
    function pct(d){ return Math.max(0, Math.min(100, (d - rangeStart) / 864e5 * 100)); }
    return { times: times, next: next, countText: countText, nowPct: pct(now), pct: pct };
  }
  function vakitCard(){
    var card = el('div', {'class': 'vakit-card'}, el('p', {'class': 'vakit-loading', text: 'Namaz vakitleri yükleniyor…'}));
    var timer = null;
    function paint(vakit){
      if (!vakit){
        card.replaceChildren(el('p', {'class': 'vakit-loading', text: 'Vakitler şu an yüklenemedi. İnternete bağlanınca görünecek.'}));
        return;
      }
      var info = vakitInfo(vakit);
      var strip = el('div', {'class': 'vakit-strip'});
      info.times.forEach(function(t){
        strip.appendChild(el('span', {'class': 'tick', style: 'left:' + info.pct(t.d) + '%'}));
      });
      strip.appendChild(el('span', {'class': 'now-mark', style: 'left:' + info.nowPct + '%'}));
      var legend = el('div', {'class': 'vakit-legend'});
      info.times.forEach(function(t){
        legend.appendChild(el('span', null, el('b', {text: t.l}), ' ' + pad2(t.d.getHours()) + ':' + pad2(t.d.getMinutes())));

      card.replaceChildren(

        el('b', {'class': 'vakit-next', text: info.next.l + '’ye ' + info.countText}),
        strip, legend
      );
    }
    fetchVakitler(paint);
    timer = setInterval(function(){
      var cached = store.get(vakitCacheKey(new Date()));
      if (cached){ try { paint(JSON.parse(cached)); } catch (e){} }
    }, 60000);
    return { node: card, stop: function(){ clearInterval(timer); } };
